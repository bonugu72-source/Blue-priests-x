  if(e.critAll&&!critOn)label+=' (🌸 벚꽃바람에 치명타가 빗나감)';
  const crit=critOn?e.critAll*(B.awoke&&e.awaken?e.awaken.critMult:1):1;
  const raw=e.atk*(1+0.2*B.rage)*(B.hex?0.8:1)*mult*crit;
  // fixedDmg: 방어력 무시 고정 피해 · 그 외에는 방어력으로 최대 70%까지만 줄어듦 (최소 30%는 들어감)
  let d=e.fixedDmg?raw:Math.max(raw*DEF_FLOOR,raw-def/2)*rnd(0.9,1.1);
  d=Math.max(1,Math.round(d));
  if(B.defending)d=Math.max(1,Math.round(d*0.6)); // 방어: 피해 40% 감소
  if(B.ward)d=Math.max(1,Math.round(d*0.5));
  if(B.prism){
    const r=Math.round(d*0.5*(B.prismM>=2?2:1));d=Math.max(1,d-Math.round(d*0.5));
    if(!B.immune){stat('dmg','siren',Math.min(r,e.hp));e.hp=Math.max(0,e.hp-r);addLog(`💎 프리즘 굴절 — ${e.name}에게 ${r} 반사`);queueFx('enemy','💎'+r,'dmg');}
  }
  let absorbed=0;
  if(B.shield>0){absorbed=Math.min(B.shield,d);B.shield-=absorbed;d-=absorbed;stat('heal','elia',absorbed);}
  if(B.mshield>0&&d>0){const a2=Math.min(B.mshield,d);B.mshield-=a2;d-=a2;absorbed+=a2;stat('heal','mikael',a2);}
  if(B.bshield>0&&d>0){const a3=Math.min(B.bshield,d);B.bshield-=a3;d-=a3;absorbed+=a3;}
  P.hp=Math.max(0,P.hp-d);
  if(P.relics.includes('time_belt')&&!B.beltUsed&&P.hp>0&&P.hp<=P.maxHp*0.5){B.beltUsed=true;B.bshield=P.hp;addLog(`⏳ 시간에 갇힌 벨트 — 시간이 멈추며 남은 HP만큼 보호막 ${P.hp}`);queueFx('player','⏳🛡'+P.hp,'mpf');}
  if(B.vamp&&d>0&&e.hp>0){const vh=Math.min(e.maxHp-e.hp,Math.round(d*B.vamp));if(vh>0){e.hp+=vh;label+=` (🩸 흡혈 +${vh})`;}}
  addLog(`${label}!${critOn?' 💥치명타':''} ${d} 피해${B.defending?' (방어)':''}${B.ward?' (결계)':''}${absorbed?` (🛡 보호막 ${absorbed} 흡수)`:''}`);
  queueFx('player','-'+d,'pdmg');
  if(e.bleedOnHit&&Math.random()<0.35){B.dot={name:'출혈',dmg:Math.max(5,Math.round(e.atk*0.3)),turns:3};addLog('🩸 독사의 이빨 — 출혈 (3턴)');}
  return d;
}

function act(kind,arg){
  if(!B||B.busy||B.over||B.won)return;
  if(kind==='itemmenu'||kind==='skillmenu'||kind==='back'){B.menu=kind==='itemmenu'?'item':'main';renderBattle();return;}
  if(Date.now()<(B.cdUntil||0))return;
  if(pFrozen()){addLog(`🧊 얼어붙어 움직일 수 없다… (${Math.ceil((B.pFrozenUntil-Date.now())/1000)}초)`);renderBattle();return;}
  const e=B.e;
  if(kind==='attack'||kind==='item'){B.guard=false;B.defending=false;}
  if(kind==='attack'){
    hitEnemy(1,'공격');
    B.atkN=(B.atkN||0)+1;
    if(B.atkN>=AWAKEN_SKILL.every){B.atkN=0;if(e.hp>0)awakenStrike();}
  }else if(kind==='skill'){
    const s=SKILLS.find(x=>x.id===arg);
    if(!s||P.mp<s.mp||B.silence)return;
    P.mp-=s.mp;
    if(s.type==='dmg'){
      hitEnemy(s.mult*(s.demonBonus&&e.demon?s.demonBonus:1),s.name);
    }else if(s.type==='heal'){
      const h=Math.min(P.maxHp-P.hp,Math.round(P.maxHp*s.pct));
      P.hp+=h;addLog(`${s.name} — HP ${h} 회복`);queueFx('player','+'+h,'heal');
    }else if(s.type==='buff'){
      B.buff=4;addLog(`${s.name} — 3턴간 공격력 1.5배`);
    }
  }else if(kind==='defend'){
    if(B.defending)return;
    B.defending=true;B.guard=true;addLog('🛡 방어 태세 — 공격하거나 아이템을 쓰기 전까지 피해 40% 감소 (동료도 공격을 멈춘다)');
  }else if(kind==='item'){
    if(arg==='water'&&P.items.water>0&&B.noHeal){addLog('🧪 가미긴의 괴성이 상처를 벌려 놓았다 — 회복할 수 없다');renderBattle();return;}
    else if(arg==='water'&&P.items.water>0){
      P.items.water--;const h=Math.min(P.maxHp-P.hp,Math.round(Math.max(60,P.maxHp*0.4)*healMul()));
      P.hp+=h;stat('heal','hero',h);addLog(`성수 사용 — HP ${h} 회복`);queueFx('player','+'+h,'heal');
    }else if(arg==='rosary'&&P.items.rosary>0){
      P.items.rosary--;const m=Math.min(P.maxMp-P.mp,25);
      P.mp+=m;addLog(`묵주 사용 — 성력 ${m} 회복`);queueFx('player','+'+m,'mpf');
    }else return;
  }else if(kind==='flee'){
    if(B.isBoss)return;
    if(Math.random()<0.6){
      B.busy=true;addLog('무사히 도망쳤다!');renderBattle();
      setTimeout(()=>{save();renderHub('무사히 도망쳤다.');},600);return;
    }
    addLog('도망에 실패했다!');
  }
  if(e.hp<=0&&((e.berserk&&!B.berserked)||(e.madness&&!B.maddened)||(e.awaken&&!B.awoke)||(e.twin&&!B.twinned)||(e.relay&&(B.relayStage||0)<2)))e.hp=1; // 폭주·광기 전에는 쓰러지지 않음
  const cd=kind==='attack'||kind==='skill'?RT.atkCd:kind==='item'?RT.itemCd:kind==='flee'?RT.fleeCd:RT.defCd;
  B.cdUntil=Date.now()+cd;B.cdLen=cd;B.menu='main';
  setTimeout(()=>{if(B&&!B.over&&!B.won&&$('#modal').classList.contains('hidden'))renderBattle();},cd+30);
  if(P.hp<=0&&e.hp>0){P.hp=0;B.over=true;renderBattle();setTimeout(defeat,900);return;}
  if(e.hp<=0){winNow();return;}
  if(checkPhase())return;
  renderBattle();
}

function checkPhase(){
  const e=B.e;
  if(e.relay&&!(B.relayStage>0)&&e.hp>0&&e.hp<=e.relay.at){
    const w=e.relay.lord,em=LATE_BOSS_MULT;
    B.relayStage=1;B.charging=false;B.chargeKind=null;
    B.nab={name:e.name,title:e.title,art:e.art,atk:e.atk,def:e.def,moves:e.moves,slashes:e.slashes,dimension:e.dimension,maxHp:e.maxHp};
    e.name=w.name;e.title=w.title;e.art=w.art;e.hp=w.hp;e.maxHp=w.hp;e.atk=Math.round(w.atk*em);e.def=w.def;e.moves=w.moves;e.slashes=0;e.dimension=false;
    addLog(`🩸 나베리우스가 물러나고 「어둠의 군주」가 나섰다! (체력 ${fmt(w.hp)})`);
    showStory(`<div class="sum s5"><div class="sum-title">어둠의 군주</div><div class="intro-art">${portraitHTML(w.art,'big')}</div><div class="sum-name">${w.name}</div><div class="small">${w.title}</div><p class="sum-desc" style="color:#ffb0b0">${esc(w.line).replace(/\n/g,'<br>')}</p></div>`,
      ()=>{renderBattle();setTimeout(enemyTurn,500);},true);
    return true;
  }
  if(e.relay&&B.relayStage===1&&e.hp<=1){
    const n=B.nab,bk=e.relay.back;
    B.relayStage=2;B.charging=false;B.chargeKind=null;
    Object.assign(e,{name:n.name,title:n.title,art:n.art,atk:n.atk,def:n.def,moves:n.moves,slashes:n.slashes,dimension:n.dimension,maxHp:n.maxHp,hp:bk.hp});
    B.vamp=bk.vamp;
    addLog(`🩸 어둠의 군주 격파 — 나베리우스가 체력 ${fmt(bk.hp)}로 돌아왔다! (흡혈 · 생명력 흡수)`);
    document.body.classList.add('flash');setTimeout(()=>document.body.classList.remove('flash'),400);
    showStory(`<div class="sum s5"><div class="sum-title">귀환</div><div class="intro-art">${portraitHTML(n.art,'big')}</div><div class="sum-name">${n.name}</div><p class="sum-desc" style="color:#ffb0b0">${esc(bk.line).replace(/\n/g,'<br>')}</p></div>`,
      ()=>{B.drainAt=Date.now()+bk.drainEvery;B.drainT=setInterval(drainTick,bk.drainEvery);renderBattle();setTimeout(enemyTurn,500);},true);
    return true;
  }
  if(e.twin&&!B.twinned&&e.hp>0&&e.hp<=e.twin.at){
    const w=e.twin,em=LATE_BOSS_MULT;
    B.twinned=true;B.charging=false;B.chargeKind=null;
    e.name=w.name;e.title=w.title;e.art=w.art;e.hp=w.hp;e.maxHp=w.hp;e.atk=Math.round(w.atk*em);e.def=w.def;e.moves=w.moves;e.burnHit=false;
    addLog(`❄ 라이아가 물러나고 쌍둥이 언니 「테리아」가 나섰다! (체력 ${fmt(w.hp)})`);
    showStory(`<div class="sum s5"><div class="sum-title">쌍둥이 교대</div><div class="intro-art">${portraitHTML(w.art,'big')}</div><div class="sum-name">${w.name}</div><div class="small">${w.title}</div><p class="sum-desc" style="color:#cfeaff">${esc(w.line).replace(/\n/g,'<br>')}</p></div>`,
      ()=>{B.freezeAt=Date.now()+w.freezeEvery;B.freezeT=setInterval(freezeTick,w.freezeEvery);renderBattle();setTimeout(enemyTurn,500);},true);
    return true;
  }
  if(e.awaken&&!B.awoke&&e.hp>0&&e.hp<=e.awaken.at){
    const w=e.awaken;
    B.awoke=true;e.hp=w.to;e.maxHp=Math.max(e.maxHp,w.to);e.art=w.art;B.charging=false;B.chargeKind=null;
    e.moves=e.moves.filter(m=>m.kind!=='deathblow');
    addLog(`💢 ${e.name} 각성 — 체력 ${fmt(w.to)} · 「영혼을 가르는 일격」 · 치명타 피해 ${w.critMult}배!`);
    document.body.classList.add('flash');setTimeout(()=>document.body.classList.remove('flash'),400);
    showStory(`<div class="sum s5"><div class="sum-title">각성</div><div class="intro-art">${portraitHTML(w.art,'big')}</div><div class="sum-name">${e.name}</div><p class="sum-desc" style="color:#ffb0b0">${esc(w.line).replace(/\n/g,'<br>')}</p></div>`,
      ()=>{B.soulAt=Date.now()+w.soulTick;B.soulT=setInterval(soulTick,w.soulTick);addLog('⚠ 3초마다 「영혼을 가르는 일격」 — 방어 태세를 유지하라!');renderBattle();setTimeout(enemyTurn,500);},true);
    return true;
  }
  if(e.madness&&!B.maddened&&e.hp>0&&e.hp<=e.madness.at){
    const m=e.madness;
    B.maddened=true;e.maxHp=Math.max(e.maxHp,m.to);e.hp=m.to;e.atk=Math.round(e.atk*m.atkMult);e.art=m.art;B.charging=false;B.chargeKind=null;
    addLog(`💢 ${e.name}의 ${m.logName||'광기'} — 체력 ${fmt(m.to)}까지 회복 · 공격력 ${m.atkMult}배!`);
    document.body.classList.add('flash');setTimeout(()=>document.body.classList.remove('flash'),400);
    showStory(`<div class="sum s5"><div class="sum-title">${m.title||'광기'}</div><div class="intro-art">${PORTRAIT[m.art]?portraitHTML(m.art,'big'):bossSVG(m.art)}</div><div class="sum-name">${e.name}</div><p class="sum-desc" style="color:#ffb0b0">${esc(m.line).replace(/\n/g,'<br>')}</p></div>`,
      ()=>{renderBattle();setTimeout(enemyTurn,500);},true);
    return true;
  }
  if(e.berserk&&!B.berserked&&e.hp>0&&e.hp<=e.berserk.at){
    B.berserked=true;e.hp=e.berserk.to;B.charging=false;B.chargeKind=null;B.noHeal=true;B.invisNext=true;
    e.moves=[...e.moves,{t:'bleedstorm',n:'무수한 출혈 참격',hits:8,m:0.25},{t:'bleedstorm',n:'무수한 출혈 참격',hits:8,m:0.25}];
    addLog(`💢 ${e.name}의 폭주 — 괴성과 함께 체력 ${fmt(e.berserk.to)}까지 회복!`);
    document.body.classList.add('flash');setTimeout(()=>document.body.classList.remove('flash'),400);
    showStory(`<div class="sum s5"><div class="sum-title">폭주</div><div class="intro-art berserk">${bossSVG(e.art)}</div><div class="sum-name">${e.name}</div><p class="sum-desc" style="color:#ffb0b0">${esc(e.berserk.line).replace(/\n/g,'<br>')}</p></div>`,
      ()=>{addLog('🚫 폭주의 저주 — 이제 주인공은 회복할 수 없다');addLog('…어딘가에서 공기가 갈라지는 소리가 들린다.');B.busy=false;renderBattle();},true);
    return true;
  }
  if(e.rage&&!B.raged&&e.hp>0&&e.hp<=e.maxHp/2){
    B.raged=true;e.atk=Math.round(e.atk*2);e.art=e.rage.art;B.charging=false;B.chargeKind=null;
    addLog(`💢 ${e.name}의 발악 — 공격력 2배!`);
    showStory(`<div class="sum s5"><div class="sum-title">발악</div><div class="intro-art">${portraitHTML(e.rage.art,'big')}</div><div class="sum-name">${e.name}</div><p class="sum-desc" style="color:#ffb0b0">${esc(e.rage.line).replace(/\n/g,'<br>')}</p></div>`,
      ()=>{renderBattle();setTimeout(enemyTurn,500);},true);
    return true;
  }
  if(B.isFinal&&B.phase===1&&e.phase2&&e.hp<=e.maxHp/2){
    const p2=e.phase2;
    B.phase=2;B.charging=false;B.chargeKind=null;B.silence=0;
    e.atk=Math.round(e.atk*p2.atkMult);e.art=p2.art;e.name=p2.name;e.moves=p2.moves;e.slashes=p2.slashes;
    addLog('나베리우스의 군단이 깨어났다! (공격력 상승 · 추격 참격 ×3)');
    showStory(`<div class="sum s5"><div class="sum-title">제2형태</div><div class="intro-art">${PORTRAIT[p2.art]?portraitHTML(p2.art,'big'):bossSVG(p2.art)}</div><div class="sum-name">${p2.name}</div><p class="sum-desc" style="color:#cdd6f0">${esc(p2.line).replace(/\n/g,'<br>')}</p></div>`,
      ()=>{renderBattle();setTimeout(enemyTurn,500);},true);
    return true;
  }
  return false;
}

let forcedMv=null;
function enemyTurnForced(mv){forcedMv=mv;enemyTurn();}
function enemyTurn(){
  if(!B||B.over||B.won)return;
  const e=B.e;let mv;
  if(forcedMv){mv=forcedMv;forcedMv=null;}
  else if(B.invisNext){B.invisNext=false;mv={t:'invisslash',n:'보이지 않는 참격'};forcedMv={t:'bleedstorm',n:'무수한 출혈 참격',hits:8,m:0.25};}
  else if(B.sealed>0){mv={t:'sealed'};B.sealed--;}
  else if(B.charging){mv={t:'release',n:B.chargeName,kind:B.chargeKind};B.charging=false;B.chargeKind=null;}
  else if(e.pvp)mv={t:'pvp',n:''};
  else if(e.tornado&&e.hp<e.maxHp*0.35&&B.tornadoCD<=0){mv={t:'charge',n:'스파크 토네이도',kind:'tornado'};B.tornadoCD=4;}
  else if(e.moves){mv=pick(e.moves);if(mv.kind==='zero'&&pFrozen())mv={t:'atk',n:'얼음 송곳'};} // 빙결 중엔 방어 불가 → 절대 영도 보류
  else mv=Math.random()<0.2?{t:'strong',n:'강타'}:{t:'atk',n:'공격'};
  const label=`${e.name} — ${mv.n}`;

  switch(mv.t){
    case 'sealed':  addLog(`${e.name} — 봉인되어 움직일 수 없다!`);break;
    case 'pvp':     pvpEnemyActs(e);break;
    case 'nullify': B.immune=2;addLog(`${label} — ⏸ 잠시 동안 모든 피해가 무효화된다!`);break;
    case 'reflect': B.reflect=2;addLog(`${label} — ↩ 잠시 동안 준 피해의 절반이 되돌아온다!`);break;
    case 'atk':     hitPlayer(1,label);break;
    case 'strong':  hitPlayer(1.5,label);break;
    case 'hellfire':hitPlayer(1.8,label);break;
    case 'release':
      if(mv.kind==='jeongyeok'){
        if(B.defending)hitPlayer(1,`${e.name}의 「전격」`);
        else{const d=Math.round(P.maxHp*0.5);P.hp=Math.max(0,P.hp-d);addLog(`${e.name}의 「전격」! 방어하지 못했다 — HP ${d} 소멸`);queueFx('player','⚡-'+d,'pdmg');}
      }else if(mv.kind==='deathblow'){
        if(B.defending){hitPlayer(1,`${e.name}의 「죽음의 일격」 — 막아냈다`);}
        else{
          const c=partyIds().filter(id=>id!==FIXED&&B.ahp[id]&&B.ahp[id].hp>0);
          if(c.length){const id=pick(c);B.ahp[id].hp=0;addLog(`☠ ${e.name}의 「죽음의 일격」! 방어하지 못했다 — ${ALLIES[id].name} 사망`);queueFx('player','☠','pdmg');
            document.body.classList.add('flash');setTimeout(()=>document.body.classList.remove('flash'),300);allyDown(id);}
          else hitPlayer(2.5,`${e.name}의 「죽음의 일격」`);
        }
      }else if(mv.kind==='zero'){
        if(B.defending)hitPlayer(1,`${e.name}의 「절대 영도」 — 막아냈다`);
        else{const d=Math.round(P.hp*0.5);P.hp=Math.max(0,P.hp-d);addLog(`❄ ${e.name}의 「절대 영도」! 방어하지 못했다 — HP ${d} 소멸 · 3초간 빙결`);queueFx('player','❄-'+d,'pdmg');
          document.body.classList.add('flash');setTimeout(()=>document.body.classList.remove('flash'),300);
          if(P.hp>0)freezePlayer(ZERO_FREEZE_MS);}
      }else if(mv.kind==='tornado'){
        const d=Math.ceil(P.maxHp/3);P.hp=Math.max(0,P.hp-d);
        addLog(`${e.name}의 「스파크 토네이도」! 방어도 소용없다 — HP ${d} 소멸`);queueFx('player','🌪-'+d,'pdmg');
        hitAllies(0.3,'스파크 토네이도');
      }else hitPlayer(2.5,`${e.name}의 「${mv.n}」`);
      break;
    case 'multi':{
      addLog(`${label}!`);
      for(let i=0;i<mv.hits;i++)hitPlayer(mv.m,`  ${i+1}타`);
      break;}
    case 'drain':{
      const d=hitPlayer(1,label);
      const h=Math.min(e.maxHp-e.hp,Math.round(d*0.6));
      if(h>0){e.hp+=h;addLog(`적이 생명력 ${h}을 빨아들였다.`);queueFx('enemy','+'+h,'heal');}
      break;}
    case 'curse':   B.curse=3;addLog(`${label} — 3턴간 방어력 감소`);break;
    case 'silence': B.curse=Math.max(B.curse,2);addLog(`${label} — 2턴간 방어력 감소`);break;
    case 'dot':
      hitPlayer(0.6,label);
      B.dot={name:mv.dn||'부패',dmg:Math.max(3,Math.round(e.atk*0.35)),turns:3};
      addLog(`${label} — 3턴간 ${B.dot.name}`);break;
    case 'invis':   B.evade=true;addLog(`${label} — 모습을 감췄다! 다음 공격이 빗나간다`);break;
    case 'discord':{
      const c=partyIds().filter(id=>id!==FIXED&&!(B.stun[id]>0)&&B.ahp[id]&&B.ahp[id].hp>0);
      if(c.length){const id=pick(c);B.stun[id]=2;B.stunWhy[id]='불화';addLog(`${label} — ${ALLIES[id].name} 2턴간 행동 불가`);}
      else{B.curse=3;addLog(`${label} — 3턴간 방어력 감소`);}
      break;}
    case 'storm':   hitPlayer(mv.m,label);hitAllies(0.12,label);break;
    case 'freezebreath':
      addLog(`${label}!`);hitAllies(0.08,label);
      B.aFrozenUntil=Date.now()+4000;addLog('❄ 동료 전원이 얼어붙었다! (4초간 행동 불가)');
      break;
    case 'invisslash':
      if(B.defending){hitPlayer(1.2,`${e.name}의 「보이지 않는 참격」 — 간신히 막아냈다`);}
      else{const d=Math.round(P.maxHp*0.5);P.hp=Math.max(0,P.hp-d);addLog(`${e.name}의 「보이지 않는 참격」! 방어하지 못했다 — HP ${d} 소멸`);queueFx('player','-'+d,'pdmg');
        document.body.classList.add('flash');setTimeout(()=>document.body.classList.remove('flash'),300);}
      break;
    case 'bleedstorm':{
      addLog(`${label}!`);
      for(let i=0;i<mv.hits&&P.hp>0;i++)hitPlayer(mv.m,`  출혈 참격 ${i+1}`);
      hitAllies(0.12,label);
      if(P.hp>0){B.dot={name:'출혈',dmg:Math.max(5,Math.round(e.atk*0.3)),turns:4};addLog('🩸 깊은 상처 — 4턴간 출혈');}
      break;}
    case 'barrage':{
      addLog(`${label}!`);
      for(let i=0;i<mv.hits&&P.hp>0;i++)hitPlayer(mv.m,`  참격 ${i+1}`);
      hitAllies(0.08,label);
      B.healCut=3;addLog('✂ 무수한 참격의 상처 — 3턴간 주인공·동료 회복량 10% 무효');
      break;}
    case 'sweep':   hitPlayer(0.6,label);hitAllies(mv.m,label);break;
    case 'rage':
      if(B.rage<2){B.rage++;addLog(`${label} — 공격력 상승!`);}
      else hitPlayer(1.5,label);
      break;
    case 'charge':
      B.charging=true;B.chargeName=mv.n;B.chargeKind=mv.kind||null;
      addLog(mv.kind==='jeongyeok'?`⚠ ${e.name} — 「전격」 충전! 방어하지 않으면 HP 절반을 잃는다`
        :mv.kind==='tornado'?`⚠ ${e.name} — 「스파크 토네이도」의 전조! 방어해도 HP 1/3을 잃는다`
        :mv.kind==='deathblow'?`⚠ ${e.name} — 「죽음의 일격」 준비! 방어하지 않으면 동료 한 명이 죽는다`
        :mv.kind==='zero'?`⚠ ${e.name} — 「절대 영도」 준비! 방어하지 않으면 HP 절반을 잃고 얼어붙는다`
        :`⚠ ${e.name} — 「${mv.n}」 준비! 곧 날아온다 — 방어하자!`);
      break;
  }
  // 나베리우스: 숨 쉴 틈 없는 추격 참격
  if(e.burnHit&&mv.t!=='sealed'&&P.hp>0&&Math.random()<0.4&&!(B.dot&&B.dot.name==='화상')){B.dot={name:'화상',dmg:Math.max(5,Math.round(e.atk*0.12)),turns:3};addLog('🔥 라이아의 불길 — 화상');}
  if(e.slashes&&mv.t!=='sealed'&&P.hp>0){
    for(let i=0;i<e.slashes;i++)hitPlayer(0.35,`🗡 추격 참격 ${i+1}`);
  }
  if(e.critSlash&&mv.t!=='sealed'&&mv.t!=='charge'&&P.hp>0){const f=e.fixedDmg;e.fixedDmg=true;hitPlayer(e.critSlash,`💥 ${e.name}의 참격 — 치명타`);e.fixedDmg=f;} // 공격력 절반의 치명타 (방어력 무시)
  B.ward=false;
  if(e.burnBleed&&P.hp>0&&e.hp>0){ // 테라지오: 처음부터 끝까지 화상 + 출혈
    const bd=Math.max(3,Math.round(e.atk*0.075)),bl=Math.max(3,Math.round(e.atk*0.075));
    P.hp=Math.max(0,P.hp-bd-bl);addLog(`🔥 화상 ${bd} · 🩸 출혈 ${bl} — 끝나지 않는 상처`);queueFx('player','-'+(bd+bl),'pdmg');
    hitAllies(0.05,'🔥🩸 화상·출혈',true);
  }
  if(e.burnAll&&P.hp>0&&e.hp>0){ // 아몬: 끝없는 화상 (주인공·동료)
    if(!B.dot||B.dot.name!=='화상')B.dot={name:'화상',dmg:Math.max(5,Math.round(e.atk*0.2)),turns:99};else B.dot.turns=99;
    hitAllies(0.05,'🔥 끝없는 화상');
  }
  if(B.dot&&P.hp>0){
    P.hp=Math.max(0,P.hp-B.dot.dmg);addLog(`${B.dot.name==='화상'?'🔥':'🩸'} ${B.dot.name} — ${B.dot.dmg} 피해`);queueFx('player','-'+B.dot.dmg,'pdmg');
    if(--B.dot.turns<=0)B.dot=null;
  }
  if(B.ebleed&&e.hp>0){
    const d=B.immune?0:B.ebleed.dmg;stat('dmg','pasri',Math.min(d,e.hp));e.hp=Math.max(0,e.hp-d);addLog(`🩸 출혈 — ${e.name} ${d} 피해`);queueFx('enemy','🩸'+d,'dmg');
    if(--B.ebleed.turns<=0)B.ebleed=null;
  }
  if(B.eburn&&e.hp>0){
    const d=B.immune?0:B.eburn.dmg;stat('dmg','karma',Math.min(d,e.hp));e.hp=Math.max(0,e.hp-d);addLog(`🔥 불태움 — ${e.name} ${d} 피해`);queueFx('enemy','🔥'+d,'dmg');
    if(--B.eburn.turns<=0)B.eburn=null;
  }
  if(B.prism)B.prism--;
  if(B.negate)B.negate--;
  if(B.blind)B.blind--;
  if(B.ashield){B.ashield--;if(!B.ashield)B.shield=0;}
  if(B.splash)B.splash--;
  if(B.tornadoCD>0)B.tornadoCD--;
  if(B.immune)B.immune--;
  if(B.healCut&&mv.t!=='barrage')B.healCut--;
  if(B.reflect)B.reflect--;
  if(B.buff)B.buff--;
  if(B.aura)B.aura--;
  if(B.hex)B.hex--;
  if(B.curse&&mv.t!=='curse')B.curse--;
  if(B.silence&&mv.t!=='silence')B.silence--;
  if(B.weak)B.weak--;
  if(P.hp<=0){P.hp=0;B.over=true;renderBattle();setTimeout(defeat,900);return;}
  if(e.hp<=0){winNow();return;}
  renderBattle();
}

function gainXp(n){
  P.xp+=n;const msgs=[];
  while(P.xp>=need(P.lv)){
    P.xp-=need(P.lv);P.lv++;
    P.maxHp+=15;P.maxMp+=5;P.atk+=3;P.def+=2;P.hp=P.maxHp;P.mp=P.maxMp;
    msgs.push(`⬆ 레벨 ${P.lv} 달성! (HP 완전 회복)`);
  }
  return msgs;
}

function victory(){
  if(!B)return;
  if(B.pvp){pvpEnd(true);return;}
  const e=B.e,area=B.area,stype=B.stype,stage=B.stage,wasFinal=B.isFinal,fromHunt=!!B.spec.hunt;
  const tName=B.baseName;
  B.over=true;
  const firstClear=!fromHunt&&stage>P.prog[area];
  const gold=e.goldRepeat!=null?(firstClear?e.goldFirst:e.goldRepeat):B.isBoss?Math.round(e.gold*BOSS_GOLD_MULT):e.gold;
  P.gold+=gold;
  P.kills[tName]=(P.kills[tName]||0)+1;
  const memEgg=tName==='푸르푸르'&&P.kills[tName]>=MEMORY_KILLS&&!P.relics.includes('our_memory'); // 이스터에그
  if(memEgg)gainRelic('our_memory');
  P.wins[area]=(P.wins[area]||0)+1;
  let extra=[];
  if(memEgg)extra.push(`📸 이스터에그! 희귀한 유물 「우리들의 추억」을 손에 넣었다 — 시간 속에 잠긴 추억`);
  {P.trust=P.trust||{};const g=TRUST_GAIN[stype]||1;
   partyIds().filter(trustOn).forEach(id=>{const l0=trustLv(id);P.trust[id]=Math.min(TRUST_REQ[TRUST_MAX],trustPts(id)+g);const l1=trustLv(id);
     if(l1>l0)extra.push(`💗 ${ALLIES[id].name} 신뢰도 ${l1}/${TRUST_MAX} — 전투력 +${Math.round((trustMult(id)-1)*100)}%`);});}
  if(firstClear&&e.itemFirst&&RELICS[e.itemFirst]&&!P.relics.includes(e.itemFirst)){gainRelic(e.itemFirst);const it=RELICS[e.itemFirst];extra.push(`🏁 첫 클리어 보상: ${it.icon} 희귀 아이템 「${it.name}」 — ${it.desc.replace('희귀 아이템 · ','')}`);}
  if(firstClear&&e.stoneFirst){P.items.stone+=e.stoneFirst;stoneToast(e.stoneFirst,'첫 클리어 보상');extra.push(`🏁 첫 클리어 보상: ${AWAKEN_ITEM.icon} 「${AWAKEN_ITEM.name}」 ×${e.stoneFirst}`);}
  if(stype==='normal'&&Math.random()<0.15){P.items.water++;extra.push('성수 획득');}
  if(stype==='normal'&&Math.random()<DROP.stoneNormal){P.items.stone++;stoneToast(1,'희귀 드랍');extra.push(`${AWAKEN_ITEM.icon} 희귀 아이템 「${AWAKEN_ITEM.name}」 획득!`);}
  const first=!fromHunt&&stage>P.prog[area];
  if(first){
    P.prog[area]=stage;
    if(stype==='normal'){P.gold+=e.gold;extra.push(`🏁 첫 클리어 보너스 +${e.gold} G`);}
    if(stype==='elite'){P.tickets+=1;extra.push('🏁 첫 클리어: 🎫 소환권 ×1');}
    if(stype==='mid'){P.tickets+=2;extra.push('🏁 첫 클리어: 🎫 소환권 ×2');}
    if(stype==='boss'){P.tickets+=3;extra.push('🏁 첫 클리어: 🎫 소환권 ×3');}
  }
  // 희귀 유물: 확률 드롭 (재도전으로 다시 노릴 수 있음)
  if(stype==='mid'&&Math.random()<DROP.stoneMid){P.items.stone++;stoneToast(1,'솔로몬 72악마 드랍');extra.push(`${AWAKEN_ITEM.icon} 희귀 아이템 「${AWAKEN_ITEM.name}」 획득!`);}
  if(stype==='boss'){
    const gaiaB=inParty('gaia')?0.10:0; // 가이아 수도사 출전 시 성유물 확률 +10%p
    if(Math.random()<DROP.stoneBoss+gaiaB){P.items.stone++;stoneToast(1,gaiaB?'나라 보스 드랍 · 🔷 가이아의 눈썰미':'나라 보스 드랍');extra.push(`${AWAKEN_ITEM.icon} 희귀 아이템 「${AWAKEN_ITEM.name}」 획득!`);}
    const d=AREAS[area].boss.drop;
    if(d&&!P.relics.includes(d)){
      if(Math.random()<DROP.seal){gainRelic(d);extra.push(`${RELICS[d].icon} 희귀 유물 「${RELICS[d].name}」 획득! (${RELICS[d].desc})`);}
      else extra.push(`인장은 손에 넣지 못했다… (획득 확률 ${DROP.seal*100}% · 재도전 가능)`);
    }
  }
  const allyUps=[];
  partyIds().forEach(id=>{if(allyGainXp(id,e.xp))allyUps.push(`${ALLIES[id].name} Lv ${aData(id).lv}`);});
  const ups=gainXp(e.xp);
  if(allyUps.length)ups.push('🤝 동료 레벨업: '+allyUps.join(', '));
  const lines=[`✨ 경험치 +${fmt(e.xp)}`];
  if(gold)lines.push(`💰 ${fmt(gold)} G${e.goldRepeat!=null?(firstClear?' (첫 클리어 보상)':' (재도전 보상)'):gold!==e.gold?' (보스 보너스 ×1.25)':''}`);
  const rep={title:`${AREAS[area].flag} ${esc(e.twin?`${tName} · ${e.twin.name}`:tName)} 처치`,won:true,lines:[...lines,...extra,...ups],st:B.st,party:partyIds().slice()};
  clearBattle();
  victoryFlow(area,stype,first,wasFinal,fromHunt,'',stage,rep);
}
function victoryFlow(area,stype,first,wasFinal,fromHunt,msg,stage,rep){
  if(rep&&stype==='boss'&&first){showResult(rep,()=>victoryFlow(area,stype,first,wasFinal,fromHunt,msg,stage));return;}
  if(stype==='boss'&&first){
    P.cleared[area]=true;
    if(wasFinal){
      P.ended=true;P.unlocked=Math.max(P.unlocked,area+1);P.cur=area+1;save();
      storyChain([ENDING,AREAS[area+1].intro],()=>renderMap(area+1,`✝ 나베리우스 토벌 완료!<br>🔓 새 지역 개방: ${AREAS[area+1].flag} ${AREAS[area+1].name}`));
      return;
    }
    if(area>=AREAS.length-1){save();storyChain([AREAS[area].outro],()=>renderMap(area));return;}
    P.unlocked=Math.max(P.unlocked,area+1);
    P.cur=area+1;save();
    storyChain([AREAS[area].outro,AREAS[area+1].intro],
      ()=>renderMap(area+1,`🔓 새 나라 개방: ${AREAS[area+1].flag} ${AREAS[area+1].name}`));
    return;
  }
  save();
  if(!fromHunt&&first&&stage<STAGES){mapSel={a:area,s:stage+1};autoNext(area,stage+1,rep);return;}
  if(fromHunt)renderHub();else renderMap(area);
  if(rep)showResult(rep,null);
}
/* 전투 결과: 보상 + 딜·힐 그래프 (모든 전투 후, 한 화면) */
function resultHTML(r){
  const who=['hero',...(r.party||[])];
  const nm=w=>w==='hero'?esc(P.name):ALLIES[w].name;
  const ic=w=>w==='hero'?'<span class="aemo xs">✝</span>':allyFace(w,'xs');
  const st=r.st||{dmg:{},heal:{}};
  const total=kind=>who.reduce((s,w)=>s+(st[kind][w]||0),0);
  const chart=(kind,cls)=>{
    const rows=who.map(w=>({w,v:st[kind][w]||0})).sort((a,b)=>b.v-a.v);
    const tot=total(kind),mx=Math.max(1,...rows.map(x=>x.v));
    return rows.map(x=>`<div class="rp-row"><div class="rp-nm">${ic(x.w)}<span>${nm(x.w)}</span></div>
      <div class="rp-bar"><i class="${cls}" style="width:${(x.v/mx*100).toFixed(1)}%"></i></div>
      <div class="rp-v">${fmt(x.v)}<small>${tot?Math.round(x.v/tot*100):0}%</small></div></div>`).join('');
  };
  const ht=total('heal');
  return `<div class="report result"><div class="rs-head ${r.won?'win':'lose'}">${r.won?'🏆 승리':'💀 패배'}</div>
    <div class="sum-title">${r.title}</div>
    ${r.note?`<div class="rs-note">${r.note}</div>`:''}
    <div class="rs-rew">${(r.lines&&r.lines.length?r.lines:['획득한 보상 없음']).map(l=>`<div>${l}</div>`).join('')}</div>
    <div class="rp-h">⚔ 준 피해 <span>합계 ${fmt(total('dmg'))}</span></div>${chart('dmg','d')}
    ${ht?`<div class="rp-h">✚ 회복 · 보호 <span>합계 ${fmt(ht)}</span></div>${chart('heal','h')}`:''}</div>`;
}
function showResult(r,cb,label){
  showStory(resultHTML(r),cb,true);
  $('#mbtn').textContent=label||'확인';
}
/* 최초 클리어 → 다음 스테이지 자동 출전 (3초, 취소 가능) */
let autoT=null;
function autoNext(a,s,rep){
  renderMap(a);
  let n=5;const t=stageType(s);
  $('#mtext').innerHTML=`<div class="autonext">${rep?resultHTML(rep):''}
    <div class="anext">다음 → <b>${s}. ${stageName(a,s)}</b> <span class="tag ${t==='normal'?'done':t==='elite'?'item':'t-ally'}">${STYPE_LABEL[t]}</span>
    <div class="small">HP ${P.hp}/${P.maxHp} · 성수 ${P.items.water}</div></div>
    <button class="btn" id="anstop">🗺 멈추고 지도로</button></div>`;
  const lbl=()=>`▶ 바로 출전 (${n}초 후 자동)`;
  $('#mbtn').textContent=lbl();
  $('#modal').classList.remove('hidden');
  const go=()=>{clearInterval(autoT);autoT=null;$('#modal').classList.add('hidden');startBattle({area:a,stage:s});};
  $('#mbtn').onclick=go;
  $('#anstop').onclick=()=>{clearInterval(autoT);autoT=null;$('#modal').classList.add('hidden');renderMap(a);};
  clearInterval(autoT);
  autoT=setInterval(()=>{n--;if(n<=0)go();else $('#mbtn').textContent=lbl();},1000);
}

function defeat(){
  if(B&&B.pvp){pvpEnd(false);return;}
  const rep=B?{title:`${esc(B.baseName||B.e.name)}에게 패배`,won:false,st:B.st,party:partyIds().slice()}:null;
  clearBattle();
  const lost=Math.floor(P.gold/2);
  P.gold-=lost;P.hp=Math.round(P.maxHp*0.5);P.mp=Math.round(P.maxMp*0.5);save();
  const note=`눈앞이 어두워진다… 교구의 사제들이 쓰러진 ${esc(P.name)}을(를) 성당으로 옮겼다.`;
  const after=()=>renderHub('정신을 차렸다. 성당에서 휴식하고 다시 도전하자.');
  if(rep){rep.note=note;rep.lines=[`💸 소지금 ${fmt(lost)} G를 잃었다`,'🩹 HP 절반으로 깨어남'];showResult(rep,after,'계속');}
  else showStory(note+`\n\n(소지금 ${lost} G를 잃었다)`,after);
}

/* ===================== 지도 ===================== */
let mapSel=null;
function renderMap(a,msg){
  BGM.play('lobby');
  if(a==null)a=P.cur;
  P.cur=a;
  const ar=AREAS[a],prog=P.prog[a];
  if(mapSel==null||mapSel.a!==a)mapSel={a,s:Math.min(STAGES,prog+1)};
  const X=[50,74,82,66,42,22,18,34,58,78,80,60,38,22,46];
  const ROW=74,H=STAGES*ROW+30;

  for(let s=1;s<=STAGES;s++){
    const x=X[s-1],y=(STAGES-s)*ROW+40;pts.push(`${x},${y}`);
    const t=stageType(s),state=s<=prog?'done':s===prog+1?'next':'lock';
    const label=t==='boss'?'☠':t==='mid'?'✠':t==='elite'?'⚔':s;
    const kc=t==='boss'?(P.kills[ar.boss.name]||0):0;
    nodes+=`<button class="node ${t} ${state} ${mapSel.s===s?'sel':''}" data-st="${s}" style="left:${x}%;top:${y}px" ${state==='lock'?'disabled':''}>${state==='done'&&t==='normal'?'✔':label}${kc?`<span class="kc">처치 ${fmt(kc)}회</span>`:''}</button>`;
  }
  const s=mapSel.s,t=stageType(s),open=s<=prog+1;
  const art=(t==='boss'||t==='mid')?`<div class="sheet-art">${PORTRAIT[(t==='boss'?ar.boss:ar.mid).art]?portraitHTML((t==='boss'?ar.boss:ar.mid).art,'small'):bossSVG((t==='boss'?ar.boss:ar.mid).art)}</div>`:'';
  $('#app').innerHTML=`${statusHTML()}${topBack()}
    ${msg?`<div class="notice">${msg}</div>`:''}
    <div class="panel"><div class="ptitle">🗺 ${ar.flag} ${ar.name} <span class="small">스테이지 ${prog}/${STAGES}</span></div>
      <div class="mapwrap" style="--gc:${ar.glow}"><div class="map" style="height:${H}px">
        <svg class="mapline" viewBox="0 0 100 ${H}" preserveAspectRatio="none"><polyline points="${pts.join(' ')}" vector-effect="non-scaling-stroke"/></svg>
        ${nodes}
      </div></div>
    </div>
    <div class="panel sheet">
      ${art}
      <div class="ptitle">${s}. ${stageName(a,s)} <span class="tag ${t==='normal'?'done':t==='elite'?'item':'t-ally'}">${STYPE_LABEL[t]}</span>${t==='boss'?` <span class="small">☠ 처치 ${fmt(P.kills[ar.boss.name]||0)}회</span>`:''}</div>
      ${(t==='boss'||t==='mid')?`<div class="etitle" style="text-align:left">${(t==='boss'?ar.boss:ar.mid).title}</div>`:''}
      <div class="desc">권장 Lv ${stageRec(a,s)} · 첫 클리어 보상: ${STAGE_REWARD[t]}${s<=prog?' <span class="gold">(클리어 완료 · 재도전 가능)</span>':''}${t==='boss'&&ar.boss.drop?(P.relics.includes(ar.boss.drop)?' · 🔒 인장 보유':' · 인장 미획득'):''}</div>
      ${sortieRule(a)?(()=>{const ok=P.active.filter(id=>sortieOk(a,id)).slice(0,sortieRule(a).max||9),no=P.active.filter(id=>!ok.includes(id));
        return `<div class="notice sortie">⚠ 출전 조건 — ${sortieRule(a).text}<br><span class="small">출전 가능: ${ok.length?ok.map(id=>ALLIES[id].name).join(', '):'없음'}${no.length?` · 출전 불가: ${no.map(id=>ALLIES[id].name).join(', ')}`:''}</span></div>`;})():''}
      <div class="grid">
        <button class="btn ${t==='boss'||t==='mid'?'danger':'primary'}" id="go" ${open?'':'disabled'}>${open?'⚔ 출전':'🔒 이전 스테이지를 먼저 클리어'}</button>
        <button class="btn" id="back">← 거점으로</button>
      </div>
    </div>${tabBar()}`;
  document.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{mapSel={a,s:+b.dataset.st};renderMap(a);});
  $('#go').onclick=()=>startBattle({area:a,stage:s});
  $('#back').onclick=()=>renderHub();
  const sel=document.querySelector('.node.sel');
  if(sel&&!msg)sel.scrollIntoView({block:'center'});
  else window.scrollTo(0,0);
  save();
}

document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&P){try{localStorage.setItem(SAVE_KEY,JSON.stringify(P))}catch(e){}
  if(FB&&cloudRef&&P.uid===fbPid){try{cloudRef.set({json:JSON.stringify(P),savedAt:P.savedAt||Date.now(),key:SAVE_KEY});}catch(e){}}}});
renderTitle();
initCloud();



</script>
</body>
</html>
