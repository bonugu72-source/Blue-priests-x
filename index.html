<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>푸른사제들</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&family=Noto+Serif+KR:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070b18;--panel:#101831;--panel2:#16213f;--line:#26345e;
  --text:#e6ecff;--dim:#8d9bc4;--blue:#4da3ff;--blue2:#2b6fd6;
  --gold:#e8c76a;--red:#e05a5a;--green:#5fd39a;--mp:#5b8cff;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:'Noto Sans KR',system-ui,sans-serif;color:var(--text);
  background:radial-gradient(ellipse at 50% -10%,#1a2d63 0%,var(--bg) 60%) fixed;
  background-color:var(--bg);user-select:none;-webkit-user-select:none;
  transition:background-color .15s;
}
body.flash{background-color:#3a0f16}
#app{max-width:480px;margin:0 auto;padding:12px 12px 24px;min-height:100dvh;display:flex;flex-direction:column;gap:10px}
button{font-family:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default}

/* Title */
.title{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:20px 8px}
.cross{font-size:54px;color:var(--blue);text-shadow:0 0 24px var(--blue),0 0 60px var(--blue2);animation:pulse 3s ease-in-out infinite}
.title h1{font-family:'Noto Serif KR',serif;font-weight:900;font-size:44px;letter-spacing:4px;
  background:linear-gradient(180deg,#eaf3ff,#6fb6ff 60%,#2b6fd6);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 12px rgba(77,163,255,.45))}
.sub{color:var(--dim);letter-spacing:6px;font-size:12px;margin-top:-8px}
.title input{width:100%;max-width:280px;margin-top:18px;padding:14px;border-radius:12px;border:1px solid var(--line);
  background:var(--panel);color:var(--text);font-size:17px;text-align:center;font-family:inherit;outline:none}
.title input:focus{border-color:var(--blue)}
.title .btn{width:100%;max-width:280px}
.hint{color:var(--dim);font-size:12px;line-height:1.6}
@keyframes pulse{50%{opacity:.6;transform:scale(.96)}}

/* Buttons */
.btn{min-height:52px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);
  font-size:15px;font-weight:700;transition:transform .08s,background .15s}
.btn:active:not(:disabled){transform:scale(.97)}
.btn.primary{background:linear-gradient(180deg,#3b8cf0,#2560c4);border-color:#5aa5ff}
.btn.danger{background:linear-gradient(180deg,#7a2333,#561523);border-color:#a8404f}
.btn:disabled{opacity:.42}
.btn small{display:block;font-weight:400;font-size:11px;color:#c5d2f5;margin-top:2px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid .full{grid-column:1/-1}
.link{background:none;border:none;color:var(--dim);font-size:13px;text-decoration:underline;padding:8px}
.foot{text-align:center}

/* Status */
.status{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.row b{font-size:16px}
.small{font-size:12px;color:var(--dim)}
.gold{color:var(--gold);font-weight:700}
.bar{position:relative;height:18px;border-radius:9px;background:#0a1024;overflow:hidden;border:1px solid #1d2a50}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:9px;transition:width .35s ease}
.bar span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;text-shadow:0 1px 2px #000}
.bar.hp i{background:linear-gradient(90deg,#c43c4c,#ef6a6a)}
.bar.mp i{background:linear-gradient(90deg,#3462d9,#6f9cff)}
.bar.xp{height:10px}.bar.xp i{background:linear-gradient(90deg,#b8933a,#f0d27a)}.bar.xp span{font-size:8px}
.bar.ehp{height:14px;width:100%}.bar.ehp i{background:linear-gradient(90deg,#8e2a3a,#d84c5c)}

/* Panels */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.ptitle{font-family:'Noto Serif KR',serif;font-size:17px;color:#cfe3ff}
.desc{font-size:13px;color:var(--dim);line-height:1.6}
.notice{background:#122448;border:1px solid #2e5aa6;border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.7}
.area{display:flex;justify-content:space-between;align-items:center;padding:11px 12px;border-radius:10px;border:1px solid var(--line);
  background:#0d1530;font-size:14px;text-align:left}
.area.on{border-color:var(--blue);background:#14264d;box-shadow:inset 3px 0 0 var(--blue)}
.area.lock{opacity:.4}
.shopitem{display:flex;justify-content:space-between;align-items:center;gap:10px}
.shopitem .info{font-size:14px}.shopitem .info small{display:block;color:var(--dim);font-size:12px;margin-top:2px}
.shopitem .btn{min-height:42px;min-width:92px;font-size:14px}

/* Battle */
.enemy{background:linear-gradient(180deg,#121b38,#0b1126);border:1px solid var(--line);border-radius:16px;padding:14px 14px 12px;
  display:flex;flex-direction:column;align-items:center;gap:8px;position:relative;overflow:hidden}
.enemy.boss{border-color:#7a2a3a;background:linear-gradient(180deg,#24101c,#0d0a18)}
.ename{font-family:'Noto Serif KR',serif;font-size:18px}
.ename em{font-style:normal;font-family:'Noto Sans KR';font-size:10px;font-weight:700;background:var(--red);border-radius:4px;padding:2px 5px;vertical-align:middle;margin-left:4px}
.eicon{font-size:86px;line-height:1.1;filter:drop-shadow(0 0 18px rgba(120,160,255,.35));animation:float 3s ease-in-out infinite}
.boss .eicon{filter:drop-shadow(0 0 22px rgba(224,90,90,.6))}
.eicon.charge{animation:charge .5s ease-in-out infinite}
.eicon.hit{animation:hit .35s}
.estat{font-size:12px;color:#ffb36b;min-height:16px;font-weight:700}
.pstat{font-size:12px;color:var(--green);text-align:center;min-height:16px}
@keyframes float{50%{transform:translateY(-6px)}}
@keyframes charge{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes hit{0%{transform:translateX(0)}20%{transform:translateX(-10px);filter:brightness(2.5)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}100%{transform:translateX(0)}}
.log{background:#080d1e;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.65;min-height:128px;display:flex;flex-direction:column;justify-content:flex-end}
.log div{color:var(--dim)}
.log div:last-child{color:var(--text)}
.cmds .btn{min-height:54px}

.eicon.shadow{filter:brightness(.18) drop-shadow(0 0 18px rgba(224,90,90,.8))}
.eicon.triple{font-size:58px;letter-spacing:-8px}
.eflag{font-size:11px;color:var(--dim);letter-spacing:1px}
.party{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chip{font-size:12px;background:#13224a;border:1px solid #2e4a8a;border-radius:20px;padding:4px 10px}
.mission{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px;border-radius:10px;background:#0d1530;border:1px solid var(--line)}
.mission .info{font-size:14px;flex:1}.mission .info small{display:block;color:var(--dim);font-size:12px;margin-top:3px;line-height:1.5}
.mission .btn{min-height:40px;font-size:13px;min-width:86px}
.tag{font-size:10px;font-weight:700;border-radius:4px;padding:1px 5px;margin-right:4px;vertical-align:middle}
.tag.t-ally{background:#2b6fd6}.tag.item{background:#8a6a1f}.tag.done{background:#2f6b4c}
.ally{display:flex;gap:10px;align-items:center;font-size:14px}
.ally .ic{font-size:26px;width:36px;text-align:center}
.ally small{display:block;color:var(--dim);font-size:12px;line-height:1.5}
.ally.locked{opacity:.5}

/* Summon */
.sum{text-align:center;font-family:'Noto Sans KR',sans-serif}
.sum-stars{font-size:30px;color:var(--gold);letter-spacing:4px;text-shadow:0 0 14px rgba(232,199,106,.7)}
.sum-icon{font-size:76px;margin:6px 0;animation:pop .5s ease-out}
.sum.s3 .sum-icon{filter:drop-shadow(0 0 18px var(--blue))}
.sum.s2 .sum-icon{filter:drop-shadow(0 0 10px #8fb0ff)}
.sum-name{font-family:'Noto Serif KR',serif;font-size:22px;font-weight:900}
.sum-desc{font-size:13px;color:var(--dim);line-height:1.6;margin:10px 0}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}

.sum-title{font-size:13px;color:var(--dim);margin-bottom:6px}
.sumgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:8px 0 4px}
.sumcell{background:#0d1530;border:1px solid var(--line);border-radius:10px;padding:6px 2px;position:relative;animation:pop .4s ease-out both}
.sumcell .ic{font-size:26px}.sumcell .st{font-size:9px;color:var(--gold);letter-spacing:-1px}.sumcell .nm{font-size:9px;line-height:1.2;word-break:keep-all}
.sumcell.s3{border-color:#4da3ff}.sumcell.s4{border-color:#b07cff;box-shadow:0 0 10px rgba(176,124,255,.5)}.sumcell.s5{border-color:var(--gold);box-shadow:0 0 14px rgba(232,199,106,.7)}
.sumcell .new{position:absolute;top:-6px;right:-4px;background:var(--red);font-size:8px;font-weight:700;border-radius:4px;padding:1px 3px}
.sum.s4 .sum-icon{filter:drop-shadow(0 0 20px #b07cff)}.sum.s5 .sum-icon{filter:drop-shadow(0 0 26px var(--gold))}

.acard{background:#0d1530;border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
.acard.fixed{border-color:#3a6fc4;background:#10204a}
.abtns{display:flex;gap:6px;flex-wrap:wrap}
.abtns .btn{min-height:36px;font-size:12px;padding:4px 10px;flex:1;white-space:nowrap}

/* Cover (title) */
body.title-mode{overflow:hidden}
.cover{position:fixed;inset:0;z-index:5;overflow:hidden;background:#05070f}
.cover .bgblur{position:absolute;inset:-10%;background:url(cover.jpg) center/cover no-repeat;filter:blur(28px) brightness(.35)}
.cover .bgwrap{position:absolute;top:0;left:50%;transform:translateX(-50%);width:min(100vw,560px);aspect-ratio:900/1304;overflow:hidden}
.cover .bgwrap::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,7,15,.7) 0%,transparent 18%,transparent 70%,#05070f 100%)}
.cover .bg{position:absolute;inset:0;background:url(cover.jpg) center top/cover no-repeat;animation:kenburns 26s ease-in-out infinite alternate}
@keyframes kenburns{from{transform:scale(1) translate(0,0)}to{transform:scale(1.07) translate(-1.2%,-1%)}}
.cover .aura{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen}
.cover .aura.blue{background:radial-gradient(circle at 76% 52%,rgba(70,130,255,.42),transparent 30%);animation:breathe 5.5s ease-in-out infinite}
.cover .aura.red{background:radial-gradient(circle at 15% 56%,rgba(255,50,60,.34),transparent 28%);animation:breathe 7s ease-in-out infinite reverse}
.cover .aura.halo{background:radial-gradient(ellipse at 64% 20%,rgba(150,190,255,.22),transparent 26%);animation:breathe 9s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.3}50%{opacity:1}}
.cover .fog{position:absolute;left:-50%;width:200%;height:46%;top:22%;pointer-events:none;
  background:radial-gradient(ellipse at 30% 50%,rgba(110,140,220,.14),transparent 55%),radial-gradient(ellipse at 75% 40%,rgba(90,120,200,.12),transparent 50%);
  filter:blur(18px);animation:drift 34s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-8%)}to{transform:translateX(8%)}}
.cover canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.cover .shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,transparent 0%,transparent 55%,rgba(5,7,15,.6) 72%,rgba(5,7,15,.9) 100%)}
.cover .vignette{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 140px rgba(0,0,0,.85)}
.cover .top{position:absolute;top:calc(22px + env(safe-area-inset-top));left:0;right:0;text-align:center;z-index:2}
.ctitle{font-family:'Noto Serif KR',serif;font-weight:900;font-size:46px;letter-spacing:6px;
  background:linear-gradient(180deg,#f2f7ff,#8cc4ff 55%,#3a7ae0);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 14px rgba(77,163,255,.55));animation:glow 4s ease-in-out infinite}
@keyframes glow{50%{filter:drop-shadow(0 0 26px rgba(120,180,255,.9))}}
.cover .sub{margin-top:2px}
.cover .ui{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:480px;z-index:2;
  padding:0 22px calc(26px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:stretch;gap:10px;animation:fadein 1.2s ease-out}
.cover input{padding:14px;border-radius:12px;border:1px solid rgba(120,160,255,.35);background:rgba(10,16,36,.72);color:var(--text);
  font-size:17px;text-align:center;font-family:inherit;outline:none;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.cover input:focus{border-color:var(--blue)}
.cover .btn{backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.cover .btn:not(.primary){background:rgba(22,33,63,.75)}
.cover .hint{text-align:center;color:#9fb0d8;text-shadow:0 1px 4px #000}
@media (prefers-reduced-motion: reduce){.cover .bg,.cover .aura,.cover .fog,.ctitle{animation:none}}

/* Demons */
.enemy.boss{background:radial-gradient(ellipse at 50% 45%,#2a0c16 0%,#0b0610 70%);border-color:#6b1f2e;box-shadow:inset 0 0 40px rgba(0,0,0,.8)}
.enemy.final{border-color:#b0203a;box-shadow:0 0 24px rgba(255,30,60,.25),inset 0 0 50px rgba(0,0,0,.9)}
.etitle{font-size:11px;color:#c79aa6;letter-spacing:1px;text-align:center;margin-top:-4px}
.epass{font-size:11px;color:#ffb0b0;font-weight:700}
.ename em.el{background:#a87a1c}
.eicon.art{animation:none;font-size:0;line-height:0}
.eicon.art.charge{animation:charge .5s ease-in-out infinite}
.eicon.sil{filter:brightness(0) drop-shadow(0 0 1.5px var(--gc)) drop-shadow(0 0 12px var(--gc))}
.eicon.sil.elite{font-size:100px}
.bsvg{width:230px;height:230px;overflow:visible;display:block}
.bsvg *{animation-delay:var(--t,0s)}
.bsvg .circle{transform-origin:100px 110px;animation:spin 48s linear infinite;opacity:.55}
.bsvg .pulse{animation:breathe 3.2s ease-in-out infinite}
.bsvg .body{animation:bob 4.5s ease-in-out infinite}
.bsvg .eyes{animation:bob 4.5s ease-in-out infinite,eyep 2.6s ease-in-out infinite}
.bsvg .wl{animation:flapL 3s ease-in-out infinite}.bsvg .wr{animation:flapR 3s ease-in-out infinite}
.bsvg .fire{animation:flick .18s steps(2) infinite alternate}
.bsvg .bolt{animation:bolt 1.7s steps(1) infinite}.bsvg .b2{animation-duration:2.3s}.bsvg .b3{animation-duration:1.3s}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bob{50%{transform:translateY(-4px)}}
@keyframes eyep{0%,100%{opacity:.75}50%{opacity:1}}
@keyframes flapL{50%{transform:rotate(-7deg)}}@keyframes flapR{50%{transform:rotate(7deg)}}
@keyframes flick{to{opacity:.7;transform:translateY(-1px) scaleY(1.04)}}
@keyframes bolt{0%,62%{opacity:0}64%,70%{opacity:1}72%,80%{opacity:0}82%,86%{opacity:1}88%{opacity:0}}
.intro-art .bsvg{width:210px;height:210px;margin:0 auto}
.sheet-art{display:flex;justify-content:center}.sheet-art .bsvg{width:170px;height:170px}
.chip .mhp{display:block;height:3px;background:#0a1024;border-radius:2px;margin-top:3px;overflow:hidden}
.chip .mhp b{display:block;height:100%;background:linear-gradient(90deg,#c43c4c,#ef6a6a)}
.chip.down{opacity:.35;text-decoration:line-through}
/* Boss portraits (user illustrations) */
.portrait{position:relative;width:210px;height:250px;border-radius:14px;overflow:hidden;margin:0 auto;animation:bob 4.5s ease-in-out infinite}
.portrait.big{width:250px;height:360px;animation:none}
.portrait.small{width:150px;height:180px;animation:none}
.portrait img{width:100%;height:100%;object-fit:cover;display:block}
.portrait .pglow{position:absolute;inset:0;pointer-events:none;border-radius:14px}
.portrait .pflash{position:absolute;inset:0;pointer-events:none}
.pf-furfur{box-shadow:0 0 22px rgba(120,200,255,.55),0 0 60px rgba(80,160,255,.25)}
.pf-furfur .pglow{box-shadow:inset 0 0 40px rgba(140,210,255,.55);animation:pzap 2.2s steps(1) infinite}
.pf-furfur .pflash{background:rgba(220,240,255,.85);mix-blend-mode:screen;opacity:0;animation:lflash 3.7s infinite}
.pf-furfur .prain{position:absolute;inset:-20% 0 0 0;pointer-events:none;opacity:.35;
  background:repeating-linear-gradient(100deg,transparent 0 9px,rgba(200,225,255,.55) 9px 10px,transparent 10px 22px);animation:rain .45s linear infinite}
.pbolts{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.pbolts path{fill:none;stroke:#e4f4ff;stroke-width:.8;filter:drop-shadow(0 0 3px #8fd0ff);opacity:0}
.pbolts .bolt{animation:bolt 1.9s steps(1) infinite}.pbolts .b2{animation-duration:2.6s}.pbolts .b3{animation-duration:1.4s}
.pf-naberius{box-shadow:0 0 24px rgba(255,40,60,.55),0 0 70px rgba(200,0,30,.3)}
.pf-naberius .pglow{background:radial-gradient(ellipse at 50% 100%,rgba(255,40,40,.45),transparent 60%);box-shadow:inset 0 0 50px rgba(120,0,10,.7);animation:breathe 2.6s ease-in-out infinite}
.pf-naberius.p2{box-shadow:0 0 34px rgba(255,30,50,.85),0 0 100px rgba(255,0,30,.45)}
.pf-naberius.p2 .pglow{background:radial-gradient(ellipse at 50% 100%,rgba(255,50,30,.7),transparent 70%);animation-duration:1.2s}
.pf-naberius.p2 img{filter:saturate(1.3) contrast(1.1)}
.pembers{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.pembers i{position:absolute;bottom:-6px;width:4px;height:4px;border-radius:50%;background:#ff5a3a;box-shadow:0 0 6px #ff3a1a,0 0 12px #ff2a0a;animation:ember 3s linear infinite}
.pf-naberius.p2 .pembers i{width:5px;height:5px}
@keyframes lflash{0%,88%,100%{opacity:0}89%{opacity:.55}90%{opacity:0}92%{opacity:.35}94%{opacity:0}}
@keyframes pzap{0%,60%{opacity:.6}61%{opacity:1}75%{opacity:.7}}
@keyframes rain{to{transform:translate(-6px,22px)}}
@keyframes ember{0%{transform:translate(0,0);opacity:0}10%{opacity:1}100%{transform:translate(18px,-320px);opacity:0}}

/* Map */
.mapwrap{max-height:56vh;overflow-y:auto;border-radius:12px;background:radial-gradient(ellipse at 50% 0%,rgba(255,255,255,.04),transparent 60%),#070b18;border:1px solid var(--line)}
.map{position:relative}
.mapline{position:absolute;inset:0;width:100%;height:100%}
.mapline polyline{fill:none;stroke:var(--gc);stroke-opacity:.35;stroke-width:3;stroke-dasharray:6 6}
.node{position:absolute;transform:translate(-50%,-50%);width:46px;height:46px;border-radius:50%;border:2px solid var(--line);background:#0e1630;font-weight:900;font-size:15px;color:var(--text)}
.node.done{background:#1a2a50;border-color:#4a6fb8;color:#9fc0ff}
.node.next{border-color:var(--gc);box-shadow:0 0 0 0 var(--gc);animation:nodep 1.6s ease-out infinite;background:#14244a}
.node.lock{opacity:.35}
.node.sel{outline:3px solid #fff;outline-offset:3px}
.node.elite{border-color:#a87a1c}
.node.mid{width:54px;height:54px;font-size:20px;border-color:#b0203a;background:#2a0c16;color:#ff6a7a}
.node.boss{width:64px;height:64px;font-size:26px;border-color:#ff2a4a;background:#3a0a14;color:#ff5a6a;box-shadow:0 0 18px rgba(255,40,70,.45)}
@keyframes nodep{0%{box-shadow:0 0 0 0 var(--gc)}100%{box-shadow:0 0 0 14px transparent}}
.sheet{position:sticky;bottom:8px;z-index:3;box-shadow:0 -6px 24px rgba(0,0,0,.6)}

.codebox{width:100%;height:96px;border-radius:10px;border:1px solid var(--line);background:#070b18;color:#cfe0ff;font-size:11px;padding:8px;font-family:monospace;word-break:break-all;resize:none;user-select:text;-webkit-user-select:text}

.teamcp{font-size:14px;color:#e8d7a0;text-align:center;padding:4px 0}.teamcp b{font-size:20px;color:var(--gold);margin:0 4px}
.cpbreak{text-align:center;line-height:1.6}
.frow{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;background:#0d1530;border:1px solid var(--line)}
.frow.me{border-color:#3a6fc4;background:#10204a}
.fcp{min-width:78px;font-weight:900;color:var(--gold);font-size:14px;display:flex;flex-direction:column;align-items:flex-start}
.fbtn{min-height:34px !important;font-size:12px !important;padding:4px 10px !important;white-space:nowrap}

.fbtns{display:flex;flex-direction:column;gap:4px}
.pvpvis{font-size:0;line-height:1;display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px 0;animation:none}
.pvphero{font-size:64px;color:#ff8a8a;text-shadow:0 0 20px #ff3040}
.pvpteam{display:flex;gap:8px;justify-content:center;font-size:14px;margin:4px 0}
.pvpa{font-size:30px;display:flex;flex-direction:column;align-items:center;background:#1a1030;border:1px solid #6b2a4a;border-radius:10px;padding:4px 6px}
.pvpa i{font-style:normal;font-size:10px;color:var(--dim)}
.pvpvs{font-family:'Noto Serif KR',serif;font-size:20px;font-weight:900;margin:6px 0}.pvpvs span{color:#ff5a6a;margin:0 8px}

/* FX */
#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
.float{position:fixed;transform:translate(-50%,-50%);font-weight:900;font-size:26px;text-shadow:0 2px 6px #000;animation:up .9s ease-out forwards}
.float.dmg{color:#fff}.float.crit{color:var(--gold);font-size:34px}.float.pdmg{color:#ff6b6b}.float.heal{color:var(--green)}.float.mpf{color:#8fb0ff}
@keyframes up{0%{opacity:0;margin-top:10px}15%{opacity:1}100%{opacity:0;margin-top:-60px}}

/* Modal */
#modal{position:fixed;inset:0;background:rgba(3,6,15,.86);display:flex;align-items:center;justify-content:center;padding:20px;z-index:40}
#modal.hidden{display:none}
.mbox{max-width:440px;width:100%;background:linear-gradient(180deg,#14214a,#0c1430);border:1px solid #3a5fae;border-radius:18px;padding:24px 20px 18px;
  box-shadow:0 0 40px rgba(77,163,255,.25);animation:fadein .3s}
#mtext{font-family:'Noto Serif KR',serif;font-size:16px;line-height:1.9;margin-bottom:18px;white-space:normal}
.mbox .btn{width:100%}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}}
</style>

/* 스테이지 */
const stageType=s=>s===15?'boss':s===10?'mid':s===5?'elite':'normal';
const STYPE_LABEL={normal:'일반',elite:'정예',mid:'솔로몬 72악마',boss:'나라 보스'};
const stageRec=(a,s)=>Math.round(AREAS[a].rec+(s-1)*(AREAS[a].recEnd-AREAS[a].rec)/(STAGES-1));
const NORMAL_HP=[2.4,4,4.5,5,5.5], NORMAL_REWARD=1.5; // 일반 적이 몇 턴은 버티며 공격하도록
function scaleBase(base,a,s){
  const f=1+0.06*(s-1);
  return {...base,hp:Math.round(base.hp*f*NORMAL_HP[a]),atk:Math.round(base.atk*f),def:Math.round(base.def*(1+0.04*(s-1))),
    xp:Math.round(base.xp*f*NORMAL_REWARD),gold:Math.round(base.gold*f*NORMAL_REWARD)};
}
function scaledEnemy(a,s,base){
  const ar=AREAS[a];
  return scaleBase(base||ar.enemies[(s-1)%ar.enemies.length],a,s);
}
function stageEnemy(a,s){
  const ar=AREAS[a],t=stageType(s);
  if(t==='boss')return JSON.parse(JSON.stringify(ar.boss));
  if(t==='mid')return JSON.parse(JSON.stringify(ar.mid));
  if(t==='elite')return {...JSON.parse(JSON.stringify(ar.elite)),elite:true};
  return scaledEnemy(a,s);
}
function stageName(a,s){
  const t=stageType(s),ar=AREAS[a];
  if(t==='boss')return ar.boss.name;
  if(t==='mid')return ar.mid.name;
  if(t==='elite')return ar.elite.name;
  return ar.enemies[(s-1)%ar.enemies.length].name;
}

let cloudRef=null,cloudState='checking',cloudBusy=false,cloudDirty=false;
function save(){
  if(!P)return;
  P.savedAt=Date.now();
  try{localStorage.setItem(SAVE_KEY,JSON.stringify(P))}catch(e){}
  cloudSave();
  publishProfile();
}
function load(){try{const s=localStorage.getItem(SAVE_KEY);return s?JSON.parse(s):null}catch(e){return null}}
function cloudSave(){
  if(!cloudRef||!P)return;
  cloudDirty=true;
  if(cloudBusy)return;
  cloudBusy=true;
  setTimeout(async()=>{
    while(cloudDirty&&cloudRef){
      cloudDirty=false;
      try{await cloudRef.set({json:JSON.stringify(P),savedAt:P.savedAt||Date.now(),key:SAVE_KEY});}
      catch(e){if(e&&(e.code==='invalid_argument'||e.code==='revoked'||e.code==='quota_exceeded')){cloudRef=null;cloudState='off';}break;}
    }
    cloudBusy=false;
  },1200);
}
async function initCloud(){
  try{
    if(!window.claude||typeof claude.use!=='function'){cloudState='off';updateCloudNote();return;}
    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    const id=user?await user.id():null;
    if(!db||!id){cloudState='off';updateCloudNote();return;}
    const ref=db.doc('data/users/'+id+'/save');
    const snap=await Promise.race([ref.get(),new Promise((_,rej)=>setTimeout(()=>rej({code:'timeout'}),10000))]);
    cloudRef=ref;cloudState='on';DBX=db;USERX=user;myId=id;
    let remote=null;
    if(snap.exists){try{const d=snap.data();if(d&&d.key===SAVE_KEY)remote=JSON.parse(d.json);}catch(e){}}
    const local=load();
    if(remote&&(!local||(remote.savedAt||0)>(local.savedAt||0))){
      try{localStorage.setItem(SAVE_KEY,JSON.stringify(remote))}catch(e){}

function allyGainXp(id,n){
  const d=aData(id);let c=0;
  if(d.lv>=aCap(id)){d.xp=0;return 0;}
  d.xp+=n;
  while(d.lv<aCap(id)&&d.xp>=need(d.lv)){d.xp-=need(d.lv);d.lv++;c++;}
  if(d.lv>=aCap(id))d.xp=0;
  return c;
}

function missionProgress(m){
  if(m.type==='kill')return Math.min(m.count,P.kills[m.target]||0);
  if(m.type==='wins')return Math.min(m.count,P.wins[m.area]||0);
  if(m.type==='item')return P.keys[m.item]?1:0;
  return 0;
}
function missionReady(m){
  const goal=m.type==='item'?1:m.count;

}
function applyReward(m){
  const r=m.reward;P.done[m.id]=true;
  if(r.water)P.items.water+=r.water;
  if(r.rosary)P.items.rosary+=r.rosary;
  if(r.gold)P.gold+=r.gold;

function startMotes(cv){
  const ctx=cv.getContext('2d');
  const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W,H,dpr;
  const resize=()=>{dpr=Math.min(2,window.devicePixelRatio||1);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);};
  resize();
  const COLORS=['143,183,255','110,150,255','255,110,110','230,240,255'];
  const mk=(init)=>{const c=Math.random();return{
    x:Math.random()*W, y:init?Math.random()*H:H+10,
    r:rnd(0.6,2.2), vy:-rnd(0.12,0.45), vx:rnd(-0.08,0.08), ph:Math.random()*6.28, sp:rnd(0.01,0.03),
    col:c<0.55?COLORS[0]:c<0.7?COLORS[1]:c<0.88?COLORS[2]:COLORS[3]};};
  const ps=Array.from({length:reduce?14:46},()=>mk(true));
  const fx={raf:0,resize};
  const tick=()=>{
    ctx.clearRect(0,0,W,H);
    for(const p of ps){
      p.ph+=p.sp;p.y+=p.vy;p.x+=p.vx+Math.sin(p.ph)*0.15;
      if(p.y<-10)Object.assign(p,mk(false));
      const a=0.25+0.45*(0.5+0.5*Math.sin(p.ph*1.7));
      const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*5);
      g.addColorStop(0,`rgba(${p.col},${a})`);g.addColorStop(1,`rgba(${p.col},0)`);
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,p.r*5,0,6.283);ctx.fill();
    }
    fx.raf=requestAnimationFrame(tick);
  };
  tick();
  window.addEventListener('resize',resize);
  return fx;
}

function publishProfile(){
  if(!DBX||!myId||!P||canShare===false)return;

/* ===================== 친구 대결 (비동기: 친구가 마지막으로 저장한 팀을 AI가 조종) ===================== */
const PVP_DAILY=5, PVP_HP=1.25;
const pvpCl=(v,lo,hi)=>Math.max(lo,Math.min(hi,Number(v)||lo));
function teamIconsHTML(party){return party.map(x=>`<span class="pvpa" title="${ALLIES[x.id].name}">${ALLIES[x.id].icon}<i>Lv${x.lv}</i></span>`).join('');}
function startPvp(f){
  const t=f&&f.team;if(!t)return;
  const hero={atk:pvpCl(t.atk,1,9999),def:pvpCl(t.def,0,9999),maxHp:pvpCl(t.maxHp,1,99999),lv:pvpCl(t.lv,1,99)};
  const party=(Array.isArray(t.party)?t.party:[]).filter(x=>x&&ALLIES[x.id]).slice(0,4)
    .map(x=>({id:x.id,lv:pvpCl(x.lv,1,60),aw:pvpCl(x.aw,0,AWAKEN_MAX)}));
  const allyHp=party.reduce((s,x)=>s+Math.round((50+x.lv*10)*(0.7+0.15*ALLIES[x.id].star)),0);
  const heroName=(String(f.hero||'').replace(/[<>&"'`]/g,'').slice(0,8))||'모험가';
  const e={name:`${heroName}의 팀`,heroName,hp:Math.round(hero.maxHp*PVP_HP+allyHp*0.35),atk:hero.atk,def:hero.def,xp:0,gold:0,
    pvp:true,hero,party,friendId:f.id,cp:pvpCl(f.cp,0,9999999)};
  P._pvpRestore={hp:P.hp,mp:P.mp};
  P.hp=P.maxHp;P.mp=P.maxMp;   // 대결은 연습 경기: 가득 찬 상태로 시작, 끝나면 원래대로
  startBattle({area:P.cur,pvp:e});
}
function pvpEnemyActs(e){
  const h=e.hero,r=Math.random();
  if(e.hp<e.maxHp*0.4&&r<0.25){
    const hh=Math.round(e.maxHp*0.12);e.hp=Math.min(e.maxHp,e.hp+hh);
    addLog(`${e.heroName}의 치유의 기도 — 팀 HP ${hh} 회복`);queueFx('enemy','+'+hh,'heal');
  }else if(h.lv>=8&&r<0.12)hitPlayer(2.5,`${e.heroName}의 대천사의 심판`);
  else if(r<0.4)hitPlayer(1.6,`${e.heroName}의 성광 일격`);
  else hitPlayer(1,`${e.heroName}의 공격`);
  for(const a of e.party){
    if(P.hp<=0)break;
    const al=ALLIES[a.id],m=STAR_MULT[al.star]*(1+0.2*a.aw),lv=a.lv,nm=`${e.heroName}의 ${al.name}`;
    const dmg=(base,f,label)=>{
      let d=(base*m-P.def*(B.curse?0.6:1)*f)*rnd(0.9,1.1);
      if(B.defending)d*=0.6;if(B.ward)d*=0.5;
      d=Math.max(1,Math.round(d));P.hp=Math.max(0,P.hp-d);addLog(`${label}! ${d} 피해`);queueFx('player','-'+d,'pdmg');
    };
    const heal=pct=>{const hh=Math.round((e.maxHp*pct*0.25+lv*2)*m);e.hp=Math.min(e.maxHp,e.hp+hh);addLog(`${nm} — 팀 HP ${hh} 회복`);queueFx('enemy','+'+hh,'heal');};
    switch(al.kit){
      case 'isabel': case 'monk_heal': case 'civ_heal':
        if(e.hp<e.maxHp*0.6)heal(al.kit==='monk_heal'?0.25:al.kit==='civ_heal'?0.12:0.11);
        else dmg(6+lv*2,0.5,`${nm}의 공격`);
        break;
      case 'seju':     if(Math.random()<0.08)dmg((8+lv*4)*3,0.5,`${nm} — 은총 폭주`);else dmg(8+lv*4,0.5,`${nm}의 은총`);break;
      case 'dominion': dmg(11+lv*3.2,0,`${nm}의 빛의 절단`);break;
      case 'asiris':   if(Math.random()<0.34)dmg(30+lv*9,0,`${nm} — 신의 은총`);else addLog(`${nm} — 기적의 대가로 숨을 고른다`);break;
      case 'grace':    dmg(4+lv*4.6,0.5,`${nm}의 은총`);break;
      case 'curse':    if(Math.random()<0.35){B.curse=Math.max(B.curse,2);addLog(`${nm}의 저주 — 방어력 감소`);}else dmg(7+lv*2.5,0.5,`${nm}의 저주의 일격`);break;
      case 'sight':    B.curse=Math.max(B.curse,2);addLog(`${nm}의 투시 — 약점을 간파당했다 (방어력 감소)`);break;
      case 'civ_mp':   addLog(`${nm}의 응원`);break;
      case 'monk_holy':dmg(8+lv*2.8,0,`${nm}의 성수 투척`);break;
      case 'civ_atk':  dmg(6+lv*2,0.5,`${nm}의 ${al.skill}`);break;
      default:         dmg(10+lv*3,0.5,`${nm}의 공격`);
    }
  }
}
function pvpEnd(win){
  const e=B.e;clearBattle();
  if(P._pvpRestore){P.hp=P._pvpRestore.hp;P.mp=P._pvpRestore.mp;delete P._pvpRestore;}
  const today=new Date().toISOString().slice(0,10);
  P.pvp=P.pvp||{w:0,l:0,day:'',n:0};
  if(P.pvp.day!==today){P.pvp.day=today;P.pvp.n=0;}
  let msg;
  if(win){
    P.pvp.w++;
    if(P.pvp.n<PVP_DAILY){P.pvp.n++;const g=30+e.hero.lv*5;P.gold+=g;msg=`⚔ ${esc(e.heroName)}의 팀에 승리! +${g} G (오늘 대결 보상 ${P.pvp.n}/${PVP_DAILY})`;}
    else msg=`⚔ ${esc(e.heroName)}의 팀에 승리! (오늘 대결 보상은 모두 받았어요)`;
  }else{
    P.pvp.l++;msg=`${esc(e.heroName)}의 팀에 패배했다… 대결은 연습 경기라 잃은 것은 없다.`;
  }
  msg+=`<br>내 대결 전적: ${P.pvp.w}승 ${P.pvp.l}패`;
  save();renderFriends(msg);
}

function claim(id){
  const m=MISSIONS.find(x=>x.id===id);
  if(!m||!missionReady(m))return;
  applyReward(m);save();
  showStory(m.story,()=>renderHub(`📜 미션 완료: ${m.title}`));
}

function toggleSortie(id){
  if(!owned(id))return;
  let m;
  if(P.active.includes(id)){P.active=P.active.filter(x=>x!==id);m=`${ALLIES[id].name} — 대기`;}
  else if(P.active.length<MAX_ACTIVE){P.active.push(id);m=`${ALLIES[id].name} — 출전`;}
  else m=`출전 동료는 최대 ${MAX_ACTIVE}명이다. 먼저 다른 동료를 대기로 바꾸자.`;
  save();renderAllies(m);
}

function allyCard(id){

  if(!isFixed)btns.push(`<button class="btn ${on?'primary':''}" data-sortie="${id}">${on?'출전 중':'대기'}</button>`);
  btns.push(d.lv>=cap?`<button class="btn" disabled>최대 레벨</button>`
    :`<button class="btn ${P.gold>=aCost(id)?'primary':''}" data-alv="${id}" ${P.gold<aCost(id)?'disabled':''}>레벨업 ${aCost(id)} G</button>`);
  if(needSyn)btns.push(`<button class="btn ${cnt>=needSyn?'danger':''}" data-syn="${id}" ${cnt<needSyn?'disabled':''}>합성 ${cnt}/${needSyn}</button>`);
  if(al.star===5)btns.push(aw>=AWAKEN_MAX?`<button class="btn" disabled>각성 완료</button>`
    :`<button class="btn ${P.items.stone>=1?'danger':''}" data-awk="${id}" ${P.items.stone<1?'disabled':''}>각성 ${aw}/${AWAKEN_MAX} · ${AWAKEN_ITEM.icon}1</button>`);

    ${d.lv<cap?bar(d.xp,need(d.lv),'xp','EXP'):''}

function allyLevelUp(id){
  const d=aData(id),c=aCost(id);
  if(d.lv>=aCap(id)||P.gold<c)return;
  P.gold-=c;d.lv++;d.xp=0;save();
  renderAllies(`⬆ ${ALLIES[id].name} Lv ${d.lv} (−${c} G)`);
}
function awaken(id){
  if(ALLIES[id].star!==5||P.items.stone<1||(P.awaken[id]||0)>=AWAKEN_MAX)return;
  P.items.stone--;P.awaken[id]=(P.awaken[id]||0)+1;save();

  showStory(`<div class="sum s5"><div class="sum-title">각성</div><div class="sum-stars">${'★'.repeat(5)}</div><div class="sum-icon">${al.icon}</div>

function buy(id){
  let m='';
  if(id==='water'&&P.gold>=25){P.gold-=25;P.items.water++;m='성수를 구입했다.';}
  else if(id==='rosary'&&P.gold>=30){P.gold-=30;P.items.rosary++;m='묵주를 구입했다.';}
  else if(id==='wpn'&&P.gold>=wpnCost()){P.gold-=wpnCost();P.wpn++;P.atk+=4;m='검이 축성되었다. 공격력 +4';}
  else if(id==='arm'&&P.gold>=armCost()){P.gold-=armCost();P.arm++;P.def+=3;P.maxHp+=10;P.hp+=10;m='사제복이 축성되었다. 방어력 +3, 최대 HP +10';}
  save();renderShop(m);
}

function rollStar(){
  let r=Math.random();
  for(const [st,p] of STAR_RATE){if(r<p)return st;r-=p;}
  return 1;
}
function revealHTML(list,title){
  const best=Math.max(...list.map(x=>ALLIES[x.id].star));
  if(list.length===1){
    const {id,isNew}=list[0],al=ALLIES[id];
    return `<div class="sum s${al.star}"><div class="sum-title">${title}</div><div class="sum-stars">${'★'.repeat(al.star)}</div><div class="sum-icon">${al.icon}</div>
      <div class="sum-name">${al.name}</div><div class="small">${al.role}</div><p class="sum-desc">${al.desc}</p>
      <div class="notice">${isNew?'새로운 동료가 합류했다!':'보유 수 +1 (합성 재료) · 현재 '+P.roster[id]+'개'}</div></div>`;
  }
  return `<div class="sum s${best}"><div class="sum-title">${title}</div><div class="sumgrid">${list.map(({id,isNew})=>{const al=ALLIES[id];
    return `<div class="sumcell s${al.star}"><div class="ic">${al.icon}</div><div class="st">${'★'.repeat(al.star)}</div><div class="nm">${al.name}</div>${isNew?'<div class="new">NEW</div>':''}</div>`;}).join('')}</div></div>`;
}
function summon(n,useTicket){
  if(useTicket){if(P.tickets<n)return;P.tickets-=n;}
  else{const c=n===11?SUMMON11_COST:n===10?SUMMON10_COST:SUMMON_COST*n;if(P.gold<c)return;P.gold-=c;}
  const res=[];
  for(let i=0;i<n;i++){
    const id=pick(allyIds(rollStar()));
    const isNew=!owned(id);addAlly(id);res.push({id,isNew});
  }
  save();
  const top=res.reduce((a,b)=>ALLIES[b.id].star>ALLIES[a.id].star?b:a);
  showStory(revealHTML(res,n===1?'소환 결과':n+'회 소환 결과'),()=>renderShop(`${n}회 소환 완료 · 최고 등급 ${'★'.repeat(ALLIES[top.id].star)} ${ALLIES[top.id].name}`),true);
}
function synthesize(id){
  const al=ALLIES[id],need=SYN_NEED[al.star];
  if(!need||(P.roster[id]||0)<need)return;
  P.roster[id]-=need;
  if(P.roster[id]<=0){delete P.roster[id];P.active=P.active.filter(x=>x!==id);}
  const nid=pick(allyIds(al.star+1)),isNew=!owned(nid);
  addAlly(nid);save();
  showStory(revealHTML([{id:nid,isNew}],`합성: ${al.name} ×${need} →`),()=>renderAllies(`🔮 합성 완료 — ${'★'.repeat(ALLIES[nid].star)} ${ALLIES[nid].name}`),true);
}

/* ===================== 전투 ===================== */
function clearBattle(){if(B&&B.zapT)clearInterval(B.zapT);B=null;}
function startBattle(spec){
  // spec: {area, stage} 스테이지 전투 / {area, hunt:true} 자유 사냥
  const a=spec.area;
  let s=spec.stage,t;
  if(spec.pvp){t=spec.pvp;s=0;}
  else if(spec.hunt){s=Math.min(14,Math.max(1,P.prog[a]));if(stageType(s)!=='normal')s=Math.max(1,s-1);t=scaledEnemy(a,s,pick(AREAS[a].enemies));}
  else t=stageEnemy(a,s);
  const type=spec.pvp?'pvp':spec.hunt?'normal':stageType(s);
  const isBoss=type==='boss'||type==='mid'||type==='pvp';
  clearBattle();
  const ahp={};
  partyIds().forEach(id=>{const al=ALLIES[id],mx=Math.round((50+aData(id).lv*10)*(0.7+0.15*al.star));ahp[id]={hp:mx,max:mx};});
  B={e:{...t,maxHp:t.hp},spec,area:a,stage:spec.hunt?0:s,stype:type,baseName:t.name,isBoss,isFinal:!!t.final,
     charging:false,chargeName:'',chargeKind:null,phase:1,tornadoCD:0,
     buff:0,aura:0,hex:0,stun:{},stunWhy:{},ahp,agatoUsed:false,curse:0,silence:0,weak:0,ward:false,rage:0,turn:0,
     dot:null,evade:false,sealed:false,over:false,
     defending:false,busy:false,menu:'main',log:[],fxq:[]};
  const begin=()=>{
    if(B&&isBoss&&!t.pvp){B.tickMs=t.zap?3000:t.final?4500:type==='boss'?5000:6000;B.zapT=setInterval(bossTick,B.tickMs);}
    if(B&&!isBoss&&Math.random()<0.4){
      addLog(`⚠ 기습! ${t.name}이(가) 먼저 덤벼든다`);B.busy=true;renderBattle();setTimeout(enemyTurn,700);return;
    }
    renderBattle();
  };
  if(t.pvp){
    B.pvp=true;
    addLog(`⚔ 친구 대결 — 「${t.name}」 (전투력 ${fmt(t.cp)})`);
    showStory(`<div class="sum s4"><div class="sum-title">⚔ 친구 대결</div><div class="pvpvs">${esc(P.name)} <span>VS</span> ${t.heroName}</div>
      <div class="pvpteam">✝ ${t.heroName} Lv ${t.hero.lv}</div><div class="pvpteam">${teamIconsHTML(t.party)}</div>
      <p class="sum-desc">친구가 마지막으로 저장한 팀을 AI가 조종해요.<br>대결은 연습 경기라 HP는 가득 찬 상태로 시작하고, 끝나면 원래대로 돌아와요.</p></div>`,begin,true);
  }else if(isBoss){
    addLog(`${type==='boss'?(t.final?'최종 보스':'나라 보스'):'솔로몬 72악마'} 「${t.name}」 강림!`);
    if(t.dimension)addLog('🌀 차원 전이 — 주인공의 공격 절반이 다른 차원으로 흘러간다');
    if(t.zap)addLog('⚡ 흐르는 전류 — 몇 초마다 파티 전체가 피해를 입는다');
    showStory(`<div class="sum s5"><div class="sum-title">${t.title}</div><div class="intro-art">${PORTRAIT[t.art]?portraitHTML(t.art,'big'):bossSVG(t.art)}</div><div class="sum-name">${t.name}</div><p class="sum-desc" style="color:#cdd6f0">${esc(t.pre).replace(/\n/g,'<br>')}</p></div>`,begin,true);
  }else{
    addLog(`${type==='elite'?'정예 ':''}「${t.name}」 출현!`);
    begin();
  }
}
function bossTick(){
  if(!B||B.over||!$('#modal').classList.contains('hidden'))return;
  if(B.e.zap){zapTick();return;}
  // 중간 보스·나라 보스: 몇 초마다 몰아붙이는 맹공
  hitPlayer(0.3,`⏱ ${B.e.name}의 맹공`);
  if(P.hp<=0){P.hp=0;B.over=true;clearInterval(B.zapT);renderBattle();setTimeout(defeat,800);return;}
  renderBattle();
}
function zapTick(){
  if(!B||B.over||!B.e.zap||!$('#modal').classList.contains('hidden'))return;
  const d=Math.max(1,Math.round(P.maxHp*0.03));
  P.hp=Math.max(0,P.hp-d);
  hitAllies(0.04,'⚡ 흐르는 전류',true);
  addLog(`⚡ 흐르는 전류 — HP ${d} · 동료 전원 피해`);
  queueFx('player','⚡-'+d,'pdmg');
  if(P.hp<=0){B.over=true;clearInterval(B.zapT);renderBattle();setTimeout(defeat,800);return;}
  renderBattle();
}
function hitAllies(pct,label,quiet){
  const down=[];
  partyIds().forEach(id=>{const h=B.ahp[id];if(!h||h.hp<=0)return;
    const d=Math.max(1,Math.round(h.max*pct*rnd(0.9,1.1)));h.hp=Math.max(0,h.hp-d);
    if(h.hp<=0)down.push(ALLIES[id].name);});
  if(!quiet)addLog(`${label} — 동료 전원 피해`);
  if(down.length)addLog(`💀 ${down.join(', ')} 쓰러짐 (이번 전투 행동 불가)`);
}
function addLog(s){B.log.push(s);if(B.log.length>40)B.log.shift();}
function queueFx(target,txt,cls){B.fxq.push([target,txt,cls]);}
const enemyDef=()=>B.e.def*(B.weak?0.5:1);

function cmdHTML(){
  const dis=B.busy?'disabled':'';
  if(B.menu==='skill'){
    const learned=SKILLS.filter(s=>P.lv>=s.lv);
    return `<div class="grid">${learned.map(s=>`<button class="btn ${s.type==='dmg'?'primary':''}" data-skill="${s.id}" ${(B.busy||P.mp<s.mp)?'disabled':''}>${s.name}<small>성력 ${s.mp} · ${s.desc}</small></button>`).join('')}
      <button class="btn full" data-back="1" ${dis}>← 뒤로</button></div>`;
  }
  if(B.menu==='item'){
    return `<div class="grid">
      <button class="btn" data-item="water" ${(B.busy||!P.items.water)?'disabled':''}>성수 ×${P.items.water}<small>HP 회복</small></button>
      <button class="btn" data-item="rosary" ${(B.busy||!P.items.rosary)?'disabled':''}>묵주 ×${P.items.rosary}<small>성력 25 회복</small></button>
      <button class="btn full" data-back="1" ${dis}>← 뒤로</button></div>`;
  }
  return `<div class="grid">
    <button class="btn primary" data-act="attack" ${dis}>⚔ 공격</button>
    <button class="btn primary" data-act="skillmenu" ${(B.busy||B.silence)?'disabled':''}>${B.silence?'🔇 성력 봉인됨':'✝ 성력'}</button>
    <button class="btn" data-act="defend" ${dis}>🛡 방어<small>피해 40% 감소 · 성력 +3</small></button>
    <button class="btn" data-act="itemmenu" ${dis}>🧪 아이템</button>
    <button class="btn full" data-act="flee" ${(B.busy||B.isBoss)?'disabled':''}>${B.pvp?'대결 중에는 도망칠 수 없다':B.isBoss?'보스전에서는 도망칠 수 없다':'🏃 도망 (60%)'}</button>
  </div>`;
}

function renderBattle(){
  const e=B.e;
  const st=[];
  if(B.buff)st.push(`✨ 축복 ${B.buff}`);
  if(B.aura)st.push(`🌟 축성 ${B.aura}`);
  if(B.hex)st.push(`🩸 적 공격↓ ${B.hex}`);
  if(B.curse)st.push(`☠ 저주 ${B.curse}`);
  if(B.silence)st.push(`🔇 봉인 ${B.silence}`);
  if(B.weak)st.push(`📜 적 방어↓ ${B.weak}`);
  if(B.dot)st.push(`🩸 ${B.dot.name} ${B.dot.turns}`);
  if(B.ward)st.push('🔰 결계');
  if(B.defending)st.push('🛡 방어');
  const party=`<div class="party">${partyIds().map(id=>{const h=B.ahp[id];const p=h?Math.round(h.hp/h.max*100):100;
    return `<span class="chip ${h&&h.hp<=0?'down':''}">${ALLIES[id].icon} ${ALLIES[id].name}<i class="mhp"><b style="width:${p}%"></b></i></span>`;}).join('')}</div>`;
  const tag=B.pvp?'<em class="el">DUEL</em>':B.stype==='boss'?`<em>${B.isFinal?'FINAL':'BOSS'}</em>`:B.stype==='mid'?'<em>DEMON</em>':B.stype==='elite'?'<em class="el">ELITE</em>':'';
  const t=-(performance.now()/1000).toFixed(2);
  const vis=e.pvp?`<div class="eicon pvpvis" id="eicon"><div class="pvphero">✝</div><div class="pvpteam">${teamIconsHTML(e.party)}</div></div>`:e.art?`<div class="eicon art ${B.charging?'charge':''}" id="eicon" style="--t:${t}s">${bossSVG(e.art)}</div>`
    :`<div class="eicon sil ${e.elite?'elite':''} ${B.charging?'charge':''}" id="eicon" style="--gc:${e.elite?'#ff3040':AREAS[B.area].glow}">${e.icon}</div>`;
  const passive=[];
  if(e.dimension)passive.push('🌀 차원 전이');
  if(e.zap)passive.push('⚡ 흐르는 전류 (3초마다)');
  else if(B.isBoss&&B.tickMs)passive.push(`⏱ 맹공 (${B.tickMs/1000}초마다)`);
  if(e.slashes)passive.push(`🗡 추격 참격 ×${e.slashes}`);
  if(B.evade)passive.push('👁 투명화');
  let warn='';
  if(B.charging){
    warn=B.chargeKind==='jeongyeok'?`⚠ 「전격」 — 방어하지 않으면 HP 절반 소멸`
      :B.chargeKind==='tornado'?`⚠ 「스파크 토네이도」 — 방어해도 HP 1/3 소멸`
      :`⚠ 「${B.chargeName}」 준비 중 — 방어 추천`;
  }
  $('#app').innerHTML=`${statusHTML()}
    <div class="enemy ${B.isBoss?'boss':''} ${B.isFinal?'final':''}">
      <div class="eflag">${AREAS[B.area].flag} ${AREAS[B.area].name}${B.pvp?' · 친구 대결':B.stage?` · 스테이지 ${B.stage}`:' · 자유 사냥'}</div>
      <div class="ename">${e.name}${tag}</div>
      ${e.title?`<div class="etitle">${e.title}</div>`:''}
      ${vis}
      ${bar(e.hp,e.maxHp,'ehp')}
      ${passive.length?`<div class="epass">${passive.join(' · ')}</div>`:''}
      <div class="estat">${warn}</div>
    </div>
    ${party}
    <div class="pstat">${st.join(' · ')}</div>
    <div class="log">${B.log.slice(-7).map(l=>`<div>${esc(l)}</div>`).join('')}</div>
    <div class="cmds">${cmdHTML()}</div>`;
  document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{
    const a=b.dataset.act;
    if(a==='skillmenu'){B.menu='skill';renderBattle();}
    else if(a==='itemmenu'){B.menu='item';renderBattle();}
    else act(a);
  });
  document.querySelectorAll('[data-skill]').forEach(b=>b.onclick=()=>act('skill',b.dataset.skill));
  document.querySelectorAll('[data-item]').forEach(b=>b.onclick=()=>act('item',b.dataset.item));
  document.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>{B.menu='main';renderBattle();});
  flushFx();
}

function flushFx(){
  B.fxq.forEach(([t,txt,cls])=>{
    const el=t==='enemy'?$('#eicon'):$('#pstatus');
    if(!el)return;
    const r=el.getBoundingClientRect();
    const s=document.createElement('div');
    s.className='float '+cls;s.textContent=txt;
    s.style.left=(r.left+r.width/2+rnd(-40,40))+'px';
    s.style.top=(r.top+r.height/2+rnd(-14,14))+'px';
    $('#fx').appendChild(s);setTimeout(()=>s.remove(),950);
    if(t==='enemy')el.classList.add('hit');
    if(cls==='pdmg'){document.body.classList.add('flash');setTimeout(()=>document.body.classList.remove('flash'),220);}
  });
  B.fxq=[];
}

function hitEnemy(mult,label){
  const e=B.e;
  if(B.evade){B.evade=false;addLog(`${label}! — 적이 모습을 감춰 빗나갔다`);queueFx('enemy','MISS','mpf');return;}
  if(e.dimension&&Math.random()<0.5){addLog(`${label}! — 🌀 차원의 틈으로 흘러가 사라졌다`);queueFx('enemy','차원 전이','mpf');return;}
  let d=(P.atk*(B.buff?1.5:1)*(B.aura?1.2:1)*mult-enemyDef()/2)*rnd(0.9,1.1);
  d=Math.max(1,Math.round(d));
  const crit=Math.random()<0.1;
  if(crit)d=Math.round(d*1.5);
  e.hp=Math.max(0,e.hp-d);
  addLog(`${label}! ${e.name}에게 ${d} 피해${crit?' (치명타!)':''}`);
  queueFx('enemy',(crit?'💥':'')+d,crit?'crit':'dmg');
}
function allyHit(base,label,defFactor){
  const e=B.e;
  let d=Math.max(1,Math.round((base*(B.am||1)-enemyDef()*defFactor)*rnd(0.9,1.1)));
  e.hp=Math.max(0,e.hp-d);
  addLog(`${label}! ${d} 피해`);
  queueFx('enemy',d,'dmg');
}

function alliesAct(){
  const e=B.e;
  B.stun=B.stun||{};
  for(const id of partyIds()){
    if(e.hp<=0)break;
    const al=ALLIES[id],nm=al.name,m=allyMult(id),lv=aData(id).lv;
    B.am=m;
    if(B.ahp[id]&&B.ahp[id].hp<=0)continue;
    if(B.stun[id]>0){
      B.stun[id]--;
      addLog(`${nm} — 행동 불가 (${B.stunWhy[id]||'대가'})`);
      continue;
    }
    const heal=(pct,label,k=1)=>{
      const h=Math.min(P.maxHp-P.hp,Math.round((P.maxHp*pct+lv*2)*m*k));
      if(h>0){P.hp+=h;addLog(`${label} — HP ${h} 회복`);queueFx('player','+'+h,'heal');}
      partyIds().forEach(x=>{const ah=B.ahp[x];if(ah&&ah.hp>0)ah.hp=Math.min(ah.max,ah.hp+Math.round(ah.max*pct*0.6*k));});
    };
    switch(al.kit){
      case 'isabel': // 천사의 의지 — 주인공을 돕는 서포터
        if(P.hp<P.maxHp*0.6)heal(0.22,`${nm}의 치유`,0.5); // 주인공·동료 치유량 절반
        else if(!B.aura){B.aura=4;addLog(`${nm}의 의지 — 3턴간 주인공 공격력 1.2배`);}
        else{const g=Math.min(P.maxMp-P.mp,Math.round((4+lv/3)*m));if(g>0){P.mp+=g;addLog(`${nm}의 기도 — 성력 ${g} 회복`);}}
        break;
      case 'civ_atk': allyHit(6+lv*2,`${nm}의 ${al.skill}`,0.5);break;
      case 'civ_heal':
        if(P.hp<P.maxHp*0.7)heal(0.12,`${nm}의 ${al.skill}`);
        else allyHit(6+lv*2,`${nm}의 발길질`,0.5);
        break;
      case 'civ_mp':{
        const g=Math.min(P.maxMp-P.mp,Math.round(4+lv/2));
        if(g>0){P.mp+=g;addLog(`${nm}의 ${al.skill} — 성력 ${g} 회복`);}
        break;}
      case 'monk_heal':
        if(P.hp<P.maxHp*0.6)heal(0.25,`${nm}의 치유 기도`);
        else allyHit(8+lv*2.5,`${nm}의 묵상 일격`,0.5);
        break;
      case 'monk_bless':
        if(!B.aura){B.aura=4;addLog(`${nm}의 축복 — 3턴간 주인공 공격력 1.2배`);}
        else allyHit(8+lv*2.5,`${nm}의 묵주 일격`,0.5);
        break;
      case 'monk_ward':
        if(B.charging&&!B.ward){B.ward=true;addLog(`${nm}의 결계 — 다음 적 공격 피해 절반`);}
        else allyHit(8+lv*2.5,`${nm}의 지팡이`,0.5);
        break;
      case 'monk_holy': allyHit(8+lv*2.8,`${nm}의 성수 투척`,0);break;
      case 'salvation': // 천사의 구원: 균형 잡힌 전투력 + 방어적 오라
        if(B.charging&&!B.ward){B.ward=true;addLog(`${nm}의 구원의 오라 — 다음 적 공격 피해 절반`);}
        else allyHit(10+lv*3,`${nm}의 구원의 일격`,0.5);
        break;
      case 'sight': // 박아영의 투시
        if(!B.weak){B.weak=3;addLog(`${nm}의 투시 — 적의 약점을 꿰뚫어 봤다 (적 방어력 절반)`);}
        else{const g=Math.min(P.maxMp-P.mp,Math.round(5+lv/2));if(g>0){P.mp+=g;addLog(`${nm}의 의지 — 성력 ${g} 회복`);}}
        break;
      case 'basic': allyHit(10+lv*3,`${nm}의 공격`,0.5);break;
      case 'curse': // 구원의 계보에서 배제 — 저주의 힘
        if(!B.hex){B.hex=3;addLog(`${nm}의 저주 — 3턴간 적 공격력 감소`);}
        else allyHit(7+lv*2.5,`${nm}의 저주의 일격`,0.5);
        break;
      case 'dominion': // 천사의 지배 / 신의 은총(위급할 때 단 한 번)
        if(!B.agatoUsed&&P.hp<P.maxHp*0.3){
          B.agatoUsed=true;allyHit(40+lv*12,`${nm} — 신의 은총`,0);B.stun[id]=2;B.stunWhy[id]='신의 은총의 대가';
          addLog(`${nm} — 대가를 치르며 무릎을 꿇는다 (2턴간 행동 불가)`);
        }else allyHit(11+lv*3.2,`${nm}의 지배 — 빛의 절단`,0);
        break;
      case 'grace': allyHit(4+lv*4.6,`${nm}의 은총`,0.5);break;
      case 'seju':
        if(P.hp<P.maxHp*0.4)heal(0.15,`${nm}의 의지 — 보호의 오라`);
        else if(Math.random()<0.08){allyHit((8+lv*4)*3,`${nm}의 눈동자가 검게 물든다 — 은총 폭주`,0.5);B.stun[id]=1;B.stunWhy[id]='이성 상실';}
        else allyHit(8+lv*4,`${nm}의 은총`,0.5);
        break;
      case 'asiris': // 신의 은총: 짧은 기적, 반드시 대가
        allyHit(30+lv*9,`${nm} — 신의 은총`,0);
        if(e.hp>0){B.sealed=true;addLog(`${nm}의 봉인 — 적이 1턴간 움직일 수 없다`);}
        B.stun[id]=2;B.stunWhy[id]='기적의 대가';addLog(`${nm} — 기적의 대가로 2턴간 행동 불가`);
        break;
    }
  }
}

function hitPlayer(mult,label){
  const e=B.e;
  if(P.active.includes('guseju')&&!(B.stun&&B.stun.guseju)&&Math.random()<0.15){
    addLog(`${label} — 구세주의 예지로 공격을 피했다!`);queueFx('player','MISS','mpf');return 0;
  }
  const def=P.def*(B.curse?0.6:1);
  let d=(e.atk*(1+0.2*B.rage)*(B.hex?0.8:1)*mult-def/2)*rnd(0.9,1.1);
  d=Math.max(1,Math.round(d));
  if(B.defending)d=Math.max(1,Math.round(d*0.6)); // 방어: 피해 40% 감소
  if(B.ward)d=Math.max(1,Math.round(d*0.5));
  P.hp=Math.max(0,P.hp-d);
  addLog(`${label}! ${d} 피해${B.defending?' (방어)':''}${B.ward?' (결계)':''}`);
  queueFx('player','-'+d,'pdmg');
  return d;
}

function act(kind,arg){
  if(!B||B.busy||B.over)return;
  const e=B.e;
  if(kind==='attack'){
    hitEnemy(1,'공격');
  }else if(kind==='skill'){
    const s=SKILLS.find(x=>x.id===arg);
    if(!s||P.mp<s.mp||B.silence)return;
    P.mp-=s.mp;
    if(s.type==='dmg'){
      hitEnemy(s.mult*(s.demonBonus&&e.demon?s.demonBonus:1),s.name);
    }else if(s.type==='heal'){
      const h=Math.min(P.maxHp-P.hp,Math.round(P.maxHp*s.pct));
      P.hp+=h;addLog(`${s.name} — HP ${h} 회복`);queueFx('player','+'+h,'heal');
    }else if(s.type==='buff'){
      B.buff=4;addLog(`${s.name} — 3턴간 공격력 1.5배`);
    }
  }else if(kind==='defend'){
    B.defending=true;P.mp=Math.min(P.maxMp,P.mp+3);addLog('방어 태세를 갖췄다. (성력 +3)');
  }else if(kind==='item'){
    if(arg==='water'&&P.items.water>0){
      P.items.water--;const h=Math.min(P.maxHp-P.hp,Math.max(60,Math.round(P.maxHp*0.4)));
      P.hp+=h;addLog(`성수 사용 — HP ${h} 회복`);queueFx('player','+'+h,'heal');
    }else if(arg==='rosary'&&P.items.rosary>0){
      P.items.rosary--;const m=Math.min(P.maxMp-P.mp,25);
      P.mp+=m;addLog(`묵주 사용 — 성력 ${m} 회복`);queueFx('player','+'+m,'mpf');
    }else return;
  }else if(kind==='flee'){
    if(B.isBoss)return;
    if(Math.random()<0.6){
      B.busy=true;addLog('무사히 도망쳤다!');renderBattle();
      setTimeout(()=>{save();renderHub('무사히 도망쳤다.');},600);return;
    }
    addLog('도망에 실패했다!');
  }
  if(e.hp>0)alliesAct();
  B.menu='main';B.busy=true;
  renderBattle();
  if(e.hp<=0){setTimeout(victory,750);return;}
  if(checkPhase())return;
  setTimeout(enemyTurn,750);
}

function checkPhase(){
  const e=B.e;
  if(B.isFinal&&B.phase===1&&e.phase2&&e.hp<=e.maxHp/2){
    const p2=e.phase2;
    B.phase=2;B.charging=false;B.chargeKind=null;B.silence=0;
    e.atk=Math.round(e.atk*p2.atkMult);e.art=p2.art;e.name=p2.name;e.moves=p2.moves;e.slashes=p2.slashes;
    addLog('나베리우스의 군단이 깨어났다! (공격력 상승 · 추격 참격 ×3)');
    showStory(`<div class="sum s5"><div class="sum-title">제2형태</div><div class="intro-art">${PORTRAIT[p2.art]?portraitHTML(p2.art,'big'):bossSVG(p2.art)}</div><div class="sum-name">${p2.name}</div><p class="sum-desc" style="color:#cdd6f0">${esc(p2.line).replace(/\n/g,'<br>')}</p></div>`,
      ()=>{renderBattle();setTimeout(enemyTurn,500);},true);
    return true;
  }
  return false;
}

function enemyTurn(){
  if(!B||B.over)return;
  const e=B.e;let mv;
  if(B.sealed){mv={t:'sealed'};B.sealed=false;}
  else if(B.charging){mv={t:'release',n:B.chargeName,kind:B.chargeKind};B.charging=false;B.chargeKind=null;}
  else if(e.pvp)mv={t:'pvp',n:''};
  else if(e.tornado&&e.hp<e.maxHp*0.35&&B.tornadoCD<=0){mv={t:'charge',n:'스파크 토네이도',kind:'tornado'};B.tornadoCD=4;}
  else if(e.moves)mv=pick(e.moves);
  else mv=Math.random()<0.2?{t:'strong',n:'강타'}:{t:'atk',n:'공격'};
  const label=`${e.name} — ${mv.n}`;

  switch(mv.t){
    case 'sealed':  addLog(`${e.name} — 봉인되어 움직일 수 없다!`);break;
    case 'pvp':     pvpEnemyActs(e);break;
    case 'atk':     hitPlayer(1,label);break;
    case 'strong':  hitPlayer(1.5,label);break;
    case 'hellfire':hitPlayer(1.8,label);break;
    case 'release':
      if(mv.kind==='jeongyeok'){
        if(B.defending)hitPlayer(1,`${e.name}의 「전격」`);
        else{const d=Math.round(P.maxHp*0.5);P.hp=Math.max(0,P.hp-d);addLog(`${e.name}의 「전격」! 방어하지 못했다 — HP ${d} 소멸`);queueFx('player','⚡-'+d,'pdmg');}
      }else if(mv.kind==='tornado'){
        const d=Math.ceil(P.maxHp/3);P.hp=Math.max(0,P.hp-d);
        addLog(`${e.name}의 「스파크 토네이도」! 방어도 소용없다 — HP ${d} 소멸`);queueFx('player','🌪-'+d,'pdmg');
        hitAllies(0.3,'스파크 토네이도');
      }else hitPlayer(2.5,`${e.name}의 「${mv.n}」`);
      break;
    case 'multi':{
      addLog(`${label}!`);
      for(let i=0;i<mv.hits;i++)hitPlayer(mv.m,`  ${i+1}타`);
      break;}
    case 'drain':{
      const d=hitPlayer(1,label);
      const h=Math.min(e.maxHp-e.hp,Math.round(d*0.6));
      if(h>0){e.hp+=h;addLog(`적이 생명력 ${h}을 빨아들였다.`);queueFx('enemy','+'+h,'heal');}
      break;}
    case 'curse':   B.curse=3;addLog(`${label} — 3턴간 방어력 감소`);break;
    case 'silence': B.silence=2;addLog(`${label} — 2턴간 성력 봉인`);break;
    case 'dot':
      hitPlayer(0.6,label);
      B.dot={name:mv.dn||'부패',dmg:Math.max(3,Math.round(e.atk*0.35)),turns:3};
      addLog(`${label} — 3턴간 ${B.dot.name}`);break;
    case 'invis':   B.evade=true;addLog(`${label} — 모습을 감췄다! 다음 공격이 빗나간다`);break;
    case 'discord':{
      const c=P.active.filter(id=>!(B.stun[id]>0)&&B.ahp[id]&&B.ahp[id].hp>0);
      if(c.length){const id=pick(c);B.stun[id]=2;B.stunWhy[id]='불화';addLog(`${label} — ${ALLIES[id].name} 2턴간 행동 불가`);}
      else{B.curse=3;addLog(`${label} — 3턴간 방어력 감소`);}
      break;}
    case 'storm':   hitPlayer(mv.m,label);hitAllies(0.12,label);break;
    case 'sweep':   hitPlayer(0.6,label);hitAllies(mv.m,label);break;
    case 'rage':
      if(B.rage<2){B.rage++;addLog(`${label} — 공격력 상승!`);}
      else hitPlayer(1.5,label);
      break;
    case 'charge':
      B.charging=true;B.chargeName=mv.n;B.chargeKind=mv.kind||null;
      addLog(mv.kind==='jeongyeok'?`⚠ ${e.name} — 「전격」 충전! 방어하지 않으면 HP 절반을 잃는다`
        :mv.kind==='tornado'?`⚠ ${e.name} — 「스파크 토네이도」의 전조! 방어해도 HP 1/3을 잃는다`
        :`⚠ ${e.name} — 「${mv.n}」 준비! 다음 턴에 방어하자.`);
      break;
  }
  // 나베리우스: 숨 쉴 틈 없는 추격 참격
  if(e.slashes&&mv.t!=='sealed'&&P.hp>0){
    for(let i=0;i<e.slashes;i++)hitPlayer(0.35,`🗡 추격 참격 ${i+1}`);
  }
  B.defending=false;B.ward=false;
  if(B.dot&&P.hp>0){
    P.hp=Math.max(0,P.hp-B.dot.dmg);addLog(`🩸 ${B.dot.name} — ${B.dot.dmg} 피해`);queueFx('player','-'+B.dot.dmg,'pdmg');
    if(--B.dot.turns<=0)B.dot=null;
  }
  if(B.tornadoCD>0)B.tornadoCD--;
  if(B.buff)B.buff--;
  if(B.aura)B.aura--;
  if(B.hex)B.hex--;
  if(B.curse&&mv.t!=='curse')B.curse--;
  if(B.silence&&mv.t!=='silence')B.silence--;
  if(B.weak)B.weak--;
  if(P.hp<=0){P.hp=0;B.over=true;renderBattle();setTimeout(defeat,900);return;}
  B.busy=false;
  renderBattle();
}

function gainXp(n){
  P.xp+=n;const msgs=[];
  while(P.xp>=need(P.lv)){
    P.xp-=need(P.lv);P.lv++;
    P.maxHp+=15;P.maxMp+=5;P.atk+=3;P.def+=2;P.hp=P.maxHp;P.mp=P.maxMp;
    msgs.push(`⬆ 레벨 ${P.lv} 달성! (HP·성력 완전 회복)`);
    SKILLS.forEach(s=>{if(s.lv===P.lv)msgs.push(`✝ 새 성력 습득: ${s.name}`);});
  }
  return msgs;
}

function victory(){
  if(!B)return;
  if(B.pvp){pvpEnd(true);return;}
  const e=B.e,area=B.area,stype=B.stype,stage=B.stage,wasFinal=B.isFinal,fromHunt=!!B.spec.hunt;
  const tName=B.baseName;
  B.over=true;
  const gold=B.isBoss?Math.round(e.gold*BOSS_GOLD_MULT):e.gold;
  P.gold+=gold;
  P.kills[tName]=(P.kills[tName]||0)+1;
  P.wins[area]=(P.wins[area]||0)+1;
  let extra=[];
  if(stype==='normal'&&Math.random()<0.15){P.items.water++;extra.push('성수 획득');}
  if(stype==='normal'&&Math.random()<DROP.stoneNormal){P.items.stone++;extra.push(`${AWAKEN_ITEM.icon} 희귀 아이템 「${AWAKEN_ITEM.name}」 획득!`);}
  const first=!fromHunt&&stage>P.prog[area];
  if(first){
    P.prog[area]=stage;
    if(stype==='normal'){P.gold+=e.gold;extra.push(`🏁 첫 클리어 보너스 +${e.gold} G`);}
    if(stype==='elite'){P.tickets+=1;extra.push('🏁 첫 클리어: 🎫 소환권 ×1');}
    if(stype==='mid'){P.tickets+=2;extra.push('🏁 첫 클리어: 🎫 소환권 ×2');}
    if(stype==='boss'){P.tickets+=3;extra.push('🏁 첫 클리어: 🎫 소환권 ×3');}
  }
  // 희귀 유물: 확률 드롭 (재도전으로 다시 노릴 수 있음)
  if(stype==='mid'&&Math.random()<DROP.stoneMid){P.items.stone++;extra.push(`${AWAKEN_ITEM.icon} 희귀 아이템 「${AWAKEN_ITEM.name}」 획득!`);}
  if(stype==='boss'){
    if(Math.random()<DROP.stoneBoss){P.items.stone++;extra.push(`${AWAKEN_ITEM.icon} 희귀 아이템 「${AWAKEN_ITEM.name}」 획득!`);}
    const d=AREAS[area].boss.drop;
    if(d&&!P.relics.includes(d)){
      if(Math.random()<DROP.seal){gainRelic(d);extra.push(`${RELICS[d].icon} 희귀 유물 「${RELICS[d].name}」 획득! (${RELICS[d].desc})`);}
      else extra.push(`인장은 손에 넣지 못했다… (획득 확률 ${DROP.seal*100}% · 재도전 가능)`);
    }
  }
  const allyUps=[];
  partyIds().forEach(id=>{if(allyGainXp(id,e.xp))allyUps.push(`${ALLIES[id].name} Lv ${aData(id).lv}`);});
  const ups=gainXp(e.xp);
  if(allyUps.length)ups.push('🤝 동료 레벨업: '+allyUps.join(', '));
  let msg=`<b>${esc(tName)} 처치!</b> EXP +${e.xp} · ${gold} G${gold!==e.gold?' (보스 보너스 ×1.25)':''}`;
  if(extra.length)msg+='<br>'+extra.join('<br>');
  if(ups.length)msg+='<br>'+ups.join('<br>');
  clearBattle();

  if(stype==='boss'&&first){
    P.cleared[area]=true;
    if(wasFinal){
      P.ended=true;save();
      storyChain([ENDING],()=>renderHub(msg+'<br>✝ 나베리우스 토벌 완료! 엔딩 이후에도 계속 플레이할 수 있습니다.'));
      return;
    }
    P.unlocked=Math.max(P.unlocked,area+1);
    P.cur=area+1;save();
    storyChain([AREAS[area].outro,AREAS[area+1].intro],
      ()=>renderMap(area+1,msg+`<br>🔓 새 나라 개방: ${AREAS[area+1].flag} ${AREAS[area+1].name}`));
    return;
  }
  save();
  if(fromHunt)renderHub(msg);
  else renderMap(area,msg);
}

function defeat(){
  if(B&&B.pvp){pvpEnd(false);return;}
  clearBattle();
  const lost=Math.floor(P.gold/2);
  P.gold-=lost;P.hp=Math.round(P.maxHp*0.5);P.mp=Math.round(P.maxMp*0.5);save();
  showStory(`눈앞이 어두워진다…\n\n교구의 사제들이 쓰러진 {name}을(를) 성당으로 옮겼다.\n\n(소지금 ${lost} G를 잃었다)`,()=>renderHub('정신을 차렸다. 성당에서 휴식하고 다시 도전하자.'));
}

/* ===================== 지도 ===================== */
let mapSel=null;
function renderMap(a,msg){
  if(a==null)a=P.cur;
  P.cur=a;
  const ar=AREAS[a],prog=P.prog[a];
  if(mapSel==null||mapSel.a!==a)mapSel={a,s:Math.min(STAGES,prog+1)};
  const X=[50,74,82,66,42,22,18,34,58,78,80,60,38,22,46];
  const ROW=74,H=STAGES*ROW+30;
  const pts=[];let nodes='';
  for(let s=1;s<=STAGES;s++){
    const x=X[s-1],y=(STAGES-s)*ROW+40;pts.push(`${x},${y}`);
    const t=stageType(s),state=s<=prog?'done':s===prog+1?'next':'lock';
    const label=t==='boss'?'☠':t==='mid'?'✠':t==='elite'?'⚔':s;
    nodes+=`<button class="node ${t} ${state} ${mapSel.s===s?'sel':''}" data-st="${s}" style="left:${x}%;top:${y}px" ${state==='lock'?'disabled':''}>${state==='done'&&t==='normal'?'✔':label}</button>`;
  }
  const s=mapSel.s,t=stageType(s),open=s<=prog+1;
  const art=(t==='boss'||t==='mid')?`<div class="sheet-art">${PORTRAIT[(t==='boss'?ar.boss:ar.mid).art]?portraitHTML((t==='boss'?ar.boss:ar.mid).art,'small'):bossSVG((t==='boss'?ar.boss:ar.mid).art)}</div>`:'';
  $('#app').innerHTML=`${statusHTML()}
    ${msg?`<div class="notice">${msg}</div>`:''}
    <div class="panel"><div class="ptitle">🗺 ${ar.flag} ${ar.name} <span class="small">스테이지 ${prog}/${STAGES}</span></div>
      <div class="mapwrap" style="--gc:${ar.glow}"><div class="map" style="height:${H}px">
        <svg class="mapline" viewBox="0 0 100 ${H}" preserveAspectRatio="none"><polyline points="${pts.join(' ')}" vector-effect="non-scaling-stroke"/></svg>
        ${nodes}
      </div></div>
    </div>
    <div class="panel sheet">
      ${art}
      <div class="ptitle">${s}. ${stageName(a,s)} <span class="tag ${t==='normal'?'done':t==='elite'?'item':'t-ally'}">${STYPE_LABEL[t]}</span></div>
      ${(t==='boss'||t==='mid')?`<div class="etitle" style="text-align:left">${(t==='boss'?ar.boss:ar.mid).title}</div>`:''}
      <div class="desc">권장 Lv ${stageRec(a,s)} · 첫 클리어 보상: ${STAGE_REWARD[t]}${s<=prog?' <span class="gold">(클리어 완료 · 재도전 가능)</span>':''}${t==='boss'&&ar.boss.drop?(P.relics.includes(ar.boss.drop)?' · 🔒 인장 보유':' · 인장 미획득'):''}</div>
      <div class="grid">
        <button class="btn ${t==='boss'||t==='mid'?'danger':'primary'}" id="go" ${open?'':'disabled'}>${open?'⚔ 출전':'🔒 이전 스테이지를 먼저 클리어'}</button>
        <button class="btn" id="back">← 거점으로</button>
      </div>
    </div>`;
  document.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{mapSel={a,s:+b.dataset.st};renderMap(a);});
  $('#go').onclick=()=>startBattle({area:a,stage:s});
  $('#back').onclick=()=>renderHub();
  const sel=document.querySelector('.node.sel');
  if(sel&&!msg)sel.scrollIntoView({block:'center'});
  else window.scrollTo(0,0);
  save();
}

document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&P){try{localStorage.setItem(SAVE_KEY,JSON.stringify(P))}catch(e){}}});
renderTitle();
initCloud();

</script>
</body>
