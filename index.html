        <button class="btn primary" id="sumT1" ${P.tickets<1?'disabled':''}>🎫 소환권 1회<small>보유 ${P.tickets}장</small></button>
        <button class="btn primary" id="sumT10" ${P.tickets<10?'disabled':''}>🎫 소환권 10회<small>10장 사용</small></button>
        <button class="btn primary full" id="sumG1" ${P.gold<SUMMON_COST?'disabled':''}>💰 골드 1회<small>${SUMMON_COST} G</small></button>
        <button class="btn danger full" id="sumG11" ${P.gold<SUMMON11_COST?'disabled':''}>💰 골드 11회 연속<small>${fmt(SUMMON11_COST)} G (${SUMMON_COST*11-SUMMON11_COST} G 할인)</small></button>
      </div>
    </div>
    <button class="btn" id="back">← 돌아가기</button>`;
  $('#sumT1').onclick=()=>summon(1,true);
  $('#sumT10').onclick=()=>summon(10,true);
  $('#sumG1').onclick=()=>summon(1,false);
  $('#sumG11').onclick=()=>summon(11,false);
  document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>buy(b.dataset.id));
  $('#back').onclick=()=>renderHub();
}
function buy(id){
  let m='';
  if(id==='water'&&P.gold>=25){P.gold-=25;P.items.water++;m='성수를 구입했다.';}
  else if(id==='rosary'&&P.gold>=30){P.gold-=30;P.items.rosary++;m='묵주를 구입했다.';}
  else if(id==='wpn'&&P.gold>=wpnCost()){P.gold-=wpnCost();P.wpn++;P.atk+=4;m='검이 축성되었다. 공격력 +4';}
  else if(id==='arm'&&P.gold>=armCost()){P.gold-=armCost();P.arm++;P.def+=3;P.maxHp+=10;P.hp+=10;m='사제복이 축성되었다. 방어력 +3, 최대 HP +10';}
  save();renderShop(m);
}

function rollStar(){
  let r=Math.random();
  for(const [st,p] of STAR_RATE){if(r<p)return st;r-=p;}
  return 1;
}
function revealHTML(list,title){
  const best=Math.max(...list.map(x=>ALLIES[x.id].star));
  if(list.length===1){
    const {id,isNew}=list[0],al=ALLIES[id];
    return `<div class="sum s${al.star}"><div class="sum-title">${title}</div><div class="sum-stars">${'★'.repeat(al.star)}</div>${allyPortrait(id)}
      <div class="sum-name">${al.name}</div><div class="small">${al.role}</div><p class="sum-desc">${al.desc}</p>
      <div class="notice">${isNew?'새로운 동료가 합류했다!':'보유 수 +1 (합성 재료) · 현재 '+P.roster[id]+'개'}</div></div>`;
  }
  return `<div class="sum s${best}"><div class="sum-title">${title}</div><div class="sumgrid">${list.map((x,i)=>{const {id,isNew}=x,al=ALLIES[id];
    return `<div class="sumcell s${al.star}" style="animation-delay:${(i*0.09).toFixed(2)}s"><div class="ic">${allyFace(id,'sm')}</div><div class="st">${'★'.repeat(al.star)}</div><div class="nm">${al.name}</div>${isNew?'<div class="new">NEW</div>':''}${x.gift?'<div class="gift">🎁 확정</div>':''}</div>`;}).join('')}</div></div>`;
}
/* 소환 연출: 최고 등급에 따라 화려해짐 */
function summonFx(top,cb){
  const n=top>=5?46:top>=4?30:top>=3?18:10;
  const parts=Array.from({length:n},()=>`<i style="--a:${Math.round(Math.random()*360)}deg;--r:${Math.round(90+Math.random()*170)}px;--s:${(2+Math.random()*4).toFixed(1)}px;animation-delay:${(0.55+Math.random()*0.5).toFixed(2)}s"></i>`).join('');
  const ov=document.createElement('div');
  ov.className='sfx s'+top;
  ov.innerHTML=`<div class="sfx-bg"></div>
    <div class="sfx-circle"><div class="r1"></div><div class="r2"></div><div class="r3"></div></div>
    <div class="sfx-pillar"></div>${top>=4?'<div class="sfx-rays"></div>':''}${top>=5?'<div class="sfx-rays r2"></div>':''}
    <div class="sfx-parts">${parts}</div>
    ${top>=4?`<div class="sfx-label">${'★'.repeat(top)}</div>`:''}
    <div class="sfx-flash"></div><div class="sfx-skip">탭하여 건너뛰기</div>`;
  document.body.appendChild(ov);
  const dur=top>=5?2700:top>=4?2100:top>=3?1600:1300;
  let done=false;
  const fin=()=>{if(done)return;done=true;ov.remove();cb();};
  ov.onclick=fin;setTimeout(fin,dur);
}
function summon(n,useTicket){
  if(useTicket){if(P.tickets<n)return;P.tickets-=n;}
  else{const c=n===11?SUMMON11_COST:SUMMON_COST*n;if(P.gold<c)return;P.gold-=c;}
  const res=[];
  for(let i=0;i<n;i++){
    const id=pick(allyIds(rollStar()));
    const isNew=!owned(id);addAlly(id);res.push({id,isNew});
  }
  save();
  const top=res.reduce((a,b)=>ALLIES[b.id].star>ALLIES[a.id].star?b:a);
  summonFx(ALLIES[top.id].star,()=>showStory(revealHTML(res,n===1?'소환 결과':n+'회 소환 결과'+(res.some(r=>r.gift)?' + 🎁 ★4 확정':'')),()=>renderShop(`${n}회 소환 완료 · 최고 등급 ${'★'.repeat(ALLIES[top.id].star)} ${ALLIES[top.id].name}`),true));
}
function synthesize(id){
  const al=ALLIES[id],need=SYN_NEED[al.star];
  if(!need||(P.roster[id]||0)<need)return;
  P.roster[id]-=need;
  if(P.roster[id]<=0){delete P.roster[id];P.active=P.active.filter(x=>x!==id);}
  const nid=pick(allyIds(al.star+1)),isNew=!owned(nid);
  addAlly(nid);save();
  summonFx(ALLIES[nid].star,()=>showStory(revealHTML([{id:nid,isNew}],`합성: ${al.name} ×${need} →`),()=>renderAllies(`🔮 합성 완료 — ${'★'.repeat(ALLIES[nid].star)} ${ALLIES[nid].name}`),true));
}

/* 일괄 합성: 지금 재료가 모인 모든 캐릭터를 한 번에 합성 */
function synthPlan(){
  return Object.keys(P.roster).filter(id=>SYN_NEED[ALLIES[id].star]&&(P.roster[id]||0)>=SYN_NEED[ALLIES[id].star])
    .map(id=>({id,n:Math.floor(P.roster[id]/SYN_NEED[ALLIES[id].star])})).sort((a,b)=>ALLIES[a.id].star-ALLIES[b.id].star);
}
function synthAllAsk(){
  const plan=synthPlan();if(!plan.length)return;
  const total=plan.reduce((s,x)=>s+x.n,0);
  $('#mtext').innerHTML=`<div class="sum"><div class="sum-title">🔮 일괄 합성</div>
    <div class="synlist">${plan.map(x=>{const al=ALLIES[x.id],need=SYN_NEED[al.star];
      return `<div class="synrow">${allyFace(x.id,'xs')} <span class="synnm">${'★'.repeat(al.star)} ${al.name}</span><b>${need*x.n}장 → ★${al.star+1} ×${x.n}</b></div>`;}).join('')}</div>
    <p class="sum-desc">총 ${total}회 합성합니다. 재료로 쓴 캐릭터는 사라지고, 한 단계 위 등급의 무작위 캐릭터를 얻습니다.</p>
    <button class="btn" id="syncancel" style="width:100%;margin-bottom:8px">취소</button></div>`;
  $('#mbtn').textContent=`🔮 ${total}회 합성하기`;
  $('#modal').classList.remove('hidden');
  $('#syncancel').onclick=()=>{$('#modal').classList.add('hidden');};
  $('#mbtn').onclick=()=>{$('#modal').classList.add('hidden');synthAll();};
}
function synthAll(){
  const plan=synthPlan();if(!plan.length)return;
  const res=[];
  for(const {id,n} of plan){
    const al=ALLIES[id],need=SYN_NEED[al.star];
    for(let i=0;i<n;i++){
      P.roster[id]-=need;
      const nid=pick(allyIds(al.star+1)),isNew=!owned(nid);
      addAlly(nid);res.push({id:nid,isNew});
    }
    if(P.roster[id]<=0){delete P.roster[id];P.active=P.active.filter(x=>x!==id);}
  }
  save();
  const top=res.reduce((a,b)=>ALLIES[b.id].star>ALLIES[a.id].star?b:a);
  summonFx(ALLIES[top.id].star,()=>showStory(revealHTML(res,`일괄 합성 결과 (${res.length}회)`),()=>renderAllies(`🔮 일괄 합성 ${res.length}회 완료 · 최고 등급 ${'★'.repeat(ALLIES[top.id].star)} ${ALLIES[top.id].name}`),true));
}

/* ===================== 전투 ===================== */
function clearBattle(){document.body.classList.remove('battle');if(B&&B.paraT)clearInterval(B.paraT);if(B&&B.zapT)clearInterval(B.zapT);if(B&&B.karmaT)clearInterval(B.karmaT);if(B&&B.isaT)clearInterval(B.isaT);B=null;}
/* 반사·부적 등으로 적이 턴 밖에서 쓰러졌을 때 */
function winNow(){
  if(!B||B.won)return;
  if(B.e.berserk&&!B.berserked){B.e.hp=Math.max(1,B.e.hp);renderBattle();return;}
  B.won=true;B.busy=true;if(B.paraT)clearInterval(B.paraT);
  if(B.zapT)clearInterval(B.zapT);if(B.karmaT)clearInterval(B.karmaT);if(B.isaT)clearInterval(B.isaT);
  renderBattle();setTimeout(victory,750);
}
/* 이사벨 부제: 5초마다 주인공 HP 40% 회복 */
const ISABEL_TICK=5000, ISABEL_HEAL=0.4;
function isabelTick(){
  if(!B||B.over||B.won||P.hp<=0||!$('#modal').classList.contains('hidden'))return;
  const h=B.ahp[FIXED];if(h&&h.hp<=0)return;
  if(B.stun[FIXED]>0)return;
  const hh=Math.min(P.maxHp-P.hp,Math.round(P.maxHp*ISABEL_HEAL*healMul()));
  if(hh<=0)return;
  P.hp+=hh;stat('heal',FIXED,hh);addLog(`🕊️ 이사벨 부제의 치유 기도 — HP ${hh} 회복`);queueFx('player','+'+hh,'heal');
  renderBattle();
}
/* 카르마: 5초마다 무작위 부적 (주인공 치유 / 적 저주 / 적 불태움) */
function karmaTick(){
  if(!B||B.over||B.won||!$('#modal').classList.contains('hidden'))return;
  const id='karma',h=B.ahp[id];
  if(!inParty(id)||(h&&h.hp<=0)||(B.stun[id]>0))return;
  const m=allyMult(id),lv=aData(id).lv,e=B.e,n=isMyth(id)?2:1;
  for(let i=0;i<n&&e.hp>0;i++){
    const r=Math.floor(Math.random()*3);
    if(r===0){const hh=Math.min(P.maxHp-P.hp,Math.round((P.maxHp*0.04+lv)*m*healMul()));P.hp+=hh;stat('heal','karma',hh);addLog(`📜 카르마의 치유 부적 — HP ${hh} 회복`);if(hh>0)queueFx('player','+'+hh,'heal');}
    else if(r===1){B.hex=Math.max(B.hex,2);addLog(`📜 카르마의 저주 부적 — 적 공격력 감소`);}
    else{
      if(B.immune){addLog('📜 카르마의 화염 부적 — ⏸ 피해 무효');continue;}
      if(B.vsil&&B.vsil.karma&&Math.random()<0.3){addLog('📜 카르마의 화염 부적 — 🔇 침묵에 막혀 무효');continue;}
      const d=Math.max(1,Math.round((6+lv*2.2)*m*rnd(0.9,1.1)*(B.vslow&&B.vslow.karma?0.6:1)));stat('dmg','karma',Math.min(d,e.hp));e.hp=Math.max(0,e.hp-d);
      B.eburn={dmg:Math.max(1,Math.round(d*0.4)),turns:2};
      addLog(`📜 카르마의 화염 부적 — ${d} 피해 · 불태움`);queueFx('enemy','🔥'+d,'dmg');
    }
  }
  if(e.hp<=0){winNow();return;}
  renderBattle();
}
function startBattle(spec){
  // spec: {area, stage} 스테이지 전투 / {area, hunt:true} 자유 사냥
  const a=spec.area;
  let s=spec.stage,t;
  if(spec.pvp){t=spec.pvp;s=0;}
  else if(spec.hunt){s=Math.min(14,Math.max(1,P.prog[a]));if(stageType(s)!=='normal')s=Math.max(1,s-1);t=scaledEnemy(a,s,pick(AREAS[a].enemies));}
  else t=stageEnemy(a,s);
  if(!spec.pvp){const em=(!spec.hunt&&stageType(s)==='boss'&&a>=4)?LATE_BOSS_MULT:ENEMY_MULT;t={...t,hp:t.exactHp?t.hp:Math.round(t.hp*em),atk:Math.round(t.atk*em)};} // 적 체력·공격력 배율 (exactHp: 체력 고정)
  const type=spec.pvp?'pvp':spec.hunt?'normal':stageType(s);
  const isBoss=type==='boss'||type==='mid'||type==='pvp';
  clearBattle();
  const ahp={};
  const party=[FIXED,...P.active.filter(id=>spec.pvp||sortieOk(a,id))];
  const benched=spec.pvp?[]:P.active.filter(id=>!sortieOk(a,id));
  party.forEach(id=>{const al=ALLIES[id],mx=Math.round((50+aData(id).lv*10)*(0.7+0.15*al.star)*(isMyth(id)?2:1));ahp[id]={hp:mx,max:mx};});
  B={e:{...t,maxHp:t.hp},spec,area:a,stage:spec.hunt?0:s,stype:type,baseName:t.name,isBoss,isFinal:!!t.final,
     charging:false,chargeName:'',chargeKind:null,phase:1,tornadoCD:0,
     buff:0,aura:0,hex:0,immune:0,reflect:0,curAlly:null,stun:{},stunWhy:{},ahp,agatoUsed:false,curse:0,silence:0,weak:0,ward:false,rage:0,turn:0,
     party,healCut:0,mikaCD:0,mshield:0,st:{dmg:{},heal:{}},dot:null,evade:false,sealed:0,over:false,won:false,shield:0,ashield:0,prism:0,negate:0,blind:0,eburn:null,eliaCD:0,sirenT:0,danT:0,
     defending:false,busy:false,menu:'main',log:[],fxq:[]};
  if(benched.length)addLog(`⚠ 출전 조건 — ${benched.map(id=>ALLIES[id].name).join(', ')} 출전 불가 (${sortieRule(a).text})`);
  const begin=()=>{
    if(B&&t.paralyze)B.paraT=setInterval(paraTick,t.paralyze);
    if(B&&t.slowSil){
      const c=party.slice().sort(()=>Math.random()-0.5).slice(0,t.slowSil);
      B.vslow={};B.vsil={};c.forEach(id=>{B.vslow[id]=1;B.vsil[id]=1;});
      if(c.length)addLog(`🌀 ${t.name}의 강탈 — ${c.map(id=>ALLIES[id].name).join(', ')} 둔화(공격 피해 40% 감소) · 침묵(공격 30% 무효) — 전투가 끝날 때까지`);
    }
    if(B&&t.burnAll){B.dot={name:'화상',dmg:Math.max(5,Math.round(t.atk*0.2)),turns:99};addLog(`🔥 ${t.name}의 불길 — 주인공과 동료들이 끝없이 불타기 시작한다`);}
    if(B&&t.sealAlly){
      const c=party.filter(id=>id!==FIXED);
      if(c.length){const id=pick(c);B.stun[id]=99999;B.stunWhy[id]='바르바토스의 사냥 표식 — 전투가 끝날 때까지';
        addLog(`🏹 ${t.name}의 사냥 표식 — ${ALLIES[id].name}이(가) 전투가 끝날 때까지 행동 불능!`);}
    }
    if(B)B.startAt=Date.now();
    if(B&&inParty('karma'))B.karmaT=setInterval(karmaTick,5000);
    if(B)B.isaT=setInterval(isabelTick,ISABEL_TICK);
    if(B&&isBoss&&!t.pvp){B.tickMs=t.zap?3000:t.tick?t.tick:t.final?4500:type==='boss'?5000:6000;B.zapT=setInterval(bossTick,B.tickMs);}
    if(B&&!isBoss&&Math.random()<0.4){
      addLog(`⚠ 기습! ${t.name}이(가) 먼저 덤벼든다`);B.busy=true;renderBattle();setTimeout(enemyTurn,700);return;
    }
    renderBattle();
  };
  if(t.pvp){
    B.pvp=true;
    addLog(`⚔ 친구 대결 — 「${t.name}」 (전투력 ${fmt(t.cp)})`);
    showStory(`<div class="sum s4"><div class="sum-title">⚔ 친구 대결</div><div class="pvpvs">${esc(P.name)} <span>VS</span> ${t.heroName}</div>
      <div class="pvpteam">✝ ${t.heroName} Lv ${t.hero.lv}</div><div class="pvpteam">${teamIconsHTML(t.party)}</div>
      <p class="sum-desc">친구가 마지막으로 저장한 팀을 AI가 조종해요.<br>대결은 연습 경기라 HP는 가득 찬 상태로 시작하고, 끝나면 원래대로 돌아와요.</p></div>`,begin,true);
  }else if(isBoss){
    addLog(`${type==='boss'?(t.final?'최종 보스':'나라 보스'):'솔로몬 72악마'} 「${t.name}」 강림!`);
    if(t.dimension)addLog('🌀 차원 전이 — 주인공의 공격 절반이 다른 차원으로 흘러간다');
    if(t.zap)addLog('⚡ 흐르는 전류 — 몇 초마다 파티 전체가 피해를 입는다');
    showStory(`<div class="sum s5"><div class="sum-title">${t.title}</div><div class="intro-art">${PORTRAIT[t.art]?portraitHTML(t.art,'big'):bossSVG(t.art)}</div><div class="sum-name">${t.name}</div><p class="sum-desc" style="color:#cdd6f0">${esc(t.pre).replace(/\n/g,'<br>')}</p></div>`,begin,true);
  }else{
    addLog(`${type==='elite'?'정예 ':''}「${t.name}」 출현!`);
    begin();
  }
}
function bossTick(){
  if(!B||B.over||B.won||!$('#modal').classList.contains('hidden'))return;
  if(B.e.zap){zapTick();return;}
  // 중간 보스·나라 보스: 몇 초마다 몰아붙이는 맹공
  hitPlayer(0.3,`⏱ ${B.e.name}의 맹공`);
  if(B.e.hp<=0&&P.hp>0){winNow();return;}
  if(P.hp<=0){P.hp=0;B.over=true;clearInterval(B.zapT);renderBattle();setTimeout(defeat,800);return;}
  renderBattle();
}
function zapTick(){
  if(!B||B.over||!B.e.zap||!$('#modal').classList.contains('hidden'))return;
  const d=Math.max(1,Math.round(P.maxHp*0.03));
  P.hp=Math.max(0,P.hp-d);
  hitAllies(0.04,'⚡ 흐르는 전류',true);
  addLog(`⚡ 흐르는 전류 — HP ${d} · 동료 전원 피해`);
  queueFx('player','⚡-'+d,'pdmg');
  if(P.hp<=0){B.over=true;clearInterval(B.zapT);renderBattle();setTimeout(defeat,800);return;}
  renderBattle();
}
function hitAllies(pct,label,quiet){
  const down=[];
  partyIds().forEach(id=>{const h=B.ahp[id];if(!h||h.hp<=0)return;
    if(id==='danian'&&Math.random()<0.5)return; // 다니안 회피
    const d=Math.max(1,Math.round(h.max*pct*(B.ashield?0.5:1)*(paraOn()?1.5:1)*rnd(0.9,1.1)));h.hp=Math.max(0,h.hp-d);
    if(h.hp<=0&&!allyDown(id))down.push(ALLIES[id].name);});
  if(!quiet)addLog(`${label} — 동료 전원 피해`);
  if(down.length)addLog(`💀 ${down.join(', ')} 쓰러짐 (이번 전투 행동 불가)`);
}
function addLog(s){B.log.push(s);if(B.log.length>40)B.log.shift();}
const healMul=()=>(B&&B.healCut)?0.9:1;
const paraOn=()=>!!(B&&B.paraUntil&&Date.now()<B.paraUntil);
/* 가미긴: 3초마다 동료 전원 마비 (방어력 50% 감소 → 받는 피해 1.5배) */
function paraTick(){
  if(!B||B.over||B.won||!$('#modal').classList.contains('hidden'))return;
  const was=paraOn();B.paraUntil=Date.now()+B.e.paralyze+600;
  if(!was){addLog(`⚡ ${B.e.name}의 마비 — 동료 전원 방어력 50% 감소 (3초마다 다시 걸림)`);renderBattle();}
}
const stormOn=()=>!!(B&&B.stormUntil&&Date.now()<B.stormUntil);
/* 키리에: 처음 쓰러진 동료 부활 (신화 2회) */
function allyDown(id){
  if(!B||id==='kirie'||!inParty('kirie'))return false;
  const k=B.ahp.kirie;if(!k||k.hp<=0||(B.stun.kirie>0))return false;
  const max=isMyth('kirie')?2:1;if((B.revives||0)>=max)return false;
  const h=B.ahp[id];h.hp=Math.round(h.max*0.5);B.revives=(B.revives||0)+1;
  addLog(`🪶 키리에의 날개 — ${ALLIES[id].name} HP 50%로 부활!`);stat('heal','kirie',h.hp);return true;
}
function stat(kind,who,v){if(!B||!B.st||!who||!(v>0))return;const o=B.st[kind];o[who]=(o[who]||0)+Math.round(v);}
function queueFx(target,txt,cls){B.fxq.push([target,txt,cls]);}
const enemyDef=()=>B.e.def*(B.weak?0.5:1);

function cmdHTML(){
  const dis=B.busy?'disabled':'';
  if(B.menu==='item'){
    return `<div class="grid">
      <button class="btn full" data-item="water" ${(B.busy||!P.items.water)?'disabled':''}>성수 ×${P.items.water}<small>HP 40% 회복 (최소 60)</small></button>
      <button class="btn full" data-back="1" ${dis}>← 뒤로</button></div>`;
  }
  return `<div class="grid">
    <button class="btn primary full" data-act="attack" ${dis}>⚔ 공격</button>
    <button class="btn" data-act="defend" ${dis}>🛡 방어<small>피해 40% 감소 · 공격 없음</small></button>
    <button class="btn" data-act="itemmenu" ${dis}>🧪 아이템</button>
    <button class="btn full" data-act="flee" ${(B.busy||B.isBoss)?'disabled':''}>${B.pvp?'대결 중에는 도망칠 수 없다':B.isBoss?'보스전에서는 도망칠 수 없다':'🏃 도망 (60%)'}</button>
  </div>`;
}

function renderBattle(){
  document.body.classList.add('battle');
  const e=B.e;
  const st=[];
  if(B.buff)st.push(`✨ 축복 ${B.buff}`);
  if(B.aura)st.push(`🌟 축성 ${B.aura}`);
  if(B.hex)st.push(`🩸 적 공격↓ ${B.hex}`);
  if(B.curse)st.push(`☠ 저주 ${B.curse}`);
  if(B.silence)st.push(`🔇 봉인 ${B.silence}`);
  if(B.weak)st.push(`📜 적 방어↓ ${B.weak}`);
  if(B.dot)st.push(`${B.dot.name==='화상'?'🔥':'🩸'} ${B.dot.name} ${B.dot.turns>=90?'∞':B.dot.turns}`);
  if(B.ward)st.push('🔰 결계');
  if(B.immune)st.push('⏸ 적 피해 무효');
  if(B.reflect)st.push('↩ 적 반사');
  if(B.shield>0)st.push(`🌹 보호막 ${B.shield}`);
  if(B.mshield>0)st.push(`🛡 방어막 ${B.mshield}`);
  if(B.prism)st.push('💎 프리즘');
  if(B.negate)st.push('🗡 무력화');
  if(B.blind)st.push(`📜 시야 차단 ${B.blind}`);
  if(B.sealed>0)st.push(`⛓ 적 속박 ${B.sealed}`);
  if(B.eburn)st.push(`🔥 적 불태움 ${B.eburn.turns}`);
  if(B.ebleed)st.push(`🩸 적 출혈 ${B.ebleed.turns}`);
  if(inParty('pasri')&&B.startAt&&Date.now()-B.startAt<10000)st.push(`🏮 파스리 충전 ${Math.ceil((10000-(Date.now()-B.startAt))/1000)}초`);
  if(B.healCut)st.push(`✂ 회복 -10% ${B.healCut}`);
  if(paraOn())st.push('⚡ 동료 마비 (방어 -50%)');
  if(stormOn())st.push(`🌪 폭풍 ${Math.ceil((B.stormUntil-Date.now())/1000)}초`);
  if(B.defending)st.push('🛡 방어');
  const party=`<div class="party">${partyIds().map(id=>{const h=B.ahp[id];const p=h?Math.round(h.hp/h.max*100):100;
    return `<span class="chip ${(h&&h.hp<=0)||(B.stun[id]>=9999)?'down':''}">${allyFace(id,'xs')} ${ALLIES[id].name}${B.vslow&&B.vslow[id]?' 🐢🔇':''}<i class="mhp"><b style="width:${p}%"></b></i></span>`;}).join('')}</div>`;
  const tag=B.pvp?'<em class="el">DUEL</em>':B.stype==='boss'?`<em>${B.isFinal?'FINAL':'BOSS'}</em>`:B.stype==='mid'?'<em>DEMON</em>':B.stype==='elite'?'<em class="el">ELITE</em>':'';
  const t=-(performance.now()/1000).toFixed(2);
  const vis=e.pvp?`<div class="eicon pvpvis" id="eicon"><div class="pvphero">✝</div><div class="pvpteam">${teamIconsHTML(e.party)}</div></div>`:e.art?`<div class="eicon art ${B.charging?'charge':''}" id="eicon" style="--t:${t}s">${bossSVG(e.art)}</div>`
    :`<div class="eicon sil ${e.elite?'elite':''} ${B.charging?'charge':''}" id="eicon" style="--gc:${e.elite?'#ff3040':AREAS[B.area].glow}">${e.icon}</div>`;
  const passive=[];
  if(e.dimension)passive.push('🌀 차원 전이');
  if(e.zap)passive.push('⚡ 흐르는 전류 (3초마다)');
  else if(B.isBoss&&B.tickMs)passive.push(`⏱ 맹공 (${B.tickMs/1000}초마다)`);
  if(e.slashes)passive.push(`🗡 추격 참격 ×${e.slashes}`);
  if(B.evade)passive.push('👁 투명화');
  if(B.immune)passive.push('⏸ 시간 정지: 이번 턴 피해 무효 — 회복·방어 추천');
  if(B.reflect)passive.push('↩ 뒤집힌 시간: 준 피해의 50% 반사');
  if(e.bleedOnHit)passive.push('🩸 공격 시 출혈');
  if(e.fixedDmg)passive.push('🎯 방어력 무시 고정 피해');
  if(e.paralyze)passive.push('⚡ 3초마다 동료 마비');
  if(e.berserk)passive.push(B.berserked?'💢 폭주 중':`💢 HP ${fmt(e.berserk.at)} 이하 폭주`);
  if(e.slowSil)passive.push(`🌀 강탈: 동료 ${e.slowSil}명 둔화·침묵`);
  if(e.rage)passive.push(B.raged?'💢 발악: 공격력 2배':'💢 HP 50% 이하 발악');
  if(e.burnAll)passive.push('🔥 끝없는 화상: 주인공·동료');
  if(e.voidHero)passive.push(`🔥 주인공 공격 ${Math.round(e.voidHero*100)}% 무효`);
  if(e.sealAlly)passive.push('🏹 사냥 표식: 동료 1명 전투 종료까지 행동 불능');
  let warn='';
  if(B.charging){
    warn=B.chargeKind==='jeongyeok'?`⚠ 「전격」 — 방어하지 않으면 HP 절반 소멸`
      :B.chargeKind==='tornado'?`⚠ 「스파크 토네이도」 — 방어해도 HP 1/3 소멸`
      :`⚠ 「${B.chargeName}」 준비 중 — 방어 추천`;
  }
  $('#app').innerHTML=`${statusHTML()}
    <div class="enemy ${B.isBoss?'boss':''} ${B.isFinal?'final':''}">
      <div class="eflag">${AREAS[B.area].flag} ${AREAS[B.area].name}${B.pvp?' · 친구 대결':B.stage?` · 스테이지 ${B.stage}`:' · 자유 사냥'}</div>
      <div class="ename">${e.name}${tag}</div>
      ${e.title?`<div class="etitle">${e.title}</div>`:''}
      ${vis}
      ${bar(e.hp,e.maxHp,'ehp')}
      ${passive.length?`<div class="epass">${passive.join(' · ')}</div>`:''}
      <div class="estat">${warn}</div>
    </div>
    ${party}
    <div class="pstat">${st.join(' · ')}</div>
    <div class="log">${B.log.slice(-7).map(l=>`<div>${esc(l)}</div>`).join('')}</div>
    <div class="cmds">${cmdHTML()}</div>`;
  document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{
    const a=b.dataset.act;
    if(a==='skillmenu'){B.menu='skill';renderBattle();}
    else if(a==='itemmenu'){B.menu='item';renderBattle();}
    else act(a);
  });
  document.querySelectorAll('[data-skill]').forEach(b=>b.onclick=()=>act('skill',b.dataset.skill));
  document.querySelectorAll('[data-item]').forEach(b=>b.onclick=()=>act('item',b.dataset.item));
  document.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>{B.menu='main';renderBattle();});
  flushFx();
}

function flushFx(){
  B.fxq.forEach(([t,txt,cls])=>{
    const el=t==='enemy'?$('#eicon'):$('#pstatus');
    if(!el)return;
    const r=el.getBoundingClientRect();
    const s=document.createElement('div');
    s.className='float '+cls;s.textContent=txt;
    s.style.left=(r.left+r.width/2+rnd(-40,40))+'px';
    s.style.top=(r.top+r.height/2+rnd(-14,14))+'px';
    $('#fx').appendChild(s);setTimeout(()=>s.remove(),950);
    if(t==='enemy')el.classList.add('hit');
    if(cls==='pdmg'){document.body.classList.add('flash');setTimeout(()=>document.body.classList.remove('flash'),220);}
  });
  B.fxq=[];
}

function hitEnemy(mult,label){
  const e=B.e;
  if(B.evade){B.evade=false;addLog(`${label}! — 적이 모습을 감춰 빗나갔다`);queueFx('enemy','MISS','mpf');return;}
  if(e.dimension&&Math.random()<0.5){addLog(`${label}! — 🌀 차원의 틈으로 흘러가 사라졌다`);queueFx('enemy','차원 전이','mpf');return;}
  if(B.immune){addLog(`${label}! — ⏸ 시간이 멈춰 피해가 무효화됐다`);queueFx('enemy','무효','mpf');return;}
  if(e.voidHero&&Math.random()<e.voidHero){addLog(`${label}! — 🔥 아몬의 업화에 삼켜져 무효화됐다`);queueFx('enemy','무효','mpf');return;}
  let d=(P.atk*(B.buff?1.5:1)*(B.aura?1.2:1)*mult-enemyDef()/2)*rnd(0.9,1.1);
  d=Math.max(1,Math.round(d));
  const crit=Math.random()<0.1*(stormOn()?2:1);
  if(crit)d=Math.round(d*(stormOn()&&isMyth('kirie')?2:1.5));
  stat('dmg','hero',Math.min(d,e.hp));
  e.hp=Math.max(0,e.hp-d);
  addLog(`${label}! ${e.name}에게 ${d} 피해${crit?' (치명타!)':''}`);
  queueFx('enemy',(crit?'💥':'')+d,crit?'crit':'dmg');
  if(B.reflect){const r=Math.round(d*0.5);P.hp=Math.max(0,P.hp-r);addLog(`↩ 뒤집힌 시간 — 주인공에게 ${r} 반사`);queueFx('player','↩-'+r,'pdmg');}
}
function allyHit(base,label,defFactor,fixed){
  const e=B.e;
  if(B.immune){addLog(`${label}! — ⏸ 피해 무효`);queueFx('enemy','무효','mpf');return 0;}
  if(B.vsil&&B.vsil[B.curAlly]&&Math.random()<0.3){addLog(`${label}! — 🔇 침묵에 막혀 무효`);queueFx('enemy','침묵','mpf');return 0;}
  let d=fixed?Math.max(1,Math.round(base*(B.am||1))):Math.max(1,Math.round((base*(B.am||1)-enemyDef()*defFactor)*rnd(0.9,1.1)));
  if(B.vslow&&B.vslow[B.curAlly])d=Math.max(1,Math.round(d*0.6));
  stat('dmg',B.curAlly,Math.min(d,e.hp));
  e.hp=Math.max(0,e.hp-d);
  addLog(`${label}! ${d} 피해`);
  queueFx('enemy',d,'dmg');
  if(B.reflect&&B.curAlly&&B.ahp[B.curAlly]){
    const h=B.ahp[B.curAlly],r=Math.round(d*0.5);h.hp=Math.max(0,h.hp-r);
    addLog(`↩ 반사 — ${ALLIES[B.curAlly].name} ${r} 피해${h.hp<=0?' · 쓰러짐':''}`);if(h.hp<=0)allyDown(B.curAlly);
  }
  return d;
}

function alliesAct(){
  const e=B.e;
  B.stun=B.stun||{};
  for(const id of partyIds()){
    if(e.hp<=0)break;
    const al=ALLIES[id],nm=al.name,m=allyMult(id),lv=aData(id).lv;
    B.am=m;B.curAlly=id;
    if(B.ahp[id]&&B.ahp[id].hp<=0)continue;
    if(B.stun[id]>0){
      B.stun[id]--;
      addLog(`${nm} — 행동 불가 (${B.stunWhy[id]||'대가'})`);
      continue;
    }
    const heal=(pct,label,k=1)=>{
      const h=Math.min(P.maxHp-P.hp,Math.round((P.maxHp*pct+lv*2)*m*k*healMul()));
      if(h>0){P.hp+=h;stat('heal',id,h);addLog(`${label} — HP ${h} 회복`);queueFx('player','+'+h,'heal');}
      partyIds().forEach(x=>{const ah=B.ahp[x];if(ah&&ah.hp>0)ah.hp=Math.min(ah.max,ah.hp+Math.round(ah.max*pct*0.6*k*healMul()));});
    };
    switch(al.kit){
      case 'isabel': // 천사의 의지 — 주인공을 돕는 서포터
        if(P.hp<P.maxHp*0.6)heal(0.22,`${nm}의 치유`,0.5); // 주인공·동료 치유량 절반
        else if(!B.aura){B.aura=4;addLog(`${nm}의 의지 — 3턴간 주인공 공격력 1.2배`);}
        else allyHit(6+lv*2,`${nm}의 기도의 빛`,0.5);
        break;
      case 'civ_atk': allyHit(6+lv*2,`${nm}의 ${al.skill}`,0.5);break;
      case 'civ_heal':
        if(P.hp<P.maxHp*0.7)heal(0.12,`${nm}의 ${al.skill}`);
        else allyHit(6+lv*2,`${nm}의 발길질`,0.5);
        break;
      case 'civ_mp':
        if(P.hp<P.maxHp)heal(0.06,`${nm}의 ${al.skill}`);
        else allyHit(6+lv*2,`${nm}의 돌팔매`,0.5);
        break;
      case 'monk_heal':
        if(P.hp<P.maxHp*0.6)heal(0.25,`${nm}의 치유 기도`);
        else allyHit(8+lv*2.5,`${nm}의 묵상 일격`,0.5);
        break;
      case 'monk_bless':
        if(!B.aura){B.aura=4;addLog(`${nm}의 축복 — 3턴간 주인공 공격력 1.2배`);}
        else allyHit(8+lv*2.5,`${nm}의 묵주 일격`,0.5);
        break;
      case 'monk_ward':
        if(B.charging&&!B.ward){B.ward=true;addLog(`${nm}의 결계 — 다음 적 공격 피해 절반`);}
        else allyHit(8+lv*2.5,`${nm}의 지팡이`,0.5);
        break;
      case 'monk_holy': allyHit(8+lv*2.8,`${nm}의 성수 투척`,0);break;
      case 'salvation': // 천사의 구원: 균형 잡힌 전투력 + 방어적 오라
        if(B.charging&&!B.ward){B.ward=true;addLog(`${nm}의 구원의 오라 — 다음 적 공격 피해 절반`);}
        else allyHit(10+lv*3,`${nm}의 구원의 일격`,0.5);
        break;
      case 'sight': // 박아영의 투시
        if(!B.weak){B.weak=3;addLog(`${nm}의 투시 — 적의 약점을 꿰뚫어 봤다 (적 방어력 절반)`);}
        else allyHit(10+lv*3,`${nm}의 간파 일격`,0);
        break;
      case 'basic': allyHit(10+lv*3,`${nm}의 공격`,0.5);break;
      case 'twin': // 비스타 부제: 쌍검 2연격 · 마무리 일격
        if(e.hp<e.maxHp*0.3)allyHit(14+lv*3.6,`${nm}의 마무리 일격`,0);
        else{allyHit(6+lv*1.8,`${nm}의 쌍검 ①`,0.5);if(e.hp>0)allyHit(6+lv*1.8,`${nm}의 쌍검 ②`,0.5);}
        break;
      case 'guard': // 비르안 부제: 수호의 기도
        if(P.hp<P.maxHp*0.5&&!B.ward){B.ward=true;addLog(`${nm}의 수호의 기도 — 다음 적 공격 피해 절반`);heal(0.06,`${nm}의 수호의 기도`,0.5);}
        else allyHit(9+lv*2.8,`${nm}의 방패 강타`,0.4);
        break;
      case 'chant': // 사라 부제: 정화·치유의 성가
        if(B.dot){addLog(`${nm}의 정화의 성가 — ${B.dot.name} 제거`);B.dot=null;}
        else if(B.curse){B.curse=0;addLog(`${nm}의 정화의 성가 — 방어력 감소 제거`);}
        else if(P.hp<P.maxHp*0.7)heal(0.12,`${nm}의 치유의 성가`,0.5);
        else allyHit(7+lv*2.4,`${nm}의 빛의 음표`,0.5);
        break;
      case 'curse': // 구원의 계보에서 배제 — 저주의 힘
        if(!B.hex){B.hex=3;addLog(`${nm}의 저주 — 3턴간 적 공격력 감소`);}
        else allyHit(7+lv*2.5,`${nm}의 저주의 일격`,0.5);
        break;
      case 'dominion': // 천사의 지배 / 신의 은총(위급할 때 단 한 번)
        if(!B.agatoUsed&&P.hp<P.maxHp*0.3){
          B.agatoUsed=true;allyHit(40+lv*12,`${nm} — 신의 은총`,0);B.stun[id]=2;B.stunWhy[id]='신의 은총의 대가';
          addLog(`${nm} — 대가를 치르며 무릎을 꿇는다 (2턴간 행동 불가)`);
        }else allyHit(11+lv*3.2,`${nm}의 지배 — 빛의 절단`,0);
        break;
      case 'grace': allyHit(4+lv*4.6,`${nm}의 은총`,0.5);break;
      case 'seju':
        if(P.hp<P.maxHp*0.4)heal(0.15,`${nm}의 의지 — 보호의 오라`);
        else if(Math.random()<0.08){allyHit((8+lv*4)*3,`${nm}의 눈동자가 검게 물든다 — 은총 폭주`,0.5);if(isMyth(id))addLog(`🔱 구원자의 눈 — ${nm}은(는) 이성을 잃지 않는다`);else{B.stun[id]=1;B.stunWhy[id]='이성 상실';}}
        else allyHit(8+lv*4,`${nm}의 은총`,0.5);
        break;
      case 'talisman': // 카르마: 시야 차단 부적 (실시간 부적은 karmaTick)
        if(!B.blind){B.blind=3;addLog(`${nm}의 봉인 부적 — 적의 시야를 가렸다 (3턴간 적 공격 35% 빗나감)`);}
        else allyHit(10+lv*3.8,`${nm}의 부적 투척`,0.3);
        break;
      case 'earth':{ // 다니안: 대검 · 무력화 · 회피
        B.danT++;
        if(!B.negate&&(B.charging||B.danT%4===0)){B.negate=1;addLog(`${nm}의 대지 분쇄 — 대지가 갈라져 다음 적 공격을 무력화한다`);}
        else allyHit(14+lv*4.4,`${nm}의 대검 — 대지 가르기`,isMyth(id)?0:0.5);
        break;}
      case 'flower': // 엘리아: 꽃의 보호막 · 속박
        if(B.eliaCD>0)B.eliaCD--;
        if(!B.ashield){
          B.shield=Math.round((P.maxHp*0.08+lv*2)*m);B.ashield=2;
          addLog(`${nm} — 색이 다른 꽃들이 피어나 보호막을 펼친다 (주인공 ${B.shield} 흡수 · 동료 피해 절반, 2턴)`);
          if(isMyth(id))heal(0.08,`🔱 사계의 화원`);
        }else if(B.eliaCD<=0&&!B.sealed){B.sealed=isMyth(id)?2:1;B.eliaCD=4;addLog(`${nm}의 꽃의 속박 — 덩굴과 꽃이 적을 휘감았다 (${B.sealed}턴간 행동 불가)`);}
        else allyHit(8+lv*3.4,`${nm}의 꽃잎 폭풍`,0.5);
        break;
      case 'fixed':{ // 파스리: 10초 대기 후 방어 무시 고정 피해
        const left=Math.ceil((10000-(Date.now()-(B.startAt||Date.now())))/1000);
        if(left>0){addLog(`${nm} — 등불에 힘을 모으는 중… (${left}초 남음)`);break;}
        const d=allyHit(20+lv*6,`${nm}의 등불 — 고정 피해`,0,true);
        if(d&&isMyth(id)&&e.hp>0){B.ebleed={dmg:Math.max(1,Math.round(d*0.3)),turns:3};addLog(`🩸 피의 등불 — ${e.name} 출혈 (3턴)`);}
        break;}
      case 'storm': // 키리에: 폭풍(5초 치명타 2배) · 깃털 칼날
        if(!stormOn()){B.stormUntil=Date.now()+5000;addLog(`${nm}의 날갯짓 — 폭풍이 몰아친다! 5초 동안 주인공 치명타 확률 2배`);queueFx('player','🌪 치명타×2','mpf');}
        else allyHit(11+lv*3.8,`${nm}의 깃털 칼날`,0.4);
        break;
      case 'purify':{ // 미카엘: 디버프 제거 + 현재 HP 절반 방어막
        if(B.mikaCD>0)B.mikaCD--;
        const debuffs=[];
        if(B.curse){debuffs.push('방어력 감소');B.curse=0;}
        if(B.dot){debuffs.push(B.dot.name);B.dot=null;}
        if(B.silence){debuffs.push('봉인');B.silence=0;}
        if(B.healCut){debuffs.push('회복 감소');B.healCut=0;}
        partyIds().forEach(x=>{if(B.stun[x]>0&&B.stunWhy[x]==='불화'){B.stun[x]=0;debuffs.push(`${ALLIES[x].name} 불화`);}});
        if(debuffs.length||(B.mikaCD<=0&&!B.mshield)){
          if(B.mikaCD<=0){
            const sh=Math.max(1,Math.round(P.hp*(isMyth(id)?1:0.5)));B.mshield=Math.max(B.mshield||0,sh);B.mikaCD=isMyth(id)?2:3;
            addLog(`${nm}의 정화 — ${debuffs.length?debuffs.join(', ')+' 제거 · ':''}방어막 ${B.mshield}`);queueFx('player','🛡'+B.mshield,'mpf');
          }else addLog(`${nm}의 정화 — ${debuffs.join(', ')} 제거`);
        }else allyHit(10+lv*3.6,`${nm}의 날개 베기`,0.4);
        break;}
      case 'prism':{ // 세이렌: 보석 광선 · 프리즘 굴절 반사
        B.sirenT++;
        if(!B.prism&&(B.charging||B.sirenT%3===0)){B.prism=1;B.prismM=m*(isMyth(id)?2:1);addLog(`${nm}의 프리즘 굴절 — 다음 적 공격의 절반을 굴절시켜 되돌린다`);}
        else allyHit(12+lv*4.2,`${nm}의 보석 광선`,isMyth(id)?0:0.3);
        break;}
      case 'asiris': // 신의 은총: 짧은 기적, 반드시 대가
        allyHit(30+lv*9,`${nm} — 신의 은총`,0);
        if(e.hp>0){B.sealed=Math.max(B.sealed,1);addLog(`${nm}의 봉인 — 적이 1턴간 움직일 수 없다`);}
        {const t=isMyth(id)?1:2;B.stun[id]=t;B.stunWhy[id]='기적의 대가';addLog(`${nm} — 기적의 대가로 ${t}턴간 행동 불가`);}
        break;
    }
  }
}

function hitPlayer(mult,label){
  const e=B.e;
  if(inParty('guseju')&&!(B.stun&&B.stun.guseju)&&Math.random()<(isMyth('guseju')?0.25:0.15)){
    addLog(`${label} — 구세주의 예지로 공격을 피했다!`);queueFx('player','MISS','mpf');return 0;
  }
  if(inParty('danian')&&isMyth('danian')&&!(B.stun&&B.stun.danian)&&B.ahp.danian&&B.ahp.danian.hp>0&&Math.random()<0.2){
    addLog(`${label} — 🔱 천지개벽: 다니안이 공격을 쳐냈다!`);queueFx('player','MISS','mpf');return 0;
  }
  if(B.blind&&Math.random()<0.35){addLog(`${label} — 📜 시야가 가려진 적의 공격이 빗나갔다!`);queueFx('player','MISS','mpf');return 0;}
  if(B.negate){addLog(`${label} — 🗡 갈라진 대지에 막혀 무력화됐다!`);queueFx('player','무력화','mpf');return 0;}
  const def=P.def*(B.curse?0.6:1);
  let d=e.fixedDmg?e.atk*(1+0.2*B.rage)*(B.hex?0.8:1)*mult:(e.atk*(1+0.2*B.rage)*(B.hex?0.8:1)*mult-def/2)*rnd(0.9,1.1); // fixedDmg: 방어력 무시 고정 피해
  d=Math.max(1,Math.round(d));
  if(B.defending)d=Math.max(1,Math.round(d*0.6)); // 방어: 피해 40% 감소
  if(B.ward)d=Math.max(1,Math.round(d*0.5));
  if(B.prism){
    const r=Math.round(d*0.5*(B.prismM>=2?2:1));d=Math.max(1,d-Math.round(d*0.5));
    if(!B.immune){stat('dmg','siren',Math.min(r,e.hp));e.hp=Math.max(0,e.hp-r);addLog(`💎 프리즘 굴절 — ${e.name}에게 ${r} 반사`);queueFx('enemy','💎'+r,'dmg');}
  }
  let absorbed=0;
  if(B.shield>0){absorbed=Math.min(B.shield,d);B.shield-=absorbed;d-=absorbed;stat('heal','elia',absorbed);}
  if(B.mshield>0&&d>0){const a2=Math.min(B.mshield,d);B.mshield-=a2;d-=a2;absorbed+=a2;stat('heal','mikael',a2);}
  P.hp=Math.max(0,P.hp-d);
  addLog(`${label}! ${d} 피해${B.defending?' (방어)':''}${B.ward?' (결계)':''}${absorbed?` (🛡 보호막 ${absorbed} 흡수)`:''}`);
  queueFx('player','-'+d,'pdmg');
  if(e.bleedOnHit&&Math.random()<0.35){B.dot={name:'출혈',dmg:Math.max(5,Math.round(e.atk*0.3)),turns:3};addLog('🩸 독사의 이빨 — 출혈 (3턴)');}
  return d;
}

function act(kind,arg){
  if(!B||B.busy||B.over)return;
  const e=B.e;
  if(kind==='attack'){
    hitEnemy(1,'공격');
  }else if(kind==='skill'){
    const s=SKILLS.find(x=>x.id===arg);
    if(!s||P.mp<s.mp||B.silence)return;
    P.mp-=s.mp;
    if(s.type==='dmg'){
      hitEnemy(s.mult*(s.demonBonus&&e.demon?s.demonBonus:1),s.name);
    }else if(s.type==='heal'){
      const h=Math.min(P.maxHp-P.hp,Math.round(P.maxHp*s.pct));
      P.hp+=h;addLog(`${s.name} — HP ${h} 회복`);queueFx('player','+'+h,'heal');
    }else if(s.type==='buff'){
      B.buff=4;addLog(`${s.name} — 3턴간 공격력 1.5배`);
    }
  }else if(kind==='defend'){
    B.defending=true;addLog('방어 태세를 갖췄다. (이번 턴은 공격하지 않는다)');
  }else if(kind==='item'){
    if(arg==='water'&&P.items.water>0){
      P.items.water--;const h=Math.min(P.maxHp-P.hp,Math.round(Math.max(60,P.maxHp*0.4)*healMul()));
      P.hp+=h;stat('heal','hero',h);addLog(`성수 사용 — HP ${h} 회복`);queueFx('player','+'+h,'heal');
    }else if(arg==='rosary'&&P.items.rosary>0){
      P.items.rosary--;const m=Math.min(P.maxMp-P.mp,25);
      P.mp+=m;addLog(`묵주 사용 — 성력 ${m} 회복`);queueFx('player','+'+m,'mpf');
    }else return;
  }else if(kind==='flee'){
    if(B.isBoss)return;
    if(Math.random()<0.6){
      B.busy=true;addLog('무사히 도망쳤다!');renderBattle();
      setTimeout(()=>{save();renderHub('무사히 도망쳤다.');},600);return;
    }
    addLog('도망에 실패했다!');
  }
  if(e.hp>0&&kind==='attack')alliesAct(); // 동료는 '공격'을 누른 턴에만 행동
  if(e.hp<=0&&e.berserk&&!B.berserked)e.hp=1; // 폭주 전에는 쓰러지지 않음
  B.menu='main';B.busy=true;
  if(P.hp<=0&&e.hp>0){P.hp=0;B.over=true;renderBattle();setTimeout(defeat,900);return;}
  renderBattle();
  if(e.hp<=0){setTimeout(victory,750);return;}
  if(checkPhase())return;
  setTimeout(enemyTurn,750);
}

function checkPhase(){
  const e=B.e;
  if(e.berserk&&!B.berserked&&e.hp>0&&e.hp<=e.berserk.at){
    B.berserked=true;e.hp=e.berserk.to;B.charging=false;B.chargeKind=null;
    e.moves=[...e.moves,{t:'bleedstorm',n:'무수한 출혈 참격',hits:8,m:0.25},{t:'bleedstorm',n:'무수한 출혈 참격',hits:8,m:0.25}];
    addLog(`💢 ${e.name}의 폭주 — 괴성과 함께 체력 ${fmt(e.berserk.to)}까지 회복!`);
    document.body.classList.add('flash');setTimeout(()=>document.body.classList.remove('flash'),400);
    showStory(`<div class="sum s5"><div class="sum-title">폭주</div><div class="intro-art berserk">${bossSVG(e.art)}</div><div class="sum-name">${e.name}</div><p class="sum-desc" style="color:#ffb0b0">${esc(e.berserk.line).replace(/\n/g,'<br>')}</p></div>`,
      ()=>{renderBattle();setTimeout(()=>enemyTurnForced({t:'bleedstorm',n:'무수한 출혈 참격',hits:8,m:0.25}),500);},true);
    return true;
  }
  if(e.rage&&!B.raged&&e.hp>0&&e.hp<=e.maxHp/2){
    B.raged=true;e.atk=Math.round(e.atk*2);e.art=e.rage.art;B.charging=false;B.chargeKind=null;
    addLog(`💢 ${e.name}의 발악 — 공격력 2배!`);
    showStory(`<div class="sum s5"><div class="sum-title">발악</div><div class="intro-art">${portraitHTML(e.rage.art,'big')}</div><div class="sum-name">${e.name}</div><p class="sum-desc" style="color:#ffb0b0">${esc(e.rage.line).replace(/\n/g,'<br>')}</p></div>`,
      ()=>{renderBattle();setTimeout(enemyTurn,500);},true);
    return true;
  }
  if(B.isFinal&&B.phase===1&&e.phase2&&e.hp<=e.maxHp/2){
    const p2=e.phase2;
    B.phase=2;B.charging=false;B.chargeKind=null;B.silence=0;
    e.atk=Math.round(e.atk*p2.atkMult);e.art=p2.art;e.name=p2.name;e.moves=p2.moves;e.slashes=p2.slashes;
    addLog('나베리우스의 군단이 깨어났다! (공격력 상승 · 추격 참격 ×3)');
    showStory(`<div class="sum s5"><div class="sum-title">제2형태</div><div class="intro-art">${PORTRAIT[p2.art]?portraitHTML(p2.art,'big'):bossSVG(p2.art)}</div><div class="sum-name">${p2.name}</div><p class="sum-desc" style="color:#cdd6f0">${esc(p2.line).replace(/\n/g,'<br>')}</p></div>`,
      ()=>{renderBattle();setTimeout(enemyTurn,500);},true);
    return true;
  }
  return false;
}

let forcedMv=null;
function enemyTurnForced(mv){forcedMv=mv;enemyTurn();}
function enemyTurn(){
  if(!B||B.over||B.won)return;
  const e=B.e;let mv;
  if(forcedMv){mv=forcedMv;forcedMv=null;}
  else if(B.sealed>0){mv={t:'sealed'};B.sealed--;}
  else if(B.charging){mv={t:'release',n:B.chargeName,kind:B.chargeKind};B.charging=false;B.chargeKind=null;}
  else if(e.pvp)mv={t:'pvp',n:''};
  else if(e.tornado&&e.hp<e.maxHp*0.35&&B.tornadoCD<=0){mv={t:'charge',n:'스파크 토네이도',kind:'tornado'};B.tornadoCD=4;}
  else if(e.moves)mv=pick(e.moves);
  else mv=Math.random()<0.2?{t:'strong',n:'강타'}:{t:'atk',n:'공격'};
  const label=`${e.name} — ${mv.n}`;

  switch(mv.t){
    case 'sealed':  addLog(`${e.name} — 봉인되어 움직일 수 없다!`);break;
    case 'pvp':     pvpEnemyActs(e);break;
    case 'nullify': B.immune=2;addLog(`${label} — ⏸ 다음 턴 동안 모든 피해가 무효화된다!`);break;
    case 'reflect': B.reflect=2;addLog(`${label} — ↩ 다음 턴 동안 준 피해의 절반이 되돌아온다!`);break;
    case 'atk':     hitPlayer(1,label);break;
    case 'strong':  hitPlayer(1.5,label);break;
    case 'hellfire':hitPlayer(1.8,label);break;
    case 'release':
      if(mv.kind==='jeongyeok'){
        if(B.defending)hitPlayer(1,`${e.name}의 「전격」`);
        else{const d=Math.round(P.maxHp*0.5);P.hp=Math.max(0,P.hp-d);addLog(`${e.name}의 「전격」! 방어하지 못했다 — HP ${d} 소멸`);queueFx('player','⚡-'+d,'pdmg');}
      }else if(mv.kind==='tornado'){
        const d=Math.ceil(P.maxHp/3);P.hp=Math.max(0,P.hp-d);
        addLog(`${e.name}의 「스파크 토네이도」! 방어도 소용없다 — HP ${d} 소멸`);queueFx('player','🌪-'+d,'pdmg');
        hitAllies(0.3,'스파크 토네이도');
      }else hitPlayer(2.5,`${e.name}의 「${mv.n}」`);
      break;
    case 'multi':{
      addLog(`${label}!`);
      for(let i=0;i<mv.hits;i++)hitPlayer(mv.m,`  ${i+1}타`);
      break;}
    case 'drain':{
      const d=hitPlayer(1,label);
      const h=Math.min(e.maxHp-e.hp,Math.round(d*0.6));
      if(h>0){e.hp+=h;addLog(`적이 생명력 ${h}을 빨아들였다.`);queueFx('enemy','+'+h,'heal');}
      break;}
    case 'curse':   B.curse=3;addLog(`${label} — 3턴간 방어력 감소`);break;
    case 'silence': B.curse=Math.max(B.curse,2);addLog(`${label} — 2턴간 방어력 감소`);break;
    case 'dot':
      hitPlayer(0.6,label);
      B.dot={name:mv.dn||'부패',dmg:Math.max(3,Math.round(e.atk*0.35)),turns:3};
      addLog(`${label} — 3턴간 ${B.dot.name}`);break;
    case 'invis':   B.evade=true;addLog(`${label} — 모습을 감췄다! 다음 공격이 빗나간다`);break;
    case 'discord':{
      const c=partyIds().filter(id=>id!==FIXED&&!(B.stun[id]>0)&&B.ahp[id]&&B.ahp[id].hp>0);
      if(c.length){const id=pick(c);B.stun[id]=2;B.stunWhy[id]='불화';addLog(`${label} — ${ALLIES[id].name} 2턴간 행동 불가`);}
      else{B.curse=3;addLog(`${label} — 3턴간 방어력 감소`);}
      break;}
    case 'storm':   hitPlayer(mv.m,label);hitAllies(0.12,label);break;
    case 'bleedstorm':{
      addLog(`${label}!`);
      for(let i=0;i<mv.hits&&P.hp>0;i++)hitPlayer(mv.m,`  출혈 참격 ${i+1}`);
      hitAllies(0.12,label);
      if(P.hp>0){B.dot={name:'출혈',dmg:Math.max(5,Math.round(e.atk*0.3)),turns:4};addLog('🩸 깊은 상처 — 4턴간 출혈');}
      break;}
    case 'barrage':{
      addLog(`${label}!`);
      for(let i=0;i<mv.hits&&P.hp>0;i++)hitPlayer(mv.m,`  참격 ${i+1}`);
      hitAllies(0.08,label);
      B.healCut=3;addLog('✂ 무수한 참격의 상처 — 3턴간 주인공·동료 회복량 10% 무효');
      break;}
    case 'sweep':   hitPlayer(0.6,label);hitAllies(mv.m,label);break;
    case 'rage':
      if(B.rage<2){B.rage++;addLog(`${label} — 공격력 상승!`);}
      else hitPlayer(1.5,label);
      break;
    case 'charge':
      B.charging=true;B.chargeName=mv.n;B.chargeKind=mv.kind||null;
      addLog(mv.kind==='jeongyeok'?`⚠ ${e.name} — 「전격」 충전! 방어하지 않으면 HP 절반을 잃는다`
        :mv.kind==='tornado'?`⚠ ${e.name} — 「스파크 토네이도」의 전조! 방어해도 HP 1/3을 잃는다`
        :`⚠ ${e.name} — 「${mv.n}」 준비! 다음 턴에 방어하자.`);
      break;
  }
  // 나베리우스: 숨 쉴 틈 없는 추격 참격
  if(e.slashes&&mv.t!=='sealed'&&P.hp>0){
    for(let i=0;i<e.slashes;i++)hitPlayer(0.35,`🗡 추격 참격 ${i+1}`);
  }
  B.defending=false;B.ward=false;
  if(e.burnAll&&P.hp>0&&e.hp>0){ // 아몬: 끝없는 화상 (주인공·동료)
    if(!B.dot||B.dot.name!=='화상')B.dot={name:'화상',dmg:Math.max(5,Math.round(e.atk*0.2)),turns:99};else B.dot.turns=99;
    hitAllies(0.05,'🔥 끝없는 화상');
  }
  if(B.dot&&P.hp>0){
    P.hp=Math.max(0,P.hp-B.dot.dmg);addLog(`${B.dot.name==='화상'?'🔥':'🩸'} ${B.dot.name} — ${B.dot.dmg} 피해`);queueFx('player','-'+B.dot.dmg,'pdmg');
    if(--B.dot.turns<=0)B.dot=null;
  }
  if(B.ebleed&&e.hp>0){
    const d=B.immune?0:B.ebleed.dmg;stat('dmg','pasri',Math.min(d,e.hp));e.hp=Math.max(0,e.hp-d);addLog(`🩸 출혈 — ${e.name} ${d} 피해`);queueFx('enemy','🩸'+d,'dmg');
    if(--B.ebleed.turns<=0)B.ebleed=null;
  }
  if(B.eburn&&e.hp>0){
    const d=B.immune?0:B.eburn.dmg;stat('dmg','karma',Math.min(d,e.hp));e.hp=Math.max(0,e.hp-d);addLog(`🔥 불태움 — ${e.name} ${d} 피해`);queueFx('enemy','🔥'+d,'dmg');
    if(--B.eburn.turns<=0)B.eburn=null;
  }
  if(B.prism)B.prism--;
  if(B.negate)B.negate--;
  if(B.blind)B.blind--;
  if(B.ashield){B.ashield--;if(!B.ashield)B.shield=0;}
  if(B.tornadoCD>0)B.tornadoCD--;
  if(B.immune)B.immune--;
  if(B.healCut&&mv.t!=='barrage')B.healCut--;
  if(B.reflect)B.reflect--;
  if(B.buff)B.buff--;
  if(B.aura)B.aura--;
  if(B.hex)B.hex--;
  if(B.curse&&mv.t!=='curse')B.curse--;
  if(B.silence&&mv.t!=='silence')B.silence--;
  if(B.weak)B.weak--;
  if(P.hp<=0){P.hp=0;B.over=true;renderBattle();setTimeout(defeat,900);return;}
  if(e.hp<=0){winNow();return;}
  B.busy=false;
  renderBattle();
}

function gainXp(n){
  P.xp+=n;const msgs=[];
  while(P.xp>=need(P.lv)){
    P.xp-=need(P.lv);P.lv++;
    P.maxHp+=15;P.maxMp+=5;P.atk+=3;P.def+=2;P.hp=P.maxHp;P.mp=P.maxMp;
    msgs.push(`⬆ 레벨 ${P.lv} 달성! (HP 완전 회복)`);
  }
  return msgs;
}

function victory(){
  if(!B)return;
  if(B.pvp){pvpEnd(true);return;}
  const e=B.e,area=B.area,stype=B.stype,stage=B.stage,wasFinal=B.isFinal,fromHunt=!!B.spec.hunt;
  const tName=B.baseName;
  B.over=true;
  const firstClear=!fromHunt&&stage>P.prog[area];
  const gold=e.goldFirst?(firstClear?e.goldFirst:e.goldRepeat):B.isBoss?Math.round(e.gold*BOSS_GOLD_MULT):e.gold;
  P.gold+=gold;
  P.kills[tName]=(P.kills[tName]||0)+1;
  P.wins[area]=(P.wins[area]||0)+1;
  let extra=[];
  if(stype==='normal'&&Math.random()<0.15){P.items.water++;extra.push('성수 획득');}
  if(stype==='normal'&&Math.random()<DROP.stoneNormal){P.items.stone++;extra.push(`${AWAKEN_ITEM.icon} 희귀 아이템 「${AWAKEN_ITEM.name}」 획득!`);}
  const first=!fromHunt&&stage>P.prog[area];
  if(first){
    P.prog[area]=stage;
    if(stype==='normal'){P.gold+=e.gold;extra.push(`🏁 첫 클리어 보너스 +${e.gold} G`);}
    if(stype==='elite'){P.tickets+=1;extra.push('🏁 첫 클리어: 🎫 소환권 ×1');}
    if(stype==='mid'){P.tickets+=2;extra.push('🏁 첫 클리어: 🎫 소환권 ×2');}
    if(stype==='boss'){P.tickets+=3;extra.push('🏁 첫 클리어: 🎫 소환권 ×3');}
  }
  // 희귀 유물: 확률 드롭 (재도전으로 다시 노릴 수 있음)
  if(stype==='mid'&&Math.random()<DROP.stoneMid){P.items.stone++;extra.push(`${AWAKEN_ITEM.icon} 희귀 아이템 「${AWAKEN_ITEM.name}」 획득!`);}
  if(stype==='boss'){
    if(Math.random()<DROP.stoneBoss){P.items.stone++;extra.push(`${AWAKEN_ITEM.icon} 희귀 아이템 「${AWAKEN_ITEM.name}」 획득!`);}
    const d=AREAS[area].boss.drop;
    if(d&&!P.relics.includes(d)){
      if(Math.random()<DROP.seal){gainRelic(d);extra.push(`${RELICS[d].icon} 희귀 유물 「${RELICS[d].name}」 획득! (${RELICS[d].desc})`);}
      else extra.push(`인장은 손에 넣지 못했다… (획득 확률 ${DROP.seal*100}% · 재도전 가능)`);
    }
  }
  const allyUps=[];
  partyIds().forEach(id=>{if(allyGainXp(id,e.xp))allyUps.push(`${ALLIES[id].name} Lv ${aData(id).lv}`);});
  const ups=gainXp(e.xp);
  if(allyUps.length)ups.push('🤝 동료 레벨업: '+allyUps.join(', '));
  let msg=`<b>${esc(tName)} 처치!</b> EXP +${e.xp} · ${fmt(gold)} G${e.goldFirst?(firstClear?' (첫 클리어 보상)':' (재도전 보상)'):gold!==e.gold?' (보스 보너스 ×1.25)':''}`;
  if(extra.length)msg+='<br>'+extra.join('<br>');
  if(ups.length)msg+='<br>'+ups.join('<br>');
  const report=stype==='boss'?{st:B.st,party:partyIds().slice(),name:tName,area}:null;
  clearBattle();
  if(report){battleReport(report,()=>victoryFlow(area,stype,first,wasFinal,fromHunt,msg,stage));return;}
  victoryFlow(area,stype,first,wasFinal,fromHunt,msg,stage);
}
function victoryFlow(area,stype,first,wasFinal,fromHunt,msg,stage){
  if(stype==='boss'&&first){
    P.cleared[area]=true;
    if(wasFinal){
      P.ended=true;P.unlocked=Math.max(P.unlocked,area+1);P.cur=area+1;save();
      storyChain([ENDING,AREAS[area+1].intro],()=>renderMap(area+1,msg+`<br>✝ 나베리우스 토벌 완료!<br>🔓 새 지역 개방: ${AREAS[area+1].flag} ${AREAS[area+1].name}`));
      return;
    }
    if(area>=AREAS.length-1){save();storyChain([AREAS[area].outro],()=>renderMap(area,msg));return;}
    P.unlocked=Math.max(P.unlocked,area+1);
    P.cur=area+1;save();
    storyChain([AREAS[area].outro,AREAS[area+1].intro],
      ()=>renderMap(area+1,msg+`<br>🔓 새 나라 개방: ${AREAS[area+1].flag} ${AREAS[area+1].name}`));
    return;
  }
  save();
  if(fromHunt)renderHub(msg);
  else if(first&&stage<STAGES){mapSel={a:area,s:stage+1};autoNext(area,stage+1,msg);}
  else renderMap(area,msg);
}
/* 나라 보스 처치 리포트: 딜·힐 그래프 */
function battleReport(r,cb){
  const who=['hero',...r.party];
  const nm=w=>w==='hero'?esc(P.name):ALLIES[w].name;
  const ic=w=>w==='hero'?'<span class="aemo xs">✝</span>':allyFace(w,'xs');
  const chart=(kind,cls)=>{
    const rows=who.map(w=>({w,v:r.st[kind][w]||0})).sort((a,b)=>b.v-a.v);
    const tot=rows.reduce((s,x)=>s+x.v,0),mx=Math.max(1,...rows.map(x=>x.v));
    return `<div class="rp-tot">합계 <b>${fmt(tot)}</b></div>`+rows.map(x=>`<div class="rp-row"><div class="rp-nm">${ic(x.w)}<span>${nm(x.w)}</span></div>
      <div class="rp-bar"><i class="${cls}" style="width:${(x.v/mx*100).toFixed(1)}%"></i></div>
      <div class="rp-v">${fmt(x.v)}<small>${tot?Math.round(x.v/tot*100):0}%</small></div></div>`).join('');
  };
  showStory(`<div class="report"><div class="sum-title">📊 ${AREAS[r.area].flag} ${esc(r.name)} 토벌 기록</div>
    <div class="rp-h">⚔ 준 피해</div>${chart('dmg','d')}
    <div class="rp-h">✚ 회복 · 보호</div>${chart('heal','h')}
    <div class="small rp-note">회복에는 성수 사용, 엘리아·미카엘의 보호막 흡수량, 키리에의 부활이 포함됩니다.</div></div>`,cb,true);
}
/* 최초 클리어 → 다음 스테이지 자동 출전 (3초, 취소 가능) */
let autoT=null;
function autoNext(a,s,msg){
  renderMap(a);
  let n=3;const t=stageType(s);
  $('#mtext').innerHTML=`<div class="autonext"><div class="sum-title">🏁 스테이지 클리어</div><div class="notice">${msg}</div>
    <div class="anext">다음 → <b>${s}. ${stageName(a,s)}</b> <span class="tag ${t==='normal'?'done':t==='elite'?'item':'t-ally'}">${STYPE_LABEL[t]}</span>
    <div class="small">HP ${P.hp}/${P.maxHp} · 성수 ${P.items.water}</div></div>
    <button class="btn" id="anstop">🗺 멈추고 지도로</button></div>`;
  const lbl=()=>`▶ 바로 출전 (${n}초 후 자동)`;
  $('#mbtn').textContent=lbl();
  $('#modal').classList.remove('hidden');
  const go=()=>{clearInterval(autoT);autoT=null;$('#modal').classList.add('hidden');startBattle({area:a,stage:s});};
  $('#mbtn').onclick=go;
  $('#anstop').onclick=()=>{clearInterval(autoT);autoT=null;$('#modal').classList.add('hidden');renderMap(a,msg);};
  clearInterval(autoT);
  autoT=setInterval(()=>{n--;if(n<=0)go();else $('#mbtn').textContent=lbl();},1000);
}

function defeat(){
  if(B&&B.pvp){pvpEnd(false);return;}
  clearBattle();
  const lost=Math.floor(P.gold/2);
  P.gold-=lost;P.hp=Math.round(P.maxHp*0.5);P.mp=Math.round(P.maxMp*0.5);save();
  showStory(`눈앞이 어두워진다…\n\n교구의 사제들이 쓰러진 {name}을(를) 성당으로 옮겼다.\n\n(소지금 ${lost} G를 잃었다)`,()=>renderHub('정신을 차렸다. 성당에서 휴식하고 다시 도전하자.'));
}

/* ===================== 지도 ===================== */
let mapSel=null;
function renderMap(a,msg){
  if(a==null)a=P.cur;
  P.cur=a;
  const ar=AREAS[a],prog=P.prog[a];
  if(mapSel==null||mapSel.a!==a)mapSel={a,s:Math.min(STAGES,prog+1)};
  const X=[50,74,82,66,42,22,18,34,58,78,80,60,38,22,46];
  const ROW=74,H=STAGES*ROW+30;
  const pts=[];let nodes='';
  for(let s=1;s<=STAGES;s++){
    const x=X[s-1],y=(STAGES-s)*ROW+40;pts.push(`${x},${y}`);
    const t=stageType(s),state=s<=prog?'done':s===prog+1?'next':'lock';
    const label=t==='boss'?'☠':t==='mid'?'✠':t==='elite'?'⚔':s;
    nodes+=`<button class="node ${t} ${state} ${mapSel.s===s?'sel':''}" data-st="${s}" style="left:${x}%;top:${y}px" ${state==='lock'?'disabled':''}>${state==='done'&&t==='normal'?'✔':label}</button>`;
  }
  const s=mapSel.s,t=stageType(s),open=s<=prog+1;
  const art=(t==='boss'||t==='mid')?`<div class="sheet-art">${PORTRAIT[(t==='boss'?ar.boss:ar.mid).art]?portraitHTML((t==='boss'?ar.boss:ar.mid).art,'small'):bossSVG((t==='boss'?ar.boss:ar.mid).art)}</div>`:'';
  $('#app').innerHTML=`${statusHTML()}${topBack()}
    ${msg?`<div class="notice">${msg}</div>`:''}
    <div class="panel"><div class="ptitle">🗺 ${ar.flag} ${ar.name} <span class="small">스테이지 ${prog}/${STAGES}</span></div>
      <div class="mapwrap" style="--gc:${ar.glow}"><div class="map" style="height:${H}px">
        <svg class="mapline" viewBox="0 0 100 ${H}" preserveAspectRatio="none"><polyline points="${pts.join(' ')}" vector-effect="non-scaling-stroke"/></svg>
        ${nodes}
      </div></div>
    </div>
    <div class="panel sheet">
      ${art}
      <div class="ptitle">${s}. ${stageName(a,s)} <span class="tag ${t==='normal'?'done':t==='elite'?'item':'t-ally'}">${STYPE_LABEL[t]}</span></div>
      ${(t==='boss'||t==='mid')?`<div class="etitle" style="text-align:left">${(t==='boss'?ar.boss:ar.mid).title}</div>`:''}
      <div class="desc">권장 Lv ${stageRec(a,s)} · 첫 클리어 보상: ${STAGE_REWARD[t]}${s<=prog?' <span class="gold">(클리어 완료 · 재도전 가능)</span>':''}${t==='boss'&&ar.boss.drop?(P.relics.includes(ar.boss.drop)?' · 🔒 인장 보유':' · 인장 미획득'):''}</div>
      ${sortieRule(a)?(()=>{const ok=P.active.filter(id=>sortieOk(a,id)),no=P.active.filter(id=>!sortieOk(a,id));
        return `<div class="notice sortie">⚠ 출전 조건 — ${sortieRule(a).text}<br><span class="small">출전 가능: ${ok.length?ok.map(id=>ALLIES[id].name).join(', '):'없음'}${no.length?` · 출전 불가: ${no.map(id=>ALLIES[id].name).join(', ')}`:''}</span></div>`;})():''}
      <div class="grid">
        <button class="btn ${t==='boss'||t==='mid'?'danger':'primary'}" id="go" ${open?'':'disabled'}>${open?'⚔ 출전':'🔒 이전 스테이지를 먼저 클리어'}</button>
        <button class="btn" id="back">← 거점으로</button>
      </div>
    </div>`;
  document.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{mapSel={a,s:+b.dataset.st};renderMap(a);});
  $('#go').onclick=()=>startBattle({area:a,stage:s});
  $('#back').onclick=()=>renderHub();
  const sel=document.querySelector('.node.sel');
  if(sel&&!msg)sel.scrollIntoView({block:'center'});
  else window.scrollTo(0,0);
  save();
}

document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&P){try{localStorage.setItem(SAVE_KEY,JSON.stringify(P))}catch(e){}}});
renderTitle();
initCloud();

</script>
