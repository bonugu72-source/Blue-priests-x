<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<title>푸른사제들</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&family=Noto+Serif+KR:wght@700;900&display=swap" rel="stylesheet">
<style>
/* 두 번 터치·핀치 확대 방지 */
html,body{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,a,input,select,textarea,[data-act],.btn{touch-action:manipulation}

:root{
  --bg:#070b18;--panel:#101831;--panel2:#16213f;--line:#26345e;
  --text:#e6ecff;--dim:#8d9bc4;--blue:#4da3ff;--blue2:#2b6fd6;
  --gold:#e8c76a;--red:#e05a5a;--green:#5fd39a;--mp:#5b8cff;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:'Noto Sans KR',system-ui,sans-serif;color:var(--text);
  background:radial-gradient(ellipse at 50% -10%,#1a2d63 0%,var(--bg) 60%) fixed;
  background-color:var(--bg);user-select:none;-webkit-user-select:none;
  transition:background-color .15s;
}
body.flash{background-color:#3a0f16}
body.holyflash{background-color:#2a3550}
.trust{display:flex;flex-wrap:wrap;align-items:center;gap:2px 6px;margin:3px 0 2px}.trust .hearts{font-size:11px;letter-spacing:-1px;white-space:nowrap}
.awkc{display:block;font-size:11px;opacity:.85;margin-top:2px}.awkc.ready{color:#ffe08a;opacity:1;font-weight:700}
#app{max-width:480px;margin:0 auto;padding:12px 12px 24px;min-height:100dvh;display:flex;flex-direction:column;gap:10px}
button{font-family:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default}

/* Title */
.title{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:20px 8px}
.cross{font-size:54px;color:var(--blue);text-shadow:0 0 24px var(--blue),0 0 60px var(--blue2);animation:pulse 3s ease-in-out infinite}
.title h1{font-family:'Noto Serif KR',serif;font-weight:900;font-size:44px;letter-spacing:4px;
  background:linear-gradient(180deg,#eaf3ff,#6fb6ff 60%,#2b6fd6);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 12px rgba(77,163,255,.45))}
.sub{color:var(--dim);letter-spacing:6px;font-size:12px;margin-top:-8px}
.title input{width:100%;max-width:280px;margin-top:18px;padding:14px;border-radius:12px;border:1px solid var(--line);
  background:var(--panel);color:var(--text);font-size:17px;text-align:center;font-family:inherit;outline:none}
.title input:focus{border-color:var(--blue)}
.title .btn{width:100%;max-width:280px}
.hint{color:var(--dim);font-size:12px;line-height:1.6}
@keyframes pulse{50%{opacity:.6;transform:scale(.96)}}

/* Buttons */
.btn{min-height:52px;padding:10px 12px;border-radius:12px;border:none;background:#1a2444;
  font-size:15px;font-weight:700;transition:transform .08s,background .15s}
.btn:active:not(:disabled){transform:scale(.97)}
.btn.primary{background:#2f5fae}
.btn.danger{background:#6a2a36}
.btn:disabled{opacity:.42}
.btn small{display:block;font-weight:400;font-size:11px;color:#c5d2f5;opacity:.85;margin-top:2px}
/* 메뉴 성격별 색상 (거점 화면) */
.btn.m-adv{background:#223a63}.btn.m-adv small{color:#b4c9ec}
.btn.m-adv.main{background:#2d5290}
.rankrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;grid-column:1/-1}
.btn.m-gg{background:linear-gradient(135deg,#2c3a1e,#1e2a44);border-color:rgba(190,230,140,.4)}.btn.m-gg small{color:#cfe6a8}
.ggnew{display:inline-block;font-size:11px;font-weight:700;color:#1a1200;background:var(--gold);border-radius:9px;padding:1px 7px;margin-left:4px;vertical-align:middle}
.btn.m-tower{background:linear-gradient(135deg,#123a4a,#2a1a4e);border-color:rgba(140,220,255,.45)}.btn.m-tower small{color:#a8e6ff}
.tlad{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;margin:10px 0}.tlad span{font-size:10px;text-align:center;padding:4px 0;border-radius:6px;background:rgba(255,255,255,.05);opacity:.5}.tlad span.done{opacity:.95;background:rgba(120,220,255,.16)}.tlad span.on{opacity:1;background:rgba(255,210,110,.25);box-shadow:0 0 0 1px rgba(255,210,110,.6) inset}.tlad span.mid{color:#d9a8ff}.tlad span.bos{color:#ff9a8a;font-weight:700}
.btn.m-rank{background:linear-gradient(135deg,#4a2a0e,#2a1a3e);border-color:rgba(255,200,90,.45)}.btn.m-rank small{color:#ffd99a}
.rankbadge{text-align:center;padding:10px 0 4px}.rankbadge .ri{font-size:56px;line-height:1.1;filter:drop-shadow(0 0 14px var(--rc))}.rankbadge b{display:block;font-size:24px;color:var(--rc);margin-top:4px}
.ranklad{display:flex;justify-content:space-between;gap:2px;margin:10px 0}.ranklad span{flex:1;min-width:0;text-align:center;font-size:10px;letter-spacing:-.5px;padding:5px 0;border-radius:8px;background:rgba(255,255,255,.05);opacity:.55}.ranklad span.on{opacity:1;background:rgba(255,210,110,.18);box-shadow:0 0 0 1px rgba(255,210,110,.5) inset}.ranklad span.done{opacity:.9}
.btn.m-rest{background:#1f3b34}.btn.m-rest small{color:#a6cfbd}
.btn.m-forest{background:linear-gradient(135deg,#1e4a22,#3a5a1a);border-color:rgba(150,230,120,.45)}.btn.m-forest small{color:#c8f0a8}
.ftree{position:relative;padding:6px 0 10px;margin:8px 0}
.ftree:before{content:'';position:absolute;left:50%;top:46px;bottom:34px;width:16px;margin-left:-8px;background:linear-gradient(90deg,#4a321c,#7a5530 45%,#4a321c);border-radius:8px;box-shadow:0 0 12px rgba(0,0,0,.5)}
.fcrown{text-align:center;font-size:44px;line-height:1;position:relative;filter:drop-shadow(0 0 10px rgba(120,220,90,.5))}
.froot{text-align:center;font-size:22px;position:relative;letter-spacing:6px}
.trow{display:flex;align-items:center;min-height:50px;position:relative}
.trow.l{justify-content:flex-start}.trow.r{justify-content:flex-end}
.fnode{width:43%;box-sizing:border-box;padding:6px 8px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);font-size:11.5px;position:relative;opacity:.55;line-height:1.3}
.fnode b{font-size:12.5px}.fnode .fn{font-size:10px;opacity:.8}
.trow.l .fnode:after,.trow.r .fnode:after{content:'';position:absolute;top:50%;height:5px;margin-top:-2px;width:16%;background:#6b4a2a;border-radius:3px}
.trow.l .fnode:after{left:100%}.trow.r .fnode:after{right:100%}
.fnode.done{opacity:1;background:rgba(60,140,60,.28);border-color:rgba(140,230,120,.5)}
.fnode.on{opacity:1;background:rgba(255,210,90,.18);border-color:#ffd25a;box-shadow:0 0 14px rgba(255,210,90,.55)}
.fnode.realm{border-style:dashed}
.fclimber{position:absolute;top:-14px;right:-6px;font-size:22px;filter:drop-shadow(0 0 6px rgba(255,220,120,.8))}
.fnode.climb .fclimber{animation:fclimb 1.1s ease-out}
@keyframes fclimb{0%{transform:translateY(54px);opacity:.2}60%{transform:translateY(-6px);opacity:1}100%{transform:none}}
.fpick{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0}
.fpick button{position:relative;padding:6px 2px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);color:inherit;font-size:10.5px;display:flex;flex-direction:column;align-items:center;gap:3px}
.fpick button.sel{border-color:#ffd25a;background:rgba(255,210,90,.16);box-shadow:0 0 10px rgba(255,210,90,.4)}
.fpick button.ban{opacity:.45;filter:grayscale(.7)}.fpick button.ban.sel{opacity:1;border-color:#ff5a5a;box-shadow:0 0 10px rgba(255,90,90,.45)}
.fpick button .fno{position:absolute;top:2px;left:4px;font-weight:700;color:#ffd25a;font-size:12px}
.btn.m-shop{background:#3e3322}.btn.m-shop small{color:#dcc493}
.btn.m-coll{background:#322b4a}.btn.m-coll small{color:#c4b6e6}
.btn.m-ally{background:#3d2a35}.btn.m-ally small{color:#e2b9c8}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid .full{grid-column:1/-1}
.link{background:none;border:none;color:var(--dim);font-size:13px;text-decoration:underline;padding:8px}
.foot{text-align:center}

/* Status */
.status{background:var(--panel);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.row b{font-size:16px}
.small{font-size:12px;color:var(--dim)}
.gold{color:var(--gold);font-weight:700}
.bar{position:relative;height:18px;border-radius:9px;background:#0a1024;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:9px;transition:width .35s ease}
.bar span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;text-shadow:0 1px 2px #000}
.bar.hp i{background:linear-gradient(90deg,#c43c4c,#ef6a6a)}
.bar.mp i{background:linear-gradient(90deg,#3462d9,#6f9cff)}
.bar.xp{height:10px}.bar.xp i{background:linear-gradient(90deg,#b8933a,#f0d27a)}.bar.xp span{font-size:8px}
.bar.ehp{height:14px;width:100%}.bar.ehp i{background:linear-gradient(90deg,#8e2a3a,#d84c5c)}

/* Panels */
.panel{background:var(--panel);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.ptitle{font-family:'Noto Serif KR',serif;font-size:17px;color:#cfe3ff}
.desc{font-size:13px;color:var(--dim);line-height:1.6}
.notice{background:#14244a;border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.7}
.area{display:flex;justify-content:space-between;align-items:center;padding:11px 12px;border-radius:10px;border:1px solid transparent;
  background:#0c1329;font-size:14px;text-align:left}
.area.on{border-color:#3d6fb8;background:#14264d}
.area.lock{opacity:.4}
.shopitem{display:flex;justify-content:space-between;align-items:center;gap:10px}
.shopitem .info{font-size:14px}.shopitem .info small{display:block;color:var(--dim);font-size:12px;margin-top:2px}
.shopitem .btn{min-height:42px;min-width:92px;font-size:14px}

/* Battle */
.enemy{background:linear-gradient(180deg,#121b38,#0b1126);border:1px solid transparent;border-radius:16px;padding:14px 14px 12px;
  display:flex;flex-direction:column;align-items:center;gap:8px;position:relative;overflow:hidden}
.enemy.boss{border-color:#7a2a3a;background:linear-gradient(180deg,#24101c,#0d0a18)}
.ename{font-family:'Noto Serif KR',serif;font-size:18px}
.ename em{font-style:normal;font-family:'Noto Sans KR';font-size:10px;font-weight:700;background:var(--red);border-radius:4px;padding:2px 5px;vertical-align:middle;margin-left:4px}
.eicon{font-size:86px;line-height:1.1;filter:drop-shadow(0 0 18px rgba(120,160,255,.35));animation:float 3s ease-in-out infinite}
.boss .eicon{filter:drop-shadow(0 0 22px rgba(224,90,90,.6))}
.eicon.charge{animation:charge .5s ease-in-out infinite}
.eicon.hit{animation:hit .35s}
.estat{font-size:12px;color:#ffb36b;min-height:16px;font-weight:700}
.pstat{font-size:12px;color:var(--green);text-align:center;min-height:16px}
@keyframes float{50%{transform:translateY(-6px)}}
@keyframes charge{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes hit{0%{transform:translateX(0)}20%{transform:translateX(-10px);filter:brightness(2.5)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}100%{transform:translateX(0)}}
.log{background:#080d1e;border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.65;min-height:128px;display:flex;flex-direction:column;justify-content:flex-end}
.log div{color:var(--dim)}
.log div:last-child{color:var(--text)}
.cmds .btn{min-height:54px}

.eicon.shadow{filter:brightness(.18) drop-shadow(0 0 18px rgba(224,90,90,.8))}
.eicon.triple{font-size:58px;letter-spacing:-8px}
.eflag{font-size:11px;color:var(--dim);letter-spacing:1px}
.party{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chip{font-size:12px;background:#17264a;border-radius:20px;padding:4px 10px}
.mission{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px;border-radius:10px;background:#0c1329}
.mission .info{font-size:14px;flex:1}.mission .info small{display:block;color:var(--dim);font-size:12px;margin-top:3px;line-height:1.5}
.mission .btn{min-height:40px;font-size:13px;min-width:86px}
.tag{font-size:10px;font-weight:700;border-radius:4px;padding:1px 5px;margin-right:4px;vertical-align:middle}
.tag.t-ally{background:#2b6fd6}.tag.item{background:#8a6a1f}.tag.done{background:#2f6b4c}
.ally{display:flex;gap:10px;align-items:center;font-size:14px}
.ally .ic{font-size:26px;width:36px;text-align:center}
.ally small{display:block;color:var(--dim);font-size:12px;line-height:1.5}
.ally.locked{opacity:.5}

/* Summon */
.sum{text-align:center;font-family:'Noto Sans KR',sans-serif}
.sum-stars{font-size:30px;color:var(--gold);letter-spacing:4px;text-shadow:0 0 14px rgba(232,199,106,.7)}
.sum-icon{font-size:76px;margin:6px 0;animation:pop .5s ease-out}
.sum.s3 .sum-icon{filter:drop-shadow(0 0 18px var(--blue))}
.sum.s2 .sum-icon{filter:drop-shadow(0 0 10px #8fb0ff)}
.sum-name{font-family:'Noto Serif KR',serif;font-size:22px;font-weight:900}
.sum-desc{font-size:13px;color:var(--dim);line-height:1.6;margin:10px 0}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}

.sum-title{font-size:13px;color:var(--dim);margin-bottom:6px}
.sumgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:8px 0 4px}
.sumcell{background:#0d1530;border:1px solid transparent;border-radius:10px;padding:6px 2px;position:relative;animation:pop .4s ease-out both}
.sumcell .ic{font-size:26px}.sumcell .st{font-size:9px;color:var(--gold);letter-spacing:-1px}.sumcell .nm{font-size:9px;line-height:1.2;word-break:keep-all}
.sumcell.s3{border-color:#4da3ff}.sumcell.s4{border-color:#b07cff;box-shadow:0 0 10px rgba(176,124,255,.5)}.sumcell.s5{border-color:var(--gold);box-shadow:0 0 14px rgba(232,199,106,.7)}
.sumcell .new{position:absolute;top:-6px;right:-4px;background:var(--red);font-size:8px;font-weight:700;border-radius:4px;padding:1px 3px}
.sum.s4 .sum-icon{filter:drop-shadow(0 0 20px #b07cff)}.sum.s5 .sum-icon{filter:drop-shadow(0 0 26px var(--gold))}

.acard{background:#0c1329;border:1px solid transparent;border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
.acard.fixed{background:#12204a}
.abtns{display:flex;gap:6px;flex-wrap:wrap}
.abtns .btn{min-height:36px;font-size:12px;padding:4px 10px;flex:1;white-space:nowrap}

/* Cover (title) */
body.title-mode{overflow:hidden}
.cover{position:fixed;inset:0;z-index:5;overflow:hidden;background:#05070f}
.cover .bgblur{position:absolute;inset:-10%;background:url(cover.jpg) center/cover no-repeat;filter:blur(28px) brightness(.35)}
.cover .bgwrap{position:absolute;top:0;left:50%;transform:translateX(-50%);width:min(100vw,560px);aspect-ratio:900/1304;overflow:hidden}
.cover .bgwrap::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,7,15,.7) 0%,transparent 18%,transparent 70%,#05070f 100%)}
.cover .bg{position:absolute;inset:0;background:url(cover.jpg) center top/cover no-repeat;animation:kenburns 26s ease-in-out infinite alternate}
@keyframes kenburns{from{transform:scale(1) translate(0,0)}to{transform:scale(1.07) translate(-1.2%,-1%)}}
.cover .aura{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen}
.cover .aura.blue{background:radial-gradient(circle at 76% 52%,rgba(70,130,255,.42),transparent 30%);animation:breathe 5.5s ease-in-out infinite}
.cover .aura.red{background:radial-gradient(circle at 15% 56%,rgba(255,50,60,.34),transparent 28%);animation:breathe 7s ease-in-out infinite reverse}
.cover .aura.halo{background:radial-gradient(ellipse at 64% 20%,rgba(150,190,255,.22),transparent 26%);animation:breathe 9s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.3}50%{opacity:1}}
.cover .fog{position:absolute;left:-50%;width:200%;height:46%;top:22%;pointer-events:none;
  background:radial-gradient(ellipse at 30% 50%,rgba(110,140,220,.14),transparent 55%),radial-gradient(ellipse at 75% 40%,rgba(90,120,200,.12),transparent 50%);
  filter:blur(18px);animation:drift 34s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-8%)}to{transform:translateX(8%)}}
.cover canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.cover .shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,transparent 0%,transparent 55%,rgba(5,7,15,.6) 72%,rgba(5,7,15,.9) 100%)}
.cover .vignette{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 140px rgba(0,0,0,.85)}
.cover .top{position:absolute;top:calc(22px + env(safe-area-inset-top));left:0;right:0;text-align:center;z-index:2}
.ctitle{font-family:'Noto Serif KR',serif;font-weight:900;font-size:46px;letter-spacing:6px;
  background:linear-gradient(180deg,#f2f7ff,#8cc4ff 55%,#3a7ae0);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 14px rgba(77,163,255,.55));animation:glow 4s ease-in-out infinite}
@keyframes glow{50%{filter:drop-shadow(0 0 26px rgba(120,180,255,.9))}}
.cover .sub{margin-top:2px}
.cover .ui{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:480px;z-index:2;
  padding:0 22px calc(26px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:stretch;gap:10px;animation:fadein 1.2s ease-out}
.cover input{padding:14px;border-radius:12px;border:1px solid rgba(120,160,255,.35);background:rgba(10,16,36,.72);color:var(--text);
  font-size:17px;text-align:center;font-family:inherit;outline:none;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.cover input:focus{border-color:var(--blue)}
.cover .btn{backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.cover .btn:not(.primary){background:rgba(22,33,63,.75)}
.cover .hint{text-align:center;color:#9fb0d8;text-shadow:0 1px 4px #000}
@media (prefers-reduced-motion: reduce){.cover .bg,.cover .aura,.cover .fog,.ctitle{animation:none}}

/* Demons */
.enemy.boss{background:radial-gradient(ellipse at 50% 45%,#2a0c16 0%,#0b0610 70%);border-color:#6b1f2e;box-shadow:inset 0 0 40px rgba(0,0,0,.8)}
.enemy.final{border-color:#b0203a;box-shadow:0 0 24px rgba(255,30,60,.25),inset 0 0 50px rgba(0,0,0,.9)}
.etitle{font-size:11px;color:#c79aa6;letter-spacing:1px;text-align:center;margin-top:-4px}
.epass{font-size:11px;color:#ffb0b0;font-weight:700}
.ename em.el{background:#a87a1c}
.eicon.art{animation:none;font-size:0;line-height:0}
.eicon.art.charge{animation:charge .5s ease-in-out infinite}
.eicon.sil{filter:brightness(0) drop-shadow(0 0 1.5px var(--gc)) drop-shadow(0 0 12px var(--gc))}
.eicon.sil.elite{font-size:100px}
.bsvg{width:230px;height:230px;overflow:visible;display:block}
.bsvg *{animation-delay:var(--t,0s)}
.bsvg .circle{transform-origin:100px 110px;animation:spin 48s linear infinite;opacity:.55}
.bsvg .pulse{animation:breathe 3.2s ease-in-out infinite}
.bsvg .body{animation:bob 4.5s ease-in-out infinite}
.bsvg .eyes{animation:bob 4.5s ease-in-out infinite,eyep 2.6s ease-in-out infinite}
.bsvg .wl{animation:flapL 3s ease-in-out infinite}.bsvg .wr{animation:flapR 3s ease-in-out infinite}
.bsvg .fire{animation:flick .18s steps(2) infinite alternate}
.bsvg .bolt{animation:bolt 1.7s steps(1) infinite}.bsvg .b2{animation-duration:2.3s}.bsvg .b3{animation-duration:1.3s}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bob{50%{transform:translateY(-4px)}}
@keyframes eyep{0%,100%{opacity:.75}50%{opacity:1}}
@keyframes flapL{50%{transform:rotate(-7deg)}}@keyframes flapR{50%{transform:rotate(7deg)}}
@keyframes flick{to{opacity:.7;transform:translateY(-1px) scaleY(1.04)}}
@keyframes bolt{0%,62%{opacity:0}64%,70%{opacity:1}72%,80%{opacity:0}82%,86%{opacity:1}88%{opacity:0}}
.intro-art .bsvg{width:210px;height:210px;margin:0 auto}
.sheet-art{display:flex;justify-content:center}.sheet-art .bsvg{width:170px;height:170px}
/* 스테이지 정보창: 보스 이미지를 작은 썸네일로 → 지도가 가려지지 않게 */
.sheet-head{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.sheet-head .sheet-art{flex:0 0 auto}
.sheet-head .sheet-txt{flex:1;min-width:0}
.sheet-head .sheet-txt .ptitle{margin-bottom:2px}

.chip .mhp{display:block;height:3px;background:#0a1024;border-radius:2px;margin-top:3px;overflow:hidden}
.chip .mhp b{display:block;height:100%;background:linear-gradient(90deg,#c43c4c,#ef6a6a)}
.chip.down{opacity:.35;text-decoration:line-through}
/* Boss portraits (user illustrations) */
.portrait{position:relative;width:210px;height:250px;border-radius:14px;overflow:hidden;margin:0 auto;animation:bob 4.5s ease-in-out infinite}
.portrait.big{width:250px;height:360px;animation:none}
.portrait.small{width:150px;height:180px;animation:none}
.portrait img{width:100%;height:100%;object-fit:cover;display:block}
.portrait .pglow{position:absolute;inset:0;pointer-events:none;border-radius:14px}
.portrait .pflash{position:absolute;inset:0;pointer-events:none}
.pf-furfur{box-shadow:0 0 22px rgba(120,200,255,.55),0 0 60px rgba(80,160,255,.25)}
.pf-furfur .pglow{box-shadow:inset 0 0 40px rgba(140,210,255,.55);animation:pzap 2.2s steps(1) infinite}
.pf-furfur .pflash{background:rgba(220,240,255,.85);mix-blend-mode:screen;opacity:0;animation:lflash 3.7s infinite}
.pf-furfur .prain{position:absolute;inset:-20% 0 0 0;pointer-events:none;opacity:.35;
  background:repeating-linear-gradient(100deg,transparent 0 9px,rgba(200,225,255,.55) 9px 10px,transparent 10px 22px);animation:rain .45s linear infinite}
.pbolts{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.pbolts path{fill:none;stroke:#e4f4ff;stroke-width:.8;filter:drop-shadow(0 0 3px #8fd0ff);opacity:0}
.pbolts .bolt{animation:bolt 1.9s steps(1) infinite}.pbolts .b2{animation-duration:2.6s}.pbolts .b3{animation-duration:1.4s}

.pf-merem{box-shadow:0 0 30px rgba(170,90,255,.75),0 0 90px rgba(255,200,90,.3)}

.pf-perta{box-shadow:0 0 30px rgba(220,225,255,.6),0 0 90px rgba(255,215,120,.3)}

.pf-mumyeong{box-shadow:0 0 30px rgba(160,90,255,.7),0 0 90px rgba(110,40,220,.4)}

.pf-mumyeong .pembers i{background:#b07cff;box-shadow:0 0 6px #8a4dff,0 0 12px #6a2dff}
.pembers{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.pembers i{position:absolute;bottom:-6px;width:4px;height:4px;border-radius:50%;background:#ff5a3a;box-shadow:0 0 6px #ff3a1a,0 0 12px #ff2a0a;animation:ember 3s linear infinite}
.pf-naberius.p2 .pembers i{width:5px;height:5px}
@keyframes lflash{0%,88%,100%{opacity:0}89%{opacity:.55}90%{opacity:0}92%{opacity:.35}94%{opacity:0}}
@keyframes pzap{0%,60%{opacity:.6}61%{opacity:1}75%{opacity:.7}}
@keyframes rain{to{transform:translate(-6px,22px)}}
@keyframes ember{0%{transform:translate(0,0);opacity:0}10%{opacity:1}100%{transform:translate(18px,-320px);opacity:0}}

.intro-art.berserk{animation:ragequake .25s ease-in-out infinite;filter:drop-shadow(0 0 20px #ff2a2a)}
.cdbar{height:5px;border-radius:3px;background:rgba(255,255,255,.06);margin:0 0 6px;overflow:hidden}
.cdbar i{display:block;height:100%;background:linear-gradient(90deg,#4da3ff,#9fd0ff);animation:cdshrink linear forwards}
@keyframes cdshrink{from{width:100%}to{width:0}}
.btn.guardon{background:linear-gradient(135deg,#2b6a4a,#3fae78)!important;color:#eafff3!important;opacity:1!important;box-shadow:0 0 12px rgba(63,174,120,.5)}
body:has(.status) #bgmbtn{display:none}
.bgmmini{background:none;border:none;font-size:14px;padding:0 0 0 8px;cursor:pointer;vertical-align:middle}
#bgmbtn{position:fixed;top:10px;right:10px;z-index:60;width:34px;height:34px;border-radius:50%;border:none;background:rgba(10,18,40,.75);font-size:16px;line-height:1;cursor:pointer;padding:0}
.stoast{position:fixed;left:50%;transform:translateX(-50%);z-index:999;display:flex;align-items:center;gap:10px;min-width:250px;max-width:92vw;padding:10px 16px;border-radius:14px;
  background:linear-gradient(135deg,rgba(40,70,140,.96),rgba(110,60,200,.96));border:1px solid #bfe0ff;color:#fff;box-shadow:0 0 24px rgba(140,190,255,.7),0 6px 20px rgba(0,0,0,.5);
  animation:stin .45s cubic-bezier(.2,1.4,.4,1) both;transition:opacity .5s,transform .5s}
.stoast.out{opacity:0;transform:translate(-50%,-14px)}
.stoast b{display:block;font-size:15px}
.stoast small{display:block;font-size:11px;color:#d8e6ff;margin-top:2px}
.stoast .st-ic{font-size:30px;filter:drop-shadow(0 0 8px #9fd8ff);animation:stspin 1.6s ease-in-out infinite}
@keyframes stin{from{opacity:0;transform:translate(-50%,-30px) scale(.8)}to{opacity:1;transform:translate(-50%,0) scale(1)}}
@keyframes stspin{50%{transform:scale(1.18) rotate(12deg)}}
/* 구원의 조각 알림: 금빛으로 더 반짝인다 */
.stoast.salv{background:linear-gradient(135deg,rgba(120,70,8,.97),rgba(210,150,30,.97) 55%,rgba(150,80,10,.97));border:1px solid #fff0b0;overflow:hidden;
  box-shadow:0 0 0 2px rgba(255,230,140,.5),0 0 30px rgba(255,200,60,.9),0 0 60px rgba(255,160,30,.5),0 6px 20px rgba(0,0,0,.5);animation:stin .45s cubic-bezier(.2,1.4,.4,1) both,salvpulse 1.2s .45s ease-in-out infinite}
.stoast.salv small{color:#fff3c8}
.stoast.salv b{color:#fffbe8;text-shadow:0 0 8px #ffcc33}
.stoast.salv .st-ic{filter:drop-shadow(0 0 10px #ffe08a) drop-shadow(0 0 20px #ffb52e);animation:salvspin 1.4s ease-in-out infinite}
.stoast.salv::before{content:'';position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.8) 48%,rgba(255,240,180,.5) 52%,transparent 65%);background-size:250% 100%;animation:salvsweep 1.3s ease-in-out infinite;pointer-events:none}
.stoast.salv .sp{position:absolute;width:5px;height:5px;border-radius:50%;background:#fff;box-shadow:0 0 6px #fff,0 0 12px #ffd76a;opacity:0;animation:salvsp 1.4s var(--d) ease-out infinite;pointer-events:none}
@keyframes salvpulse{50%{box-shadow:0 0 0 3px rgba(255,240,170,.8),0 0 44px rgba(255,214,90,1),0 0 90px rgba(255,170,40,.7),0 6px 20px rgba(0,0,0,.5)}}
@keyframes salvspin{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.3) rotate(180deg)}}
@keyframes salvsweep{0%{background-position:130% 0}70%,100%{background-position:-30% 0}}
@keyframes salvsp{0%{opacity:0;transform:scale(.2)}30%{opacity:1;transform:scale(1.4)}100%{opacity:0;transform:scale(.2) translateY(-10px)}}

body.pfrozen #cmds .btn{filter:saturate(.2) brightness(1.2);background:linear-gradient(135deg,#bfe8ff,#7fb8e0)!important;color:#103050!important}
.pf-agares{box-shadow:0 0 28px rgba(170,80,255,.7),0 0 90px rgba(120,40,255,.35)}
.pf-agares .pglow{background:radial-gradient(ellipse at 50% 100%,rgba(160,80,255,.5),transparent 62%);box-shadow:inset 0 0 50px rgba(40,0,80,.75);animation:breathe 2.4s ease-in-out infinite}
.pf-agares .pembers i{background:#d0a0ff;box-shadow:0 0 6px #a050ff,0 0 12px #7020ff}

.pf-terazio{box-shadow:0 0 30px rgba(255,40,40,.7),0 0 90px rgba(255,90,40,.35)}
.pf-terazio .pglow{background:radial-gradient(ellipse at 50% 100%,rgba(255,80,30,.55),transparent 62%);box-shadow:inset 0 0 50px rgba(90,0,0,.7);animation:breathe 2s ease-in-out infinite}

.pf-barbatos{box-shadow:0 0 26px rgba(170,90,255,.6),0 0 80px rgba(80,140,255,.3)}

.pf-gamigin{box-shadow:0 0 26px rgba(255,50,60,.6),0 0 80px rgba(160,0,20,.35)}
.pf-gamigin .pglow{background:radial-gradient(ellipse at 50% 100%,rgba(200,20,40,.5),transparent 62%);box-shadow:inset 0 0 50px rgba(80,0,10,.7);animation:breathe 2.4s ease-in-out infinite}

.pf-valefor{box-shadow:0 0 24px rgba(150,180,255,.55),0 0 70px rgba(255,110,40,.25)}

.pf-amon{box-shadow:0 0 26px rgba(255,110,30,.6),0 0 80px rgba(255,60,0,.3)}

/* Map */
.mapwrap{max-height:56vh;overflow-y:auto;border-radius:12px;background:radial-gradient(ellipse at 50% 0%,rgba(255,255,255,.04),transparent 60%),#070b18}
.map{position:relative}
.mapline{position:absolute;inset:0;width:100%;height:100%}
.mapline polyline{fill:none;stroke:var(--gc);stroke-opacity:.35;stroke-width:3;stroke-dasharray:6 6}
.node{position:absolute;transform:translate(-50%,-50%);width:46px;height:46px;border-radius:50%;border:2px solid var(--line);background:#0e1630;font-weight:900;font-size:15px;color:var(--text)}
.node.done{background:#1a2a50;border-color:#4a6fb8;color:#9fc0ff}
.node.next{border-color:var(--gc);box-shadow:0 0 0 0 var(--gc);animation:nodep 1.6s ease-out infinite;background:#14244a}
.node.lock{opacity:.35}
.node.sel{outline:3px solid #fff;outline-offset:3px}
.node.elite{border-color:#a87a1c}
.node.mid{width:54px;height:54px;font-size:20px;border-color:#b0203a;background:#2a0c16;color:#ff6a7a}
.node.boss{width:64px;height:64px;font-size:26px;border-color:#ff2a4a;background:#3a0a14;color:#ff5a6a;box-shadow:0 0 18px rgba(255,40,70,.45)}
@keyframes nodep{0%{box-shadow:0 0 0 0 var(--gc)}100%{box-shadow:0 0 0 14px transparent}}
.sheet{position:sticky;bottom:8px;z-index:3;box-shadow:0 -6px 24px rgba(0,0,0,.6)}

.codebox{width:100%;height:96px;border-radius:10px;border:1px solid var(--line);background:#070b18;color:#cfe0ff;font-size:11px;padding:8px;font-family:monospace;word-break:break-all;resize:none;user-select:text;-webkit-user-select:text}

.node .kc{position:absolute;left:100%;top:50%;transform:translate(6px,-50%);font-size:10px;font-weight:400;white-space:nowrap;color:#ffd38a;background:rgba(0,0,0,.5);padding:1px 6px;border-radius:8px;pointer-events:none;line-height:1.5}
.realmp{border-color:rgba(199,139,255,.45);background:linear-gradient(160deg,rgba(60,20,80,.55),rgba(20,10,35,.6))}
.realmp.lockp{opacity:.75}
.advsub{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.ptitle.advsh{font-size:15px}
.advsub.realmsub{padding:10px;border-radius:12px;border:1px solid rgba(199,139,255,.45);background:linear-gradient(160deg,rgba(60,20,80,.55),rgba(20,10,35,.6))}
.advsub.realmsub.lockp{opacity:.75}
.area.realm{border-color:rgba(199,139,255,.5)}.area.realm.on{box-shadow:0 0 0 2px #c78bff inset}

.chrow .chtm{font-size:11px;color:#8f9ac0;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.chdot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#ff4f6a;box-shadow:0 0 6px #ff4f6a}
.tab .chdot{position:absolute;top:4px;right:calc(50% - 20px)}
.chatwrap{display:flex;flex-direction:column;gap:8px}
body.chatmode{overflow:hidden}
body.chatmode .chatwrap{position:fixed;left:0;right:0;top:0;margin:0 auto;max-width:480px;box-sizing:border-box;z-index:25;border-radius:0 0 16px 16px;padding-top:calc(10px + env(safe-area-inset-top))}
body.chatmode .chatlog{flex:1;height:auto;min-height:0}
body.chatmode .chathead{padding-right:46px}   /* 오른쪽 위 소리 버튼에 단체 채팅 메뉴가 가려지지 않게 */
body.chatkb .tabbar{display:none}
body.chatkb .chatwrap{border-radius:0;padding-bottom:6px}
.chathead{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px}.chathead b{text-align:center;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chbtn{padding:6px 10px;font-size:13px;min-height:0;width:auto}
.chatlog{height:calc(100dvh - 260px);min-height:260px;overflow-y:auto;background:#080d1e;border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;overscroll-behavior:contain}
.chmsg{max-width:78%;align-self:flex-start;display:flex;flex-direction:column;align-items:flex-start}
.chmsg.me{align-self:flex-end;align-items:flex-end}
.chname{font-size:11px;color:#9fb0d8;margin:0 4px 2px}
.chbub{background:#1b2850;border-radius:14px 14px 14px 4px;padding:7px 11px;font-size:15px;line-height:1.4;white-space:pre-wrap;word-break:break-word}
.chmsg.me .chbub{background:linear-gradient(135deg,#3d6fd8,#5a8cf0);border-radius:14px 14px 4px 14px;color:#fff}
.chat-t{font-size:10px;color:#7d8bb3;margin:1px 4px 0}
.chsys{align-self:center;font-size:11px;color:#8f9ac0;background:rgba(255,255,255,.05);border-radius:10px;padding:2px 10px}
.chatin{display:flex;gap:6px}.chatin input,#chgname{flex:1;min-width:0;box-sizing:border-box;background:#080d1e;color:#e6eeff;border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-size:16px}.chatin .btn{width:auto;padding:8px 14px}
.chpick{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin:6px 0;max-height:240px;overflow-y:auto}
.chpk{display:flex;align-items:center;gap:6px;background:#0c1329;border-radius:8px;padding:7px 8px;font-size:14px}
.pvpvis{font-size:0;line-height:1;display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px 0;animation:none}
.pvphero{font-size:64px;color:#ff8a8a;text-shadow:0 0 20px #ff3040}
.pvpteam{display:flex;gap:8px;justify-content:center;font-size:14px;margin:4px 0}
.pvpa{font-size:30px;display:flex;flex-direction:column;align-items:center;background:#22132e;border-radius:10px;padding:4px 6px}
.pvpa i{font-style:normal;font-size:10px;color:var(--dim)}
.pvpvs{font-family:'Noto Serif KR',serif;font-size:20px;font-weight:900;margin:6px 0}.pvpvs span{color:#ff5a6a;margin:0 8px}

/* Summon FX */
.sfx{position:fixed;inset:0;z-index:70;overflow:hidden;display:flex;align-items:center;justify-content:center;--c:#9fb8ff;cursor:pointer}
.sfx.s3{--c:#4da3ff}.sfx.s4{--c:#b07cff}.sfx.s5{--c:#ffd24a}.sfx.s6{--c:#bfe6ff}
.sfx.s6{animation:sfxshake .5s .6s 3}.sfx.s6 .sfx-circle div{border-color:#ffffff}
.sumcell.s6{border-color:#bfe6ff;box-shadow:0 0 18px rgba(190,230,255,.9),0 0 30px rgba(255,220,120,.5);background:linear-gradient(160deg,#20304a,#3a2a08)}
.sum.s6 .sum-stars{color:#e6f6ff;text-shadow:0 0 12px #9fd8ff,0 0 24px #ffd24a}
.sum.s6 .aportrait{box-shadow:0 0 30px #bfe6ff,0 0 70px rgba(255,220,120,.55);border:2px solid #fff6d8;position:relative;z-index:2}
/* 우리의 정원 */
.gtabs{display:flex;gap:6px;margin:6px 0 8px}.gtabs button{flex:1}
.ggrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.gcard{background:#0c1329;border-radius:10px;padding:6px 4px;text-align:center;font-size:12px;border:1px solid transparent}
.gcard.own{border-color:#5fd39a}.gcard svg{width:54px;height:44px;display:block;margin:0 auto 2px}
.gcard .btn{min-height:30px;font-size:11px;padding:4px 6px;margin-top:4px;width:100%}
.room{position:relative;width:100%;aspect-ratio:4/3;border-radius:12px;overflow:hidden;margin-top:6px;background:linear-gradient(#f3e3cf 0 46%,#c99a6b 46% 100%);box-shadow:inset 0 0 0 3px #6b4a2f,0 6px 18px rgba(0,0,0,.4)}
.room::before{content:'';position:absolute;left:0;right:0;top:46%;height:4px;background:#8a5f3c}
.room::after{content:'';position:absolute;left:0;right:0;top:calc(46% + 4px);bottom:0;background:repeating-linear-gradient(90deg,transparent 0 46px,rgba(0,0,0,.08) 46px 48px)}
.room .fu{position:absolute;z-index:2;transform:translate(-50%,-100%);filter:drop-shadow(0 3px 2px rgba(0,0,0,.25));animation:pop .45s ease-out}
.room .fu svg{width:100%;height:auto;display:block}
.room .empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#7a5a3c;font-size:14px;z-index:3;text-align:center;padding:0 20px}
.room .fr{position:absolute;z-index:5;width:44px;transform:translate(-50%,-100%);transition:left 2.6s linear,top 2.6s linear;cursor:pointer}
.room .fr .bd{animation:bob .45s ease-in-out infinite alternate}.room .fr.idle .bd{animation:none}
.room .fr.flip svg{transform:scaleX(-1)}
.room .fr svg{width:44px;height:58px;display:block}
.room .fr .nm{font-size:10px;font-weight:700;color:#3b2614;background:rgba(255,255,255,.8);border-radius:6px;padding:0 4px;text-align:center;white-space:nowrap;margin-top:-2px}
.room .fr .say{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:#fff;color:#222;font-size:11px;border-radius:8px;padding:2px 6px;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.25);animation:pop .3s ease-out}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-3px)}}
.petstar{color:#8fdcff!important;text-shadow:0 0 6px #4ab8ff,0 0 12px rgba(80,180,255,.7)!important}
.petpanel{border-color:#5ab8ff;box-shadow:0 0 0 1px rgba(90,184,255,.35),0 0 16px rgba(90,184,255,.18)}
/* 튜토리얼 · 가이드 */
.tut{position:fixed;inset:0;z-index:70;background:rgba(4,6,16,.82);display:flex;align-items:center;justify-content:center;padding:16px;animation:sfxfade .3s ease-out}
.tutbox{width:min(380px,100%);background:linear-gradient(160deg,#1c2a55,#0d1430);border:1px solid #4a6ab0;border-radius:18px;padding:20px 16px 14px;box-shadow:0 10px 30px rgba(0,0,0,.6);animation:pop .3s ease-out}
.tutic{font-size:46px;text-align:center;filter:drop-shadow(0 0 12px rgba(150,190,255,.6))}
.tutt{font-family:'Noto Serif KR',serif;font-size:20px;font-weight:900;text-align:center;color:#fff;margin:6px 0 10px}
.tutb{font-size:13.5px;line-height:1.65;color:#d6e2ff}.tutb b{color:#ffe38a}
.tutrw{margin:12px 0 4px;padding:8px;border-radius:10px;background:rgba(255,214,110,.12);border:1px solid rgba(255,214,110,.4);color:#ffe9a8;font-size:13px;text-align:center;font-weight:700}
.tutdots{display:flex;justify-content:center;gap:6px;margin:12px 0}.tutdots i{width:7px;height:7px;border-radius:50%;background:#3a4a7a}.tutdots i.on{background:#ffe08a}
.tutbtns{display:grid;grid-template-columns:1fr 1.4fr;gap:8px}
.tuttip{text-align:left}.tuttip .tutt{text-align:left;font-size:18px}.tuttip .small{margin-top:10px}
.gsec{background:#0c1329;border:1px solid #2a3a6a;border-radius:12px;margin:8px 0;padding:0 12px}
.gsec summary{cursor:pointer;padding:12px 0;font-weight:800;font-size:14.5px;list-style:none}.gsec summary::after{content:'＋';float:right;color:var(--dim)}.gsec[open] summary::after{content:'－'}
.gsec .tutb{padding:0 0 12px}
/* 캐릭터 맞추기 */
.qtimer{position:relative;height:22px;border-radius:11px;background:#0c1329;overflow:hidden;margin:6px 0 10px;border:1px solid #2a3a6a}
.qtimer i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#4a8cff,#7fd0ff);transition:width .1s linear}
.qtimer i.low{background:linear-gradient(90deg,#ff4f6a,#ffa04a)}
.qtimer span{position:relative;display:block;text-align:center;font-size:12px;font-weight:800;line-height:22px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.qimg{position:relative;width:min(240px,64vw);aspect-ratio:3/4;margin:0 auto 12px;border-radius:16px;background-size:cover;box-shadow:0 0 0 2px #3a5aa0,0 8px 22px rgba(0,0,0,.5);animation:pop .3s ease-out}
.qimg .qstar{position:absolute;left:8px;top:6px;font-size:13px;color:#ffe38a;text-shadow:0 0 6px #000,0 0 10px #ffb52e}
.qopts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.qopts .btn{min-height:46px;font-size:14px}
.qopts .btn.qok{background:#2f8f5a;border-color:#7fe0a8;color:#fff}
.qopts .btn.qng{background:#9a2f3f;border-color:#ff8f9f;color:#fff}
.qres{text-align:center;margin:14px 0}.qres b{display:block;font-size:56px;color:#ffe38a;text-shadow:0 0 16px rgba(255,200,60,.6)}
/* 탑 선택 슬라이드 */
.tsel{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;padding:6px 2px 10px;scrollbar-width:none}
.tsel::-webkit-scrollbar{display:none}
.tsel-card{flex:0 0 86%;scroll-snap-align:center;border-radius:18px;padding:18px 14px 14px;text-align:center;position:relative;overflow:hidden;
  background:linear-gradient(160deg,#1c2a55,#0d1430);border:1px solid #3a5aa0;box-shadow:0 6px 20px rgba(0,0,0,.45)}
.tsel-card.heaven{background:linear-gradient(160deg,#fff6dc22,#3a2c68 40%,#121030);border-color:#ffe08a;box-shadow:0 0 22px rgba(255,214,110,.35),0 6px 20px rgba(0,0,0,.45)}
.tsel-card.locked{filter:grayscale(.7) brightness(.75)}
.tsel-art{font-size:64px;filter:drop-shadow(0 0 16px rgba(160,200,255,.6));animation:halo 2.6s ease-in-out infinite}
.tsel-card.heaven .tsel-art{filter:drop-shadow(0 0 18px rgba(255,220,130,.9))}
.tsel-title{font-family:'Noto Serif KR',serif;font-size:24px;font-weight:900;margin:6px 0 2px;color:#fff}
.tsel-card.heaven .tsel-title{color:#fff1c0;text-shadow:0 0 10px rgba(255,200,80,.7)}
.tsel-body{font-size:12.5px;color:var(--dim);line-height:1.55;margin:10px 0;min-height:76px}
.tsel-prog{font-size:13px;font-weight:700;color:#cfe0ff;margin-bottom:10px}
.tsel-dots{display:flex;justify-content:center;gap:8px;margin:2px 0 10px}
.tsel-dots i{width:8px;height:8px;border-radius:50%;background:#3a4a7a;cursor:pointer}.tsel-dots i.on{background:#ffe08a;box-shadow:0 0 6px #ffcc33}
.heavenp{border-color:#ffe08a}
/* 동료 검색 */
.asearch{display:flex;gap:6px;margin:8px 0 2px}
.asearch input{flex:1;min-width:0;font-size:16px;padding:10px 12px;border-radius:12px;border:1px solid #3a4a7a;background:#0c1329;color:#fff;outline:none}
.asearch input:focus{border-color:#7fb0ff;box-shadow:0 0 0 2px rgba(127,176,255,.25)}
.asearch .btn{min-height:auto;padding:0 14px;flex:0 0 auto}
/* 초월 */
.aface.trans{position:relative;box-shadow:0 0 0 2px #ffe08a,0 0 8px 2px rgba(255,200,60,.85),0 0 18px rgba(255,170,40,.55);animation:transglow 1.6s ease-in-out infinite;overflow:hidden}
.aface.trans::after{content:'';position:absolute;inset:-20%;background:linear-gradient(115deg,transparent 40%,rgba(255,250,220,.85) 50%,transparent 60%);animation:transsweep 2.2s ease-in-out infinite;pointer-events:none}
@keyframes transglow{0%,100%{box-shadow:0 0 0 2px #ffe08a,0 0 8px 2px rgba(255,200,60,.8),0 0 16px rgba(255,170,40,.5)}50%{box-shadow:0 0 0 2px #fff4c8,0 0 14px 4px rgba(255,214,90,1),0 0 30px rgba(255,180,40,.8)}}
@keyframes transsweep{0%{transform:translateX(-70%)}60%,100%{transform:translateX(70%)}}
.transic{position:relative;display:flex;flex-direction:column;align-items:center}
.transic .translb{display:block;margin-top:3px;font-size:10px;font-weight:900;letter-spacing:1px;color:#ffe38a;white-space:nowrap;text-shadow:0 0 6px #ffcc33,0 0 12px #ff9a1a;position:relative;isolation:isolate}
.transic .translb::before{content:'';position:absolute;left:50%;top:50%;width:60px;height:22px;margin:-11px 0 0 -30px;border-radius:50%;background:radial-gradient(ellipse,rgba(255,210,90,.6),transparent 70%);animation:transaura 1.8s ease-out infinite;z-index:-1}
@keyframes transaura{0%{transform:scale(.4);opacity:1}100%{transform:scale(1.6);opacity:0}}
.transic.big{margin:0 auto}.transic.big .aportrait{box-shadow:0 0 0 3px #ffe08a,0 0 30px rgba(255,200,60,.9),0 0 70px rgba(255,170,40,.5)}
.transic.big .translb{font-size:16px;margin-top:8px}.transic.big .translb::before{width:120px;height:40px;margin:-20px 0 0 -60px}
.acard.transc{border-color:#ffd76a;box-shadow:0 0 0 1px rgba(255,215,106,.6),0 0 18px rgba(255,190,60,.35)}
.transtag{display:inline-block;font-size:10px;font-weight:900;padding:1px 6px;border-radius:8px;background:linear-gradient(135deg,#fff1b0,#ffb52e);color:#4a2a00;box-shadow:0 0 8px rgba(255,190,60,.8)}
.btn.transbtn{background:linear-gradient(135deg,#6a4a10,#c89420);border-color:#ffd76a;color:#fff6d8}
/* 초월 연출 */
.tfx{position:fixed;inset:0;z-index:72;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 45%,#2a2110,#050408 72%);animation:sfxfade .35s ease-out;overflow:hidden;cursor:pointer}
.tfx .tstage{position:relative;width:220px;height:300px}
.tfx .tpor{position:absolute;left:30px;top:20px;width:160px;height:216px;border-radius:14px;background-size:cover;background-position:50% 20%;filter:grayscale(.6) brightness(.7);box-shadow:0 0 20px rgba(0,0,0,.6);z-index:2}
.tfx .tpor.emo{display:flex;align-items:center;justify-content:center;font-size:80px;background:#141a30}
.tfx .tring{position:absolute;left:50%;top:128px;width:280px;height:280px;margin:-140px;z-index:1;animation:tspin 6s linear infinite,tin .6s ease-out}
.tfx .tring circle{fill:none;stroke:#e8c66a;stroke-width:1.2;opacity:.75}
.tfx .tring text{fill:#ffe39a;font-size:11px;letter-spacing:3px;opacity:.85}
@keyframes tspin{to{transform:rotate(360deg)}}@keyframes tin{from{opacity:0;transform:scale(.6)}}
.tfx .tshard{position:absolute;left:50%;top:128px;width:34px;height:34px;margin:-17px;z-index:4;animation:trise 1.4s .2s cubic-bezier(.3,.7,.3,1) both}
.tfx .tshard i{position:absolute;inset:0;transform:rotate(45deg);background:linear-gradient(135deg,#fff8d8,#ffcf4a 45%,#c07a10);box-shadow:0 0 14px #ffd76a,0 0 30px rgba(255,190,60,.8);border-radius:4px}
@keyframes trise{0%{transform:translateY(190px) scale(.6);opacity:0}20%{opacity:1}100%{transform:translateY(0) scale(1);opacity:1}}
.tfx .tspk{position:absolute;left:50%;top:128px;width:4px;height:4px;border-radius:50%;background:#ffe39a;box-shadow:0 0 8px #ffcc33;z-index:3;opacity:0;animation:tconv 1s var(--d) ease-in forwards}
@keyframes tconv{0%{opacity:0;transform:translate(var(--x),var(--y))}20%{opacity:1}100%{opacity:0;transform:translate(0,0)}}
.tfx .tmsg{position:absolute;left:0;right:0;top:250px;text-align:center;z-index:6;opacity:0;animation:tmsg .6s var(--t,2s) cubic-bezier(.2,1.4,.4,1) forwards}
.tfx .tmsg b{display:block;font-family:'Noto Serif KR',serif;font-size:26px;font-weight:900}
.tfx .tmsg small{display:block;font-size:13px;margin-top:4px;opacity:.85}
@keyframes tmsg{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
.tfx .tsk{position:absolute;bottom:26px;left:0;right:0;text-align:center;font-size:12px;color:rgba(255,255,255,.5);opacity:0;animation:tmsg .4s 2.6s forwards}
/* 성공 */
.tfx.ok .tshard{animation:trise 1.4s .2s cubic-bezier(.3,.7,.3,1) both,tabsorb .4s 1.6s ease-in forwards}
@keyframes tabsorb{to{transform:scale(.1);opacity:0}}
.tfx.ok .tflash{position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,#fff,#ffe9a0 30%,transparent 70%);opacity:0;z-index:5;pointer-events:none;animation:tflash 1s 1.85s ease-out forwards}
@keyframes tflash{0%{opacity:0}15%{opacity:1}100%{opacity:0}}
.tfx.ok .tpor{animation:tgold .6s 1.95s ease-out forwards}
@keyframes tgold{to{filter:none;box-shadow:0 0 0 3px #ffe08a,0 0 30px rgba(255,200,60,.95),0 0 80px rgba(255,170,40,.6)}}
.tfx.ok .trays{position:absolute;left:50%;top:128px;width:700px;height:700px;margin:-350px;z-index:0;opacity:0;background:repeating-conic-gradient(rgba(255,214,110,.35) 0 6deg,transparent 6deg 18deg);border-radius:50%;-webkit-mask:radial-gradient(circle,#000 20%,transparent 70%);mask:radial-gradient(circle,#000 20%,transparent 70%);animation:trays 1s 1.9s ease-out forwards,tspin 14s 1.9s linear infinite}
@keyframes trays{to{opacity:1}}
.tfx.ok .tbr{position:absolute;left:50%;top:128px;width:40px;height:40px;margin:-20px;border-radius:50%;border:3px solid #ffe08a;box-shadow:0 0 20px #ffcc33;z-index:5;opacity:0;animation:tburst 1.2s var(--d) ease-out forwards}
@keyframes tburst{0%{opacity:1;transform:scale(.3)}100%{opacity:0;transform:scale(9)}}
.tfx.ok .tup{position:absolute;bottom:-10px;width:5px;height:5px;border-radius:50%;background:#ffe39a;box-shadow:0 0 8px #ffcc33;z-index:5;opacity:0;animation:tup 2.4s var(--d) linear infinite}
@keyframes tup{0%{opacity:0;transform:translateY(0)}20%{opacity:1}100%{opacity:0;transform:translateY(-110vh)}}
.tfx.ok .tmsg b{color:#fff1b8;text-shadow:0 0 12px #ffcc33,0 0 30px #ff9a1a}
.tfx.ok .tmsg small{color:#ffe39a}
/* 초월 성공 글씨 양옆: 반짝이는 빛 (렌즈 플레어) */
.tfx .tmsg b.tflare{position:relative;display:inline-block;padding:0 26px}
.tfx .tmsg b.tflare::before,.tfx .tmsg b.tflare::after{content:'';position:absolute;top:50%;width:46px;height:46px;margin-top:-23px;pointer-events:none;
  background:radial-gradient(circle,#fff 0 3px,rgba(255,240,180,.95) 4px,rgba(255,200,70,.55) 9px,transparent 22px),
    linear-gradient(90deg,transparent 0,rgba(255,236,170,.95) 50%,transparent 100%) center/100% 2px no-repeat,
    linear-gradient(0deg,transparent 0,rgba(255,236,170,.9) 50%,transparent 100%) center/2px 70% no-repeat;
  filter:drop-shadow(0 0 6px #ffcc33);animation:tflr 1.4s ease-in-out infinite}
.tfx .tmsg b.tflare::before{left:-22px}
.tfx .tmsg b.tflare::after{right:-22px;animation-delay:.7s}
@keyframes tflr{0%,100%{transform:scale(.7) rotate(0);opacity:.75}50%{transform:scale(1.15) rotate(45deg);opacity:1}}
/* 실패 */
.tfx.ng .tcrack{position:absolute;inset:-8px;z-index:5;opacity:0;animation:tcrk .4s 1.65s forwards}
@keyframes tcrk{0%,98%{opacity:1}100%{opacity:0}}
.tfx.ng .tcrack path{fill:none;stroke:#fff;stroke-width:2;filter:drop-shadow(0 0 3px #fff)}
@keyframes tshow{to{opacity:1}}
.tfx.ng .tshard{animation:trise 1.4s .2s cubic-bezier(.3,.7,.3,1) both,tshake .45s 1.6s linear,thide .01s 2.05s forwards}
@keyframes tshake{0%,100%{transform:translate(0,0)}20%{transform:translate(-3px,1px)}40%{transform:translate(3px,-1px)}60%{transform:translate(-2px,-1px)}80%{transform:translate(2px,1px)}}
@keyframes thide{to{opacity:0}}
.tfx.ng .tfrag{position:absolute;left:50%;top:128px;width:22px;height:22px;margin:-11px;box-shadow:0 0 8px #ffd76a;z-index:4;opacity:0;background:linear-gradient(135deg,#fff3c0,#d8a030);clip-path:polygon(50% 0,100% 60%,30% 100%);animation:tfall 1.4s 2.05s cubic-bezier(.3,0,.8,1) forwards}

body.battle.btheme{background:radial-gradient(ellipse at 50% 28%,var(--bm) 0%,var(--bd) 72%) fixed;background-color:var(--bd)}
body.battle.btheme.flash{background:radial-gradient(ellipse at 50% 28%,#5a1420 0%,var(--bd) 72%) fixed}

body.battle.btheme .status{background:color-mix(in srgb,var(--bm) 62%,#0a0a12);box-shadow:0 0 0 1px color-mix(in srgb,var(--ba) 22%,transparent) inset,0 6px 20px rgba(0,0,0,.35)}
body.battle.btheme .enemy.boss{background:radial-gradient(ellipse at 50% 42%,color-mix(in srgb,var(--bm) 85%,var(--ba) 15%) 0%,var(--bd) 78%);
  border-color:color-mix(in srgb,var(--ba) 55%,transparent);box-shadow:0 0 26px color-mix(in srgb,var(--ba) 22%,transparent),inset 0 0 44px rgba(0,0,0,.7)}
body.battle.btheme .boss .eicon.art{filter:drop-shadow(0 0 22px color-mix(in srgb,var(--ba) 60%,transparent))}

body.battle.btheme .eflag{color:color-mix(in srgb,var(--ba) 45%,#9aa3bd)}
body.battle.btheme .etitle{color:color-mix(in srgb,var(--ba) 55%,#d8dbe6)}
body.battle.btheme .epass{color:color-mix(in srgb,var(--ba) 70%,#ffffff)}
body.battle.btheme .bar.ehp{background:color-mix(in srgb,var(--bd) 70%,#000000)}
body.battle.btheme .bar.ehp i{background:linear-gradient(90deg,color-mix(in srgb,var(--ba) 50%,#1a0a10),var(--ba))}
body.battle.btheme .chip{background:color-mix(in srgb,var(--bm) 75%,#10131f)}
body.battle.btheme .log{background:color-mix(in srgb,var(--bd) 70%,#000000);box-shadow:0 0 0 1px color-mix(in srgb,var(--ba) 14%,transparent) inset}
body.battle.btheme .cmds .btn:not(.guardon){background:color-mix(in srgb,var(--bm) 80%,#1c2030)}

.tab{--tc:#8d9bc4;--tb:#1a2444;color:var(--tc);opacity:.62;position:relative}

<script>

(()=>{let last=0,sx=0,sy=0,moved=false;
  document.addEventListener('touchstart',e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;moved=false;},{passive:true});
  document.addEventListener('touchmove',e=>{const t=e.touches[0];if(t&&(Math.abs(t.clientX-sx)>10||Math.abs(t.clientY-sy)>10))moved=true;},{passive:true});
  document.addEventListener('touchend',e=>{
    const now=Date.now(),tg=e.target;
    if(now-last<=300&&!moved&&!(tg.closest&&tg.closest('input,textarea,select,label'))){
      e.preventDefault(); // 두 번째 탭의 확대를 막고, 탭 자체는 그대로 눌리게 함
      const el=tg.closest?tg.closest('button,a,[data-act],[onclick],summary')||tg:tg;
      if(!(el.disabled||(el.closest&&el.closest('[disabled]'))))el.click&&el.click();
    }
    last=now;},{passive:false});
  ['gesturestart','gesturechange','gestureend'].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));
  document.addEventListener('touchmove',e=>{if(e.touches&&e.touches.length>1)e.preventDefault();},{passive:false});
  document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
})();

/* ===================== BGM (Web Audio로 직접 합성 — 외부 음원 없음) ===================== */
const BGM=(()=>{
  let ctx=null,master,comp,echo,echoFb,echoOut,noiseBuf,wind=null,cur=null,want=null,timer=null,nextT=0,step=0;
  let on=true;try{on=localStorage.getItem('bp_bgm')!=='0'}catch(e){}
  const VOL=0.45;
  const mf=m=>440*Math.pow(2,(m-69)/12);
  function init(){
    if(ctx)return;
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    ctx=new AC();
    comp=ctx.createDynamicsCompressor();comp.threshold.value=-18;comp.ratio.value=4;comp.connect(ctx.destination);
    master=ctx.createGain();master.gain.value=0;master.connect(comp);
    echo=ctx.createDelay(1.5);echoFb=ctx.createGain();echoOut=ctx.createGain();
    echo.connect(echoFb);echoFb.connect(echo);echo.connect(echoOut);echoOut.connect(master);
    noiseBuf=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate);
    const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  }
  function tone(m,t,dur,o={}){
    const osc=ctx.createOscillator(),g=ctx.createGain();
    osc.type=o.type||'triangle';osc.frequency.setValueAtTime(mf(m),t);
    if(o.detune)osc.detune.value=o.detune;
    if(o.vib){const l=ctx.createOscillator(),lg=ctx.createGain();l.frequency.value=5.2;lg.gain.value=o.vib;l.connect(lg);lg.connect(osc.frequency);l.start(t);l.stop(t+dur+(o.rel||0.3));}
    const a=o.att||0.01,r=o.rel||0.25,v=o.vol||0.1;
    g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v,t+a);
    g.gain.setValueAtTime(v,t+Math.max(a,dur));g.gain.exponentialRampToValueAtTime(0.0001,t+Math.max(a,dur)+r);
    let node=osc;
    if(o.lp){const f=ctx.createBiquadFilter();f.type='lowpass';f.frequency.value=o.lp;f.Q.value=o.q||0.7;osc.connect(f);node=f;}
    node.connect(g);g.connect(master);if(o.echo){const s=ctx.createGain();s.gain.value=o.echo;g.connect(s);s.connect(echo);}
    osc.start(t);osc.stop(t+Math.max(a,dur)+r+0.05);
  }
  function noise(t,dur,o={}){
    const s=ctx.createBufferSource();s.buffer=noiseBuf;
    const f=ctx.createBiquadFilter();f.type=o.ft||'highpass';f.frequency.value=o.f||6000;f.Q.value=o.q||0.7;
    const g=ctx.createGain();const v=o.vol||0.05;
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    s.connect(f);f.connect(g);g.connect(master);s.start(t,Math.random()*1.5);s.stop(t+dur+0.05);
  }
  function drum(t,o={}){ // 북(팀파니·타이코) — 음정이 떨어지는 사인파
    const osc=ctx.createOscillator(),g=ctx.createGain();osc.type='sine';
    osc.frequency.setValueAtTime(o.f0||130,t);osc.frequency.exponentialRampToValueAtTime(o.f1||42,t+(o.drop||0.18));
    g.gain.setValueAtTime(o.vol||0.5,t);g.gain.exponentialRampToValueAtTime(0.0001,t+(o.dur||0.5));
    osc.connect(g);g.connect(master);osc.start(t);osc.stop(t+(o.dur||0.5)+0.05);
    noise(t,0.06,{ft:'lowpass',f:900,vol:(o.vol||0.5)*0.25});
  }
  /* ---- 로비: 산뜻한 바람 (C장조 · 92BPM) ---- */
  const L_CH=[[48,55,64,71],[45,52,60,67],[41,48,57,64],[43,50,59,62]];
  const L_MEL=[ // [16분음표 위치, 음, 길이(16분)]
    [[0,72,3],[4,76,2],[6,79,4],[12,76,4]],
    [[0,74,3],[4,72,2],[6,69,6],[14,72,2]],
    [[0,77,3],[4,76,2],[6,72,4],[10,74,2],[12,76,4]],
    [[0,74,6],[8,79,4],[12,81,4]],
    [[0,84,4],[4,81,2],[6,79,4],[10,76,2],[12,79,4]],
    [[0,76,3],[4,74,2],[6,72,6],[12,69,4]],
    [[0,72,2],[2,74,2],[4,76,4],[8,79,2],[10,81,2],[12,79,4]],
    [[0,74,8],[8,72,8]]
  ];
  function lobbyStep(st,t,s16){
    const bar=Math.floor(st/16)%8,p=st%16,ch=L_CH[bar%4];
    if(p===0){
      ch.forEach((m,i)=>tone(m+12,t,s16*15,{type:'sine',vol:0.035,att:0.7,rel:1.2,lp:2200,detune:i%2?6:-6}));
      tone(ch[0]-12,t,s16*6,{type:'sine',vol:0.11,att:0.02,rel:0.4});
    }
    if(p===8)tone(ch[0]-12,t,s16*5,{type:'sine',vol:0.08,att:0.02,rel:0.4});
    if([0,3,6,8,11,14].includes(p)){const n=ch[[0,1,2,3,2,1][[0,3,6,8,11,14].indexOf(p)]]+12;tone(n,t,s16*0.8,{type:'triangle',vol:0.04,att:0.005,rel:0.35,echo:0.35});}
    if(p%4===2)noise(t,0.05,{f:8000,vol:0.012});
    L_MEL[bar].forEach(([ps,m,len])=>{if(ps===p)tone(m,t,s16*len*0.9,{type:'sine',vol:0.07,att:0.02,rel:0.5,vib:3,echo:0.4});});
  }
  /* ---- 전투: 웅장한 행진 (D단조 · 128BPM) ---- */
  const B_CH=[[50,57,62,65],[46,53,58,62],[48,55,60,64],[45,52,57,61]];
  const B_ROOT=[38,34,36,33];
  const B_MEL=[[[0,74,4],[4,77,4],[8,81,8]],[[0,82,6],[6,81,2],[8,79,8]],[[0,79,4],[4,81,4],[8,84,8]],[[0,85,8],[8,81,8]],
               [[0,86,4],[4,84,2],[6,82,2],[8,81,8]],[[0,82,4],[4,81,2],[6,79,2],[8,77,8]],[[0,79,2],[2,81,2],[4,82,4],[8,84,8]],[[0,85,12],[12,81,4]]];
  function battleStep(st,t,s16){
    const bar=Math.floor(st/16)%16,p=st%16,ci=bar%4,ch=B_CH[ci],r=B_ROOT[ci],sec=Math.floor(bar/8);
    if(p===0){
      ch.forEach((m,i)=>tone(m,t,s16*15,{type:'sawtooth',vol:0.022,att:0.12,rel:0.5,lp:1400,detune:i%2?8:-8}));
      tone(r-12,t,s16*15,{type:'sawtooth',vol:0.035,att:0.05,rel:0.4,lp:300});
      if(bar%8===0)noise(t,1.8,{f:5000,vol:0.06});
    }
    if(p%2===0)tone(r+(p%4===0?0:12),t,s16*1.6,{type:'sawtooth',vol:0.05,att:0.005,rel:0.08,lp:700,q:2});
    if(sec===1){const arp=[ch[0]+12,ch[1]+12,ch[2]+12,ch[3]+12];tone(arp[p%4],t,s16*0.8,{type:'square',vol:0.014,att:0.003,rel:0.06,lp:3000});}
    if([0,6,8,11,12,14].includes(p))drum(t,{vol:p===0||p===8?0.55:0.35,f0:p===0?140:110});
    if(p===4||p===12)noise(t,0.22,{f:1800,ft:'bandpass',q:0.8,vol:0.09});
    if(bar%8>=4||sec===1){const mb=sec===1?B_MEL[4+ci]:B_MEL[ci];mb.forEach(([ps,m,len])=>{if(ps===p)tone(m,t,s16*len*0.95,{type:'sawtooth',vol:0.035,att:0.04,rel:0.3,lp:2200,vib:4,echo:0.25});});}
  }
  const TR={lobby:{bpm:92,fn:lobbyStep,echoT:0.49,fb:0.35},battle:{bpm:128,fn:battleStep,echoT:0.35,fb:0.2}};
  function startWind(){
    if(wind)return;
    const s=ctx.createBufferSource();s.buffer=noiseBuf;s.loop=true;
    const f=ctx.createBiquadFilter();f.type='bandpass';f.frequency.value=700;f.Q.value=0.6;
    const g=ctx.createGain();g.gain.value=0.018;
    const l=ctx.createOscillator(),lg=ctx.createGain();l.frequency.value=0.09;lg.gain.value=0.014;l.connect(lg);lg.connect(g.gain);
    const l2=ctx.createOscillator(),l2g=ctx.createGain();l2.frequency.value=0.05;l2g.gain.value=350;l2.connect(l2g);l2g.connect(f.frequency);
    s.connect(f);f.connect(g);g.connect(master);s.start();l.start();l2.start();wind={s,l,l2,g};
  }
  function stopWind(){if(!wind)return;try{wind.s.stop();wind.l.stop();wind.l2.stop();}catch(e){}wind=null;}
  function tick(){
    if(!ctx||!cur||ctx.state!=='running')return;
    const tr=TR[cur],s16=60/tr.bpm/4;
    if(nextT<ctx.currentTime)nextT=ctx.currentTime+0.05;
    while(nextT<ctx.currentTime+0.3){tr.fn(step,nextT,s16);nextT+=s16;step++;}
  }
  function switchTo(name){
    if(!ctx||!on){cur=null;return;}
    if(cur===name)return;
    const now=ctx.currentTime;
    master.gain.cancelScheduledValues(now);master.gain.setValueAtTime(master.gain.value,now);master.gain.linearRampToValueAtTime(0,now+0.4);
    setTimeout(()=>{
      if(want!==name)return;
      cur=name;step=0;nextT=ctx.currentTime+0.05;
      echo.delayTime.value=TR[name].echoT;echoFb.gain.value=TR[name].fb;echoOut.gain.value=0.6;
      if(name==='lobby')startWind();else stopWind();
      const t=ctx.currentTime;master.gain.cancelScheduledValues(t);master.gain.setValueAtTime(0,t);master.gain.linearRampToValueAtTime(VOL,t+1.2);
      if(!timer)timer=setInterval(tick,80);
    },450);
  }
  function play(name){want=name;if(ctx&&ctx.state==='running')switchTo(name);}
  function unlock(){
    if(!on)return;
    init();if(!ctx)return;
    const go=()=>{if(want&&cur!==want)switchTo(want);};
    if(ctx.state!=='running')ctx.resume().then(go).catch(()=>{});else go();
  }
  function toggle(){
    on=!on;try{localStorage.setItem('bp_bgm',on?'1':'0')}catch(e){}
    if(on){unlock();}else if(ctx){const t=ctx.currentTime;master.gain.cancelScheduledValues(t);master.gain.setValueAtTime(master.gain.value,t);master.gain.linearRampToValueAtTime(0,t+0.3);stopWind();cur=null;}
    btn();
  }
  function btn(){let b=document.getElementById('bgmbtn');if(!b){b=document.createElement('button');b.id='bgmbtn';b.onclick=e=>{e.stopPropagation();toggle();};document.body.appendChild(b);}
    b.textContent=on?'🔊':'🔇';b.title=on?'배경음악 끄기':'배경음악 켜기';}
  document.addEventListener('pointerdown',unlock,{passive:true});
  document.addEventListener('keydown',unlock);
  document.addEventListener('visibilitychange',()=>{if(!ctx)return;if(document.hidden)ctx.suspend();else if(on)ctx.resume();});
  window.addEventListener('DOMContentLoaded',btn);if(document.readyState!=='loading')setTimeout(btn,0);
  document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('[data-bgm]');if(b){e.stopPropagation();toggle();document.querySelectorAll('[data-bgm]').forEach(x=>x.textContent=on?'🔊':'🔇');}});
  return {play,toggle,isOn:()=>on};
})();

const WING_SVG=(()=>{let f='';
  const row=(n,len,wid,a0,a1,op)=>{for(let i=0;i<n;i++){const a=a0+(a1-a0)*i/(n-1),r=a*Math.PI/180,cx=6+Math.cos(r)*len*0.5,cy=70-Math.sin(r)*len*0.5;

function puzzleFx(rid,cb){
  const C=5,Rw=6,r=RELICS[rid];
  let seam='';
  for(let i=1;i<C;i++){let d=`M ${i} 0`;for(let j=0;j<Rw;j++){const s=(i+j)%2?1:-1;d+=` L ${i} ${j+0.35} C ${i+s*0.3} ${j+0.15}, ${i+s*0.3} ${j+0.85}, ${i} ${j+0.65} L ${i} ${j+1}`;}seam+=`<path d="${d}"/>`;}
  for(let j=1;j<Rw;j++){let d=`M 0 ${j}`;for(let i=0;i<C;i++){const s=(i+j)%2?-1:1;d+=` L ${i+0.35} ${j} C ${i+0.15} ${j+s*0.3}, ${i+0.85} ${j+s*0.3}, ${i+0.65} ${j} L ${i+1} ${j}`;}seam+=`<path d="${d}"/>`;}
  let tiles='';
  for(let j=0;j<Rw;j++)for(let i=0;i<C;i++){const cx=i+0.5-C/2,cy=j+0.5-Rw/2,ang=Math.atan2(cy,cx)+(Math.random()-0.5)*0.8,dist=260+Math.random()*260;
    tiles+=`<i class="pzt" style="left:${i*100/C}%;top:${j*100/Rw}%;width:${100/C}%;height:${100/Rw}%;background-image:url(memory_puzzle.jpg);background-size:${C*100}% ${Rw*100}%;background-position:${i*100/(C-1)}% ${j*100/(Rw-1)}%;--x:${Math.round(Math.cos(ang)*dist)}px;--y:${Math.round(Math.sin(ang)*dist+120)}px;--r:${Math.round(Math.random()*720-360)}deg;--d:${(1.85+Math.random()*0.55).toFixed(2)}s"></i>`;}
  const sp=Array.from({length:28},()=>{const a=Math.random()*Math.PI*2,d=80+Math.random()*150;return `<b class="pzsp" style="left:50%;top:50%;--x:${Math.round(Math.cos(a)*d)}px;--y:${Math.round(Math.sin(a)*d)}px;--d:${(2.6+Math.random()*0.4).toFixed(2)}s"></b>`;}).join('');
  const ov=document.createElement('div');ov.className='pzfx';
  ov.innerHTML=`<div class="pzbox"><div class="pzphoto" style="background-image:url(memory_puzzle.jpg)"></div>
    <svg class="pzseam" viewBox="0 0 ${C} ${Rw}" preserveAspectRatio="none">${seam}</svg>${tiles}</div>
    <div class="pzburst"></div>${sp}
    <div class="pzitem"><div class="pzring"></div><div class="pzic">${r.icon}</div><div class="pzt1">✦ 되찾은 기억 ✦</div><div class="pzname">${esc(r.name)}</div><div class="pzdesc">희귀 아이템 · 주인공 방어력 +20</div></div>
    <div class="pzsk">탭하여 계속</div>`;
  document.body.appendChild(ov);
  let done=false;const t0=Date.now();
  ov.onclick=()=>{if(done)return;if(Date.now()-t0<3300){ov.querySelectorAll('*').forEach(e=>{e.getAnimations&&e.getAnimations().forEach(a=>{try{a.finish()}catch(_){}})});return;}done=true;ov.remove();cb&&cb();};
}

}

const DLINK_ABC='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';   // 헷갈리는 0·O·1·I 는 뺀 32자
const DLINK_MIN=10;
function newLinkCode(){
  let a;try{a=new Uint8Array(8);crypto.getRandomValues(a);}catch(e){a=Array.from({length:8},()=>Math.floor(Math.random()*256));}
  return Array.from(a,b=>DLINK_ABC[b%32]).join('');
}
const fmtLinkCode=c=>c.slice(0,4)+'-'+c.slice(4);
function myDeviceLink(){return location.href.split('#')[0]+'#d='+encodeURIComponent(P.uid+'.'+(P.skey||fbKey));}
/* 입력 해석: 연결 링크(#d=…) · 8자리 연결 코드 · 예전 저장 코드(BP1:) */
function parseDeviceInput(raw){
  const t=String(raw||'').trim();
  if(!t)return null;
  const m=t.match(/#d=([^\s#&]+)/);
  if(m){try{const v=decodeURIComponent(m[1]),i=v.lastIndexOf('.'),pid=v.slice(0,i),key=v.slice(i+1);
    if(i>0&&key.length>=16)return {pid,key};}catch(e){}return null;}
  if(t.replace(/\s+/g,'').startsWith('BP1:')){const p=decodeSave(t);return p?{save:p}:null;}
  const c=t.toUpperCase().replace(/[\s-]/g,'');
  if(c.length===8&&[...c].every(ch=>DLINK_ABC.includes(ch)))return {code:c};
  return null;
}
/* 이 기기를 캐릭터(pid)에 연결하고 클라우드의 최신 기록을 가져오기 */
async function fbLinkDevice(pid,key){
  if(fbBinding){try{await fbBinding;}catch(e){}}
  const devRef=FB.doc(`owners/${pid}/devices/${fbAuthUid}`);
  let linked=false;
  try{linked=(await withTimeout(devRef.get())).exists;}catch(e){}
  if(!linked){
    try{await withTimeout(devRef.set({key}));}
    catch(e){throw {msg:e&&e.code==='permission-denied'?'연결 정보가 맞지 않아요. 쓰던 기기에서 새 연결 코드나 링크를 받아 주세요.':'연결하지 못했어요. 인터넷 연결을 확인하고 다시 시도해 주세요.'};}
  }
  let snap;
  try{snap=await withTimeout(FB.doc('saves/'+pid).get());}catch(e){throw {msg:'클라우드 기록을 불러오지 못했어요. 잠시 뒤 다시 시도해 주세요.'};}
  let remote=null;
  if(snap.exists){try{const d=snap.data();if(d&&d.key===SAVE_KEY)remote=JSON.parse(d.json);}catch(e){}}
  if(!remote||!remote.name||!remote.lv||!Array.isArray(remote.prog))
    throw {msg:'클라우드에 저장된 기록이 없어요. 쓰던 기기에서 게임을 한 번 열어 두고 다시 시도해 주세요.'};
  remote.uid=pid;remote.skey=key;
  P=remote;
  try{localStorage.setItem(SAVE_KEY,JSON.stringify(P))}catch(e){}
  await fbBind(P);
  return P;
}

/* 캐릭터(P.uid)를 클라우드에 연결. 비밀 키(P.skey)는 저장 코드 안에만 들어 있어서,

function fbBind(p){
  if(!FB||!fbAuthUid||!p)return;
  if(!p.uid)p.uid=newUid();
  if(fbPid===p.uid){if(!p.skey&&fbKey)p.skey=fbKey;return;}   // 같은 캐릭터: 연결에 쓴 키를 저장 코드에도 넣기
  if(!p.skey)p.skey=newKey();

  const pid=p.uid,key=p.skey,origAt=p.savedAt||0;   // 저장 코드로 불러온 직후엔 원래 저장 시각으로 비교
  if(fbPid){fbPid=null;DBX=null;myId=null;cloudRef=null;}
  if(!P){try{localStorage.setItem(SAVE_KEY,JSON.stringify(p))}catch(e){}}
  fbBinding=(async()=>{
    try{
      const devRef=FB.doc(`owners/${pid}/devices/${fbAuthUid}`);
      if(!(await withTimeout(devRef.get())).exists){
        try{await withTimeout(FB.doc('owners/'+pid).set({key}));}catch(e){}   // 처음 쓰는 캐릭터면 주인 등록
        await withTimeout(devRef.set({key}));                               // 키가 맞아야 이 기기 연결
      }
      fbPid=pid;fbKey=key;DBX=FB;USERX=null;myId=pid;canShare=null;lastPub='';
      cloudRef=FB.doc('saves/'+pid);cloudState='on';
      const snap=await withTimeout(cloudRef.get());
      let remote=null;

const FCODE_PREFIX='BPF1:';
function myFriendCode(){
  const pub=myPublic();delete pub.friends;
  return FCODE_PREFIX+btoa(unescape(encodeURIComponent(JSON.stringify({v:1,id:P.uid,...pub}))));
}
function myFriendLink(){return location.href.split('#')[0]+'#f='+encodeURIComponent(myFriendCode());}
function parseFriendCode(str){
  try{
    let t=String(str||'').trim();
    const i=t.indexOf('#f=');if(i>=0)t=decodeURIComponent(t.slice(i+3));
    const j=t.indexOf(FCODE_PREFIX);if(j<0)return null;
    t=t.slice(j+FCODE_PREFIX.length).replace(/[^A-Za-z0-9+/=]/g,'');
    const o=JSON.parse(decodeURIComponent(escape(atob(t))));
    if(!o||typeof o.id!=='string'||!o.team||!Array.isArray(o.team.party))return null;
    return {id:o.id.slice(0,24),hero:String(o.hero||'모험가').replace(/[<>&"'`]/g,'').slice(0,8),lv:pvpCl(o.lv,1,9999),cp:pvpCl(o.cp,0,9999999),
      area:pvpCl(o.area,0,AREAS.length-1),stage:pvpCl(o.stage,0,STAGES),ended:!!o.ended,team:o.team,pvpW:pvpCl(o.pvpW,0,1e6),pvpL:pvpCl(o.pvpL,0,1e6),rankT:pvpCl(o.rankT||0,0,RANKS.length-1),rankLP:pvpCl(o.rankLP||0,0,1e7),rankOn:o.rankOn?1:0,updatedAt:pvpCl(o.updatedAt,0,9e15)};
  }catch(e){return null;}
}
function addFriendByCode(str){
  const f=parseFriendCode(str);
  if(!f)return {ok:false,msg:'친구 코드를 읽지 못했어요. 코드를 전부 복사했는지 확인해 주세요.'};

  P.fbook[f.id]={...f,w:old?old.w||0:0,l:old?old.l||0:0,addedAt:old?old.addedAt:Date.now()};

}

/* ===================== 친구 대결 (비동기: 친구가 마지막으로 저장한 팀을 AI가 조종) ===================== */
const PVP_DAILY=5, PVP_HP=1.25;
const pvpCl=(v,lo,hi)=>Math.max(lo,Math.min(hi,Number(v)||lo));
/* 친구 자세히 보기: 레벨·전투력·팀·전적 + 배틀 / 삭제 */
/* ===================== 친구에게 코인 보내기 (내 코인에서 차감 · 한 번에 최대 1,000,000) =====================
   서버 규칙을 새로 올리지 않아도 되도록, 이미 쓰고 있는 공개 프로필(players/{id})만 사용한다.
   ① 보내는 사람: 내 프로필의 giftOut(아직 안 받은 선물)·giftTo(받는 사람 id)에 올린다
   ② 받는 사람: giftTo에 내 id가 있는 프로필을 실시간으로 보다가, 내 프로필의 giftGot(받은 선물 id)에
      트랜잭션으로 먼저 적고 나서 코인을 받는다 → 같은 선물을 두 번 받지 않음
   ③ 보낸 사람: 받는 사람 프로필의 giftGot에 그 id가 보이면 내 giftOut에서 지운다 */
const GIFT_MAX=1000000, GIFT_STEP=1000, GIFT_PENDING=20, GIFT_GOT_KEEP=300;
let giftUnsub=null,giftFor=null,giftOutUnsubs={};const giftClaiming=new Set();
const giftReady=()=>!!(FB&&fbPid&&myId===fbPid&&P&&P.uid===fbPid);
const giftName=s=>(String(s||'').replace(/[<>&"'`]/g,'').slice(0,12))||'친구';
function giftPublicFields(){   // 공개 프로필에 함께 올리는 선물 정보 (없으면 아무것도 넣지 않음)
  const out=(Array.isArray(P.giftOut)?P.giftOut:[]).slice(0,GIFT_PENDING).map(g=>({id:g.id,to:g.to,a:g.a,at:g.at}));
  const got=(Array.isArray(P.giftGot)?P.giftGot:[]).slice(-GIFT_GOT_KEEP);
  return {...(out.length?{giftOut:out,giftTo:[...new Set(out.map(g=>g.to))]}:{}),...(got.length?{giftGot:got}:{})};
}
function giftStop(){
  if(giftUnsub){try{giftUnsub();}catch(e){}}giftUnsub=null;giftFor=null;
  Object.values(giftOutUnsubs).forEach(u=>{try{u();}catch(e){}});giftOutUnsubs={};
}
function giftListen(){
  if(!giftReady()){giftStop();return;}
  if(!(giftFor===fbPid&&giftUnsub)){
    giftStop();
    const pid=fbPid;giftFor=pid;
    try{giftUnsub=FB.collection('players').where('giftTo','array-contains',pid).onSnapshot(q=>{
      q.docs.forEach(d=>{const x=d.data()||{};(Array.isArray(x.giftOut)?x.giftOut:[]).forEach(g=>{if(g&&g.to===pid&&g.id)claimGift(pid,d.id,x.hero,g);});});
    },()=>{});}catch(e){giftUnsub=null;giftFor=null;}
  }
  giftWatchOut();
}
async function claimGift(pid,from,fromHero,g){
  const id=String(g.id);
  if(from===pid||!id.startsWith(from+'~'))return;   // 보낸 사람 프로필에서 만든 선물만
  if(!Array.isArray(P.giftGot))P.giftGot=[];
  if(P.giftGot.includes(id)||giftClaiming.has(id))return;
  const amt=Math.max(0,Math.min(GIFT_MAX,Math.floor(+g.a||0)));if(!amt)return;
  giftClaiming.add(id);
  try{
    const ref=FB.collection('players').doc(pid);
    const ok=await FB.runTransaction(async t=>{
      const sn=await t.get(ref),got=(sn.exists&&Array.isArray(sn.data().giftGot))?sn.data().giftGot:[];
      if(got.includes(id))return false;                // 다른 기기에서 이미 받음
      t.set(ref,{giftGot:[...got,id].slice(-GIFT_GOT_KEEP)},{merge:true});return true;
    });
    if(!P||P.uid!==pid)return;
    if(!P.giftGot.includes(id)){P.giftGot.push(id);P.giftGot=P.giftGot.slice(-GIFT_GOT_KEEP);}
    if(!ok){save();return;}
    const nm=giftName(fromHero);
    P.gold+=amt;P.giftLog=(P.giftLog||[]);P.giftLog.unshift({t:'in',n:nm,a:amt,at:Date.now()});P.giftLog=P.giftLog.slice(0,30);
    save();publishProfile();goldToast(amt,`${nm}님이 보낸 선물`);
    try{document.querySelectorAll('.row .gold').forEach(el=>{if(/ G$/.test(el.textContent))el.textContent=`${P.gold} G`;});}catch(e){}
  }catch(e){}
  finally{giftClaiming.delete(id);}
}
/* 보낸 선물: 받는 사람이 받았는지 지켜보다가 받으면 목록에서 지움 */
function giftWatchOut(){
  if(!giftReady())return;
  const want=new Set((P.giftOut||[]).map(g=>g.to));
  Object.keys(giftOutUnsubs).forEach(to=>{if(!want.has(to)){try{giftOutUnsubs[to]();}catch(e){}delete giftOutUnsubs[to];}});
  want.forEach(to=>{
    if(giftOutUnsubs[to])return;
    try{giftOutUnsubs[to]=FB.collection('players').doc(to).onSnapshot(sn=>{
      const got=(sn.exists&&Array.isArray(sn.data().giftGot))?sn.data().giftGot:[];
      const before=(P.giftOut||[]).length;
      P.giftOut=(P.giftOut||[]).filter(g=>!(g.to===to&&got.includes(g.id)));
      if(P.giftOut.length!==before){save();publishProfile();giftWatchOut();}
    },()=>{});}catch(e){}
  });
}
function giftSendUI(x){
  const name=giftName(x.hero);
  const max=Math.min(GIFT_MAX,Math.floor(P.gold/GIFT_STEP)*GIFT_STEP);
  const pend=(P.giftOut||[]).filter(g=>g.to===x.id);
  showStory(`<div class="sum fdetail"><div class="sum-title">💰 코인 보내기</div>
    <div class="sum-name">${esc(name)}</div>
    <div class="small">내 코인 ${fmt(P.gold)} · 한 번에 최대 ${fmt(GIFT_MAX)} 코인 · 보낸 코인은 내 코인에서 빠져요</div>
    <div class="gval" id="gval">0 <small>코인</small></div>

function pvpEnd(win){
  const e=B.e,pst=B.st,pest=B.est,pparty=partyIds().slice();clearBattle();
  if(P._pvpRestore){P.hp=P._pvpRestore.hp;P.mp=P._pvpRestore.mp;delete P._pvpRestore;}
  if(e.ranked){rankEnd(win,e,pst,pparty);return;}
  const today=new Date().toISOString().slice(0,10);
  P.pvp=P.pvp||{w:0,l:0,day:'',n:0};
  if(P.pvp.day!==today){P.pvp.day=today;P.pvp.n=0;}
  let msg;
  const fb=P.fbook&&e.friendId&&P.fbook[e.friendId];
  if(fb){if(win)fb.w=(fb.w||0)+1;else fb.l=(fb.l||0)+1;}
  else if(e.friendId){P.fvs=P.fvs||{};const v=P.fvs[e.friendId]||(P.fvs[e.friendId]={w:0,l:0});if(win)v.w++;else v.l++;}
  if(win){
    P.pvp.w++;
    if(P.pvp.n<PVP_DAILY){P.pvp.n++;const g=30+e.hero.lv*5;P.gold+=g;msg=`⚔ ${esc(e.heroName)}의 팀에 승리! +${g} G (오늘 대결 보상 ${P.pvp.n}/${PVP_DAILY})`;}
    else msg=`⚔ ${esc(e.heroName)}의 팀에 승리! (오늘 대결 보상은 모두 받았어요)`;
  }else{
    P.pvp.l++;msg=`${esc(e.heroName)}의 팀에 패배했다… 대결은 연습 경기라 잃은 것은 없다.`;
  }
  msg+=`<br>내 대결 전적: ${P.pvp.w}승 ${P.pvp.l}패`;
  save();renderFriends();
  showResult({title:`⚔ ${esc(e.heroName)}의 팀과 대결`,won:win,lines:msg.split('<br>'),st:pst,party:pparty,
    foe:{name:e.heroName,party:e.party.map(x=>x.id),st:pest||{dmg:{},heal:{}}}},null);
}

const RANK_CH=6, RANK_SAVIOR_LP=1500; // 챌린저에서 1500 LP를 모으면 구원자로 승급
