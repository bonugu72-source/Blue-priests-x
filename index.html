<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<title>푸른사제들</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&family=Noto+Serif+KR:wght@700;900&display=swap" rel="stylesheet">
<style>
/* 두 번 터치·핀치 확대 방지 */
html,body{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,a,input,select,textarea,[data-act],.btn{touch-action:manipulation}

:root{
  --bg:#070b18;--panel:#101831;--panel2:#16213f;--line:#26345e;
  --text:#e6ecff;--dim:#8d9bc4;--blue:#4da3ff;--blue2:#2b6fd6;
  --gold:#e8c76a;--red:#e05a5a;--green:#5fd39a;--mp:#5b8cff;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:'Noto Sans KR',system-ui,sans-serif;color:var(--text);
  background:radial-gradient(ellipse at 50% -10%,#1a2d63 0%,var(--bg) 60%) fixed;
  background-color:var(--bg);user-select:none;-webkit-user-select:none;
  transition:background-color .15s;
}
body.flash{background-color:#3a0f16}
body.holyflash{background-color:#2a3550}
.trust{display:flex;flex-wrap:wrap;align-items:center;gap:2px 6px;margin:3px 0 2px}.trust .hearts{font-size:11px;letter-spacing:-1px;white-space:nowrap}
.awkc{display:block;font-size:11px;opacity:.85;margin-top:2px}.awkc.ready{color:#ffe08a;opacity:1;font-weight:700}
#app{max-width:480px;margin:0 auto;padding:12px 12px 24px;min-height:100dvh;display:flex;flex-direction:column;gap:10px}
button{font-family:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default}

/* Title */
.title{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:20px 8px}
.cross{font-size:54px;color:var(--blue);text-shadow:0 0 24px var(--blue),0 0 60px var(--blue2);animation:pulse 3s ease-in-out infinite}
.title h1{font-family:'Noto Serif KR',serif;font-weight:900;font-size:44px;letter-spacing:4px;
  background:linear-gradient(180deg,#eaf3ff,#6fb6ff 60%,#2b6fd6);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 12px rgba(77,163,255,.45))}
.sub{color:var(--dim);letter-spacing:6px;font-size:12px;margin-top:-8px}
.title input{width:100%;max-width:280px;margin-top:18px;padding:14px;border-radius:12px;border:1px solid var(--line);
  background:var(--panel);color:var(--text);font-size:17px;text-align:center;font-family:inherit;outline:none}
.title input:focus{border-color:var(--blue)}
.title .btn{width:100%;max-width:280px}
.hint{color:var(--dim);font-size:12px;line-height:1.6}
@keyframes pulse{50%{opacity:.6;transform:scale(.96)}}

/* Buttons */
.btn{min-height:52px;padding:10px 12px;border-radius:12px;border:none;background:#1a2444;
  font-size:15px;font-weight:700;transition:transform .08s,background .15s}
.btn:active:not(:disabled){transform:scale(.97)}
.btn.primary{background:#2f5fae}
.btn.danger{background:#6a2a36}
.btn:disabled{opacity:.42}
.btn small{display:block;font-weight:400;font-size:11px;color:#c5d2f5;opacity:.85;margin-top:2px}
/* 메뉴 성격별 색상 (거점 화면) */
.btn.m-adv{background:#223a63}.btn.m-adv small{color:#b4c9ec}
.btn.m-adv.main{background:#2d5290}
.btn.m-rest{background:#1f3b34}.btn.m-rest small{color:#a6cfbd}
.btn.m-shop{background:#3e3322}.btn.m-shop small{color:#dcc493}
.btn.m-coll{background:#322b4a}.btn.m-coll small{color:#c4b6e6}
.btn.m-ally{background:#3d2a35}.btn.m-ally small{color:#e2b9c8}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid .full{grid-column:1/-1}
.link{background:none;border:none;color:var(--dim);font-size:13px;text-decoration:underline;padding:8px}
.foot{text-align:center}

/* Status */
.status{background:var(--panel);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.row b{font-size:16px}
.small{font-size:12px;color:var(--dim)}
.gold{color:var(--gold);font-weight:700}
.bar{position:relative;height:18px;border-radius:9px;background:#0a1024;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:9px;transition:width .35s ease}
.bar span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;text-shadow:0 1px 2px #000}
.bar.hp i{background:linear-gradient(90deg,#c43c4c,#ef6a6a)}
.bar.mp i{background:linear-gradient(90deg,#3462d9,#6f9cff)}
.bar.xp{height:10px}.bar.xp i{background:linear-gradient(90deg,#b8933a,#f0d27a)}.bar.xp span{font-size:8px}
.bar.ehp{height:14px;width:100%}.bar.ehp i{background:linear-gradient(90deg,#8e2a3a,#d84c5c)}

/* Panels */
.panel{background:var(--panel);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.ptitle{font-family:'Noto Serif KR',serif;font-size:17px;color:#cfe3ff}
.desc{font-size:13px;color:var(--dim);line-height:1.6}
.notice{background:#14244a;border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.7}
.area{display:flex;justify-content:space-between;align-items:center;padding:11px 12px;border-radius:10px;border:1px solid transparent;
  background:#0c1329;font-size:14px;text-align:left}
.area.on{border-color:#3d6fb8;background:#14264d}
.area.lock{opacity:.4}
.shopitem{display:flex;justify-content:space-between;align-items:center;gap:10px}
.shopitem .info{font-size:14px}.shopitem .info small{display:block;color:var(--dim);font-size:12px;margin-top:2px}
.shopitem .btn{min-height:42px;min-width:92px;font-size:14px}

/* Battle */
.enemy{background:linear-gradient(180deg,#121b38,#0b1126);border:1px solid transparent;border-radius:16px;padding:14px 14px 12px;
  display:flex;flex-direction:column;align-items:center;gap:8px;position:relative;overflow:hidden}
.enemy.boss{border-color:#7a2a3a;background:linear-gradient(180deg,#24101c,#0d0a18)}
.ename{font-family:'Noto Serif KR',serif;font-size:18px}
.ename em{font-style:normal;font-family:'Noto Sans KR';font-size:10px;font-weight:700;background:var(--red);border-radius:4px;padding:2px 5px;vertical-align:middle;margin-left:4px}
.eicon{font-size:86px;line-height:1.1;filter:drop-shadow(0 0 18px rgba(120,160,255,.35));animation:float 3s ease-in-out infinite}
.boss .eicon{filter:drop-shadow(0 0 22px rgba(224,90,90,.6))}
.eicon.charge{animation:charge .5s ease-in-out infinite}
.eicon.hit{animation:hit .35s}
.estat{font-size:12px;color:#ffb36b;min-height:16px;font-weight:700}
.pstat{font-size:12px;color:var(--green);text-align:center;min-height:16px}
@keyframes float{50%{transform:translateY(-6px)}}
@keyframes charge{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes hit{0%{transform:translateX(0)}20%{transform:translateX(-10px);filter:brightness(2.5)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}100%{transform:translateX(0)}}
.log{background:#080d1e;border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.65;min-height:128px;display:flex;flex-direction:column;justify-content:flex-end}
.log div{color:var(--dim)}
.log div:last-child{color:var(--text)}
.cmds .btn{min-height:54px}

.eicon.shadow{filter:brightness(.18) drop-shadow(0 0 18px rgba(224,90,90,.8))}
.eicon.triple{font-size:58px;letter-spacing:-8px}
.eflag{font-size:11px;color:var(--dim);letter-spacing:1px}
.party{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chip{font-size:12px;background:#17264a;border-radius:20px;padding:4px 10px}
.mission{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px;border-radius:10px;background:#0c1329}
.mission .info{font-size:14px;flex:1}.mission .info small{display:block;color:var(--dim);font-size:12px;margin-top:3px;line-height:1.5}
.mission .btn{min-height:40px;font-size:13px;min-width:86px}
.tag{font-size:10px;font-weight:700;border-radius:4px;padding:1px 5px;margin-right:4px;vertical-align:middle}
.tag.t-ally{background:#2b6fd6}.tag.item{background:#8a6a1f}.tag.done{background:#2f6b4c}
.ally{display:flex;gap:10px;align-items:center;font-size:14px}
.ally .ic{font-size:26px;width:36px;text-align:center}
.ally small{display:block;color:var(--dim);font-size:12px;line-height:1.5}
.ally.locked{opacity:.5}

/* Summon */
.sum{text-align:center;font-family:'Noto Sans KR',sans-serif}
.sum-stars{font-size:30px;color:var(--gold);letter-spacing:4px;text-shadow:0 0 14px rgba(232,199,106,.7)}
.sum-icon{font-size:76px;margin:6px 0;animation:pop .5s ease-out}
.sum.s3 .sum-icon{filter:drop-shadow(0 0 18px var(--blue))}
.sum.s2 .sum-icon{filter:drop-shadow(0 0 10px #8fb0ff)}
.sum-name{font-family:'Noto Serif KR',serif;font-size:22px;font-weight:900}
.sum-desc{font-size:13px;color:var(--dim);line-height:1.6;margin:10px 0}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}

.sum-title{font-size:13px;color:var(--dim);margin-bottom:6px}
.sumgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:8px 0 4px}
.sumcell{background:#0d1530;border:1px solid transparent;border-radius:10px;padding:6px 2px;position:relative;animation:pop .4s ease-out both}
.sumcell .ic{font-size:26px}.sumcell .st{font-size:9px;color:var(--gold);letter-spacing:-1px}.sumcell .nm{font-size:9px;line-height:1.2;word-break:keep-all}
.sumcell.s3{border-color:#4da3ff}.sumcell.s4{border-color:#b07cff;box-shadow:0 0 10px rgba(176,124,255,.5)}.sumcell.s5{border-color:var(--gold);box-shadow:0 0 14px rgba(232,199,106,.7)}
.sumcell .new{position:absolute;top:-6px;right:-4px;background:var(--red);font-size:8px;font-weight:700;border-radius:4px;padding:1px 3px}
.sum.s4 .sum-icon{filter:drop-shadow(0 0 20px #b07cff)}.sum.s5 .sum-icon{filter:drop-shadow(0 0 26px var(--gold))}

.acard{background:#0c1329;border:1px solid transparent;border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
.acard.fixed{background:#12204a}
.abtns{display:flex;gap:6px;flex-wrap:wrap}
.abtns .btn{min-height:36px;font-size:12px;padding:4px 10px;flex:1;white-space:nowrap}

/* Cover (title) */
body.title-mode{overflow:hidden}
.cover{position:fixed;inset:0;z-index:5;overflow:hidden;background:#05070f}
.cover .bgblur{position:absolute;inset:-10%;background:url(cover.jpg) center/cover no-repeat;filter:blur(28px) brightness(.35)}
.cover .bgwrap{position:absolute;top:0;left:50%;transform:translateX(-50%);width:min(100vw,560px);aspect-ratio:900/1304;overflow:hidden}
.cover .bgwrap::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,7,15,.7) 0%,transparent 18%,transparent 70%,#05070f 100%)}
.cover .bg{position:absolute;inset:0;background:url(cover.jpg) center top/cover no-repeat;animation:kenburns 26s ease-in-out infinite alternate}
@keyframes kenburns{from{transform:scale(1) translate(0,0)}to{transform:scale(1.07) translate(-1.2%,-1%)}}
.cover .aura{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen}
.cover .aura.blue{background:radial-gradient(circle at 76% 52%,rgba(70,130,255,.42),transparent 30%);animation:breathe 5.5s ease-in-out infinite}
.cover .aura.red{background:radial-gradient(circle at 15% 56%,rgba(255,50,60,.34),transparent 28%);animation:breathe 7s ease-in-out infinite reverse}
.cover .aura.halo{background:radial-gradient(ellipse at 64% 20%,rgba(150,190,255,.22),transparent 26%);animation:breathe 9s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.3}50%{opacity:1}}
.cover .fog{position:absolute;left:-50%;width:200%;height:46%;top:22%;pointer-events:none;
  background:radial-gradient(ellipse at 30% 50%,rgba(110,140,220,.14),transparent 55%),radial-gradient(ellipse at 75% 40%,rgba(90,120,200,.12),transparent 50%);
  filter:blur(18px);animation:drift 34s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-8%)}to{transform:translateX(8%)}}
.cover canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.cover .shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,transparent 0%,transparent 55%,rgba(5,7,15,.6) 72%,rgba(5,7,15,.9) 100%)}
.cover .vignette{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 140px rgba(0,0,0,.85)}
.cover .top{position:absolute;top:calc(22px + env(safe-area-inset-top));left:0;right:0;text-align:center;z-index:2}
.ctitle{font-family:'Noto Serif KR',serif;font-weight:900;font-size:46px;letter-spacing:6px;
  background:linear-gradient(180deg,#f2f7ff,#8cc4ff 55%,#3a7ae0);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 14px rgba(77,163,255,.55));animation:glow 4s ease-in-out infinite}
@keyframes glow{50%{filter:drop-shadow(0 0 26px rgba(120,180,255,.9))}}
.cover .sub{margin-top:2px}
.cover .ui{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:480px;z-index:2;
  padding:0 22px calc(26px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:stretch;gap:10px;animation:fadein 1.2s ease-out}
.cover input{padding:14px;border-radius:12px;border:1px solid rgba(120,160,255,.35);background:rgba(10,16,36,.72);color:var(--text);
  font-size:17px;text-align:center;font-family:inherit;outline:none;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.cover input:focus{border-color:var(--blue)}
.cover .btn{backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.cover .btn:not(.primary){background:rgba(22,33,63,.75)}
.cover .hint{text-align:center;color:#9fb0d8;text-shadow:0 1px 4px #000}
@media (prefers-reduced-motion: reduce){.cover .bg,.cover .aura,.cover .fog,.ctitle{animation:none}}

/* Demons */
.enemy.boss{background:radial-gradient(ellipse at 50% 45%,#2a0c16 0%,#0b0610 70%);border-color:#6b1f2e;box-shadow:inset 0 0 40px rgba(0,0,0,.8)}
.enemy.final{border-color:#b0203a;box-shadow:0 0 24px rgba(255,30,60,.25),inset 0 0 50px rgba(0,0,0,.9)}
.etitle{font-size:11px;color:#c79aa6;letter-spacing:1px;text-align:center;margin-top:-4px}
.epass{font-size:11px;color:#ffb0b0;font-weight:700}
.ename em.el{background:#a87a1c}
.eicon.art{animation:none;font-size:0;line-height:0}
.eicon.art.charge{animation:charge .5s ease-in-out infinite}
.eicon.sil{filter:brightness(0) drop-shadow(0 0 1.5px var(--gc)) drop-shadow(0 0 12px var(--gc))}
.eicon.sil.elite{font-size:100px}
.bsvg{width:230px;height:230px;overflow:visible;display:block}
.bsvg *{animation-delay:var(--t,0s)}
.bsvg .circle{transform-origin:100px 110px;animation:spin 48s linear infinite;opacity:.55}
.bsvg .pulse{animation:breathe 3.2s ease-in-out infinite}
.bsvg .body{animation:bob 4.5s ease-in-out infinite}
.bsvg .eyes{animation:bob 4.5s ease-in-out infinite,eyep 2.6s ease-in-out infinite}
.bsvg .wl{animation:flapL 3s ease-in-out infinite}.bsvg .wr{animation:flapR 3s ease-in-out infinite}
.bsvg .fire{animation:flick .18s steps(2) infinite alternate}
.bsvg .bolt{animation:bolt 1.7s steps(1) infinite}.bsvg .b2{animation-duration:2.3s}.bsvg .b3{animation-duration:1.3s}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bob{50%{transform:translateY(-4px)}}
@keyframes eyep{0%,100%{opacity:.75}50%{opacity:1}}
@keyframes flapL{50%{transform:rotate(-7deg)}}@keyframes flapR{50%{transform:rotate(7deg)}}
@keyframes flick{to{opacity:.7;transform:translateY(-1px) scaleY(1.04)}}
@keyframes bolt{0%,62%{opacity:0}64%,70%{opacity:1}72%,80%{opacity:0}82%,86%{opacity:1}88%{opacity:0}}
.intro-art .bsvg{width:210px;height:210px;margin:0 auto}
.sheet-art{display:flex;justify-content:center}.sheet-art .bsvg{width:170px;height:170px}
.chip .mhp{display:block;height:3px;background:#0a1024;border-radius:2px;margin-top:3px;overflow:hidden}
.chip .mhp b{display:block;height:100%;background:linear-gradient(90deg,#c43c4c,#ef6a6a)}
.chip.down{opacity:.35;text-decoration:line-through}
/* Boss portraits (user illustrations) */
.portrait{position:relative;width:210px;height:250px;border-radius:14px;overflow:hidden;margin:0 auto;animation:bob 4.5s ease-in-out infinite}
.portrait.big{width:250px;height:360px;animation:none}
.portrait.small{width:150px;height:180px;animation:none}
.portrait img{width:100%;height:100%;object-fit:cover;display:block}
.portrait .pglow{position:absolute;inset:0;pointer-events:none;border-radius:14px}
.portrait .pflash{position:absolute;inset:0;pointer-events:none}
.pf-furfur{box-shadow:0 0 22px rgba(120,200,255,.55),0 0 60px rgba(80,160,255,.25)}
.pf-furfur .pglow{box-shadow:inset 0 0 40px rgba(140,210,255,.55);animation:pzap 2.2s steps(1) infinite}
.pf-furfur .pflash{background:rgba(220,240,255,.85);mix-blend-mode:screen;opacity:0;animation:lflash 3.7s infinite}
.pf-furfur .prain{position:absolute;inset:-20% 0 0 0;pointer-events:none;opacity:.35;
  background:repeating-linear-gradient(100deg,transparent 0 9px,rgba(200,225,255,.55) 9px 10px,transparent 10px 22px);animation:rain .45s linear infinite}
.pbolts{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.pbolts path{fill:none;stroke:#e4f4ff;stroke-width:.8;filter:drop-shadow(0 0 3px #8fd0ff);opacity:0}
.pbolts .bolt{animation:bolt 1.9s steps(1) infinite}.pbolts .b2{animation-duration:2.6s}.pbolts .b3{animation-duration:1.4s}
.pf-naberius{box-shadow:0 0 24px rgba(255,40,60,.55),0 0 70px rgba(200,0,30,.3)}
.pf-naberius .pglow{background:radial-gradient(ellipse at 50% 100%,rgba(255,40,40,.45),transparent 60%);box-shadow:inset 0 0 50px rgba(120,0,10,.7);animation:breathe 2.6s ease-in-out infinite}
.pf-naberius.p2{box-shadow:0 0 34px rgba(255,30,50,.85),0 0 100px rgba(255,0,30,.45)}
.pf-naberius.p2 .pglow{background:radial-gradient(ellipse at 50% 100%,rgba(255,50,30,.7),transparent 70%);animation-duration:1.2s}
.pf-naberius.p2 img{filter:saturate(1.3) contrast(1.1)}
.pf-perta{box-shadow:0 0 30px rgba(220,225,255,.6),0 0 90px rgba(255,215,120,.3)}
.pf-perta .pglow{background:radial-gradient(ellipse at 50% 100%,rgba(255,230,160,.35),transparent 65%);box-shadow:inset 0 0 50px rgba(30,30,60,.6);animation:breathe 3s ease-in-out infinite}
.pf-mumyeong{box-shadow:0 0 30px rgba(160,90,255,.7),0 0 90px rgba(110,40,220,.4)}
.pf-mumyeong .pglow{background:radial-gradient(ellipse at 50% 100%,rgba(150,80,255,.5),transparent 65%);box-shadow:inset 0 0 50px rgba(40,0,80,.7);animation:breathe 2.4s ease-in-out infinite}
.pf-mumyeong .pembers i{background:#b07cff;box-shadow:0 0 6px #8a4dff,0 0 12px #6a2dff}
.pembers{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.pembers i{position:absolute;bottom:-6px;width:4px;height:4px;border-radius:50%;background:#ff5a3a;box-shadow:0 0 6px #ff3a1a,0 0 12px #ff2a0a;animation:ember 3s linear infinite}
.pf-naberius.p2 .pembers i{width:5px;height:5px}
@keyframes lflash{0%,88%,100%{opacity:0}89%{opacity:.55}90%{opacity:0}92%{opacity:.35}94%{opacity:0}}
@keyframes pzap{0%,60%{opacity:.6}61%{opacity:1}75%{opacity:.7}}
@keyframes rain{to{transform:translate(-6px,22px)}}
@keyframes ember{0%{transform:translate(0,0);opacity:0}10%{opacity:1}100%{transform:translate(18px,-320px);opacity:0}}

.intro-art.berserk{animation:ragequake .25s ease-in-out infinite;filter:drop-shadow(0 0 20px #ff2a2a)}
.cdbar{height:5px;border-radius:3px;background:rgba(255,255,255,.06);margin:0 0 6px;overflow:hidden}
.cdbar i{display:block;height:100%;background:linear-gradient(90deg,#4da3ff,#9fd0ff);animation:cdshrink linear forwards}
@keyframes cdshrink{from{width:100%}to{width:0}}
.btn.guardon{background:linear-gradient(135deg,#2b6a4a,#3fae78)!important;color:#eafff3!important;opacity:1!important;box-shadow:0 0 12px rgba(63,174,120,.5)}
body:has(.status) #bgmbtn{display:none}
.bgmmini{background:none;border:none;font-size:14px;padding:0 0 0 8px;cursor:pointer;vertical-align:middle}
#bgmbtn{position:fixed;top:10px;right:10px;z-index:60;width:34px;height:34px;border-radius:50%;border:none;background:rgba(10,18,40,.75);font-size:16px;line-height:1;cursor:pointer;padding:0}
.stoast{position:fixed;left:50%;transform:translateX(-50%);z-index:999;display:flex;align-items:center;gap:10px;min-width:250px;max-width:92vw;padding:10px 16px;border-radius:14px;

.stoast.out{opacity:0;transform:translate(-50%,-14px)}

@keyframes stspin{50%{transform:scale(1.18) rotate(12deg)}}

.pf-terazio{box-shadow:0 0 30px rgba(255,40,40,.7),0 0 90px rgba(255,90,40,.35)}
.pf-terazio .pglow{background:radial-gradient(ellipse at 50% 100%,rgba(255,80,30,.55),transparent 62%);box-shadow:inset 0 0 50px rgba(90,0,0,.7);animation:breathe 2s ease-in-out infinite}

.pf-barbatos{box-shadow:0 0 26px rgba(170,90,255,.6),0 0 80px rgba(80,140,255,.3)}
.pf-barbatos .pglow{background:radial-gradient(ellipse at 50% 100%,rgba(90,150,255,.45),transparent 62%);box-shadow:inset 0 0 50px rgba(60,0,110,.7);animation:breathe 2.6s ease-in-out infinite}
.pf-barbatos .pembers i{background:#9fd0ff;box-shadow:0 0 6px #4aa8ff,0 0 12px #7a4dff}
.pf-gamigin{box-shadow:0 0 26px rgba(255,50,60,.6),0 0 80px rgba(160,0,20,.35)}
.pf-gamigin .pglow{background:radial-gradient(ellipse at 50% 100%,rgba(200,20,40,.5),transparent 62%);box-shadow:inset 0 0 50px rgba(80,0,10,.7);animation:breathe 2.4s ease-in-out infinite}

.pf-valefor{box-shadow:0 0 24px rgba(150,180,255,.55),0 0 70px rgba(255,110,40,.25)}
.pf-valefor .pglow{background:radial-gradient(ellipse at 50% 100%,rgba(255,120,40,.4),transparent 60%);box-shadow:inset 0 0 44px rgba(120,150,255,.4);animation:breathe 2.8s ease-in-out infinite}

.pf-amon{box-shadow:0 0 26px rgba(255,110,30,.6),0 0 80px rgba(255,60,0,.3)}

/* Map */
.mapwrap{max-height:56vh;overflow-y:auto;border-radius:12px;background:radial-gradient(ellipse at 50% 0%,rgba(255,255,255,.04),transparent 60%),#070b18}

.mapline{position:absolute;inset:0;width:100%;height:100%}

.node.done{background:#1a2a50;border-color:#4a6fb8;color:#9fc0ff}
.node.next{border-color:var(--gc);box-shadow:0 0 0 0 var(--gc);animation:nodep 1.6s ease-out infinite;background:#14244a}
.node.lock{opacity:.35}
.node.sel{outline:3px solid #fff;outline-offset:3px}
.node.elite{border-color:#a87a1c}
.node.mid{width:54px;height:54px;font-size:20px;border-color:#b0203a;background:#2a0c16;color:#ff6a7a}
.node.boss{width:64px;height:64px;font-size:26px;border-color:#ff2a4a;background:#3a0a14;color:#ff5a6a;box-shadow:0 0 18px rgba(255,40,70,.45)}

.sheet{position:sticky;bottom:8px;z-index:3;box-shadow:0 -6px 24px rgba(0,0,0,.6)}

.memrow{width:100%;text-align:left;background:linear-gradient(135deg,rgba(255,230,240,.08),rgba(200,220,255,.06));border:1px solid rgba(255,210,230,.35);border-radius:12px;color:inherit;font:inherit;cursor:pointer;padding:6px}

/* Summon FX */
.sfx{position:fixed;inset:0;z-index:70;overflow:hidden;display:flex;align-items:center;justify-content:center;--c:#9fb8ff;cursor:pointer}
.sfx.s3{--c:#4da3ff}.sfx.s4{--c:#b07cff}.sfx.s5{--c:#ffd24a}
.sfx-bg{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,color-mix(in srgb,var(--c) 28%,#03050c),#03050c 70%);animation:sfxfade .3s ease-out}
.sfx-circle{position:absolute;width:240px;height:240px;top:50%;left:50%;transform:translate(-50%,-50%)}
.sfx-circle div{position:absolute;inset:0;border-radius:50%;border:2px solid var(--c);box-shadow:0 0 16px var(--c),inset 0 0 16px var(--c);opacity:.85}
.sfx-circle .r1{animation:sfxspin 2.4s linear infinite;border-style:dashed}
.sfx-circle .r2{inset:28px;animation:sfxspin 1.8s linear infinite reverse}
.sfx-circle .r3{inset:62px;border-width:3px;animation:sfxpulse .6s ease-in-out infinite alternate}
.sfx-pillar{position:absolute;left:50%;top:-10%;width:70px;height:120%;transform:translateX(-50%) scaleX(0);
  background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--c) 70%,#fff),#fff,color-mix(in srgb,var(--c) 70%,#fff),transparent);filter:blur(6px);animation:sfxpillar 1s .45s ease-out forwards}
.sfx-rays{position:absolute;width:900px;height:900px;left:50%;top:50%;margin:-450px 0 0 -450px;opacity:0;
  background:repeating-conic-gradient(from 0deg,color-mix(in srgb,var(--c) 55%,transparent) 0 6deg,transparent 6deg 18deg);
  mask:radial-gradient(circle,#000 0 20%,transparent 62%);-webkit-mask:radial-gradient(circle,#000 0 20%,transparent 62%);animation:sfxrays 4s .7s linear forwards}
.sfx-rays.r2{animation-direction:reverse;animation-duration:5s;filter:saturate(1.4) brightness(1.1)}
.sfx-parts i{position:absolute;left:50%;top:50%;width:var(--s);height:var(--s);border-radius:50%;background:#fff;box-shadow:0 0 8px var(--c),0 0 16px var(--c);opacity:0;
  transform:rotate(var(--a)) translateY(0);animation:sfxburst 1.1s ease-out forwards}
.sfx-flash{position:absolute;inset:0;background:radial-gradient(circle,#fff,color-mix(in srgb,var(--c) 60%,#fff) 50%,transparent 80%);opacity:0;animation:sfxflash .9s .55s ease-out forwards}
.sfx-label{position:absolute;top:calc(50% + 150px);left:0;right:0;text-align:center;font-size:34px;letter-spacing:6px;color:var(--c);
  text-shadow:0 0 12px var(--c),0 0 28px var(--c);opacity:0;animation:sfxlabel .7s 1s cubic-bezier(.2,1.6,.4,1) forwards}
.sfx-skip{position:absolute;bottom:calc(24px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;color:#8a96b8;font-size:12px}
.sfx.s5{animation:sfxshake .5s .6s 2}
.sfx.s5 .sfx-circle div{border-color:#fff3b0}
@keyframes sfxfade{from{opacity:0}}
@keyframes sfxspin{to{transform:rotate(360deg)}}
@keyframes sfxpulse{to{transform:scale(1.12);opacity:1}}
@keyframes sfxpillar{0%{transform:translateX(-50%) scaleX(0);opacity:0}40%{opacity:1}100%{transform:translateX(-50%) scaleX(1);opacity:.9}}
@keyframes sfxrays{0%{opacity:0;transform:rotate(0)}15%{opacity:1}100%{opacity:.8;transform:rotate(90deg)}}
@keyframes sfxburst{0%{opacity:1;transform:rotate(var(--a)) translateY(0)}100%{opacity:0;transform:rotate(var(--a)) translateY(calc(-1*var(--r)))}}
@keyframes sfxflash{0%{opacity:0}25%{opacity:.95}100%{opacity:0}}
@keyframes sfxlabel{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:scale(1)}}
@keyframes sfxshake{0%,100%{transform:translate(0)}20%{transform:translate(-6px,3px)}40%{transform:translate(5px,-4px)}60%{transform:translate(-4px,-2px)}80%{transform:translate(3px,4px)}}
/* reveal: high-rarity shine */
.sumcell.s4,.sumcell.s5{overflow:hidden}
.sumcell.s4::after,.sumcell.s5::after{content:'';position:absolute;inset:-40%;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.55) 50%,transparent 60%);animation:shine 1.8s 1s ease-in-out infinite}
.sumcell.s5{background:linear-gradient(160deg,#3a2a08,#0d1530)}
.sum.s5 .sum-icon{position:relative}

.sum.s4 .sum-stars{color:#cfa8ff;text-shadow:0 0 14px #b07cff}
@keyframes shine{0%{transform:translateX(-60%)}60%,100%{transform:translateX(60%)}}

<body>
<div id="app"></div>
<div id="fx"></div>
<div id="modal" class="hidden"><div class="mbox"><div id="mtext"></div><button class="btn primary" id="mbtn">계속</button></div></div>

<script>
/* 모바일 확대 방지: 두 번 터치(더블탭)·핀치 확대 차단 (iOS Safari는 user-scalable=no를 무시하므로 직접 막음) */
(()=>{let last=0,sx=0,sy=0,moved=false;
  document.addEventListener('touchstart',e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;moved=false;},{passive:true});
  document.addEventListener('touchmove',e=>{const t=e.touches[0];if(t&&(Math.abs(t.clientX-sx)>10||Math.abs(t.clientY-sy)>10))moved=true;},{passive:true});
  document.addEventListener('touchend',e=>{
    const now=Date.now(),tg=e.target;
    if(now-last<=300&&!moved&&!(tg.closest&&tg.closest('input,textarea,select,label'))){
      e.preventDefault(); // 두 번째 탭의 확대를 막고, 탭 자체는 그대로 눌리게 함
      const el=tg.closest?tg.closest('button,a,[data-act],[onclick],summary')||tg:tg;
      if(!(el.disabled||(el.closest&&el.closest('[disabled]'))))el.click&&el.click();
    }
    last=now;},{passive:false});
  ['gesturestart','gesturechange','gestureend'].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));
  document.addEventListener('touchmove',e=>{if(e.touches&&e.touches.length>1)e.preventDefault();},{passive:false});
  document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
})();

/* ===================== BGM (Web Audio로 직접 합성 — 외부 음원 없음) ===================== */
const BGM=(()=>{
  let ctx=null,master,comp,echo,echoFb,echoOut,noiseBuf,wind=null,cur=null,want=null,timer=null,nextT=0,step=0;
  let on=true;try{on=localStorage.getItem('bp_bgm')!=='0'}catch(e){}
  const VOL=0.45;
  const mf=m=>440*Math.pow(2,(m-69)/12);
  function init(){
    if(ctx)return;
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    ctx=new AC();
    comp=ctx.createDynamicsCompressor();comp.threshold.value=-18;comp.ratio.value=4;comp.connect(ctx.destination);
    master=ctx.createGain();master.gain.value=0;master.connect(comp);
    echo=ctx.createDelay(1.5);echoFb=ctx.createGain();echoOut=ctx.createGain();
    echo.connect(echoFb);echoFb.connect(echo);echo.connect(echoOut);echoOut.connect(master);
    noiseBuf=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate);
    const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  }
  function tone(m,t,dur,o={}){
    const osc=ctx.createOscillator(),g=ctx.createGain();
    osc.type=o.type||'triangle';osc.frequency.setValueAtTime(mf(m),t);
    if(o.detune)osc.detune.value=o.detune;
    if(o.vib){const l=ctx.createOscillator(),lg=ctx.createGain();l.frequency.value=5.2;lg.gain.value=o.vib;l.connect(lg);lg.connect(osc.frequency);l.start(t);l.stop(t+dur+(o.rel||0.3));}
    const a=o.att||0.01,r=o.rel||0.25,v=o.vol||0.1;
    g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v,t+a);
    g.gain.setValueAtTime(v,t+Math.max(a,dur));g.gain.exponentialRampToValueAtTime(0.0001,t+Math.max(a,dur)+r);
    let node=osc;
    if(o.lp){const f=ctx.createBiquadFilter();f.type='lowpass';f.frequency.value=o.lp;f.Q.value=o.q||0.7;osc.connect(f);node=f;}
    node.connect(g);g.connect(master);if(o.echo){const s=ctx.createGain();s.gain.value=o.echo;g.connect(s);s.connect(echo);}
    osc.start(t);osc.stop(t+Math.max(a,dur)+r+0.05);
  }
  function noise(t,dur,o={}){
    const s=ctx.createBufferSource();s.buffer=noiseBuf;
    const f=ctx.createBiquadFilter();f.type=o.ft||'highpass';f.frequency.value=o.f||6000;f.Q.value=o.q||0.7;
    const g=ctx.createGain();const v=o.vol||0.05;
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    s.connect(f);f.connect(g);g.connect(master);s.start(t,Math.random()*1.5);s.stop(t+dur+0.05);
  }
  function drum(t,o={}){ // 북(팀파니·타이코) — 음정이 떨어지는 사인파
    const osc=ctx.createOscillator(),g=ctx.createGain();osc.type='sine';
    osc.frequency.setValueAtTime(o.f0||130,t);osc.frequency.exponentialRampToValueAtTime(o.f1||42,t+(o.drop||0.18));
    g.gain.setValueAtTime(o.vol||0.5,t);g.gain.exponentialRampToValueAtTime(0.0001,t+(o.dur||0.5));
    osc.connect(g);g.connect(master);osc.start(t);osc.stop(t+(o.dur||0.5)+0.05);
    noise(t,0.06,{ft:'lowpass',f:900,vol:(o.vol||0.5)*0.25});
  }
  /* ---- 로비: 산뜻한 바람 (C장조 · 92BPM) ---- */
  const L_CH=[[48,55,64,71],[45,52,60,67],[41,48,57,64],[43,50,59,62]];
  const L_MEL=[ // [16분음표 위치, 음, 길이(16분)]
    [[0,72,3],[4,76,2],[6,79,4],[12,76,4]],
    [[0,74,3],[4,72,2],[6,69,6],[14,72,2]],
    [[0,77,3],[4,76,2],[6,72,4],[10,74,2],[12,76,4]],
    [[0,74,6],[8,79,4],[12,81,4]],
    [[0,84,4],[4,81,2],[6,79,4],[10,76,2],[12,79,4]],
    [[0,76,3],[4,74,2],[6,72,6],[12,69,4]],
    [[0,72,2],[2,74,2],[4,76,4],[8,79,2],[10,81,2],[12,79,4]],
    [[0,74,8],[8,72,8]]
  ];
  function lobbyStep(st,t,s16){
    const bar=Math.floor(st/16)%8,p=st%16,ch=L_CH[bar%4];
    if(p===0){
      ch.forEach((m,i)=>tone(m+12,t,s16*15,{type:'sine',vol:0.035,att:0.7,rel:1.2,lp:2200,detune:i%2?6:-6}));
      tone(ch[0]-12,t,s16*6,{type:'sine',vol:0.11,att:0.02,rel:0.4});
    }
    if(p===8)tone(ch[0]-12,t,s16*5,{type:'sine',vol:0.08,att:0.02,rel:0.4});
    if([0,3,6,8,11,14].includes(p)){const n=ch[[0,1,2,3,2,1][[0,3,6,8,11,14].indexOf(p)]]+12;tone(n,t,s16*0.8,{type:'triangle',vol:0.04,att:0.005,rel:0.35,echo:0.35});}
    if(p%4===2)noise(t,0.05,{f:8000,vol:0.012});
    L_MEL[bar].forEach(([ps,m,len])=>{if(ps===p)tone(m,t,s16*len*0.9,{type:'sine',vol:0.07,att:0.02,rel:0.5,vib:3,echo:0.4});});
  }
  /* ---- 전투: 웅장한 행진 (D단조 · 128BPM) ---- */
  const B_CH=[[50,57,62,65],[46,53,58,62],[48,55,60,64],[45,52,57,61]];
  const B_ROOT=[38,34,36,33];
  const B_MEL=[[[0,74,4],[4,77,4],[8,81,8]],[[0,82,6],[6,81,2],[8,79,8]],[[0,79,4],[4,81,4],[8,84,8]],[[0,85,8],[8,81,8]],
               [[0,86,4],[4,84,2],[6,82,2],[8,81,8]],[[0,82,4],[4,81,2],[6,79,2],[8,77,8]],[[0,79,2],[2,81,2],[4,82,4],[8,84,8]],[[0,85,12],[12,81,4]]];
  function battleStep(st,t,s16){
    const bar=Math.floor(st/16)%16,p=st%16,ci=bar%4,ch=B_CH[ci],r=B_ROOT[ci],sec=Math.floor(bar/8);
    if(p===0){
      ch.forEach((m,i)=>tone(m,t,s16*15,{type:'sawtooth',vol:0.022,att:0.12,rel:0.5,lp:1400,detune:i%2?8:-8}));
      tone(r-12,t,s16*15,{type:'sawtooth',vol:0.035,att:0.05,rel:0.4,lp:300});
      if(bar%8===0)noise(t,1.8,{f:5000,vol:0.06});
    }
    if(p%2===0)tone(r+(p%4===0?0:12),t,s16*1.6,{type:'sawtooth',vol:0.05,att:0.005,rel:0.08,lp:700,q:2});
    if(sec===1){const arp=[ch[0]+12,ch[1]+12,ch[2]+12,ch[3]+12];tone(arp[p%4],t,s16*0.8,{type:'square',vol:0.014,att:0.003,rel:0.06,lp:3000});}
    if([0,6,8,11,12,14].includes(p))drum(t,{vol:p===0||p===8?0.55:0.35,f0:p===0?140:110});
    if(p===4||p===12)noise(t,0.22,{f:1800,ft:'bandpass',q:0.8,vol:0.09});
    if(bar%8>=4||sec===1){const mb=sec===1?B_MEL[4+ci]:B_MEL[ci];mb.forEach(([ps,m,len])=>{if(ps===p)tone(m,t,s16*len*0.95,{type:'sawtooth',vol:0.035,att:0.04,rel:0.3,lp:2200,vib:4,echo:0.25});});}
  }
  const TR={lobby:{bpm:92,fn:lobbyStep,echoT:0.49,fb:0.35},battle:{bpm:128,fn:battleStep,echoT:0.35,fb:0.2}};
  function startWind(){
    if(wind)return;
    const s=ctx.createBufferSource();s.buffer=noiseBuf;s.loop=true;
    const f=ctx.createBiquadFilter();f.type='bandpass';f.frequency.value=700;f.Q.value=0.6;
    const g=ctx.createGain();g.gain.value=0.018;
    const l=ctx.createOscillator(),lg=ctx.createGain();l.frequency.value=0.09;lg.gain.value=0.014;l.connect(lg);lg.connect(g.gain);
    const l2=ctx.createOscillator(),l2g=ctx.createGain();l2.frequency.value=0.05;l2g.gain.value=350;l2.connect(l2g);l2g.connect(f.frequency);
    s.connect(f);f.connect(g);g.connect(master);s.start();l.start();l2.start();wind={s,l,l2,g};
  }
  function stopWind(){if(!wind)return;try{wind.s.stop();wind.l.stop();wind.l2.stop();}catch(e){}wind=null;}
  function tick(){
    if(!ctx||!cur||ctx.state!=='running')return;
    const tr=TR[cur],s16=60/tr.bpm/4;
    if(nextT<ctx.currentTime)nextT=ctx.currentTime+0.05;
    while(nextT<ctx.currentTime+0.3){tr.fn(step,nextT,s16);nextT+=s16;step++;}
  }
  function switchTo(name){
    if(!ctx||!on){cur=null;return;}
    if(cur===name)return;
    const now=ctx.currentTime;
    master.gain.cancelScheduledValues(now);master.gain.setValueAtTime(master.gain.value,now);master.gain.linearRampToValueAtTime(0,now+0.4);
    setTimeout(()=>{
      if(want!==name)return;
      cur=name;step=0;nextT=ctx.currentTime+0.05;
      echo.delayTime.value=TR[name].echoT;echoFb.gain.value=TR[name].fb;echoOut.gain.value=0.6;
      if(name==='lobby')startWind();else stopWind();
      const t=ctx.currentTime;master.gain.cancelScheduledValues(t);master.gain.setValueAtTime(0,t);master.gain.linearRampToValueAtTime(VOL,t+1.2);
      if(!timer)timer=setInterval(tick,80);
    },450);
  }
  function play(name){want=name;if(ctx&&ctx.state==='running')switchTo(name);}
  function unlock(){
    if(!on)return;
    init();if(!ctx)return;
    const go=()=>{if(want&&cur!==want)switchTo(want);};
    if(ctx.state!=='running')ctx.resume().then(go).catch(()=>{});else go();
  }
  function toggle(){
    on=!on;try{localStorage.setItem('bp_bgm',on?'1':'0')}catch(e){}
    if(on){unlock();}else if(ctx){const t=ctx.currentTime;master.gain.cancelScheduledValues(t);master.gain.setValueAtTime(master.gain.value,t);master.gain.linearRampToValueAtTime(0,t+0.3);stopWind();cur=null;}
    btn();
  }
  function btn(){let b=document.getElementById('bgmbtn');if(!b){b=document.createElement('button');b.id='bgmbtn';b.onclick=e=>{e.stopPropagation();toggle();};document.body.appendChild(b);}
    b.textContent=on?'🔊':'🔇';b.title=on?'배경음악 끄기':'배경음악 켜기';}
  document.addEventListener('pointerdown',unlock,{passive:true});
  document.addEventListener('keydown',unlock);
  document.addEventListener('visibilitychange',()=>{if(!ctx)return;if(document.hidden)ctx.suspend();else if(on)ctx.resume();});
  window.addEventListener('DOMContentLoaded',btn);if(document.readyState!=='loading')setTimeout(btn,0);
  document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('[data-bgm]');if(b){e.stopPropagation();toggle();document.querySelectorAll('[data-bgm]').forEach(x=>x.textContent=on?'🔊':'🔇');}});
  return {play,toggle,isOn:()=>on};
})();

function allyFace(id,cls){

/* 스테이지 */
const stageType=s=>s===15?'boss':s===10?'mid':s===5?'elite':'normal';
const STYPE_LABEL={normal:'일반',elite:'정예',mid:'솔로몬 72악마',boss:'나라 보스'};
const stageRec=(a,s)=>Math.round(AREAS[a].rec+(s-1)*(AREAS[a].recEnd-AREAS[a].rec)/(STAGES-1));
/* 실시간 전투 속도 (ms) */
const RT={atkCd:1500,defCd:400,itemCd:1500,fleeCd:1000,allyMs:1500,bossMs:1500,midMs:1600,normalMs:1800};
const DEF_FLOOR=0.3; // 방어력이 아무리 높아도 적 공격의 30%는 들어감
const ENEMY_MULT=1.3, LATE_BOSS_MULT=1.1; // 적 공격력·체력 1.3배 (나베리우스·보티스는 1.1배)
const NORMAL_HP=[2.4,4,4.5,5,5.5,6,6.5,7,7.5,8,8.5,9,9.5,10,10.5,11], NORMAL_REWARD=1.5; // 일반 적이 몇 턴은 버티며 공격하도록
function scaleBase(base,a,s){
  const f=1+0.06*(s-1);
  return {...base,hp:Math.round(base.hp*f*NORMAL_HP[a]),atk:Math.round(base.atk*f),def:Math.round(base.def*(1+0.04*(s-1))),
    xp:Math.round(base.xp*f*NORMAL_REWARD),gold:Math.round(base.gold*f*NORMAL_REWARD)};
}
function scaledEnemy(a,s,base){
  const ar=AREAS[a];
  return scaleBase(base||ar.enemies[(s-1)%ar.enemies.length],a,s);
}
/* 자유 사냥: huntW(가중치)가 있는 적은 더 자주 등장 (기본 1) */
function huntPick(list){const tot=list.reduce((t,x)=>t+(x.huntW||1),0);let r=Math.random()*tot;for(const x of list){r-=(x.huntW||1);if(r<0)return x;}return list[list.length-1];}
function stageEnemy(a,s){
  const ar=AREAS[a],t=stageType(s);
  if(t==='boss')return JSON.parse(JSON.stringify(ar.boss));
  if(t==='mid')return JSON.parse(JSON.stringify(ar.mid));
  if(t==='elite')return {...JSON.parse(JSON.stringify(ar.elite)),elite:true};
  return scaledEnemy(a,s);
}
function stageName(a,s){
  const t=stageType(s),ar=AREAS[a];
  if(t==='boss')return ar.boss.name;
  if(t==='mid')return ar.mid.name;
  if(t==='elite')return ar.elite.name;

const DLINK_ABC='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';   // 헷갈리는 0·O·1·I 는 뺀 32자
const DLINK_MIN=10;
function newLinkCode(){
  let a;try{a=new Uint8Array(8);crypto.getRandomValues(a);}catch(e){a=Array.from({length:8},()=>Math.floor(Math.random()*256));}
  return Array.from(a,b=>DLINK_ABC[b%32]).join('');
}
const fmtLinkCode=c=>c.slice(0,4)+'-'+c.slice(4);

/* 입력 해석: 연결 링크(#d=…) · 8자리 연결 코드 · 예전 저장 코드(BP1:) */
function parseDeviceInput(raw){
  const t=String(raw||'').trim();
  if(!t)return null;
  const m=t.match(/#d=([^\s#&]+)/);
  if(m){try{const v=decodeURIComponent(m[1]),i=v.lastIndexOf('.'),pid=v.slice(0,i),key=v.slice(i+1);
    if(i>0&&key.length>=16)return {pid,key};}catch(e){}return null;}
  if(t.replace(/\s+/g,'').startsWith('BP1:')){const p=decodeSave(t);return p?{save:p}:null;}
  const c=t.toUpperCase().replace(/[\s-]/g,'');
  if(c.length===8&&[...c].every(ch=>DLINK_ABC.includes(ch)))return {code:c};
  return null;
}
/* 이 기기를 캐릭터(pid)에 연결하고 클라우드의 최신 기록을 가져오기 */
async function fbLinkDevice(pid,key){
  if(fbBinding){try{await fbBinding;}catch(e){}}
  const devRef=FB.doc(`owners/${pid}/devices/${fbAuthUid}`);
  let linked=false;
  try{linked=(await withTimeout(devRef.get())).exists;}catch(e){}
  if(!linked){
    try{await withTimeout(devRef.set({key}));}
    catch(e){throw {msg:e&&e.code==='permission-denied'?'연결 정보가 맞지 않아요. 쓰던 기기에서 새 연결 코드나 링크를 받아 주세요.':'연결하지 못했어요. 인터넷 연결을 확인하고 다시 시도해 주세요.'};}
  }
  let snap;
  try{snap=await withTimeout(FB.doc('saves/'+pid).get());}catch(e){throw {msg:'클라우드 기록을 불러오지 못했어요. 잠시 뒤 다시 시도해 주세요.'};}
  let remote=null;
  if(snap.exists){try{const d=snap.data();if(d&&d.key===SAVE_KEY)remote=JSON.parse(d.json);}catch(e){}}
  if(!remote||!remote.name||!remote.lv||!Array.isArray(remote.prog))
    throw {msg:'클라우드에 저장된 기록이 없어요. 쓰던 기기에서 게임을 한 번 열어 두고 다시 시도해 주세요.'};
  remote.uid=pid;remote.skey=key;
  P=remote;
  try{localStorage.setItem(SAVE_KEY,JSON.stringify(P))}catch(e){}
  await fbBind(P);
  return P;
}

  const pid=p.uid,key=p.skey,origAt=p.savedAt||0;   // 저장 코드로 불러온 직후엔 원래 저장 시각으로 비교
  if(fbPid){fbPid=null;DBX=null;myId=null;cloudRef=null;}

    try{
      const devRef=FB.doc(`owners/${pid}/devices/${fbAuthUid}`);
      if(!(await withTimeout(devRef.get())).exists){
        try{await withTimeout(FB.doc('owners/'+pid).set({key}));}catch(e){}   // 처음 쓰는 캐릭터면 주인 등록
        await withTimeout(devRef.set({key}));                               // 키가 맞아야 이 기기 연결
      }
      fbPid=pid;fbKey=key;DBX=FB;USERX=null;myId=pid;canShare=null;lastPub='';
      cloudRef=FB.doc('saves/'+pid);cloudState='on';
      const snap=await withTimeout(cloudRef.get());
      let remote=null;
      if(snap.exists){try{const d=snap.data();if(d&&d.key===SAVE_KEY)remote=JSON.parse(d.json);}catch(e){}}
      const mine=(P&&P.uid===pid)?P:p;
      if(remote&&remote.uid===pid&&(remote.savedAt||0)>origAt+1000){
        if(!remote.skey)remote.skey=key;
        try{localStorage.setItem(SAVE_KEY,JSON.stringify(remote))}catch(e){}
        if(P&&P.uid===pid){P=remote;fbBinding=null;renderHub('☁ 다른 기기에서 더 최근에 저장한 기록을 불러왔어요.');}

        try{await cloudRef.set({json:JSON.stringify(mine),savedAt:mine.savedAt||Date.now(),key:SAVE_KEY});}catch(e){}
      }
      if(P&&P.uid===pid){fbMergeFriends();publishProfile();if(pendingFriend)takePendingFriend();}
    }catch(e){if(!fbPid)cloudState='denied';}
    fbBinding=null;updateCloudNote();

function startMotes(cv){
  const ctx=cv.getContext('2d');
  const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W,H,dpr;
  const resize=()=>{dpr=Math.min(2,window.devicePixelRatio||1);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);};
  resize();
  const COLORS=['143,183,255','110,150,255','255,110,110','230,240,255'];
  const mk=(init)=>{const c=Math.random();return{
    x:Math.random()*W, y:init?Math.random()*H:H+10,
    r:rnd(0.6,2.2), vy:-rnd(0.12,0.45), vx:rnd(-0.08,0.08), ph:Math.random()*6.28, sp:rnd(0.01,0.03),
    col:c<0.55?COLORS[0]:c<0.7?COLORS[1]:c<0.88?COLORS[2]:COLORS[3]};};
  const ps=Array.from({length:reduce?14:46},()=>mk(true));
  const fx={raf:0,resize};
  const tick=()=>{
    ctx.clearRect(0,0,W,H);
    for(const p of ps){
      p.ph+=p.sp;p.y+=p.vy;p.x+=p.vx+Math.sin(p.ph)*0.15;
      if(p.y<-10)Object.assign(p,mk(false));
      const a=0.25+0.45*(0.5+0.5*Math.sin(p.ph*1.7));
      const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*5);
      g.addColorStop(0,`rgba(${p.col},${a})`);g.addColorStop(1,`rgba(${p.col},0)`);
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,p.r*5,0,6.283);ctx.fill();
    }
    fx.raf=requestAnimationFrame(tick);
  };
  tick();
  window.addEventListener('resize',resize);
  return fx;
}

/* 접속 상태: 게임을 열어 둔 동안 2분마다 seenAt만 살짝 올림 → 4분 안이면 「접속 중」, 앱을 떠나면 off 표시 */

const presenceText=(t,off)=>!t?'접속 기록 없음':isOnline(t,off)?'🟢 접속 중':`마지막 접속 ${agoText(t)}`;
const presenceHTML=x=>{const t=lastSeenOf(x),off=x.off?1:0;
  return `<span class="pres ${isOnline(t,off)?'on':''}" data-sid="${esc(x.id||'')}" data-seen="${t}" data-off="${off}">${presenceText(t,off)}</span>`;};
function refreshPresence(map){
  document.querySelectorAll('.pres[data-seen]').forEach(el=>{
    const x=map&&map[el.dataset.sid];
    if(x&&lastSeenOf(x)>=(+el.dataset.seen||0)){el.dataset.seen=lastSeenOf(x);el.dataset.off=x.off?1:0;}
    const t=+el.dataset.seen||0,off=el.dataset.off==='1';

  });
}

/* ===================== 친구 (코드·링크 방식: 서버 없이 어디서나) ===================== */
const FCODE_PREFIX='BPF1:';
function myFriendCode(){
  const pub=myPublic();delete pub.friends;
  return FCODE_PREFIX+btoa(unescape(encodeURIComponent(JSON.stringify({v:1,id:P.uid,...pub}))));
}
function myFriendLink(){return location.href.split('#')[0]+'#f='+encodeURIComponent(myFriendCode());}
function parseFriendCode(str){
  try{
    let t=String(str||'').trim();
    const i=t.indexOf('#f=');if(i>=0)t=decodeURIComponent(t.slice(i+3));
    const j=t.indexOf(FCODE_PREFIX);if(j<0)return null;
    t=t.slice(j+FCODE_PREFIX.length).replace(/[^A-Za-z0-9+/=]/g,'');
    const o=JSON.parse(decodeURIComponent(escape(atob(t))));
    if(!o||typeof o.id!=='string'||!o.team||!Array.isArray(o.team.party))return null;
    return {id:o.id.slice(0,24),hero:String(o.hero||'모험가').replace(/[<>&"'`]/g,'').slice(0,8),lv:pvpCl(o.lv,1,9999),cp:pvpCl(o.cp,0,9999999),
      area:pvpCl(o.area,0,AREAS.length-1),stage:pvpCl(o.stage,0,STAGES),ended:!!o.ended,team:o.team,pvpW:pvpCl(o.pvpW,0,1e6),pvpL:pvpCl(o.pvpL,0,1e6),updatedAt:pvpCl(o.updatedAt,0,9e15)};
  }catch(e){return null;}
}
function addFriendByCode(str){
  const f=parseFriendCode(str);
  if(!f)return {ok:false,msg:'친구 코드를 읽지 못했어요. 코드를 전부 복사했는지 확인해 주세요.'};
  if(f.id===P.uid)return {ok:false,msg:'내 친구 코드예요. 친구의 코드를 넣어 주세요.'};
  P.fbook=P.fbook||{};
  const old=P.fbook[f.id];
  if(!old&&Object.keys(P.fbook).length>=100)return {ok:false,msg:'친구는 100명까지 추가할 수 있어요.'};
  if(old&&(old.updatedAt||0)>f.updatedAt)return {ok:true,msg:`${esc(f.hero)}님은 이미 더 최신 정보로 등록되어 있어요.`};
  P.fbook[f.id]={...f,w:old?old.w||0:0,l:old?old.l||0:0,addedAt:old?old.addedAt:Date.now()};
  save();
  return {ok:true,msg:old?`🔄 ${esc(f.hero)}님의 정보를 최신으로 갱신했어요. (전투력 ${fmt(f.cp)})`:`🤝 ${esc(f.hero)}님을 친구로 추가했어요!`};
}
function agoText(t){
  const m=Math.floor((Date.now()-t)/60000);
  return m<1?'방금':m<60?m+'분 전':m<1440?Math.floor(m/60)+'시간 전':Math.floor(m/1440)+'일 전';
}
function copyText(txt,btn){
  const done=()=>{if(btn){const o=btn.dataset.lbl||btn.innerHTML;btn.dataset.lbl=o;btn.innerHTML='✔ 복사됨';setTimeout(()=>btn.innerHTML=o,1500);}};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done,()=>fallback());}else fallback();
  function fallback(){const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done();}catch(e){}ta.remove();}
}

function takePendingFriend(){

  // 짧은 친구 링크인데 아직 클라우드 연결 중이면 연결이 끝난 뒤 처리

    fbAddFriend(code).then(m=>renderFriends(m));return true;

    renderFriendsCode('⚠ 아직 클라우드에 연결되지 않아 친구 링크를 처리하지 못했어요. 연결된 뒤 친구 화면에서 코드를 넣어 주세요.');return true;

function teamIconsHTML(party){return party.map(x=>`<span class="pvpa" title="${ALLIES[x.id].name}">${allyFace(x.id,'pv')}<i>Lv${x.lv}</i></span>`).join('');}
function startPvp(f){
  const t=f&&f.team;if(!t)return;
  const hero={atk:pvpCl(t.atk,1,9999),def:pvpCl(t.def,0,9999),maxHp:pvpCl(t.maxHp,1,99999),lv:pvpCl(t.lv,1,9999)};
  const party=(Array.isArray(t.party)?t.party:[]).filter(x=>x&&ALLIES[x.id]).slice(0,4)
    .map(x=>({id:x.id,lv:pvpCl(x.lv,1,60),aw:pvpCl(x.aw,0,AWAKEN_MAX),my:x.my?1:0,tr:pvpCl(x.tr||0,0,TRUST_MAX)}));
  const allyHp=party.reduce((s,x)=>s+Math.round((50+x.lv*10)*(0.7+0.15*ALLIES[x.id].star)*(x.my?2:1)*(ALLIES[x.id].hpMul||1)),0);
  const heroName=(String(f.hero||'').replace(/[<>&"'`]/g,'').slice(0,8))||'모험가';
  const e={name:`${heroName}의 팀`,heroName,hp:Math.round(hero.maxHp*PVP_HP+allyHp*0.35),atk:hero.atk,def:hero.def,xp:0,gold:0,
    pvp:true,hero,party,friendId:f.id,cp:pvpCl(f.cp,0,9999999)};
  P._pvpRestore={hp:P.hp,mp:P.mp};
  P.hp=P.maxHp;P.mp=P.maxMp;   // 대결은 연습 경기: 가득 찬 상태로 시작, 끝나면 원래대로
  startBattle({area:P.cur,pvp:e});
}
function pvpEnemyActs(e){
  const h=e.hero,r=Math.random();
  if(e.hp<e.maxHp*0.4&&r<0.25){
    const hh=Math.round(e.maxHp*0.12);e.hp=Math.min(e.maxHp,e.hp+hh);
    addLog(`${e.heroName}의 치유의 기도 — 팀 HP ${hh} 회복`);queueFx('enemy','+'+hh,'heal');
  }else if(h.lv>=8&&r<0.12)hitPlayer(2.5,`${e.heroName}의 대천사의 심판`);
  else if(r<0.4)hitPlayer(1.6,`${e.heroName}의 성광 일격`);
  else hitPlayer(1,`${e.heroName}의 공격`);
  for(const a of e.party){
    if(P.hp<=0)break;
    const al=ALLIES[a.id],m=multOf(a.id,a.aw,a.my)*trustMultT(a.id,a.tr),lv=a.lv,nm=`${e.heroName}의 ${al.name}`;
    const dmg=(base,f,label)=>{
      let d=(base*m-P.def*(B.curse?0.6:1)*f)*rnd(0.9,1.1);
      if(B.defending)d*=0.6;if(B.ward)d*=0.5;
      d=Math.max(1,Math.round(d));P.hp=Math.max(0,P.hp-d);addLog(`${label}! ${d} 피해`);queueFx('player','-'+d,'pdmg');
    };
    const heal=pct=>{const hh=Math.round((e.maxHp*pct*0.25+lv*2)*m);e.hp=Math.min(e.maxHp,e.hp+hh);addLog(`${nm} — 팀 HP ${hh} 회복`);queueFx('enemy','+'+hh,'heal');};
    switch(al.kit){
      case 'isabel': case 'monk_heal': case 'civ_heal':
        if(e.hp<e.maxHp*0.6)heal(al.kit==='monk_heal'?0.25:al.kit==='civ_heal'?0.12:0.11);
        else dmg(6+lv*2,0.5,`${nm}의 공격`);
        break;
      case 'seju':     if(Math.random()<0.08)dmg((8+lv*4)*3,0.5,`${nm} — 은총 폭주`);else dmg(8+lv*4,0.5,`${nm}의 은총`);break;
      case 'dominion': dmg(11+lv*3.2,0,`${nm}의 빛의 절단`);break;
      case 'asiris':   if(Math.random()<0.34)dmg(30+lv*9,0,`${nm} — 신의 은총`);else addLog(`${nm} — 기적의 대가로 숨을 고른다`);break;
      case 'grace':    dmg(4+lv*4.6,0.5,`${nm}의 은총`);break;
      case 'curse':    if(Math.random()<0.35){B.curse=Math.max(B.curse,2);addLog(`${nm}의 저주 — 방어력 감소`);}else dmg(7+lv*2.5,0.5,`${nm}의 저주의 일격`);break;
      case 'sight':    B.curse=Math.max(B.curse,2);addLog(`${nm}의 투시 — 약점을 간파당했다 (방어력 감소)`);break;
      case 'civ_mp':   addLog(`${nm}의 응원`);break;
      case 'talisman': if(Math.random()<0.3){B.curse=Math.max(B.curse,2);addLog(`${nm}의 저주 부적 — 방어력 감소`);}else dmg(9+lv*3.6,0.3,`${nm}의 부적 투척`);break;
      case 'earth':    dmg(14+lv*4.4,0.5,`${nm}의 대지 가르기`);break;
      case 'flower':   if(e.hp<e.maxHp*0.6&&Math.random()<0.5)heal(0.14);else dmg(8+lv*3.4,0.5,`${nm}의 꽃잎`);break;
      case 'prism':    dmg(12+lv*4.2,0.3,`${nm}의 보석 광선`);break;
      case 'storm':    dmg(11+lv*3.8,0.4,`${nm}의 깃털 칼날`);break;
      case 'fixed':    {const d=Math.max(1,Math.round((20+lv*6)*m));P.hp=Math.max(0,P.hp-d);addLog(`${nm}의 등불 — 고정 피해! ${d} 피해`);queueFx('player','-'+d,'pdmg');}break;
      case 'weakspot': if(Math.random()<(a.my?0.3:0.15)){const d=Math.max(1,Math.round((12+lv*4)*3*m));P.hp=Math.max(0,P.hp-d);addLog(`${nm}의 약점 일격 — 고정 피해! ${d} 피해`);queueFx('player','-'+d,'pdmg');}else dmg(12+lv*4,0.5,`${nm}의 창 찌르기`);break;
      case 'judge':    dmg((12+lv*3.4)*(P.hp/P.maxHp>e.hp/e.maxHp?1.6:1),0.3,`${nm}의 심판의 창`);break;
      case 'sakura':   dmg(10+lv*3.6,0.4,`${nm}의 벚꽃 칼날`);break;
      case 'twin':     dmg(6+lv*1.8,0.5,`${nm}의 쌍검 ①`);dmg(6+lv*1.8,0.5,`${nm}의 쌍검 ②`);break;
      case 'guard':    if(e.hp<e.maxHp*0.5&&Math.random()<0.3)heal(0.06);else dmg(9+lv*2.8,0.4,`${nm}의 방패 강타`);break;
      case 'chant':    if(e.hp<e.maxHp*0.7&&Math.random()<0.4)heal(0.12);else dmg(7+lv*2.4,0.5,`${nm}의 빛의 음표`);break;
      case 'tide':     dmg(12+lv*4,0.5,`${nm}의 물살`);break;
      case 'train':    if(Math.random()<0.4)dmg(vistaBase(lv)*(a.my?3:2),0,`${nm}의 열차 관통`);else dmg(vistaBase(lv),0.5,`${nm}의 군도 베기`);break;
      case 'breeze':   if(e.hp<e.maxHp*0.7&&Math.random()<0.45)heal(0.1);else dmg(6+lv*2.4,0.5,`${nm}의 낙엽 바람`);break;
      case 'purify':   if(e.hp<e.maxHp*0.5&&Math.random()<0.4)heal(0.12);else dmg(10+lv*3.6,0.4,`${nm}의 날개 베기`);break;
      case 'monk_holy':dmg(8+lv*2.8,0,`${nm}의 성수 투척`);break;
      case 'civ_atk': case 'civ_burn': case 'civ_blind': case 'civ_cart': case 'civ_scan': case 'civ_guard': case 'civ_food':
                       dmg(6+lv*2,0.5,`${nm}의 ${al.skill}`);break;
      default:         dmg(10+lv*3,0.5,`${nm}의 공격`);
    }
  }
}
function pvpEnd(win){
  const e=B.e,pst=B.st,pparty=partyIds().slice();clearBattle();
  if(P._pvpRestore){P.hp=P._pvpRestore.hp;P.mp=P._pvpRestore.mp;delete P._pvpRestore;}
  const today=new Date().toISOString().slice(0,10);
  P.pvp=P.pvp||{w:0,l:0,day:'',n:0};
  if(P.pvp.day!==today){P.pvp.day=today;P.pvp.n=0;}
  let msg;
  const fb=P.fbook&&e.friendId&&P.fbook[e.friendId];
  if(fb){if(win)fb.w=(fb.w||0)+1;else fb.l=(fb.l||0)+1;}
  else if(e.friendId){P.fvs=P.fvs||{};const v=P.fvs[e.friendId]||(P.fvs[e.friendId]={w:0,l:0});if(win)v.w++;else v.l++;}
  if(win){
    P.pvp.w++;
    if(P.pvp.n<PVP_DAILY){P.pvp.n++;const g=30+e.hero.lv*5;P.gold+=g;msg=`⚔ ${esc(e.heroName)}의 팀에 승리! +${g} G (오늘 대결 보상 ${P.pvp.n}/${PVP_DAILY})`;}
    else msg=`⚔ ${esc(e.heroName)}의 팀에 승리! (오늘 대결 보상은 모두 받았어요)`;
  }else{
    P.pvp.l++;msg=`${esc(e.heroName)}의 팀에 패배했다… 대결은 연습 경기라 잃은 것은 없다.`;
  }
  msg+=`<br>내 대결 전적: ${P.pvp.w}승 ${P.pvp.l}패`;
  save();renderFriends();
  showResult({title:`⚔ ${esc(e.heroName)}의 팀과 대결`,won:win,lines:msg.split('<br>'),st:pst,party:pparty},null);
}

const REST_CD=3*60*1000;

  const l=restLeft();

  const sec=Math.ceil(l/1000);

function migrateSave(){
  if(!P.uid)P.uid='u'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
  if(!P.noMp){P.noMp=1;if(P.relics&&P.relics.includes('seal_glasya'))P.atk+=5;if(P.items&&P.items.rosary){P.items.water+=P.items.rosary;P.items.rosary=0;}}
  if(!P.myth)P.myth={};
  ['prog','wins'].forEach(k=>{if(!Array.isArray(P[k]))P[k]=[];while(P[k].length<AREAS.length)P[k].push(0);});
  if(!Array.isArray(P.cleared))P.cleared=[];while(P.cleared.length<AREAS.length)P.cleared.push(false);
  if(P.ended&&P.unlocked<5)P.unlocked=5;
  // 이전 버전에서 마지막 지역 보스를 이미 깬 경우: 새로 추가된 다음 지역을 연다
  let opened=null;
  for(let i=0;i<AREAS.length-1;i++)if((P.prog[i]>=STAGES||P.cleared[i])&&P.unlocked<i+1){P.unlocked=i+1;opened=i+1;}
  return opened;
}
function renderHub(msg){

  if(opened!=null){save();showStory(AREAS[opened].intro,()=>renderHub(`🔓 새 지역 개방: ${AREAS[opened].flag} ${AREAS[opened].name}`));return;}
  if(hubTab==='shop'){renderShop(msg);return;}
  if(hubTab==='ally'){renderAllyTab(msg);return;}
  if(hubTab==='friend'){renderFriends(msg);return;}
  const a=AREAS[P.cur],prog=P.prog[P.cur],cleared=prog>=STAGES,nxt=Math.min(STAGES,prog+1);
  // 개방된 지역 + 다음 잠긴 지역 1곳만 보여 화면을 짧게 유지
  const RS=realmStart();
  const areaBtn=(ar,i)=>{const locked=i>P.unlocked;
    return `<button class="area ${ar.realm?'realm':''} ${i===P.cur?'on':''} ${locked?'lock':''}" data-i="${i}" ${locked?'disabled':''}>
      <span class="an">${locked?'🔒 ???':ar.flag+' '+ar.name}</span><span class="small">${locked?'다음 지역':P.prog[i]>=STAGES?'✔ 완료':P.prog[i]+'/'+STAGES}</span></button>`;};
  const areas=AREAS.slice(0,Math.min(RS,P.unlocked+2)).map((ar,i)=>areaBtn(ar,i)).join('');
  const realmOpen=P.unlocked>=RS;
  const realms=realmOpen?AREAS.map((ar,i)=>({ar,i})).filter(x=>x.ar.realm&&x.i<=P.unlocked+1).map(x=>areaBtn(x.ar,x.i)).join(''):'';

  const ms=MISSIONS.filter(m=>m.area===P.cur&&!m.auto);
  const missionHTML=ms.length?ms.map(m=>{

function summonFx(top,cb){
  const n=top>=5?46:top>=4?30:top>=3?18:10;
  const parts=Array.from({length:n},()=>`<i style="--a:${Math.round(Math.random()*360)}deg;--r:${Math.round(90+Math.random()*170)}px;--s:${(2+Math.random()*4).toFixed(1)}px;animation-delay:${(0.55+Math.random()*0.5).toFixed(2)}s"></i>`).join('');
  const ov=document.createElement('div');
  ov.className='sfx s'+top;
  ov.innerHTML=`<div class="sfx-bg"></div>
    <div class="sfx-circle"><div class="r1"></div><div class="r2"></div><div class="r3"></div></div>
    <div class="sfx-pillar"></div>${top>=4?'<div class="sfx-rays"></div>':''}${top>=5?'<div class="sfx-rays r2"></div>':''}

    <div class="sfx-flash"></div><div class="sfx-skip">탭하여 건너뛰기</div>`;

function summon(n,useTicket){
  if(useTicket){if(P.tickets<n)return;P.tickets-=n;}
  else{const c=n===11?SUMMON11_COST:SUMMON_COST*n;if(P.gold<c)return;P.gold-=c;}
  const res=[];
  for(let i=0;i<n;i++){
    const id=pick(allyIds(rollStar()));
    const isNew=!owned(id);addAlly(id);res.push({id,isNew});
  }
  save();
  const top=res.reduce((a,b)=>ALLIES[b.id].star>ALLIES[a.id].star?b:a);
  summonFx(ALLIES[top.id].star,()=>showStory(revealHTML(res,n===1?'소환 결과':n+'회 소환 결과'+(res.some(r=>r.gift)?' + 🎁 ★4 확정':'')),()=>renderShop(`${n}회 소환 완료 · 최고 등급 ${'★'.repeat(ALLIES[top.id].star)} ${ALLIES[top.id].name}`),true));
}
function synthesize(id){
  const al=ALLIES[id],need=SYN_NEED[al.star];
  if(!need||(P.roster[id]||0)<need)return;
  P.roster[id]-=need;
  if(P.roster[id]<=0){delete P.roster[id];P.active=P.active.filter(x=>x!==id);}
  const nid=pick(allyIds(al.star+1)),isNew=!owned(nid);
  addAlly(nid);save();
  summonFx(ALLIES[nid].star,()=>showStory(revealHTML([{id:nid,isNew}],`합성: ${al.name} ×${need} →`),()=>renderAllies(`🔮 합성 완료 — ${'★'.repeat(ALLIES[nid].star)} ${ALLIES[nid].name}`),true));
}

function synthAll(){
  const plan=synthPlan();if(!plan.length)return;
  const res=[];
  for(const {id,n} of plan){
    const al=ALLIES[id],need=SYN_NEED[al.star];
    for(let i=0;i<n;i++){

      const nid=pick(allyIds(al.star+1)),isNew=!owned(nid);
      addAlly(nid);res.push({id:nid,isNew});

    if(P.roster[id]<=0){delete P.roster[id];P.active=P.active.filter(x=>x!==id);}
  }
  save();
  const top=res.reduce((a,b)=>ALLIES[b.id].star>ALLIES[a.id].star?b:a);

}

    addLog(`🗡 영혼을 가르는 일격! 방어하지 못했다 — 주인공 ${d} · 모든 동료 현재 HP 절반 소멸`);queueFx('player','🗡-'+d,'pdmg');
    document.body.classList.add('flash');setTimeout(()=>document.body.classList.remove('flash'),300);
  }
  renderBattle();
}
/* 테라지오: 5초마다 거스르는 파동 — 방어 태세가 아니면 현재 HP 절반 소멸 */
function waveTick(){
  if(!B||B.over||B.won||P.hp<=0||!$('#modal').classList.contains('hidden')){if(B)B.waveAt=Date.now()+B.e.wave;return;}
  const e=B.e;B.waveAt=Date.now()+e.wave;
  if(B.guard){const d=Math.max(1,Math.round(P.hp*0.1));P.hp=Math.max(1,P.hp-d);addLog(`🌀 거스르는 파동 — 방어 태세로 버텼다 (${d} 피해)`);queueFx('player','-'+d,'pdmg');}
  else{const d=Math.floor(P.hp/2);P.hp-=d;addLog(`🌀 거스르는 파동! 방어하지 못했다 — 현재 HP의 절반 ${d} 소멸`);queueFx('player','🌀-'+d,'pdmg');
    document.body.classList.add('flash');setTimeout(()=>document.body.classList.remove('flash'),300);}
  renderBattle();
}
/* 가미긴: 3초마다 동료 전원 마비 (방어력 50% 감소 → 받는 피해 1.5배) */
function paraTick(){
  if(!B||B.over||B.won||!$('#modal').classList.contains('hidden'))return;
  const was=paraOn();B.paraUntil=Date.now()+B.e.paralyze+600;
  if(!was){addLog(`⚡ ${B.e.name}의 마비 — 동료 전원 방어력 50% 감소 (3초마다 다시 걸림)`);renderBattle();}
}
const stormOn=()=>!!(B&&B.stormUntil&&Date.now()<B.stormUntil);
/* 키리에: 처음 쓰러진 동료 부활 (신화 2회) */
function allyDown(id){
  if(B&&id==='miner'&&!B.minerva&&B.ahp.miner){
    const h=B.ahp.miner;B.minerva=true;h.hp=h.max;B.stun.miner=0;
    addLog(`🌊 미네르가 쓰러지는 순간, 물기둥이 솟구친다 — 물의 여신 「미네르바」 각성! (HP 100% · 고정 피해 + 치명타)`);
    queueFx('player','🌊 미네르바','mpf');document.body.classList.add('holyflash');setTimeout(()=>document.body.classList.remove('holyflash'),400);
    stat('heal','miner',h.hp);return true;
  }
  if(!B||id==='kirie'||!inParty('kirie'))return false;
  const k=B.ahp.kirie;if(!k||k.hp<=0||(B.stun.kirie>0))return false;
  const max=isMyth('kirie')?2:1;if((B.revives||0)>=max)return false;
  const h=B.ahp[id];h.hp=Math.round(h.max*0.5);B.revives=(B.revives||0)+1;
  addLog(`🪶 키리에의 날개 — ${ALLIES[id].name} HP 50%로 부활!`);stat('heal','kirie',h.hp);return true;
}
function stat(kind,who,v){if(!B||!B.st||!who||!(v>0))return;const o=B.st[kind];o[who]=(o[who]||0)+Math.round(v);}
function queueFx(target,txt,cls){B.fxq.push([target,txt,cls]);}
const enemyDef=()=>B.e.def*(B.weak?0.5:1);

function cmdHTML(){
  const cdLeft=Math.max(0,(B.cdUntil||0)-Date.now());
  const dis=(B.busy||pFrozen()||cdLeft>0)?'disabled':'';
  const cdBar=cdLeft>0?`<div class="cdbar"><i style="animation-duration:${B.cdLen}ms;animation-delay:-${B.cdLen-cdLeft}ms"></i></div>`:'<div class="cdbar"></div>';
  if(B.menu==='item'){
    return `<div class="grid">
      ${cdBar}<button class="btn full" data-item="water" ${(B.busy||!P.items.water||cdLeft>0||pFrozen())?'disabled':''}>성수 ×${P.items.water}<small>HP 40% 회복 (최소 60)</small></button>
      <button class="btn full" data-back="1" ${dis}>← 뒤로</button></div>`;
  }
  return `${cdBar}<div class="grid">
    <button class="btn primary full" data-act="attack" ${dis}>${pFrozen()?`🧊 얼음을 깨는 중… ${Math.ceil((B.pFrozenUntil-Date.now())/1000)}초`:`⚔ 공격<span class="awkc ${(B.atkN||0)===AWAKEN_SKILL.every-1?'ready':''}">✨ 각성 ${'●'.repeat(B.atkN||0)}${'○'.repeat(AWAKEN_SKILL.every-(B.atkN||0))} ${(B.atkN||0)===AWAKEN_SKILL.every-1?'다음 공격 발동!':''}</span>`}</button>
    <button class="btn ${B.defending?'guardon':''}" data-act="defend" ${B.defending||B.busy||pFrozen()?'disabled':''}>${B.defending?'🛡 방어 중':'🛡 방어'}<small>${B.defending?'공격하면 해제':'피해 40% 감소 · 동료도 공격 멈춤'}</small></button>
    <button class="btn" data-act="itemmenu" ${dis}>🧪 아이템</button>
    <button class="btn full" data-act="flee" ${(B.busy||B.isBoss)?'disabled':''}>${B.pvp?'대결 중에는 도망칠 수 없다':B.isBoss?'보스전에서는 도망칠 수 없다':'🏃 도망 (60%)'}</button>

  if(B.drainAt)st.push(`🩸 흡수 ${Math.max(0,Math.ceil((B.drainAt-Date.now())/1000))}초`);
  if(B.freezeAt)st.push(pFrozen()?'🧊 주인공 빙결':`🧊 빙결 ${Math.max(0,Math.ceil((B.freezeAt-Date.now())/1000))}초`);
  if(aFrozen())st.push('❄ 동료 빙결');

  if(B.e.wave&&B.waveAt)st.push(`🌀 파동 ${Math.max(0,Math.ceil((B.waveAt-Date.now())/1000))}초${B.guard?' · 🛡 방어 태세':''}`);

    return `<span class="chip ${(h&&h.hp<=0)||(B.stun[id]>=9999)?'down':''}">${allyFace(id,'xs')} ${ALLIES[id].name}${B.vslow&&B.vslow[id]?' 🐢🔇':''}<i class="mhp"><b style="width:${p}%"></b></i></span>`;}).join('')}</div>`;
  const tag=B.pvp?'<em class="el">DUEL</em>':B.stype==='boss'?`<em>${B.isFinal?'FINAL':'BOSS'}</em>`:B.stype==='mid'?'<em>DEMON</em>':B.stype==='elite'?'<em class="el">ELITE</em>':'';
  const t=-(performance.now()/1000).toFixed(2);
  const vis=e.pvp?`<div class="eicon pvpvis" id="eicon"><div class="pvphero">✝</div><div class="pvpteam">${teamIconsHTML(e.party)}</div></div>`:e.art?`<div class="eicon art ${B.charging?'charge':''}" id="eicon" style="--t:${t}s">${bossSVG(e.art)}</div>`
    :`<div class="eicon sil ${e.elite?'elite':''} ${B.charging?'charge':''}" id="eicon" style="--gc:${e.elite?'#ff3040':AREAS[B.area].glow}">${e.icon}</div>`;
  const passive=[];
  if(e.dimension)passive.push('🌀 차원 전이');
  if(e.zap)passive.push('⚡ 흐르는 전류 (3초마다)');
  // 실시간 전투: 별도 맹공 없음
  if(e.slashes)passive.push(`🗡 추격 참격 ×${e.slashes}`);
  if(B.evade)passive.push('👁 투명화');
  if(B.immune)passive.push('⏸ 시간 정지: 이번 턴 피해 무효 — 회복·방어 추천');
  if(B.reflect)passive.push('↩ 뒤집힌 시간: 준 피해의 50% 반사');
  if(e.bleedOnHit)passive.push('🩸 공격 시 출혈');
  if(e.burnHit)passive.push('🔥 공격 시 화상');
  if(e.timeStop)passive.push(`⏳ ${e.timeStop.every/1000}초마다 시간정지 ${e.timeStop.ms/1000}초 (방어 시 ${e.timeStop.guardMs/1000}초)`);
  if(e.reflectHero)passive.push(`🔮 주인공 공격 ${Math.round(e.reflectHero*100)}% 반사`);
  if(e.noBleed)passive.push('🩸 출혈 면역');
  if(e.critSlash)passive.push('💥 공격마다 치명타 참격');
  if(e.relay)passive.push((B.relayStage||0)===0?`🩸 HP ${fmt(e.relay.at)} 이하 어둠의 군주 교대`:B.relayStage===1?'🩸 어둠의 군주를 쓰러뜨리면 나베리우스 귀환':'🩸 흡혈 50% · 5초마다 생명력 흡수');
  if(e.twin)passive.push(B.twinned?'🧊 7초마다 빙결 · 얼어붙은 숨결 · ❄ 절대 영도(방어 필수)':`☯ HP ${fmt(e.twin.at)} 이하 쌍둥이 교대`);
  if(e.critAll)passive.push(`💥 모든 공격 치명타 ×${e.critAll*(B.awoke&&e.awaken?e.awaken.critMult:1)}`);
  if(e.awaken)passive.push(B.awoke?'💢 각성: 3초마다 영혼을 가르는 일격':`💢 HP ${fmt(e.awaken.at)} 이하 각성`);
  if(e.burnBleed)passive.push('🔥🩸 끝없는 화상·출혈');
  if(e.madness)passive.push(B.maddened?`💢 ${e.madness.logName||'광기'}: 공격력 ${e.madness.atkMult}배`:`💢 HP ${fmt(e.madness.at)} 이하 ${e.madness.logName||'광기'}`);
  if(e.wave)passive.push('🌀 5초마다 거스르는 파동');
  if(e.fixedDmg)passive.push('🎯 방어력 무시 고정 피해');
  if(e.paralyze)passive.push('⚡ 3초마다 동료 마비');
  if(e.berserk)passive.push(B.berserked?'💢 폭주 중':`💢 HP ${fmt(e.berserk.at)} 이하 폭주`);
  if(e.slowSil)passive.push(`🌀 강탈: 동료 ${e.slowSil}명 둔화·침묵`);
  if(e.rage)passive.push(B.raged?'💢 발악: 공격력 2배':'💢 HP 50% 이하 발악');
  if(e.burnAll)passive.push('🔥 끝없는 화상: 주인공·동료');
  if(e.voidHero)passive.push(`🔥 주인공 공격 ${Math.round(e.voidHero*100)}% 무효`);
  if(e.sealAlly)passive.push('🏹 사냥 표식: 동료 1명 전투 종료까지 행동 불능');
  let warn='';
  if(B.charging){
    warn=B.chargeKind==='jeongyeok'?`⚠ 「전격」 — 방어하지 않으면 HP 절반 소멸`
      :B.chargeKind==='tornado'?`⚠ 「스파크 토네이도」 — 방어해도 HP 1/3 소멸`
      :B.chargeKind==='deathblow'?`☠ 「죽음의 일격」 — 방어하지 않으면 동료 1명 사망`
      :B.chargeKind==='zero'?`❄ 「절대 영도」 — 방어하지 않으면 HP 절반 + 3초 빙결`
      :`⚠ 「${B.chargeName}」 준비 중 — 방어 추천`;
  }
  $('#app').innerHTML=`${statusHTML()}
    <div class="enemy ${B.isBoss?'boss':''} ${B.isFinal?'final':''}">
      <div class="eflag">${AREAS[B.area].flag} ${AREAS[B.area].name}${B.pvp?' · 친구 대결':B.stage?` · 스테이지 ${B.stage}`:' · 자유 사냥'}</div>
      <div class="ename">${e.name}${tag}</div>
      ${e.title?`<div class="etitle">${e.title}</div>`:''}
      ${vis}
      ${bar(e.hp,e.maxHp,'ehp')}
      ${passive.length?`<div class="epass">${passive.join(' · ')}</div>`:''}
      <div class="estat">${warn}</div>
    </div>
    ${party}
    <div class="pstat">${st.join(' · ')}</div>
    <div class="log">${B.log.slice(-7).map(l=>`<div>${esc(l)}</div>`).join('')}</div>

  document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{

    else act(a);
  });
  document.querySelectorAll('[data-skill]').forEach(b=>b.onclick=()=>act('skill',b.dataset.skill));
  document.querySelectorAll('[data-item]').forEach(b=>b.onclick=()=>act('item',b.dataset.item));
  document.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>{B.menu='main';renderBattle();});
  flushFx();
}

function flushFx(){
  B.fxq.forEach(([t,txt,cls])=>{
    const el=t==='enemy'?$('#eicon'):$('#pstatus');
    if(!el)return;
    const r=el.getBoundingClientRect();
    const s=document.createElement('div');
    s.className='float '+cls;s.textContent=txt;
    s.style.left=(r.left+r.width/2+rnd(-40,40))+'px';
    s.style.top=(r.top+r.height/2+rnd(-14,14))+'px';
    $('#fx').appendChild(s);setTimeout(()=>s.remove(),950);
    if(t==='enemy')el.classList.add('hit');
    if(cls==='pdmg'){document.body.classList.add('flash');setTimeout(()=>document.body.classList.remove('flash'),220);}
  });
  B.fxq=[];
}

// 주인공 각성 스킬: 공격 5회마다 자동 발동
const AWAKEN_SKILL={every:5,mult:3,name:'대천사의 심판'};
function awakenStrike(){
  addLog(`✨ 각성 스킬 발동!`);
  document.body.classList.add('holyflash');setTimeout(()=>document.body.classList.remove('holyflash'),350);
  hitEnemy(AWAKEN_SKILL.mult,`✨ 「${AWAKEN_SKILL.name}」`);
}
function hitEnemy(mult,label){
  const e=B.e;
  if(B.evade){B.evade=false;addLog(`${label}! — 적이 모습을 감춰 빗나갔다`);queueFx('enemy','MISS','mpf');return;}
  if(e.dimension&&Math.random()<0.5){addLog(`${label}! — 🌀 차원의 틈으로 흘러가 사라졌다`);queueFx('enemy','차원 전이','mpf');return;}
  if(B.immune){addLog(`${label}! — ⏸ 시간이 멈춰 피해가 무효화됐다`);queueFx('enemy','무효','mpf');return;}
  if(e.voidHero&&Math.random()<e.voidHero){addLog(`${label}! — 🔥 아몬의 업화에 삼켜져 무효화됐다`);queueFx('enemy','무효','mpf');return;}
  let d=(P.atk*(B.buff?1.5:1)*(B.aura?1.2:1)*mult-enemyDef()/2)*rnd(0.9,1.1);
  d=Math.max(1,Math.round(d));
  const crit=Math.random()<0.1*(stormOn()?2:1);
  if(crit)d=Math.round(d*(stormOn()&&isMyth('kirie')?2:1.5));
  stat('dmg','hero',Math.min(d,e.hp));
  e.hp=Math.max(0,e.hp-d);
  addLog(`${label}! ${e.name}에게 ${d} 피해${crit?' (치명타!)':''}`);
  queueFx('enemy',(crit?'💥':'')+d,crit?'crit':'dmg');
  if(P.relics.includes('blood_orb')&&d>0&&P.hp>0){const vh=Math.min(P.maxHp-P.hp,Math.round(d*BLOOD_ORB_PCT*pHealMul()));if(vh>0){P.hp+=vh;stat('heal','hero',vh);queueFx('player','🩸+'+vh,'heal');}}
  if(B.reflect){const r=Math.round(d*0.5);P.hp=Math.max(0,P.hp-r);addLog(`↩ 뒤집힌 시간 — 주인공에게 ${r} 반사`);queueFx('player','↩-'+r,'pdmg');}
  else if(e.reflectHero&&d>0){const r=Math.max(1,Math.round(d*e.reflectHero));P.hp=Math.max(0,P.hp-r);addLog(`🔮 ${e.name}의 반사 — 주인공에게 ${r} 되돌아왔다`);queueFx('player','🔮-'+r,'pdmg');}
}
function allyHit(base,label,defFactor,fixed){
  const e=B.e;
  if(B.immune){addLog(`${label}! — ⏸ 피해 무효`);queueFx('enemy','무효','mpf');return 0;}
  if(B.vsil&&B.vsil[B.curAlly]&&Math.random()<0.3){addLog(`${label}! — 🔇 침묵에 막혀 무효`);queueFx('enemy','침묵','mpf');return 0;}
  let d=fixed?Math.max(1,Math.round(base*(B.am||1))):Math.max(1,Math.round((base*(B.am||1)-enemyDef()*defFactor)*rnd(0.9,1.1)));
  if(B.vslow&&B.vslow[B.curAlly])d=Math.max(1,Math.round(d*0.6));
  stat('dmg',B.curAlly,Math.min(d,e.hp));
  e.hp=Math.max(0,e.hp-d);
  addLog(`${label}! ${d} 피해`);
  queueFx('enemy',d,'dmg');
  if(B.reflect&&B.curAlly&&B.ahp[B.curAlly]){
    const h=B.ahp[B.curAlly],r=Math.round(d*0.5);h.hp=Math.max(0,h.hp-r);
