const rankNeed=t=>t<RANK_CH?RANK_LP:t===RANK_CH?RANK_SAVIOR_LP:t===RANK_CH+1?RANK_MORTAL_LP:0; // 0 = 최고 티어
const RANK_SAVIOR_EGGS=[[500,'heaven_ring']]; // 구원자 LP 이스터에그
const RANK_SV_SALV_STEP=100; // 필멸자 티어: 100 LP 달성할 때마다 구원의 조각 1개 (구간마다 1회)
const RANK_EGGS=[[500,'bonu_staff'],[800,'yujun_suit'],[900,'jihu_suit'],[1000,'gonggu_paper'],[1300,'bangeo_hoe']]; // 챌린저 LP 이스터에그 // 플레이어 Lv 20부터 랭크전 개방
const RANK_AI_NAMES=['푸른 기사','심연의 사제','은빛 순례자','붉은 수도사','밤의 성가대','새벽의 파수꾼','잿빛 집행자','별빛 부제'];
const rankState=()=>{P.rank=P.rank||{tier:0,lp:0,w:0,l:0,best:0};return P.rank;};
const rankOf=()=>RANKS[Math.min(RANKS.length-1,rankState().tier)];
function rankOpponent(){
  const r=rankState(),R=RANKS[r.tier],pool=allyIds(5).slice(),party=[];
  while(party.length<(R.cnt||3)&&pool.length){const i=Math.floor(Math.random()*pool.length);party.push(pool.splice(i,1)[0]);}
  const L=R.lv,u=Math.min(AREAS.length-1,Math.floor(L/4)); // 티어 레벨 기준 주인공 능력치 (장비·유물 포함 수준)
  return {id:'rank-ai',ranked:true,rtier:r.tier,hero:`${R.n} ${pick(RANK_AI_NAMES)}`,cp:0,
    team:{atk:12+3*(L-1)+6*u,def:5+2*(L-1)+5*u,maxHp:100+15*(L-1)+18*u,maxMp:30,lv:L,
      party:party.map(id=>({id,lv:R.alv,aw:R.aw,my:R.my,tr:0}))}};
}
let rankRwOpen=false;   // 승급 보상 펼침 상태 (화면을 다시 그려도 유지)
function renderRank(msg){
  hubTab='adv';
  if(P.lv<RANK_MIN_LV){renderHub(`🔒 랭크전은 Lv ${RANK_MIN_LV}부터 열린다 (현재 Lv ${P.lv})`);return;}
  const r=rankState(),R=rankOf(),top=!rankNeed(r.tier);
  $('#app').innerHTML=`${statusHTML()}${topBack()}
    ${msg?`<div class="notice">${msg}</div>`:''}
    <div class="panel"><div class="ptitle">🏆 랭크전 <span class="small">${r.w}승 ${r.l}패 · 최고 ${RANKS[r.best||0].n}</span></div>
      <div class="rankbadge" style="--rc:${R.c}"><div class="ri">${R.icon}</div><b>${R.n}</b></div>
      ${top?`<div class="desc" style="text-align:center">${fmt(r.lp)} LP · 최고 티어 도달</div>`:bar(r.lp,rankNeed(r.tier),'xp','LP')}
      <div class="ranklad">${RANKS.map((x,i)=>`<span class="${i===r.tier?'on':i<r.tier?'done':''}">${x.icon}<br>${x.n}</span>`).join('')}</div>
      ${(()=>{const rows=[...RANKS.map((x,i)=>RANK_REWARD[i]?[`${x.icon} ${x.n}`,rankRewardText(i),(r.got||{})[i]]:null).filter(Boolean),[`🏆 챌린저 ${RANK_CH_BONUS_LP} LP`,`${fmt(RANK_CH_BONUS)} 코인`,P.rankChBonus]],got=rows.filter(x=>x[2]).length;
        return `<details class="desc rkfold" id="rkfold" ${rankRwOpen?'open':''}><summary><b>승급 보상</b> <span class="small">받음 ${got}/${rows.length}</span><span class="fdarr"></span></summary>${rwList(rows)}</details>`;})()}
      <div class="desc">★5 동료 무작위 3명(구원자·필멸자는 5명)을 데려온 AI 상대와 대결한다. 승리 +${RANK_WIN} LP · 패배 −${RANK_LOSS} LP. <br><b>승급에 필요한 LP</b>${rwList([[`${RANKS[0].n} → ${RANKS[RANK_CH].n}`,`티어마다 ${RANK_LP} LP`],[`${RANKS[RANK_CH].n} → ${RANKS[RANK_CH+1].n}`,`${fmt(RANK_SAVIOR_LP)} LP`],[`${RANKS[RANK_CH+1].n} → ${RANKS[RANK_CH+2].n}`,`${fmt(RANK_MORTAL_LP)} LP`]])}⏳ 필멸자 티어에서는 ${RANK_SV_SALV_STEP} LP 달성할 때마다 ${SALV_ITEM.icon} ${SALV_ITEM.name} 1개 (받은 구간 ${rankState().mtGot||0}개)<br>이번 티어 상대: 주인공 Lv ${R.lv} · ★5 동료 ${R.cnt||3}명 Lv ${R.alv}${R.aw?` · 각성 ${R.aw}`:''}${R.my?' · 신화':''}</div>
      <div class="grid">
        <button class="btn danger full" id="rgo">⚔ 랭크전 시작</button>
        <button class="btn full" id="back">← 거점으로</button>
      </div></div>${tabBar()}`;
  $('#rgo').onclick=()=>{if(P.lv<RANK_MIN_LV)return renderRank();startPvp(rankOpponent());};
  $('#back').onclick=()=>renderHub();
  window.scrollTo(0,0);
  if($('#rkfold'))$('#rkfold').addEventListener('toggle',e=>{rankRwOpen=e.currentTarget.open;});
}
function rankEnd(win,e,pst,pparty){
  const r=rankState(),before=r.tier;const lines=[];
  if(win){r.w++;r.lp+=RANK_WIN;lines.push(`🏆 승리! +${RANK_WIN} LP`);}
  else{r.l++;const lost=Math.min(r.lp,RANK_LOSS);r.lp-=lost;lines.push(`패배… −${lost} LP`);}
  if(r.tier===RANK_CH)for(const [lp,id] of RANK_EGGS){if(r.lp>=lp&&!P.relics.includes(id)){gainRelic(id);const it=RELICS[id];lines.push(`${it.icon} 이스터에그! 챌린저 ${lp} LP 달성 — 희귀 아이템 「${it.name}」 획득 (${it.desc.replace(/^희귀 아이템 · /,'').replace(/ \(.*\)$/,'')})`);}}
  if(r.tier===RANK_CH+1)for(const [lp,id] of RANK_SAVIOR_EGGS){if(r.lp>=lp&&!P.relics.includes(id)){gainRelic(id);const it=RELICS[id];lines.push(`${it.icon} 이스터에그! 구원자 ${lp} LP 달성 — 희귀 아이템 「${it.name}」 획득 (${it.desc.replace(/^희귀 아이템 · /,'').replace(/ \(.*\)$/,'')})`);}}
  if(rankChBonusCheck(600))lines.push(`💰 챌린저 ${RANK_CH_BONUS_LP} LP 달성 보상: ${fmt(RANK_CH_BONUS)} 코인`);
  let promo=false;
  while(rankNeed(r.tier)&&r.lp>=rankNeed(r.tier)){r.lp-=rankNeed(r.tier);r.tier++;promo=true;}
  if(promo){r.lp=0;r.best=Math.max(r.best||0,r.tier);lines.push(`${RANKS[r.tier].icon} ${RANKS[before].n} → ${RANKS[r.tier].n} 승급!`);
    r.got=r.got||{};
    for(let t=before+1;t<=r.tier;t++){const w=RANK_REWARD[t];if(!w||r.got[t])continue;r.got[t]=true;
      if(w.stone){P.items.stone+=w.stone;stoneToast(w.stone,`${RANKS[t].n} 승급 보상`);}
      if(w.gold)P.gold+=w.gold;
      if(w.ally){addAlly(w.ally);aData(w.ally);}
      lines.push(`🎁 ${RANKS[t].n} 승급 보상: ${rankRewardText(t)}`);}}
  if(r.tier===RANK_CH+2){const m=Math.floor(r.lp/RANK_SV_SALV_STEP),n=m-(r.mtGot||0);
    if(n>0){P.items.salv=(P.items.salv||0)+n;r.mtGot=m;salvToast(`필멸자 ${fmt(m*RANK_SV_SALV_STEP)} LP 달성`,n);
      lines.push(`${SALV_ITEM.icon} 필멸자 ${fmt(m*RANK_SV_SALV_STEP)} LP 달성 — ${SALV_ITEM.name} +${n} (보유 ${P.items.salv})`);}}
  lines.push(`현재 ${rankOf().n} · ${r.lp}${rankNeed(r.tier)?'/'+rankNeed(r.tier):''} LP · ${r.w}승 ${r.l}패`);
  save();renderRank();
  showResult({title:`🏆 랭크전 — ${esc(e.heroName)}의 팀`,won:win,lines,st:pst,party:pparty},promo?()=>showStory(`<div class="sum s5"><div class="sum-title">승급</div><div class="rankbadge" style="--rc:${RANKS[r.tier].c}"><div class="ri">${RANKS[r.tier].icon}</div><b>${RANKS[r.tier].n}</b></div><p class="sum-desc">${RANKS[before].n}에서 ${RANKS[r.tier].n}(으)로 승급했다!${RANK_REWARD[r.tier]?`<br>🎁 승급 보상: ${rankRewardText(r.tier)}`:''}</p>${RANK_REWARD[r.tier]&&RANK_REWARD[r.tier].ally?`<div style="margin-top:8px">${allyPortrait(RANK_REWARD[r.tier].ally)}</div>`:''}</div>`,()=>renderRank(),true):null);
}

/* ===================== 노력의 숲 ===================== */
/* 내 동료 대신 ★5 동료 전원(최대 레벨 · 3각성 · 신화)을 빌려 3명을 골라 도전 · 주인공 HP 4000 · 공격력 800 고정
   층마다 지역 이동 → 마계 이동 순서대로 각 지역의 최종 보스 */
const FOREST_HP=4000, FOREST_ATK=800, FOREST_DEF=500, FOREST_WATER=3, FOREST_PICK=3;
const FOREST_UNLOCK_AREA=AREAS.findIndex(a=>a.name==='고대 원단수'); // 고대 원단수 클리어 시 개방
const forestOpen=()=>{const i=FOREST_UNLOCK_AREA;return i<0||(P.prog[i]||0)>=STAGES||!!(P.cleared&&P.cleared[i]);};
const FOREST_REWARD={5:{salv:1},10:{salv:3},15:{salv:4},23:{ally:'atris'}}; // 첫 돌파 보상
const forestRewardText=f=>{const w=FOREST_REWARD[f];if(!w)return '';return w.ally?`★6 ${ALLIES[w.ally].name}`:`${SALV_ITEM.icon} ${SALV_ITEM.name} ×${w.salv}`;};
const FOREST_FLOOR_MUL={22:0.85,23:0.85}; // 노력의 숲 전용 보스 배율 (체력·공격력) — 22층 마르테리아 · 23층 레비아 15% 하향
const FOREST_BAN={akira:15,roa:20}; // 해당 층부터 출전 금지
const forestBanned=(id,f)=>!!(FOREST_BAN[id]&&f>=FOREST_BAN[id]);
const FOREST_LAST_AREA=22; // 노력의 숲은 끝없는 그림자(레비아)까지 23층 — 이후 지역 추가로 층 수가 바뀌지 않게
const forestAreas=()=>AREAS.map((a,i)=>i).filter(i=>i<=FOREST_LAST_AREA&&AREAS[i].boss);
const FOREST_MAX_FN=()=>forestAreas().length;
const FOREST_MAX=FOREST_MAX_FN();
const forestState=()=>{P.forest=P.forest||{best:0,sel:[],tries:0};P.forest.sel=(P.forest.sel||[]).filter(id=>forestPool().includes(id)).slice(0,FOREST_PICK);return P.forest;};
const forestPool=()=>Object.keys(ALLIES).filter(id=>ALLIES[id].star===5&&!ALLIES[id].pet).sort((a,b)=>(TIER5[a]||9)-(TIER5[b]||9)||ALLIES[a].name.localeCompare(ALLIES[b].name));
function forestRestore(){
  const r=P._forestRestore;if(r){P.hp=r.hp;P.mp=r.mp;P.maxHp=r.maxHp;P.atk=r.atk;P.def=r.def;P.relics=r.relics||[];P.items.water=r.water||0;delete P._forestRestore;}
  FOREST=null;
}
function forestStart(f){
  if(!forestOpen())return renderHub('🔒 노력의 숲은 고대 원단수를 클리어하면 열린다');
  const F=forestState();if(F.sel.length!==FOREST_PICK)return renderForest(`동료 ${FOREST_PICK}명을 먼저 골라 주세요`);
  const bn=F.sel.filter(id=>forestBanned(id,f));if(bn.length)return renderForest(`⚠ ${bn.map(id=>`${ALLIES[id].name}(${FOREST_BAN[id]}층부터)`).join(', ')} 출전 금지 — 다른 동료를 골라 주세요`);
  F.tries=(F.tries||0)+1;FOREST=new Set(F.sel);
  P._forestRestore={hp:P.hp,mp:P.mp,maxHp:P.maxHp,atk:P.atk,def:P.def,relics:P.relics,water:P.items.water};
  P.maxHp=FOREST_HP;P.hp=FOREST_HP;P.atk=FOREST_ATK;P.def=FOREST_DEF;P.relics=[];P.items.water=FOREST_WATER;P.mp=P.maxMp;
  save();startBattle({area:forestAreas()[f-1],stage:15,forest:f,fparty:F.sel.slice(),replay:F.best>=FOREST_MAX});
}
function forestEnd(win){
  const f=B.forest,rp=B.spec.replay,e=B.e,pst=B.st,pparty=partyIds().slice();clearBattle();forestRestore();
  const F=forestState(),lines=[];let climb=0,gotAlly=null;
  if(win){
    if(rp){F.run=f+1;lines.push(`🔁 ${f}층 다시 오르기 승리${f>=FOREST_MAX?'':` — 다음은 ${f+1}층`}`);if(f>=FOREST_MAX){F.run=1;F.clears=(F.clears||0)+1;lines.push(`🌳 노력의 숲 재정복! (${F.clears}회) — 다시 1층부터`);}}
    else{const first=f>F.best;if(first){F.best=f;climb=f+1;}lines.push(first?`🌳 ${f}층 돌파!${f>=FOREST_MAX?' — 노력의 숲 정상 도착!':` 나무를 타고 ${f+1}층으로`}`:`🌳 ${f}층 재도전 승리`);
      F.got=F.got||{};const w=FOREST_REWARD[f];
      if(w&&!F.got[f]){F.got[f]=true;
        if(w.salv){P.items.salv=(P.items.salv||0)+w.salv;salvToast(`노력의 숲 ${f}층 돌파`,w.salv);}
        if(w.ally){const isNew=!owned(w.ally);addAlly(w.ally);aData(w.ally);if(isNew)gotAlly=w.ally;}
        lines.push(`🎁 ${f}층 돌파 보상: ${forestRewardText(f)}`);}}
    if(rp&&f<FOREST_MAX)climb=f+1;
  }else lines.push(`${f}층에서 쓰러졌다… 동료 조합을 바꿔 다시 도전하자`);
  lines.push(`최고 기록 ${F.best}/${FOREST_MAX}층`);
  save();renderForest(null,climb);
  const res=()=>showResult({title:`🌳 노력의 숲 ${f}층 — ${esc(e.name)}`,won:win,lines,st:pst,party:pparty});
  if(gotAlly)summonFx(6,()=>showStory(revealHTML([{id:gotAlly,isNew:true}],'노력의 숲 정상 보상'),res,true));else res();
}
function renderForest(msg,climb){
  hubTab='adv';
  if(!forestOpen()){renderHub('🔒 노력의 숲은 고대 원단수를 클리어하면 열린다');return;}
  const F=forestState(),done=F.best>=FOREST_MAX,cur=done?Math.min(FOREST_MAX,F.run||1):F.best+1,L=forestAreas(),pool=forestPool();
  const rows=[];
  for(let n=FOREST_MAX;n>=1;n--){const a=L[n-1],A=AREAS[a],bs=A.boss,cl=n<=F.best,on=n===cur;
    rows.push(`<div class="trow ${n%2?'l':'r'}"><div class="fnode ${cl?'done':''} ${on?'on':''} ${A.realm?'realm':''} ${on&&climb===n?'climb':''}" ${on?'id="fcur"':''}>
      ${on?'<span class="fclimber">🧗</span>':''}<span class="fn">${n}층 · ${A.flag} ${esc(A.name)}${A.realm?' · 마계':''}</span><br><b>${cl?'✔ ':''}${esc(bs.name)}</b>${FOREST_REWARD[n]?`<br><span class="fn">🎁 ${forestRewardText(n)}${(F.got||{})[n]?' ✔':''}</span>`:''}</div></div>`);}
  const ce=id=>{const i=F.sel.indexOf(id),bn=forestBanned(id,cur);return `<button class="${i>=0?'sel':''} ${bn?'ban':''}" data-fsel="${id}" ${bn&&i<0?'disabled':''}>${i>=0?`<span class="fno">${i+1}</span>`:''}${allyFace(id,'sm')}<span>${esc(ALLIES[id].name)}</span><span class="small">${bn?`🚫 ${FOREST_BAN[id]}층~ 금지`:TIER5[id]?TIER5[id]+'티어':'★5'}</span></button>`;};
  const banSel=F.sel.filter(id=>forestBanned(id,cur)),canGo=F.sel.length===FOREST_PICK&&!banSel.length;
  const A=AREAS[L[cur-1]];
  $('#app').innerHTML=`${statusHTML()}${topBack()}
    ${msg?`<div class="notice">${msg}</div>`:''}
    <div class="panel"><div class="ptitle">🌳 노력의 숲 <span class="small">최고 ${F.best}/${FOREST_MAX}층${F.clears?` · 재정복 ${F.clears}회`:''}</span></div>
      <div class="desc">내 동료는 데려갈 수 없다. 대신 <b>모든 ★5 동료(최대 레벨 · 3각성 · 신화)</b> 중 <b>${FOREST_PICK}명</b>을 골라 도전한다.<br>
        주인공은 <b>HP ${fmt(FOREST_HP)} · 공격력 ${FOREST_ATK} · 방어력 ${FOREST_DEF}</b> 고정 · 유물 효과 없음 · 성수 ${FOREST_WATER}개 · 펫·이사벨 부제 없음. 오직 실력으로!<br>
        층마다 지역 이동 → 마계 이동 순서로 각 지역의 최종 보스가 기다린다. 끝나면 원래 능력치로 돌아온다.</div>
      <div class="desc">🚫 출전 금지: ${Object.keys(FOREST_BAN).map(id=>`${ALLIES[id].name} (${FOREST_BAN[id]}층부터)`).join(' · ')}</div>
      <div class="desc"><b>돌파 보상</b>${rwList(Object.keys(FOREST_REWARD).map(k=>[`${k}층`,forestRewardText(+k),(F.got||{})[k]]))}</div>
      ${done?`<div class="notice">🌳 노력의 숲 정상까지 올랐다! 🔁 다시 오르기 — 1층부터 다시 도전할 수 있다</div>`:''}
      <div class="ftree"><div class="fcrown">🌳</div>${rows.join('')}<div class="froot">🌱🪵🌱</div></div>
      <div class="desc"><b>${cur}층</b> — ${A.flag} ${esc(A.name)}의 보스 <b>${esc(A.boss.name)}</b></div>
      <div class="ptitle" style="margin-top:6px">🤝 함께 오를 동료 <span class="small">${F.sel.length}/${FOREST_PICK}명 선택</span></div>
      <div class="fpick">${pool.map(ce).join('')}</div>
      <div class="grid">
        <button class="btn danger full" id="fgo" ${canGo?'':'disabled'}>⚔ ${cur}층 ${done?'다시 도전':'도전'}${banSel.length?`<small>${banSel.map(id=>ALLIES[id].name).join(', ')}은(는) 이 층에 출전 금지 — 다른 동료로 바꿔 주세요</small>`:F.sel.length===FOREST_PICK?'':`<small>동료 ${FOREST_PICK}명을 골라 주세요</small>`}</button>
        ${done&&cur>1?`<button class="btn full" id="frst">🔁 1층부터 다시 오르기</button>`:''}
        <button class="btn full" id="back">← 거점으로</button>
      </div></div>${tabBar()}`;
  document.querySelectorAll('[data-fsel]').forEach(b=>b.onclick=()=>{const id=b.dataset.fsel,F=forestState(),i=F.sel.indexOf(id);
    if(i>=0)F.sel.splice(i,1);else if(F.sel.length<FOREST_PICK)F.sel.push(id);else{F.sel.shift();F.sel.push(id);}
    save();const y=window.scrollY;renderForest();window.scrollTo(0,y);});
  $('#fgo').onclick=()=>forestStart(cur);
  if($('#frst'))$('#frst').onclick=()=>{forestState().run=1;save();renderForest('🔁 1층부터 다시 오른다');};
  $('#back').onclick=()=>renderHub();
  const c=$('#fcur');if(c&&!msg&&climb===undefined)c.scrollIntoView({block:'center'});else if(c&&climb)c.scrollIntoView({block:'center'});else window.scrollTo(0,0);
}

/* ===================== 구원의 탑 ===================== */
/* 30층 · 동료 1명만 출전 (이사벨 부제 불가) · 5층마다 악마, 10층마다 보스 · 층이 오를수록 후반 지역의 적 */

const towerOpen=()=>P.lv>=TOWER_MIN_LV&&worldCleared(); // Lv 50 이상 + 지역 이동 15곳 모두 클리어
const towerState=()=>{P.tower=P.tower||{best:0,tries:0};return P.tower;};
/* 엔드 콘텐츠: 활옥사원~고대 원단수의 적이 6층마다 바뀌고, 층이 오를수록 체력 +3% · 공격력 +2%씩 강해진다 */
/* 10층마다 보스(동료 1명 기준 조정): 체력 0.85+2%/층 · 공격 0.8+1%/층 · 2페이즈 체력 60%(교대 50%) · 각성 치명 피해 최대 1.5배 · 영혼 일격 5초 · 추격 참격 최대 2회 · 주인공 반사 최대 30% · 흡혈·생명력 흡수 절반 */
const towerArea=f=>Math.min(realmStart()-1,10+Math.floor((f-1)/6));
const towerMul=f=>f%10===0?{hp:0.85+0.02*(f-1),atk:0.8+0.01*(f-1)}:{hp:1+0.03*(f-1),atk:1+0.02*(f-1)};

function towerEnemy(f){
  const a=towerArea(f),ty=towerType(f);

  const em=(ty==='boss'&&a>=4)?LATE_BOSS_MULT:ENEMY_MULT,tm=towerMul(f);

  if(t.madness)t={...t,madness:{...t.madness,at:sc(t.madness.at),to:sc(t.madness.to)}};
  if(t.awaken)t={...t,awaken:{...t.awaken,at:sc(t.awaken.at),to:ty==='boss'?Math.round(sc(t.awaken.to)*0.6):sc(t.awaken.to),...(ty==='boss'&&t.awaken.critMult?{critMult:Math.min(1.5,t.awaken.critMult)}:{}),...(ty==='boss'&&t.awaken.soulTick?{soulTick:5000}:{})}};
  if(ty==='boss'&&t.slashes>2)t={...t,slashes:2};

  if(t.berserk)t={...t,berserk:{...t.berserk,at:sc(t.berserk.at),to:sc(t.berserk.to)}};
  if(t.twin)t={...t,twin:{...t.twin,at:sc(t.twin.at),hp:sc(t.twin.hp),atk:Math.round(t.twin.atk*tm.atk)}};

function renderTower(msg){

      ${done?`<div class="notice">🕊️ 구원의 탑 ${TOWER_MAX}층을 모두 정복했다! 🔁 다시 오르기 — 1층부터 다시 도전할 수 있다 (한 층 돌파할 때마다 💠 성유물 ×1)</div>`:''}

        이번 동료: ${ally?`${allyFace(ally,'sm')} <b>${nameHTML(ally)}</b> Lv ${aData(ally).lv}`:'<span class="small">없음 — 주인공 혼자 오른다 (동료 관리에서 출전 동료를 정하자)</span>'}<br>

      <div class="grid">

  if($('#tgo'))$('#tgo').onclick=()=>{if(!towerOpen())return renderTower();const T=towerState();T.tries=(T.tries||0)+1;P._towerRestore={hp:P.hp,mp:P.mp};P.hp=P.maxHp;P.mp=P.maxMp;startBattle({area:towerArea(f),tower:f,replay:done});};

function towerEnd(win){

  if(win&&rp){T.run=f+1;P.items.stone+=1;stoneToast(1,`구원의 탑 ${f}층 다시 오르기`);lines.push(`🔁 ${f}층 다시 오르기 승리 — 💠 성유물 ×1${f>=TOWER_MAX?'':` — 다음은 ${f+1}층`}`);

      lines.push(`🎁 ${f}층 돌파 보상: ${TOWER_REWARD[f]?towerRewardText(f):'💠 성유물 ×1'}`);
      if(w.relic&&!P.relics.includes(w.relic)){gainRelic(w.relic);lines.push(`${RELICS[w.relic].icon} 이스터에그! 희귀 아이템 「${RELICS[w.relic].name}」 획득 (공격력 +50)`);}}}

/* ===================== 던전 (공격력 측정) ===================== */
/* 내가 깬 지역의 보스만 순서대로 연속 등장 → 모두 쓰러뜨리면 깬 마계 보스가 계속 반복 (깬 마계가 없으면 마지막으로 깬 지역 보스 반복)
   보스 HP는 원래대로(DG_HP_MULT) · 보스는 공격·반격·빙결 등 어떤 효과도 쓰지 않는 샌드백 · 제한 시간 60초
   기록은 한국 시간 기준 하루 단위(매일 0시 초기화)로 players/{id} 공개 프로필에 함께 올려 모두와 실시간 공유 */
const DG_MS=60000, DG_HP_MULT=1;   // 보스 HP 배율 (1 = 원래 HP)
const dgDay=()=>new Date(Date.now()+9*3600e3).toISOString().slice(0,10);   // 한국 날짜
const DG_KEEP=20;   // 오늘 기록 상위 20개 · 최근 기록 20회
function dgState(){
  const d=dgDay();
  if(!P.dgLife||typeof P.dgLife!=='object')P.dgLife={v:(P.dg&&P.dg.lifeBest)||0,at:0,p:[]};   // 개인 최고 기록: 매일 지워지지 않음
  if(!Array.isArray(P.dgHist))P.dgHist=[];                                                    // 최근 기록 20회
  if(!P.dg||P.dg.day!==d)P.dg={day:d,best:0,runs:0,last:0,top:[]};                             // 오늘 기록: 한국 시간 0시 초기화
  if(!Array.isArray(P.dg.top))P.dg.top=P.dg.best>0?[{v:P.dg.best,p:P.dg.bestParty||[],at:P.dg.bestAt||0}]:[];
  return P.dg;
}
function dgSeq(){   // 최종 보스를 깬 지역만 (지도에서 '완료'인 지역과 같은 기준) · 아직 하나도 못 깼으면 첫 지역 보스
  const RS=realmStart(),done=i=>(P.prog[i]||0)>=STAGES||!!(P.cleared&&P.cleared[i]);
  const idx=AREAS.map((a,i)=>i).filter(i=>AREAS[i].boss&&done(i));
  let main=idx.filter(i=>i<RS);const realm=idx.filter(i=>i>=RS);
  if(!main.length&&!realm.length)main=[AREAS.findIndex(a=>a.boss)];
  return {main,realm,loop:realm.length?realm:[main[main.length-1]]};
}
function dgAreaAt(n){const q=dgSeq();return n<q.main.length?q.main[n]:q.loop[(n-q.main.length)%q.loop.length];}
const dgLoopText=q=>q.realm.length?`😈 마계 보스 ${q.realm.length}명(${q.realm.map(i=>AREAS[i].boss.name).join(' → ')})이 계속 반복돼요`:`마지막으로 깬 보스 「${AREAS[q.loop[0]].boss.name}」만 계속 반복돼요`;
/* 샌드백 보스: 이름·모습·방어력만 남기고 모든 특수 효과를 뺀다 */
function dgEnemy(a){
  const b=AREAS[a].boss,em=a>=4?LATE_BOSS_MULT:ENEMY_MULT;
  const hp=(b.exactHp?b.hp:Math.round(b.hp*em))*DG_HP_MULT;
  return {name:b.name,title:b.title||'',art:b.art,def:b.def||0,demon:b.demon,atk:0,hp,maxHp:hp};
}
/* 던전 전용 출전 동료 (처음엔 지금 출전 동료를 그대로 가져옴) */
function dgParty(){
  if(!Array.isArray(P.dgActive))P.dgActive=(P.active||[]).slice();
  P.dgActive=P.dgActive.filter(id=>id!==FIXED&&ALLIES[id]&&owned(id)).slice(0,MAX_ACTIVE);

const dgTeamCP=()=>heroCP()+[FIXED,...dgParty()].reduce((s,id)=>s+allyCP(id),0);
const dgTotal=()=>B?B.dgDone+Math.max(0,B.e.maxHp-B.e.hp):0;

/* 시작 전 3 · 2 · 1 카운트다운 (보스 화면을 먼저 보여 주고, 끝나면 60초와 전투가 시작됨) */

function dungeonStart(){

/* 보스를 쓰러뜨리면 승리 대신 다음 보스가 바로 나온다 */
/* 1회 타격의 남는 딜: 보스 남은 HP보다 크게 때리면 넘친 만큼 다음 보스에게 이어짐 (출혈·불태움 같은 지속 피해는 제외) */

/* 보스를 쓰러뜨리면 승리 대신 다음 보스가 바로 나온다 (남는 딜은 무제한으로 이어서 들어감) */
function dungeonNextBoss(){
  if(!B||!B.dungeon||B.over||B.e.hp>0)return;
  const q=dgSeq(),n0=B.dgN,killed=[B.e.name],hadDot=!!(B.ebleed||B.eburn);
  dgAdvance();
  const over=B.dgOver||{};B.dgOver=null;
  let carried=0;
  Object.keys(over).forEach(w=>{
    let amt=Math.round(over[w]);
    while(amt>0&&B&&B.dungeon){
      const e=B.e,take=Math.min(amt,e.hp);
      e.hp-=take;amt-=take;carried+=take;stat('dmg',w,take);
      if(e.hp<=0){killed.push(e.name);dgAdvance();}
    }
  });
  const t=B.e;
  addLog(`💀 ${killed.join(' · ')} 처치!${carried>0?` 💥 남은 피해 ${fmt(carried)} → 다음 보스로`:''}`);
  if(hadDot)addLog('🩸 출혈·불태움은 쓰러진 보스와 함께 끝났다');
  addLog(`${n0<q.main.length&&B.dgN>=q.main.length?(q.realm.length?'😈 마계 보스 반복 시작 · ':'🔁 마지막 보스 반복 시작 · '):''}다음 보스 「${t.name}」 (HP ${fmt(t.hp)} / ${fmt(t.maxHp)})`);
  if(carried>0)queueFx('enemy','💥'+fmt(carried),'crit');
  renderBattle();
}
function dungeonTick(){

  const t=$('#dgtime'),f=$('#dgtfill'),tb=$('#dgtbar'),d=$('#dgdmg');

function dungeonEnd(why){
  if(!B||!B.dungeon||B.dgEnded)return;

  const total=Math.round(dgTotal()),kills=B.dgKills,cur=B.e.name,pst=B.st,pparty=partyIds().slice(),used=Math.round((DG_MS-B.dgLeft)/1000);
  clearBattle();

  const nb=total>prev,life=total>(P.dgLife.v||0);

let dgUnsub=null,dgRank=null,dgRankDay='',dgRankState='off';
function dgUnsubscribe(){if(dgUnsub){try{dgUnsub();}catch(e){}dgUnsub=null;}}
function dgSubscribe(){
  const day=dgDay();
  if(dgUnsub&&dgRankDay===day)return;
  dgUnsubscribe();
  if(!(FB&&DBX===FB&&myId)){dgRankState=(hasFirebaseHost()&&(cloudState==='checking'||cloudState==='ready'||fbBinding))?'wait':'off';return;}
  dgRankState='wait';dgRankDay=day;
  try{
    dgUnsub=FB.collection('players').where('dgDay','==',day).onSnapshot(q=>{
      dgRank=q.docs.filter(d=>d.exists).map(d=>({id:d.id,...d.data()})).filter(x=>(x.dgBest||0)>0);
      dgRankState='live';paintDgRank();
    },()=>{dgRankState='err';paintDgRank();});
  }catch(e){dgRankState='err';}
}
function dgRankList(){
  const day=dgDay(),me=myId||P.uid,D=dgState(),rows=[];
  (dgRank&&dgRankDay===day?dgRank:[]).forEach(x=>{
    if(x.id===me)return;   // 내 기록은 이 기기의 최신 기록으로 넣음
    const runs=Array.isArray(x.dgTop)&&x.dgTop.length?x.dgTop:(x.dgBest>0?[{v:x.dgBest,p:x.dgParty||[],at:x.dgAt||0}]:[]);   // 예전 버전은 최고 기록 1개
    runs.slice(0,DG_KEEP).forEach(r=>{if(r&&r.v>0)rows.push({id:x.id,hero:x.hero,lv:x.lv,v:r.v,p:r.p||[],at:r.at||0,d:r.d||null,k:r.k});});

  D.top.forEach(r=>rows.push({id:me,hero:P.name,lv:P.lv,v:r.v,p:r.p||[],at:r.at||0,d:r.d||null,k:r.k,me:true}));
  return rows.sort((a,b)=>b.v-a.v||a.at-b.at).slice(0,DG_KEEP);
}

  const sec=Math.ceil(l/1000);
  return `⛪ 성당 휴식<small>다시 가능까지 ${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}</small>`;
}

const ROME_AREA=3, ROME_BONUS=100000;
function romeBonusCheck(delay){
  if(!P||P.romeBonus||!((P.prog[ROME_AREA]||0)>=STAGES||(P.cleared&&P.cleared[ROME_AREA])))return false;
  P.romeBonus=1;P.gold+=ROME_BONUS;setTimeout(()=>goldToast(ROME_BONUS,'로마 최종 보스까지 클리어 보상'),delay||0);return true;
}
/* 랭크전 챌린저 400 LP 달성 시 100,000 코인 1회 — 이미 넘긴 계정(구원자 포함)도 1회 */
const RANK_CH_BONUS_LP=400, RANK_CH_BONUS=100000;
function rankChBonusCheck(delay){
  if(!P||P.rankChBonus||!P.rank)return false;const r=P.rank;
  if(!(r.tier>RANK_CH||(r.tier===RANK_CH&&r.lp>=RANK_CH_BONUS_LP)))return false;
  P.rankChBonus=1;P.gold+=RANK_CH_BONUS;setTimeout(()=>goldToast(RANK_CH_BONUS,`랭크전 챌린저 ${RANK_CH_BONUS_LP} LP 달성 보상`),delay||0);return true;
}
function goldToast(n,why){

  d.innerHTML=`<div class="st-ic">💰</div><div><b>${fmt(n)} 코인 획득!</b><small>${why||''}</small></div>`;
  const prev=document.querySelectorAll('.stoast').length;d.style.top=`${14+prev*70}px`;

function migrateSave(){
  if(P._forestRestore&&!B)forestRestore(); // 노력의 숲 도중 나간 경우 원래 능력치로
  if(P._dgRestore&&!B){P.hp=P._dgRestore.hp;P.mp=P._dgRestore.mp;delete P._dgRestore;} // 던전 도중 나간 경우 HP 원래대로
  if(!P.uid)P.uid='u'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
  if(!P.noMp){P.noMp=1;if(P.relics&&P.relics.includes('seal_glasya'))P.atk+=5;if(P.items&&P.items.rosary){P.items.water+=P.items.rosary;P.items.rosary=0;}}

  ['prog','wins'].forEach(k=>{if(!Array.isArray(P[k]))P[k]=[];while(P[k].length<AREAS.length)P[k].push(0);});
  if(!Array.isArray(P.cleared))P.cleared=[];while(P.cleared.length<AREAS.length)P.cleared.push(false);
  if(P.ended&&P.unlocked<5)P.unlocked=5;
  // 서울 글라시아라볼라스 첫 클리어 50,000 코인: 업데이트 전에 이미 깬 계정도 한 번 지급
  if(!P.glasyaBonus&&((P.prog[0]||0)>=STAGES||P.cleared[0])){P.glasyaBonus=1;P.gold+=GLASYA_BONUS;setTimeout(()=>goldToast(GLASYA_BONUS,'서울 글라시아라볼라스 첫 클리어 보상 (소급 지급)'),800);}
  romeBonusCheck(800);
  rankChBonusCheck(1000);
  // 이전 버전에서 마지막 지역 보스를 이미 깬 경우: 새로 추가된 다음 지역을 연다

  return opened;
}

function toggleSortie(id){

  if(P.active.includes(id)){P.active=P.active.filter(x=>x!==id);m=`${ALLIES[id].name} — 대기`;}

function renderCostume(msg){
  P.cos=P.cos||{owned:{},eq:{}};

      :`<div class="panel"><div class="ptitle">👗 동료 코스튬 <span class="small">캐릭터를 눌러 의상 보기</span></div><div class="desc">골드로 새 의상을 해금하고 갈아입힐 수 있어요. 한 번 해금한 의상은 언제든 다시 입힐 수 있어요. 의상은 모습만 바뀌고 능력치는 그대로예요.</div>
        <div class="dexgrid">${ids.map(cell).join('')}</div></div>`}
    <button class="btn" id="back">← 돌아가기</button>${tabBar()}`;
  document.querySelectorAll('[data-cossel]').forEach(b=>b.onclick=()=>{cosSel=b.dataset.cossel;renderCostume();});
  if($('#coslist'))$('#coslist').onclick=()=>{cosSel=null;renderCostume();};
  document.querySelectorAll('[data-cosbuy]').forEach(b=>b.onclick=()=>{
    const [id,cid]=b.dataset.cosbuy.split('|'),c=COSTUMES[id].find(x=>x.id===cid);
    if(!c||!(id===FIXED||owned(id))||P.cos.owned[cid]||(c.stone?P.items.stone<c.stone:P.gold<c.cost))return;
    if(c.stone)P.items.stone-=c.stone;else P.gold-=c.cost; // 성유물 가격 의상은 천상의 성유물로 구매
    P.cos.owned[cid]=true;P.cos.eq[id]=cid;save();
    renderCostume(`🔓 ${ALLIES[id].name}의 「${c.name}」 해금! 바로 갈아입혔어요.${c.img?'':' (의상 그림은 곧 추가돼요)'}`);

  });
  $('#back').onclick=()=>renderHub();
  window.scrollTo(0,0);
}

const AWAKEN_EXCL_STONE=3;

  showStory(`<div class="sum s5"><div class="sum-title">각성</div><div class="sum-stars">${'★'.repeat(5)}</div>${allyPortrait(id)}

    ()=>renderAllies(`💠 ${al.name} 각성 ${P.awaken[id]}단계`),true);

/* 실시간 루프: 적·동료가 각자 속도로 행동 */
function enemyStep(){

  if(B.eslowUntil&&Date.now()<B.eslowUntil){B.eslowSkip=!B.eslowSkip;if(B.eslowSkip)return;} // 루메온의 둔화: 적 공격 속도 절반

function allyStep(){
  if(!B||B.over||B.won||B.busy||B.defending||!$('#modal').classList.contains('hidden'))return;
  const e=B.e;if(e.hp<=0)return;
  alliesAct();
  if(e.hp<=0&&((e.berserk&&!B.berserked)||(e.madness&&!B.maddened)||(e.awaken&&!B.awoke)||(e.twin&&!B.twinned)||(e.relay&&(B.relayStage||0)<2)||(e.lastStand&&!B.lastStood)||(e.rampage&&!B.rampaged)||(e.duckHide&&!B.remHid)))e.hp=1;
  if(P.hp<=0){P.hp=0;B.over=true;renderBattle();setTimeout(defeat,900);return;}
  if(e.hp<=0){winNow();return;}
  if(checkPhase())return;
  renderBattle();
}
function bossTick(){
  if(!B||B.over||B.won||!$('#modal').classList.contains('hidden'))return;

  hitPlayer(0.3,`⏱ ${B.e.name}의 맹공`);

  if(P.hp<=0){P.hp=0;B.over=true;clearInterval(B.zapT);renderBattle();setTimeout(defeat,800);return;}
  renderBattle();
}
function zapTick(){
  if(!B||B.over||!B.e.zap||!$('#modal').classList.contains('hidden'))return;

function hitAllies(pct,label,quiet){
  const down=[];

    if(id==='danian'&&Math.random()<0.5)return; // 다니안 회피
    const d=allyTake(id,Math.max(1,Math.round(h.max*pct*(B.ashield?0.5:1)*(B.splash?0.5:1)*(paraOn()?1.5:1)*(B.e.apFreeze&&apOn(id)?2:1)*rnd(0.9,1.1))));h.hp=Math.max(0,h.hp-d);
    if(h.hp<=0&&!allyDown(id))down.push(ALLIES[id].name);});
  if(!quiet)addLog(`${label} — 동료 전원 피해`);
  if(down.length)addLog(`💀 ${down.join(', ')} 쓰러짐 (이번 전투 행동 불가)`);
}

/* 각성한 나베리우스(귀환 후): 5초마다 주인공·동료의 생명력 흡수 */
function drainTick(){
  if(!B||B.over||B.won||P.hp<=0||!$('#modal').classList.contains('hidden')){if(B&&B.e.relay)B.drainAt=Date.now()+B.e.relay.back.drainEvery;return;}
  const e=B.e,bk=e.relay.back;B.drainAt=Date.now()+bk.drainEvery;
  let tot=0;const pd=Math.max(1,Math.round(P.maxHp*bk.drainPct));P.hp=Math.max(1,P.hp-pd);tot+=pd;
  for(const id of partyIds()){const h=B.ahp&&B.ahp[id];if(h&&h.hp>0){const ad=Math.max(1,Math.round(h.max*bk.drainPct));h.hp=Math.max(1,h.hp-ad);tot+=ad;}}
  const heal=Math.min(e.maxHp-e.hp,tot*bk.drainMul);e.hp+=heal;
  addLog(`🩸 생명력 흡수 — 주인공 ${pd} · 동료 전원 HP ${Math.round(bk.drainPct*100)}% 흡수 · 나베리우스 ${heal} 회복`);queueFx('player','🩸-'+pd,'pdmg');
  renderBattle();
}

function flushFx(){
  B.fxq.forEach(([t,txt,cls])=>{
    const el=t==='enemy'?$('#eicon'):$('#pstatus');
    if(!el)return;
    const r=el.getBoundingClientRect();
    const s=document.createElement('div');
    s.className='float '+cls;s.textContent=txt;
    s.style.left=(r.left+r.width/2+rnd(-40,40))+'px';
    s.style.top=(r.top+r.height/2+rnd(-14,14))+'px';
    $('#fx').appendChild(s);setTimeout(()=>s.remove(),950);
    if(t==='enemy')el.classList.add('hit');
    if(cls==='pdmg'){document.body.classList.add('flash');setTimeout(()=>document.body.classList.remove('flash'),220);}
  });
  B.fxq=[];
}

const AWAKEN_SKILL={every:5,mult:3,name:'대천사의 심판'};

/* 케테케테: 공격 대신 폭풍(2초마다 주인공·동료 현재 체력 절반 — 보호막 무시) · 지옥의 흑마(6초마다 주인공·동료 고정 피해 — 보호막에 막힘) */
const NECK_SHIELD=444;
function keteTick(){
  if(!B||B.over||B.won||P.hp<=0||!$('#modal').classList.contains('hidden'))return;
  const e=B.e,st=e.storm,hs=e.horse;if(!st||e.hp<=0)return;
  B.ktS=(B.ktS||0)+250;B.ktH=(B.ktH||0)+250;let ch=false;
  if(B.ktS>=st.every){B.ktS=0;ch=true;
    const lh=Math.floor(P.hp*st.pct);P.hp-=lh;const al=[];
    partyIds().forEach(x=>{const h=B.ahp[x];if(!h||h.hp<=0)return;const l=Math.floor(h.hp*st.pct);h.hp-=l;if(l>0)al.push(`${ALLIES[x].name} -${l}`);});
    addLog(`🌪 ${e.name}의 폭풍 — 생명이 반으로 깎인다! 주인공 -${lh}${al.length?' · '+al.join(' · '):''}`);queueFx('player','🌪-'+lh,'dmg');}
  if(hs&&B.ktH>=hs.every){B.ktH=0;ch=true;
    const f=e.fixedDmg;e.fixedDmg=true;const sv=e.atk;e.atk=hs.dmg;hitPlayer(1,`🐎 지옥의 흑마가 들이박았다 (고정 피해)`);e.atk=sv;e.fixedDmg=f;
    const down=[];partyIds().forEach(x=>{const h=B.ahp[x];if(!h||h.hp<=0)return;const d=allyTake(x,hs.dmg);h.hp=Math.max(0,h.hp-d);if(h.hp<=0&&!allyDown(x))down.push(ALLIES[x].name);});
    addLog(`🐎 지옥의 흑마 돌진 — 동료 전원 고정 피해 ${hs.dmg}`);if(down.length)addLog(`💀 ${down.join(', ')} 쓰러짐 (이번 전투 행동 불가)`);
    if(P.hp<=0){P.hp=0;B.over=true;renderBattle();setTimeout(defeat,900);return;}}
  if(ch)renderBattle();
}
/* 레미안 → 레비아: 그림자 소환(주인공 공격 흡수) · 파멸의 환(동료 시야 3초 차단 — 공격 빗나감 · 체력 회복 불가) */
const lvBlindOn=id=>!!(B&&B.lvBlind&&B.lvBlind[id]&&B.lvBlind[id].until>Date.now());
function lvEnforce(){
  if(!B||!B.lvBlind)return;const now=Date.now();
  for(const id in B.lvBlind){const b=B.lvBlind[id],h=B.ahp[id];
    if(!h||b.until<=now){delete B.lvBlind[id];if(h&&h.hp>0)addLog(`👁 ${ALLIES[id].name}의 시야가 돌아왔다`);continue;}
    if(h.hp>b.cap)h.hp=b.cap;else b.cap=h.hp;}
}
function lvTick(){
  if(!B||B.over||B.won||P.hp<=0||!$('#modal').classList.contains('hidden'))return;
  const e=B.e,sd=e.shadow,rg=e.ring;if(!sd||e.hp<=0)return;
  lvEnforce();
  B.lvSd=(B.lvSd||0)+250;B.lvRg=(B.lvRg||0)+250;let ch=false;
  if(B.lvSd>=sd.every){B.lvSd=0;const v=Math.max(1,Math.round(e.maxHp*sd.pct));B.lvShadow=v;ch=true;
    addLog(`🌑 ${e.name}의 그림자 소환 — 그림자(HP ${fmt(v)})가 주인공의 공격을 막아선다`);queueFx('enemy','🌑 그림자','mpf');}
  if(rg&&B.lvRg>=rg.every){B.lvRg=0;const L=partyIds().filter(x=>B.ahp[x]&&B.ahp[x].hp>0);
    if(L.length){const now=Date.now();B.lvBlind=B.lvBlind||{};L.forEach(x=>{B.lvBlind[x]={until:now+rg.dur,cap:B.ahp[x].hp};});ch=true;
      addLog(`⭕ ${e.name}의 파멸의 환 — 동료 전원 ${rg.dur/1000}초간 시야 차단 (공격 ${Math.round(rg.miss*100)}% 빗나감 · 체력 회복 불가)`);queueFx('enemy','⭕ 파멸의 환','mpf');}}
  if(ch)renderBattle();
}
function hitEnemy(mult,label){
  const e=B.e;
  if(B.evade){B.evade=false;addLog(`${label}! — 적이 모습을 감춰 빗나갔다`);queueFx('enemy','MISS','mpf');return;}
  if(e.dimension&&Math.random()<0.5){addLog(`${label}! — 🌀 차원의 틈으로 흘러가 사라졌다`);queueFx('enemy','차원 전이','mpf');return;}
  if(remHideOn()){const d=Math.max(1,Math.round((P.atk*(B.buff?1.5:1)*mult-enemyDef()/2)*rnd(0.9,1.1))),r=Math.max(1,Math.round(d*e.duckHide.reflect));
    const alive=partyIds().filter(id=>B.ahp[id]&&B.ahp[id].hp>0);
    if(alive.length){const id=pick(alive),h=B.ahp[id],rr=allyTake(id,r);h.hp=Math.max(0,h.hp-rr);addLog(`${label}! — 🦆 오리가 대신 맞고, 절반 ${rr}이(가) ${ALLIES[id].name}에게 튕겨 나갔다`);}
    else addLog(`${label}! — 🦆 오리가 대신 맞았다`);
    queueFx('enemy','🦆','mpf');return;}
  if(B.immune){addLog(`${label}! — ⏸ 시간이 멈춰 피해가 무효화됐다`);queueFx('enemy','무효','mpf');return;}
  if(e.reflectAll&&Math.random()<e.reflectAll){const d0=Math.max(1,Math.round((P.atk*(B.buff?1.5:1)*mult-enemyDef()/2)*rnd(0.9,1.1))),r=Math.max(1,Math.round(d0*0.5));P.hp=Math.max(0,P.hp-r);addLog(`${label}! — 🪞 ${e.name}이(가) 튕겨 냈다! 주인공에게 ${r} 반사`);queueFx('player','🪞-'+r,'pdmg');queueFx('enemy','반사','mpf');if(P.hp<=0){renderBattle();defeat();}return;}
  if(e.voidHero&&Math.random()<e.voidHero){addLog(`${label}! — 🔥 아몬의 업화에 삼켜져 무효화됐다`);queueFx('enemy','무효','mpf');return;}
  let d=((P.atk+mihoAtk())*(B.buff?1.5:1)*(B.aura?1.2:1)*mult-enemyDef()/2)*rnd(0.9,1.1)*(salvOn()?1.5:1);
  d=Math.max(1,Math.round(d));

      case 'galaxy':{ // 루메온: 은하 충돌 (속박 + 둔화) · 마법 피해 (방어력 50% 무시)

      case 'charm':{ // 로아: 유혹 (5초간 모든 공격 치명타) · 평소엔 하트 화살
        if(!charmOn()&&Date.now()>=(B.charmCD||0)){B.charmUntil=Date.now()+CHARM_MS;B.charmCD=B.charmUntil+CHARM_REST;addLog(`💗 ${nm}의 유혹 — ${e.name}이(가) 빈틈을 드러냈다! 5초간 모든 공격이 치명타`);queueFx('enemy','💗 유혹','mpf');}

        else{const d=Math.floor(e.hp/2);stat('dmg',id,Math.min(d,e.hp));e.hp=Math.max(0,e.hp-d);
          addLog(`⚖️ ${nm}의 정의! ${e.name}의 체력 절반(${fmt(d)})을 앗아갔다`);queueFx('enemy','⚖️'+d,'crit');
          document.body.classList.add('holyflash');setTimeout(()=>document.body.classList.remove('holyflash'),400);}
        const h=B.ahp[id];if(h){h.hp=0;}addLog(`💀 ${nm} — 정의의 대가로 쓰러졌다`);

      case 'aora':{ // 대천사 아오라: 천사의 구원 · 흡혈
        const base=16+lv*5;
        if(!salvOn()&&Date.now()>=(B.salvCD||0)){
          const dur=isMyth(id)?5000:3000;B.salvUntil=Date.now()+dur;B.salvCD=Date.now()+dur+4500;B.sealed=Math.max(B.sealed||0,Math.ceil(dur/1500));
          addLog(`👼 ${nm} — 천사의 구원! 적이 ${dur/1000}초간 속박된다 (적 공격력 1.5배 감소 · 주인공 피해 1.5배)`);queueFx('enemy','👼 속박','mpf');
        }else{
          const d=allyHit(base,`${nm}의 천사의 심판`,0.3);
          const h=B.ahp[id];if(d&&h&&h.hp>0){const vh=Math.min(h.max-h.hp,Math.round(d*0.5));if(vh>0){h.hp+=vh;stat('heal',id,vh);}}
        }
        break;}
      case 'firepet': break; // 하리뭉: 불꽃쇼는 hariTick
      case 'bloodpet': break; // 뱀뱀이: 흡혈 송곳니는 baemTick
      case 'zappet': break;   // 미호롱: 번개 발톱은 mihoTick
      case 'charmpet': break; // 토토롱: 매혹의 하트는 totoTick
      case 'kickpet': break;  // 망아찌: 뒷발차기는 mangTick
      case 'dessert': allyHit(14+lv*4.5,`${nm}의 디저트 포크`,0.4);break; // 히노아: 디저트 던지기는 hnThrowTick (2초마다)
      case 'heatwave':{ // 아트리스: 열파(적 현재 체력 비례 공격력 감소) · 저주(회복 불가) · 공격력·마법력 절반씩
        const pct=ATR_DOWN_MAX*Math.max(0,Math.min(1,e.hp/e.maxHp)),now=Date.now();
        allyHit(10+lv*3,`${nm}의 열파 (물리·마법 절반씩)`,0.25);
        if(!B.immune&&e.hp>0){B.atrDown={pct,until:now+ATR_DUR};atrCurseSet(now+ATR_DUR);
          if(!B.atrLogAt||now-B.atrLogAt>6000){B.atrLogAt=now;addLog(`🔥 열파 — ${e.name}의 공격력 ${Math.round(pct*100)}% 감소 · 🕯 저주: ${ATR_DUR/1000}초간 회복 불가`);}}
        break;}
      case 'queen':{ // 엘리자베스: 여왕의 검 (심판은 judgeTick)
        allyHit(16+lv*5,`${nm}의 여왕의 검`,0.4);break;}
      case 'frost':{ // 아키라: 얼어붙은 화살 · 급소 사격(치명타 + 피해 절반 회복) · 신화 혹한의 화살
        const base=(13+lv*4.2)*(B.akiraMul||1);
        if(Date.now()>=(B.akiraCD||0)&&!B.immune){B.eFrozenUntil=Date.now()+AKIRA_FREEZE;B.akiraCD=B.eFrozenUntil+AKIRA_REST;addLog(`🧊 ${nm}의 얼어붙은 화살! ${e.name}이(가) ${AKIRA_FREEZE/1000}초간 얼어붙었다 (행동 불능)`);queueFx('enemy','🧊 빙결','mpf');allyHit(base,`${nm}의 얼어붙은 화살`,0.4);}
        else if(Math.random()<AKIRA_VITAL){const d=allyHit(base*2,`🎯 ${nm} — 급소 사격 (치명타)`,0.4);const hh=d?Math.min(P.maxHp-P.hp,Math.round(d*0.5*pHealMul())):0;if(hh>0){P.hp+=hh;stat('heal',id,hh);addLog(`🎯 급소 사격 — 주인공 HP ${hh} 회복`);queueFx('player','🎯+'+hh,'heal');}}
        else allyHit(base,`${nm}의 서리 화살`,0.4);
        break;}
      case 'dice':{ // 바벨로드: 운명의 점 (주사위는 diceTick) · 평소엔 예언의 지팡이
        const base=(14+lv*4.5)*(diceAtkOn()?2:1),lb=`${nm}의 예언의 광선${diceAtkOn()?' (공격력 2배)':''}`;
        allyHit(base,lb,0.4);if(diceSpdOn()&&B.e.hp>0)allyHit(base,lb+' — 연속',0.4);
        break;}
      case 'tide':{ // 미네르: 침몰(적 공격력 감소) · 물보라(동료 보호) · 미네르바 각성 후 고정 피해 + 치명타
        B.minerT=(B.minerT||0)+1;const base=12+lv*4;
        if(!B.hex){B.hex=3;addLog(`🌊 ${B.minerva?'미네르바':nm}의 침몰 — 적을 물속으로 끌어내렸다 (3턴간 적 공격력 감소)`);}
        else if(!B.splash&&B.minerT%3===0){B.splash=isMyth(id)?3:2;addLog(`💦 ${B.minerva?'미네르바':nm}의 물보라 — 물의 보호막이 동료들을 감싼다 (${B.splash}턴간 동료 피해 절반)`);}
        else if(B.minerva)allyHit(base*(isMyth(id)?2:1.5),`🌊 미네르바의 해일 — 고정 피해 · 💥치명타`,0,true);
        else allyHit(base,`${nm}의 물살`,0.5);
        break;}
      case 'train': allyHit(vistaBase(lv),`${nm}의 군도 베기`,0.5);break; // 비스타: 열차는 trainTick
      case 'breeze':{ // 엘리스: 디버프 제거 · 응원 서포트 (공격은 약함)
        if(B.eliseCD>0)B.eliseCD--;
        const db=[];
        if(B.curse){db.push('방어력 감소');B.curse=0;}
        if(B.dot){db.push(B.dot.name);B.dot=null;}
        if(B.silence){db.push('봉인');B.silence=0;}
        if(B.healCut){db.push('회복 감소');B.healCut=0;}
        partyIds().forEach(x=>{if(B.stun[x]>0&&B.stunWhy[x]==='불화'){B.stun[x]=0;db.push(`${ALLIES[x].name} 불화`);}});
        if((B.vslow&&Object.keys(B.vslow).length)||(B.vsil&&Object.keys(B.vsil).length)){B.vslow={};B.vsil={};db.push('동료 둔화·침묵');}
        if(db.length){addLog(`🍂 ${nm}의 정화의 바람 — ${db.join(', ')} 제거`);queueFx('player','🍂 정화','mpf');if(isMyth(id))heal(0.1,`🔱 만추의 축복`);}
        else if(B.eliseCD<=0){
          B.eliseCD=isMyth(id)?2:3;heal(0.1,`🍂 ${nm}의 가을바람 응원`);
          if(!B.aura){B.aura=4;addLog(`${nm}의 응원 — 3턴간 주인공 공격력 1.2배`);}
        }else allyHit(6+lv*2.4,`${nm}의 낙엽 바람`,0.5);
        break;}
      case 'prism':{ // 세이렌: 보석 광선 · 프리즘 굴절 반사
        B.sirenT++;
        if(!B.prism&&(B.charging||B.sirenT%3===0)){B.prism=1;B.prismM=m*(isMyth(id)?2:1);addLog(`${nm}의 프리즘 굴절 — 다음 적 공격의 절반을 굴절시켜 되돌린다`);}
        else allyHit(12+lv*4.2,`${nm}의 보석 광선`,isMyth(id)?0:0.3);
        break;}
      case 'asiris': // 신의 은총: 짧은 기적, 반드시 대가
        allyHit(30+lv*9,`${nm} — 신의 은총`,0);
        if(e.hp>0){B.sealed=Math.max(B.sealed,1);addLog(`${nm}의 봉인 — 적이 1턴간 움직일 수 없다`);}
        {const t=isMyth(id)?1:2;B.stun[id]=t;B.stunWhy[id]='기적의 대가';addLog(`${nm} — 기적의 대가로 ${t}턴간 행동 불가`);}
        break;
    }
  }
}

function hitPlayer(mult,label){
  const e=B.e;
  if(inParty('guseju')&&!(B.stun&&B.stun.guseju)&&Math.random()<(isMyth('guseju')?0.25:0.15)){
    addLog(`${label} — 구세주의 예지로 공격을 피했다!`);queueFx('player','MISS','mpf');return 0;
  }
  if(inParty('danian')&&isMyth('danian')&&!(B.stun&&B.stun.danian)&&B.ahp.danian&&B.ahp.danian.hp>0&&Math.random()<0.2){
    addLog(`${label} — 🔱 천지개벽: 다니안이 공격을 쳐냈다!`);queueFx('player','MISS','mpf');return 0;
  }
  if(B.evadeNext){B.evadeNext=false;addLog(`${label} — 🔦 눈이 부신 적의 공격이 빗나갔다!`);queueFx('player','MISS','mpf');return 0;}
  if(B.blind&&Math.random()<0.35){addLog(`${label} — 📜 시야가 가려진 적의 공격이 빗나갔다!`);queueFx('player','MISS','mpf');return 0;}
  if(B.negate){addLog(`${label} — 🗡 갈라진 대지에 막혀 무력화됐다!`);queueFx('player','무력화','mpf');return 0;}
  const def=(P.def+mangDef())*(B.curse?0.6:1)*(e.magic?0.5:1); // 마법 피해: 방어력 절반 · 망아찌 뒷발차기 방어력 증가
  const critOn=e.critAll&&!(sakuraWind()&&Math.random()<(isMyth('sakura')?0.75:0.5));
  if(e.critAll&&!critOn)label+=' (🌸 벚꽃바람에 치명타가 빗나감)';
  const crit=critOn?e.critAll*(B.awoke&&e.awaken?e.awaken.critMult:1):1;
  const raw=e.atk*(1+0.2*B.rage)*(B.hex?0.8:1)*(1-atrDownPct())*(salvOn()?1/1.5:1)*magicMul()*(B.fallMul||1)*(e.apFreeze&&apOn('hero')?2:1)*mult*crit;
  // fixedDmg: 방어력 무시 고정 피해 · 그 외에는 방어력으로 최대 70%까지만 줄어듦 (최소 30%는 들어감)
  let d=e.fixedDmg?raw:Math.max(raw*DEF_FLOOR,raw-def/2)*rnd(0.9,1.1);
  d=Math.max(1,Math.round(d));
  if(B.defending)d=Math.max(1,Math.round(d*0.6)); // 방어: 피해 40% 감소
  if(B.ward)d=Math.max(1,Math.round(d*0.5));
  if(B.prism){
    const r=Math.round(d*0.5*(B.prismM>=2?2:1));d=Math.max(1,d-Math.round(d*0.5));
    if(!B.immune){stat('dmg','siren',Math.min(r,e.hp));e.hp=Math.max(0,e.hp-r);addLog(`💎 프리즘 굴절 — ${e.name}에게 ${r} 반사`);queueFx('enemy','💎'+r,'dmg');}
  }
  if(ezReflOn()){ // 엘리자베스의 심판: 공격 반사 — 주인공은 피해를 받지 않고 적에게 되돌린다
    if(!B.immune){stat('dmg','elizabeth',Math.min(d,e.hp));e.hp=Math.max(0,e.hp-d);}
    addLog(`🪞 ${label} — 심판의 반사! ${e.name}에게 ${d} 되돌렸다`);queueFx('enemy','🪞'+d,'dmg');return 0;}
  let absorbed=0;
  if(B.neckSh>0&&d>0){const an=Math.min(B.neckSh,d);B.neckSh-=an;d-=an;absorbed+=an;}
  if(B.ezShield>0){const a0=Math.min(B.ezShield,d);B.ezShield-=a0;d-=a0;absorbed+=a0;stat('heal','elizabeth',a0);}
  if(hnPartyOn()&&B.hnParty.hero>0&&d>0){const a4=Math.min(B.hnParty.hero,d);B.hnParty.hero-=a4;d-=a4;absorbed+=a4;stat('heal','hinoa',a4);}
  if(B.hnShield>0&&d>0){const a5=Math.min(B.hnShield,d);B.hnShield-=a5;d-=a5;absorbed+=a5;stat('heal','hinoa',a5);}
  if(B.shield>0&&d>0){const a1=Math.min(B.shield,d);B.shield-=a1;d-=a1;absorbed+=a1;stat('heal','elia',a1);}
  if(B.mshield>0&&d>0){const a2=Math.min(B.mshield,d);B.mshield-=a2;d-=a2;absorbed+=a2;stat('heal','mikael',a2);}
  if(B.bshield>0&&d>0){const a3=Math.min(B.bshield,d);B.bshield-=a3;d-=a3;absorbed+=a3;}
  P.hp=Math.max(0,P.hp-d);
  if(P.relics.includes('time_belt')&&!B.beltUsed&&P.hp>0&&P.hp<=P.maxHp*0.5){B.beltUsed=true;B.bshield=P.hp;addLog(`⏳ 시간에 갇힌 벨트 — 시간이 멈추며 남은 HP만큼 보호막 ${P.hp}`);queueFx('player','⏳🛡'+P.hp,'mpf');}
  if(B.vamp&&d>0&&e.hp>0){const vh=Math.min(e.maxHp-e.hp,Math.round(d*B.vamp));if(vh>0){e.hp+=vh;label+=` (🩸 흡혈 +${vh})`;}}
  addLog(`${label}!${critOn?' 💥치명타':''} ${d} 피해${B.defending?' (방어)':''}${B.ward?' (결계)':''}${absorbed?` (🛡 보호막 ${absorbed} 흡수)`:''}`);
  queueFx('player','-'+d,'pdmg');
  if(e.bleedOnHit&&Math.random()<0.35){B.dot={name:'출혈',dmg:Math.max(5,Math.round(e.atk*0.3)),turns:3};addLog('🩸 독사의 이빨 — 출혈 (3턴)');}
  return d;
}

/* 자유 사냥: 경험치·골드 3배 · 자동 전투로 멈출 때까지 계속 */
const HUNT_MULT=3, HUNT_MULT_REALM=4, AUTO_MS=550;
const huntMult=a=>AREAS[a]&&AREAS[a].realm?HUNT_MULT_REALM:HUNT_MULT; // 마계 자유 사냥은 ×4
let autoHunt={on:false,area:0,n:0,xp:0,gold:0};
const autoSum=()=>`${autoHunt.farm?`${autoHunt.n}/${autoHunt.farm.target}회`:`${autoHunt.n}회`} 처치 · ✨ +${fmt(autoHunt.xp)} · 💰 +${fmt(autoHunt.gold)} G`;
/* 천상의 성유물작: 서울 최종 보스를 자동 전투로 반복 · 100번 잡으면 멈춤 (북마크 주소 …/#glasya 로 바로 시작) */
const FARM_AREA=0, FARM_TARGET=100;
const farmReady=()=>(P.prog[FARM_AREA]||0)>=STAGES-1;
function startGlasyaFarm(){
  if(!farmReady()){renderHub('🔒 천상의 성유물작은 서울 15스테이지(최종 보스)까지 열려 있어야 할 수 있다');return;}
  autoHunt={on:true,area:FARM_AREA,n:0,xp:0,gold:0,farm:{stage:STAGES,target:FARM_TARGET}};
  startBattle({area:FARM_AREA,stage:STAGES,farm:true});
}
let farmHashDone=false;
function autoTick(){
  if(!B||!B.auto||B.over||B.won||B.busy||!$('#modal').classList.contains('hidden'))return;
  if(Date.now()<(B.cdUntil||0)||pFrozen())return;
  if(P.hp<P.maxHp*0.45&&P.items.water>0&&!B.noHeal){act('item','water');return;}
  if(P.hp<P.maxHp*0.25){autoHuntStop('⚠ HP가 위험해 자동 사냥을 멈췄다 (성수 없음) — 성당에서 휴식하자');return;}
  if(B.charging&&!B.guard){act('defend');return;}
  act('attack');
}
function autoHuntStop(why){
  const had=autoHunt.on;autoHunt.on=false;
  if(B&&B.auto&&!B.over&&!B.won){B.over=true;clearBattle();}
  save();renderHub(had?`${why||'⏹ 자동 사냥을 멈췄다'}<br>🔁 이번 사냥: ${autoSum()}`:why);
}
function act(kind,arg){
  if(!B||B.busy||B.over||B.won)return;
  if(kind==='dgquit'){if(B.dungeon)dungeonEnd('quit');return;}
  if(B.dungeon&&!B.dgGo)return;   // 3·2·1 카운트다운이 끝나기 전에는 행동 불가
  if(kind==='itemmenu'||kind==='skillmenu'||kind==='back'){B.menu=kind==='itemmenu'?'item':'main';renderBattle();return;}
  if(Date.now()<(B.cdUntil||0))return;
  if(pFrozen()){addLog(`🧊 얼어붙어 움직일 수 없다… (${Math.ceil((B.pFrozenUntil-Date.now())/1000)}초)`);renderBattle();return;}
  const e=B.e;
  if(kind==='autostop'){autoHuntStop();return;}
  if(kind==='attack'||kind==='item'){B.guard=false;B.defending=false;}
  if(kind==='attack'){
    hitEnemy(1,'공격');
    B.atkN=(B.atkN||0)+1;
    if(B.atkN>=AWAKEN_SKILL.every){B.atkN=0;if(e.hp>0)awakenStrike();}
  }else if(kind==='skill'){
    const s=SKILLS.find(x=>x.id===arg);
    if(!s||P.mp<s.mp||B.silence)return;
    P.mp-=s.mp;
    if(s.type==='dmg'){
      hitEnemy(s.mult*(s.demonBonus&&e.demon?s.demonBonus:1),s.name);
    }else if(s.type==='heal'){
      const h=Math.min(P.maxHp-P.hp,Math.round(P.maxHp*s.pct));
      P.hp+=h;addLog(`${s.name} — HP ${h} 회복`);queueFx('player','+'+h,'heal');
    }else if(s.type==='buff'){
      B.buff=4;addLog(`${s.name} — 3턴간 공격력 1.5배`);
    }
  }else if(kind==='defend'){
    if(B.defending)return;
    B.defending=true;B.guard=true;addLog('🛡 방어 태세 — 공격하거나 아이템을 쓰기 전까지 피해 40% 감소 (동료도 공격을 멈춘다)');
  }else if(kind==='item'){
    if(arg==='water'&&P.items.water>0&&B.noHeal){addLog('🧪 가미긴의 괴성이 상처를 벌려 놓았다 — 회복할 수 없다');renderBattle();return;}
    else if(arg==='water'&&P.items.water>0){
      P.items.water--;const h=Math.min(P.maxHp-P.hp,Math.round(Math.max(60,P.maxHp*0.4)*healMul()));
      P.hp+=h;stat('heal','hero',h);addLog(`성수 사용 — HP ${h} 회복`);queueFx('player','+'+h,'heal');
    }else if(arg==='rosary'&&P.items.rosary>0){
      P.items.rosary--;const m=Math.min(P.maxMp-P.mp,25);
      P.mp+=m;addLog(`묵주 사용 — 성력 ${m} 회복`);queueFx('player','+'+m,'mpf');
    }else return;
  }else if(kind==='flee'){
    if(B.isBoss||B.tower)return;
    if(Math.random()<0.6){
      B.busy=true;addLog('무사히 도망쳤다!');renderBattle();
      if(autoHunt.on){const w=autoSum();autoHunt.on=false;setTimeout(()=>{save();renderHub(`무사히 도망쳤다. 🔁 자동 사냥 종료 — ${w}`);},600);return;}
      setTimeout(()=>{save();renderHub('무사히 도망쳤다.');},600);return;
    }
    addLog('도망에 실패했다!');
  }
  if(e.hp<=0&&((e.berserk&&!B.berserked)||(e.madness&&!B.maddened)||(e.awaken&&!B.awoke)||(e.twin&&!B.twinned)||(e.relay&&(B.relayStage||0)<2)||(e.lastStand&&!B.lastStood)||(e.rampage&&!B.rampaged)||(e.duckHide&&!B.remHid)))e.hp=1; // 폭주·광기 전에는 쓰러지지 않음
  const cd=kind==='attack'||kind==='skill'?RT.atkCd:kind==='item'?RT.itemCd:kind==='flee'?RT.fleeCd:RT.defCd;
  B.cdUntil=Date.now()+cd;B.cdLen=cd;B.menu='main';
  setTimeout(()=>{if(B&&!B.over&&!B.won&&$('#modal').classList.contains('hidden'))renderBattle();},cd+30);
  if(P.hp<=0&&e.hp>0){P.hp=0;B.over=true;renderBattle();setTimeout(defeat,900);return;}
  if(e.hp<=0){winNow();return;}
  if(checkPhase())return;
  renderBattle();
}

function checkPhase(){
  const e=B.e;
  if(e.relay&&!(B.relayStage>0)&&e.hp>0&&e.hp<=e.relay.at){
    const w=e.relay.lord,em=LATE_BOSS_MULT;

    B.nab={name:e.name,title:e.title,art:e.art,atk:e.atk,def:e.def,moves:e.moves,slashes:e.slashes,dimension:e.dimension,maxHp:e.maxHp};
    e.name=w.name;e.title=w.title;e.art=w.art;e.hp=w.hp;e.maxHp=w.hp;e.atk=Math.round(w.atk*em);e.def=w.def;e.moves=w.moves;e.slashes=0;e.dimension=false;
    addLog(`🩸 나베리우스가 물러나고 「어둠의 군주」가 나섰다! (체력 ${fmt(w.hp)})`);
    showStory(`<div class="sum s5"><div class="sum-title">어둠의 군주</div><div class="intro-art">${portraitHTML(w.art,'big')}</div><div class="sum-name">${w.name}</div><div class="small">${w.title}</div><p class="sum-desc" style="color:#ffb0b0">${esc(w.line).replace(/\n/g,'<br>')}</p></div>`,

    B.vamp=bk.vamp;
    addLog(`🩸 어둠의 군주 격파 — 나베리우스가 체력 ${fmt(bk.hp)}로 돌아왔다! (흡혈 · 생명력 흡수)`);
    document.body.classList.add('flash');setTimeout(()=>document.body.classList.remove('flash'),400);
    showStory(`<div class="sum s5"><div class="sum-title">귀환</div><div class="intro-art">${portraitHTML(n.art,'big')}</div><div class="sum-name">${n.name}</div><p class="sum-desc" style="color:#ffb0b0">${esc(bk.line).replace(/\n/g,'<br>')}</p></div>`,
      ()=>{B.drainAt=Date.now()+bk.drainEvery;B.drainT=setInterval(drainTick,bk.drainEvery);renderBattle();setTimeout(enemyTurn,500);},true);
    return true;
  }
  if(e.twin&&!B.twinned&&e.hp>0&&e.hp<=e.twin.at){
    const w=e.twin,em=LATE_BOSS_MULT;
    B.twinned=true;B.charging=false;B.chargeKind=null;
    e.name=w.name;e.title=w.title;e.art=w.art;e.hp=w.hp;e.maxHp=w.hp;e.atk=Math.round(w.atk*em);e.def=w.def;e.moves=w.moves;e.burnHit=false;
    addLog(`❄ 라이아가 물러나고 쌍둥이 언니 「테리아」가 나섰다! (체력 ${fmt(w.hp)})`);
    showStory(`<div class="sum s5"><div class="sum-title">쌍둥이 교대</div><div class="intro-art">${portraitHTML(w.art,'big')}</div><div class="sum-name">${w.name}</div><div class="small">${w.title}</div><p class="sum-desc" style="color:#cfeaff">${esc(w.line).replace(/\n/g,'<br>')}</p></div>`,
      ()=>{B.freezeAt=Date.now()+w.freezeEvery;B.freezeT=setInterval(freezeTick,w.freezeEvery);renderBattle();setTimeout(enemyTurn,500);},true);
    return true;
  }
  if(e.duckHide&&!B.remHid&&e.hp>0&&e.hp<=e.duckHide.at){

    addLog(`🦆 ${e.name} — 오리 떼 사이로 숨었다! ${e.duckHide.dur/1000}초간 회복 · 오리들이 대신 싸운다`);
    showStory(`<div class="sum s5"><div class="sum-title">오리 떼 속으로</div><div class="intro-art">${portraitHTML(e.art,'big')}</div><div class="sum-name">${e.name}</div><p class="sum-desc" style="color:#ffb0c8">${esc(e.duckHide.line).replace(/\n/g,'<br>')}</p></div>`,
      ()=>{B.remHideUntil=Date.now()+e.duckHide.dur;renderBattle();setTimeout(enemyTurn,500);},true);

  }
  if(e.rampage&&!B.rampaged&&e.hp>0&&e.hp<=e.rampage.at){
    B.rampaged=true;B.charging=false;B.chargeKind=null;e.atk=Math.round(e.atk/e.rampage.atkDiv);
    const now=Date.now();B.nkSeal=B.nkSeal||{};
    partyIds().forEach(x=>{const h=B.ahp[x];if(h&&h.hp>0){B.nkSeal[x]=now+e.rampage.stun;B.stun[x]=99999;B.stunWhy[x]=`${e.name}의 폭주 — 행동 불능`;apAfflict(x,Math.max(e.rampage.stun,(e.apFreeze&&e.apFreeze.afflict)||5000));}});
    addLog(`⚡ ${e.name}의 폭주 — 공격력이 1.2배 낮아졌지만, 동료 전원이 ${e.rampage.stun/1000}초간 행동 불능 · 출혈 · 화상!`);

    showStory(`<div class="sum s5"><div class="sum-title">폭주</div><div class="intro-art">${portraitHTML(e.art,'big')}</div><div class="sum-name">${e.name}</div><p class="sum-desc" style="color:#a8d0ff">${esc(e.rampage.line).replace(/\n/g,'<br>')}</p></div>`,
      ()=>{const t2=Date.now();for(const x in B.nkSeal)B.nkSeal[x]=t2+e.rampage.stun;renderBattle();setTimeout(enemyTurn,500);},true);
    return true;
  }
  if(e.lastStand&&!B.lastStood&&e.hp>0&&e.hp<=e.lastStand.at){
    B.lastStood=true;B.charging=false;B.chargeKind=null;
    partyIds().forEach(x=>{const h=B.ahp[x];if(h&&h.hp>0)h.hp=1;});

    document.body.classList.add('flash');setTimeout(()=>document.body.classList.remove('flash'),400);
    showStory(`<div class="sum s5"><div class="sum-title">최후의 발악</div><div class="intro-art">${portraitHTML(e.art,'big')}</div><div class="sum-name">${e.name}</div><p class="sum-desc" style="color:#d8b0ff">${esc(e.lastStand.line).replace(/\n/g,'<br>')}</p></div>`,
      ()=>{renderBattle();setTimeout(enemyTurn,500);},true);
    return true;
  }
  if(e.awaken&&!B.awoke&&e.hp>0&&e.hp<=e.awaken.at){
    const w=e.awaken;
    B.awoke=true;e.hp=w.to;e.maxHp=Math.max(e.maxHp,w.to);e.art=w.art;B.charging=false;B.chargeKind=null;
    e.moves=e.moves.filter(m=>m.kind!=='deathblow');
    addLog(`💢 ${e.name} 각성 — 체력 ${fmt(w.to)} · 「영혼을 가르는 일격」 · 치명타 피해 ${w.critMult}배!`);
    document.body.classList.add('flash');setTimeout(()=>document.body.classList.remove('flash'),400);
    showStory(`<div class="sum s5"><div class="sum-title">각성</div><div class="intro-art">${portraitHTML(w.art,'big')}</div><div class="sum-name">${e.name}</div><p class="sum-desc" style="color:#ffb0b0">${esc(w.line).replace(/\n/g,'<br>')}</p></div>`,
      ()=>{B.soulAt=Date.now()+w.soulTick;B.soulT=setInterval(soulTick,w.soulTick);addLog('⚠ 3초마다 「영혼을 가르는 일격」 — 방어 태세를 유지하라!');renderBattle();setTimeout(enemyTurn,500);},true);
    return true;
  }
  if(e.madness&&!B.maddened&&e.hp>0&&e.hp<=e.madness.at){
    const m=e.madness;
    B.maddened=true;e.maxHp=Math.max(e.maxHp,m.to);e.hp=m.to;e.atk=Math.round(e.atk*m.atkMult);e.art=m.art;B.charging=false;B.chargeKind=null;
    if(m.fallen){e.voidAlly=0;e.reflectAlly=0;e.title='타락천사';B.fallMul=1;B.dot={name:'출혈',dmg:Math.max(5,Math.round(e.atk*0.08)),turns:999};
      B.fallAt=Date.now()+m.fallen.rageEvery+2500;B.fallT=setInterval(fallTick,m.fallen.rageEvery);}
    addLog(`💢 ${e.name}의 ${m.logName||'광기'} — 체력 ${fmt(m.to)}까지 회복 · 공격력 ${m.atkMult}배!`);
    document.body.classList.add('flash');setTimeout(()=>document.body.classList.remove('flash'),400);
    showStory(`<div class="sum s5"><div class="sum-title">${m.title||'광기'}</div><div class="intro-art">${PORTRAIT[m.art]?portraitHTML(m.art,'big'):bossSVG(m.art)}</div><div class="sum-name">${e.name}</div><p class="sum-desc" style="color:#ffb0b0">${esc(m.line).replace(/\n/g,'<br>')}</p></div>`,
      ()=>{renderBattle();setTimeout(enemyTurn,500);},true);
    return true;
  }
  if(e.berserk&&!B.berserked&&e.hp>0&&e.hp<=e.berserk.at){
    B.berserked=true;e.hp=e.berserk.to;B.charging=false;B.chargeKind=null;B.noHeal=true;B.invisNext=true;
    e.moves=[...e.moves,{t:'bleedstorm',n:'무수한 출혈 참격',hits:8,m:0.25},{t:'bleedstorm',n:'무수한 출혈 참격',hits:8,m:0.25}];
    addLog(`💢 ${e.name}의 폭주 — 괴성과 함께 체력 ${fmt(e.berserk.to)}까지 회복!`);

      ()=>{addLog('🚫 폭주의 저주 — 이제 주인공은 회복할 수 없다');addLog('…어딘가에서 공기가 갈라지는 소리가 들린다.');B.busy=false;renderBattle();},true);
    return true;
  }
  if(e.rage&&!B.raged&&e.hp>0&&e.hp<=e.maxHp/2){

  }
  if(B.isFinal&&B.phase===1&&e.phase2&&e.hp<=e.maxHp/2){
    const p2=e.phase2;

    e.atk=Math.round(e.atk*p2.atkMult);e.art=p2.art;e.name=p2.name;e.moves=p2.moves;e.slashes=p2.slashes;

      ()=>{renderBattle();setTimeout(enemyTurn,500);},true);
    return true;
  }
  return false;
}

let forcedMv=null;
function enemyTurnForced(mv){forcedMv=mv;enemyTurn();}
function enemyTurn(){
  if(!B||B.over||B.won)return;
  const e=B.e;let mv;
  if(B.dungeon){mv={t:'idle',n:''};forcedMv=null;}   // 던전 샌드백: 아무것도 하지 않음 (버프·지속 피해 턴만 흐름)
  else if(forcedMv){mv=forcedMv;forcedMv=null;}
  else if(B.invisNext){B.invisNext=false;mv={t:'invisslash',n:'보이지 않는 참격'};forcedMv={t:'bleedstorm',n:'무수한 출혈 참격',hits:8,m:0.25};}
  else if(eFrozenOn())mv={t:'frozen'};
  else if(ezBindOn())mv={t:'bound'};
  else if(e.noAttack)mv={t:'kidle'};
  else if(mihoParaOn())mv={t:'mpara'};
  else if(mangStunOn())mv={t:'mkick'};
  else if(totoCharmOn()&&!e.pvp){const was=B.charging?B.chargeName:'';if(B.charging){B.charging=false;B.chargeKind=null;}mv={t:'atk',n:`💗 매혹된 공격${was?` (「${was}」 취소)`:''}`};}
  else if(B.sealed>0){mv={t:'sealed'};B.sealed--;}
  else if(B.charging){mv={t:'release',n:B.chargeName,kind:B.chargeKind};B.charging=false;B.chargeKind=null;}
  else if(e.pvp)mv={t:'pvp',n:''};
  else if(e.tornado&&e.hp<e.maxHp*0.35&&B.tornadoCD<=0){mv={t:'charge',n:'스파크 토네이도',kind:'tornado'};B.tornadoCD=4;}
  else if(e.moves){mv=pick(e.moves);if(mv.kind==='zero'&&pFrozen())mv={t:'atk',n:'얼음 송곳'};} // 빙결 중엔 방어 불가 → 절대 영도 보류
  else mv=Math.random()<0.2?{t:'strong',n:'강타'}:{t:'atk',n:'공격'};
  const label=`${e.name} — ${mv.n}`;

  switch(mv.t){
    case 'idle':    break;
    case 'sealed':  addLog(`${e.name} — 봉인되어 움직일 수 없다!`);break;
    case 'frozen':  addLog(`🧊 ${e.name} — 얼어붙어 움직일 수 없다!`);break;
    case 'bound':   addLog(`⛓ ${e.name} — 심판의 속박에 묶여 움직일 수 없다!`);break;
    case 'kidle':   break; // 케테케테: 직접 공격하지 않음 (폭풍·흑마는 keteTick)
    case 'mkick':   addLog(`🐴 ${e.name} — 망아찌의 뒷발차기에 기절해 움직일 수 없다!`);break;
    case 'mpara':   addLog(`⚡ ${e.name} — 미호롱의 번개에 마비되어 움직일 수 없다!`);break;
    case 'pvp':     pvpEnemyActs(e);break;
    case 'nullify': B.immune=2;addLog(`${label} — ⏸ 잠시 동안 모든 피해가 무효화된다!`);break;
    case 'reflect': B.reflect=2;addLog(`${label} — ↩ 잠시 동안 준 피해의 절반이 되돌아온다!`);break;
    case 'atk':     hitPlayer(1,label);break;
    case 'strong':  hitPlayer(1.5,label);break;
    case 'hellfire':hitPlayer(1.8,label);break;
    case 'release':
      if(mv.kind==='jeongyeok'){
        if(B.defending)hitPlayer(1,`${e.name}의 「전격」`);
        else{const d=Math.round(P.maxHp*0.5);P.hp=Math.max(0,P.hp-d);addLog(`${e.name}의 「전격」! 방어하지 못했다 — HP ${d} 소멸`);queueFx('player','⚡-'+d,'pdmg');}
      }else if(mv.kind==='deathblow'){
        if(B.defending){hitPlayer(1,`${e.name}의 「죽음의 일격」 — 막아냈다`);}
        else{
          const c=partyIds().filter(id=>id!==FIXED&&B.ahp[id]&&B.ahp[id].hp>0);
          if(c.length){const id=pick(c);B.ahp[id].hp=0;addLog(`☠ ${e.name}의 「죽음의 일격」! 방어하지 못했다 — ${ALLIES[id].name} 사망`);queueFx('player','☠','pdmg');
            document.body.classList.add('flash');setTimeout(()=>document.body.classList.remove('flash'),300);allyDown(id);}
          else hitPlayer(2.5,`${e.name}의 「죽음의 일격」`);
        }
      }else if(mv.kind==='zero'){
        if(B.defending)hitPlayer(1,`${e.name}의 「절대 영도」 — 막아냈다`);
        else{const d=Math.round(P.hp*0.5);P.hp=Math.max(0,P.hp-d);addLog(`❄ ${e.name}의 「절대 영도」! 방어하지 못했다 — HP ${d} 소멸 · 3초간 빙결`);queueFx('player','❄-'+d,'pdmg');
          document.body.classList.add('flash');setTimeout(()=>document.body.classList.remove('flash'),300);
          if(P.hp>0)freezePlayer(ZERO_FREEZE_MS);}
      }else if(mv.kind==='tornado'){
        const d=Math.ceil(P.maxHp/3);P.hp=Math.max(0,P.hp-d);
        addLog(`${e.name}의 「스파크 토네이도」! 방어도 소용없다 — HP ${d} 소멸`);queueFx('player','🌪-'+d,'pdmg');
        hitAllies(0.3,'스파크 토네이도');
      }else hitPlayer(2.5,`${e.name}의 「${mv.n}」`);
      break;
    case 'multi':{
      addLog(`${label}!`);
      for(let i=0;i<mv.hits;i++)hitPlayer(mv.m,`  ${i+1}타`);
      break;}
    case 'drain':{
      const d=hitPlayer(1,label);
      const h=Math.min(e.maxHp-e.hp,Math.round(d*0.6));
      if(h>0){e.hp+=h;addLog(`적이 생명력 ${h}을 빨아들였다.`);queueFx('enemy','+'+h,'heal');}
      break;}
    case 'curse':   B.curse=3;addLog(`${label} — 3턴간 방어력 감소`);break;
    case 'silence': B.curse=Math.max(B.curse,2);addLog(`${label} — 2턴간 방어력 감소`);break;
    case 'dot':
      hitPlayer(0.6,label);
      B.dot={name:mv.dn||'부패',dmg:Math.max(3,Math.round(e.atk*0.35)),turns:3};
      addLog(`${label} — 3턴간 ${B.dot.name}`);break;
    case 'invis':   B.evade=true;addLog(`${label} — 모습을 감췄다! 다음 공격이 빗나간다`);break;
    case 'discord':{
      const c=partyIds().filter(id=>id!==FIXED&&!(B.stun[id]>0)&&B.ahp[id]&&B.ahp[id].hp>0);
      if(c.length){const id=pick(c);B.stun[id]=2;B.stunWhy[id]='불화';addLog(`${label} — ${ALLIES[id].name} 2턴간 행동 불가`);}
      else{B.curse=3;addLog(`${label} — 3턴간 방어력 감소`);}
      break;}
    case 'storm':   hitPlayer(mv.m,label);hitAllies(0.12,label);break;
    case 'freezebreath':
      addLog(`${label}!`);hitAllies(0.08,label);
      B.aFrozenUntil=Date.now()+4000;addLog('❄ 동료 전원이 얼어붙었다! (4초간 행동 불가)');
      break;
    case 'invisslash':
      if(B.defending){hitPlayer(1.2,`${e.name}의 「보이지 않는 참격」 — 간신히 막아냈다`);}
      else{const d=Math.round(P.maxHp*0.5);P.hp=Math.max(0,P.hp-d);addLog(`${e.name}의 「보이지 않는 참격」! 방어하지 못했다 — HP ${d} 소멸`);queueFx('player','-'+d,'pdmg');
        document.body.classList.add('flash');setTimeout(()=>document.body.classList.remove('flash'),300);}
      break;
    case 'bleedstorm':{
      addLog(`${label}!`);
      for(let i=0;i<mv.hits&&P.hp>0;i++)hitPlayer(mv.m,`  출혈 참격 ${i+1}`);
      hitAllies(0.12,label);
      if(P.hp>0){B.dot={name:'출혈',dmg:Math.max(5,Math.round(e.atk*0.3)),turns:4};addLog('🩸 깊은 상처 — 4턴간 출혈');}
      break;}
    case 'barrage':{
      addLog(`${label}!`);
      for(let i=0;i<mv.hits&&P.hp>0;i++)hitPlayer(mv.m,`  참격 ${i+1}`);
      hitAllies(0.08,label);
      B.healCut=3;addLog('✂ 무수한 참격의 상처 — 3턴간 주인공·동료 회복량 10% 무효');
      break;}
    case 'sweep':   hitPlayer(0.6,label);hitAllies(mv.m,label);break;
    case 'rage':
      if(B.rage<2){B.rage++;addLog(`${label} — 공격력 상승!`);}
      else hitPlayer(1.5,label);
      break;
    case 'charge':
      B.charging=true;B.chargeName=mv.n;B.chargeKind=mv.kind||null;
      addLog(mv.kind==='jeongyeok'?`⚠ ${e.name} — 「전격」 충전! 방어하지 않으면 HP 절반을 잃는다`
        :mv.kind==='tornado'?`⚠ ${e.name} — 「스파크 토네이도」의 전조! 방어해도 HP 1/3을 잃는다`
        :mv.kind==='deathblow'?`⚠ ${e.name} — 「죽음의 일격」 준비! 방어하지 않으면 동료 한 명이 죽는다`
        :mv.kind==='zero'?`⚠ ${e.name} — 「절대 영도」 준비! 방어하지 않으면 HP 절반을 잃고 얼어붙는다`
        :`⚠ ${e.name} — 「${mv.n}」 준비! 곧 날아온다 — 방어하자!`);
      break;
  }
  // 나베리우스: 숨 쉴 틈 없는 추격 참격
  const _held=mv.t==='sealed'||mv.t==='frozen'||mv.t==='bound'||mv.t==='mpara'||mv.t==='kidle'||mv.t==='mkick'; // 봉인·빙결·속박 중엔 추가 공격도 없음
  if(e.burnHit&&!_held&&P.hp>0&&Math.random()<0.4&&!(B.dot&&B.dot.name==='화상')){B.dot={name:'화상',dmg:Math.max(5,Math.round(e.atk*0.12)),turns:3};addLog('🔥 라이아의 불길 — 화상');}
  if(e.slashes&&!_held&&P.hp>0){
    for(let i=0;i<e.slashes;i++)hitPlayer(0.35,`🗡 추격 참격 ${i+1}`);
  }
  if(e.critSlash&&!_held&&mv.t!=='charge'&&P.hp>0){const f=e.fixedDmg;e.fixedDmg=true;hitPlayer(e.critSlash,`💥 ${e.name}의 참격 — 치명타`);e.fixedDmg=f;} // 공격력 절반의 치명타 (방어력 무시)
  B.ward=false;
  if(e.burnBleed&&P.hp>0&&e.hp>0){ // 테라지오: 처음부터 끝까지 화상 + 출혈
    const bd=Math.max(3,Math.round(e.atk*0.075)),bl=Math.max(3,Math.round(e.atk*0.075));
    P.hp=Math.max(0,P.hp-bd-bl);addLog(`🔥 화상 ${bd} · 🩸 출혈 ${bl} — 끝나지 않는 상처`);queueFx('player','-'+(bd+bl),'pdmg');
    hitAllies(0.05,'🔥🩸 화상·출혈',true);
  }
  if(e.burnAll&&P.hp>0&&e.hp>0){ // 아몬: 끝없는 화상 (주인공·동료)
    if(!B.dot||B.dot.name!=='화상')B.dot={name:'화상',dmg:Math.max(5,Math.round(e.atk*0.2)),turns:99};else B.dot.turns=99;
    hitAllies(0.05,'🔥 끝없는 화상');
  }
  if(B.dot&&P.hp>0){
    P.hp=Math.max(0,P.hp-B.dot.dmg);addLog(`${B.dot.name==='화상'?'🔥':'🩸'} ${B.dot.name} — ${B.dot.dmg} 피해`);queueFx('player','-'+B.dot.dmg,'pdmg');
    if(--B.dot.turns<=0)B.dot=null;
  }
  if(B.ebleed&&e.hp>0){
    const d=B.immune?0:B.ebleed.dmg;stat('dmg','pasri',Math.min(d,e.hp));e.hp=Math.max(0,e.hp-d);addLog(`🩸 출혈 — ${e.name} ${d} 피해`);queueFx('enemy','🩸'+d,'dmg');
    if(--B.ebleed.turns<=0)B.ebleed=null;
  }
  if(B.eburn&&e.hp>0){
    const d=B.immune?0:B.eburn.dmg;stat('dmg','karma',Math.min(d,e.hp));e.hp=Math.max(0,e.hp-d);addLog(`🔥 불태움 — ${e.name} ${d} 피해`);queueFx('enemy','🔥'+d,'dmg');
    if(--B.eburn.turns<=0)B.eburn=null;
  }
  if(B.prism)B.prism--;
  if(B.negate)B.negate--;
  if(B.blind)B.blind--;
  if(B.ashield){B.ashield--;if(!B.ashield)B.shield=0;}
  if(B.splash)B.splash--;
  if(B.tornadoCD>0)B.tornadoCD--;
  if(B.immune)B.immune--;
  if(B.healCut&&mv.t!=='barrage')B.healCut--;
  if(B.reflect)B.reflect--;
  if(B.buff)B.buff--;
  if(B.aura)B.aura--;
  if(B.hex)B.hex--;
  if(B.curse&&mv.t!=='curse')B.curse--;
  if(B.silence&&mv.t!=='silence')B.silence--;
  if(B.weak)B.weak--;
  if(P.hp<=0){P.hp=0;B.over=true;renderBattle();setTimeout(defeat,900);return;}
  if(e.hp<=0){winNow();return;}
  renderBattle();
}

function gainXp(n){
  P.xp+=n;const msgs=[];
  while(P.xp>=need(P.lv)){
    P.xp-=need(P.lv);P.lv++;
    P.maxHp+=15;P.maxMp+=5;P.atk+=3;P.def+=2;P.hp=P.maxHp;P.mp=P.maxMp;
    msgs.push(`⬆ 레벨 ${P.lv} 달성! (HP 완전 회복)`);
  }
  return msgs;
}

   partyIds().filter(trustOn).forEach(id=>{const l0=trustLv(id);P.trust[id]=Math.min(TRUST_REQ[TRUST_MAX],trustPts(id)+g);const l1=trustLv(id);
     if(l1>l0)extra.push(`💗 ${ALLIES[id].name} 신뢰도 ${l1}/${TRUST_MAX} — 전투력 +${Math.round((trustMult(id)-1)*100)}%`);});}

function victoryFlow(area,stype,first,wasFinal,fromHunt,msg,stage,rep){
  if(rep&&stype==='boss'&&first){showResult(rep,()=>victoryFlow(area,stype,first,wasFinal,fromHunt,msg,stage));return;}
  if(stype==='boss'&&first){
    P.cleared[area]=true;
    if(wasFinal){
      P.ended=true;P.unlocked=Math.max(P.unlocked,area+1);P.cur=area+1;save();
      storyChain([ENDING,AREAS[area+1].intro],()=>renderMap(area+1,`✝ 나베리우스 토벌 완료!<br>🔓 새 지역 개방: ${AREAS[area+1].flag} ${AREAS[area+1].name}`));
      return;
    }
    if(area>=AREAS.length-1){save();storyChain([AREAS[area].outro],()=>renderMap(area));return;}
    P.unlocked=Math.max(P.unlocked,area+1);
    P.cur=area+1;save();
    storyChain([AREAS[area].outro,AREAS[area+1].intro],
      ()=>renderMap(area+1,`🔓 새 나라 개방: ${AREAS[area+1].flag} ${AREAS[area+1].name}`));
    return;
  }
  save();
  if(autoHunt.on&&autoHunt.farm&&!fromHunt){
    if(autoHunt.n>=autoHunt.farm.target){autoHunt.on=false;save();renderHub(`🏁 천상의 성유물작 완료 — ${autoSum()}<br>${autoHunt.farm.target}번을 모두 잡아 자동으로 멈췄다`);return;}
    $('#app').innerHTML=`${statusHTML()}<div class="panel"><div class="ptitle">🔁 천상의 성유물작</div><div class="notice">${rep?rep.lines.map(esc).join('<br>'):''}</div><div class="desc">${autoSum()}<br>다음 전투 준비 중…</div><div class="grid"><button class="btn danger full" id="autostop2">⏹ 멈추기</button></div></div>`;
    $('#autostop2').onclick=()=>autoHuntStop('⏹ 천상의 성유물작을 멈췄다');
    setTimeout(()=>{if(autoHunt.on&&autoHunt.farm&&!B)startBattle({area:FARM_AREA,stage:STAGES,farm:true});},900);return;}
  if(!fromHunt&&first&&stage<STAGES){mapSel={a:area,s:stage+1};autoNext(area,stage+1,rep);return;}
  if(fromHunt&&autoHunt.on){const a=autoHunt.area;
    $('#app').innerHTML=`${statusHTML()}<div class="panel"><div class="ptitle">🔁 자동 사냥 중</div><div class="notice">${rep?rep.lines.map(esc).join('<br>'):''}</div><div class="desc">${autoSum()}<br>다음 적을 찾는 중…</div><div class="grid"><button class="btn danger full" id="autostop2">⏹ 자동 사냥 멈추기</button></div></div>`;
    $('#autostop2').onclick=()=>autoHuntStop();
    setTimeout(()=>{if(autoHunt.on&&!B)startBattle({area:a,hunt:true});},900);return;}
  if(fromHunt)renderHub();else renderMap(area);
  if(rep)showResult(rep,null,null,(!fromHunt&&stype==='boss'&&stage)?()=>startBattle({area,stage}):null);
}
/* 전투 결과: 보상 + 딜·힐 그래프 (모든 전투 후, 한 화면) */

    const chart=(kind,cls)=>{
      const rows=who.map(w=>({w,v:st[kind][w]||0})).sort((a,b)=>b.v-a.v);
      const tot=total(kind),mx=Math.max(1,...rows.map(x=>x.v));
      return rows.map(x=>`<div class="rp-row"><div class="rp-nm">${ic(x.w)}<span>${nm(x.w)}</span></div>
      <div class="rp-bar"><i class="${cls}" style="width:${(x.v/mx*100).toFixed(1)}%"></i></div>
      <div class="rp-v">${fmt(x.v)}<small>${tot?Math.round(x.v/tot*100):0}%</small></div></div>`).join('');
    };
    const ht=total('heal');
    return `<div class="rp-h">⚔ 준 피해 <span>합계 ${fmt(total('dmg'))}</span></div>${chart('dmg','d')}
    ${ht?`<div class="rp-h">✚ 회복 · 보호 <span>합계 ${fmt(ht)}</span></div>${chart('heal','h')}`:''}`;
  };
  const mine=charts(['hero',...(r.party||[])],w=>w==='hero'?esc(P.name):ALLIES[w].name,r.st||{dmg:{},heal:{}});
  let body=mine;
  if(r.foe){
    const f=r.foe,fst=f.st||{dmg:{},heal:{}};
    const theirs=charts(['hero',...(f.party||[]).filter(id=>ALLIES[id])],w=>w==='hero'?esc(f.name):ALLIES[w].name,fst);
    body=`<div class="rs-tabs"><button class="btn primary" data-rstab="me">내 팀</button><button class="btn" data-rstab="foe">${esc(f.name)}의 팀</button></div>
    <div class="rs-sides"><div data-rsside="me">${mine}</div><div data-rsside="foe" style="visibility:hidden">${theirs}</div></div>`;
  }
  return `<div class="report result"><div class="rs-head ${r.won?'win':'lose'}">${r.head||(r.won?'🏆 승리':'💀 패배')}</div>
    <div class="sum-title">${r.title}</div>
    ${r.note?`<div class="rs-note">${r.note}</div>`:''}
    <div class="rs-rew">${(r.lines&&r.lines.length?r.lines:['획득한 보상 없음']).map(l=>`<div>${l}</div>`).join('')}</div>
    ${body}</div>`;
}
function showResult(r,cb,label,again){
  showStory(resultHTML(r),cb,true);
  $('#mbtn').textContent=label||'확인';
  /* 친구 대결: 내 팀 / 친구 팀 그래프 전환 */
  const tabs=document.querySelectorAll('#mtext [data-rstab]');
  tabs.forEach(b=>b.onclick=()=>{
    tabs.forEach(x=>x.classList.toggle('primary',x===b));
    document.querySelectorAll('#mtext [data-rsside]').forEach(d=>d.style.visibility=d.dataset.rsside===b.dataset.rstab?'':'hidden');
  });
  if(again)addAgainBtn(again);
}
/* 결과창 '확인' 옆에 '한 번 더' 버튼 (창이 닫히면 원래대로 되돌림) */
function addAgainBtn(go){
  const m=$('#mbtn'),modal=$('#modal'),row=document.createElement('div');
  row.className='mbtns';m.parentNode.insertBefore(row,m);row.appendChild(m);
  const b=document.createElement('button');b.className='btn danger';b.textContent='⚔ 한 번 더';row.appendChild(b);
  let obs=null;
  const undo=()=>{if(!row.parentNode)return;if(obs)obs.disconnect();m.removeEventListener('click',undo);row.parentNode.insertBefore(m,row);row.remove();};
  m.addEventListener('click',undo);
  obs=new MutationObserver(()=>{if(modal.classList.contains('hidden'))undo();});
  obs.observe(modal,{attributes:true,attributeFilter:['class']});
  b.onclick=()=>{modal.classList.add('hidden');undo();go();};
}
/* 최초 클리어 → 다음 스테이지 자동 출전 (3초, 취소 가능) */
let autoT=null;
function autoNext(a,s,rep){
  renderMap(a);
  let n=5;const t=stageType(s);
  $('#mtext').innerHTML=`<div class="autonext">${rep?resultHTML(rep):''}
    <div class="anext">다음 → <b>${s}. ${stageName(a,s)}</b> <span class="tag ${t==='normal'?'done':t==='elite'?'item':'t-ally'}">${STYPE_LABEL[t]}</span>
    <div class="small">HP ${P.hp}/${P.maxHp} · 성수 ${P.items.water}</div></div>
    <button class="btn" id="anstop">🗺 멈추고 지도로</button></div>`;
  const lbl=()=>`▶ 바로 출전 (${n}초 후 자동)`;
  $('#mbtn').textContent=lbl();
  $('#modal').classList.remove('hidden');
  const go=()=>{clearInterval(autoT);autoT=null;$('#modal').classList.add('hidden');startBattle({area:a,stage:s});};
  $('#mbtn').onclick=go;
  $('#anstop').onclick=()=>{clearInterval(autoT);autoT=null;$('#modal').classList.add('hidden');renderMap(a);};
  clearInterval(autoT);
  autoT=setInterval(()=>{n--;if(n<=0)go();else $('#mbtn').textContent=lbl();},1000);
}

function defeat(){
  if(B&&B.dungeon){dungeonEnd('down');return;}
  if(B&&B.pvp){pvpEnd(false);return;}
  if(B&&B.forest){forestEnd(false);return;}
  if(B&&B.tower){if(B.heaven)heavenEnd(false);else towerEnd(false);return;}
  const autoWas=autoHunt.on&&B&&B.auto;autoHunt.on=false;
  const rep=B?{title:`${esc(B.baseName||B.e.name)}에게 패배`,won:false,st:B.st,party:partyIds().slice()}:null;
  clearBattle();
  const lost=Math.floor(P.gold/2);
  P.gold-=lost;P.hp=Math.round(P.maxHp*0.5);P.mp=Math.round(P.maxMp*0.5);save();
  const note=`눈앞이 어두워진다… 교구의 사제들이 쓰러진 ${esc(P.name)}을(를) 성당으로 옮겼다.`;
  const after=()=>renderHub('정신을 차렸다. 성당에서 휴식하고 다시 도전하자.');
  if(rep){rep.note=note;rep.lines=[`💸 소지금 ${fmt(lost)} G를 잃었다`,'🩹 HP 절반으로 깨어남',...(autoWas?[`🔁 자동 사냥 종료 — ${autoSum()}`]:[])];showResult(rep,after,'계속');}
  else showStory(note+`\n\n(소지금 ${lost} G를 잃었다)`,after);
}

/* ===================== 지도 ===================== */
let mapSel=null;
function renderMap(a,msg){
  BGM.play('lobby');
  if(a==null)a=P.cur;
  P.cur=a;
  const ar=AREAS[a],prog=P.prog[a];
  if(mapSel==null||mapSel.a!==a)mapSel={a,s:Math.min(STAGES,prog+1)};
  const X=[50,74,82,66,42,22,18,34,58,78,80,60,38,22,46];
  const ROW=74,H=STAGES*ROW+30;
  const pts=[];let nodes='';
  for(let s=1;s<=STAGES;s++){
    const x=X[s-1],y=(STAGES-s)*ROW+40;pts.push(`${x},${y}`);
    const t=stageType(s),state=s<=prog?'done':s===prog+1?'next':'lock';
    const label=t==='boss'?'☠':t==='mid'?'✠':t==='elite'?'⚔':s;
    const kc=t==='boss'?(P.kills[ar.boss.name]||0):0;
    nodes+=`<button class="node ${t} ${state} ${mapSel.s===s?'sel':''}" data-st="${s}" style="left:${x}%;top:${y}px" ${state==='lock'?'disabled':''}>${state==='done'&&t==='normal'?'✔':label}${kc?`<span class="kc">처치 ${fmt(kc)}회</span>`:''}</button>`;
  }
  const s=mapSel.s,t=stageType(s),open=s<=prog+1;
  const art=(t==='boss'||t==='mid')?`<div class="sheet-art">${PORTRAIT[(t==='boss'?ar.boss:ar.mid).art]?portraitHTML((t==='boss'?ar.boss:ar.mid).art,'small'):bossSVG((t==='boss'?ar.boss:ar.mid).art)}</div>`:'';
  $('#app').innerHTML=`${statusHTML()}${topBack()}
    ${msg?`<div class="notice">${msg}</div>`:''}
    <div class="panel"><div class="ptitle">🗺 ${ar.flag} ${ar.name} <span class="small">스테이지 ${prog}/${STAGES}</span></div>
      <div class="mapwrap" style="--gc:${ar.glow}"><div class="map" style="height:${H}px">
        <svg class="mapline" viewBox="0 0 100 ${H}" preserveAspectRatio="none"><polyline points="${pts.join(' ')}" vector-effect="non-scaling-stroke"/></svg>
        ${nodes}
      </div></div>
    </div>
    <div class="panel sheet">
      <div class="${art?'sheet-head':''}">${art}<div class="${art?'sheet-txt':''}">
      <div class="ptitle">${s}. ${stageName(a,s)} <span class="tag ${t==='normal'?'done':t==='elite'?'item':'t-ally'}">${STYPE_LABEL[t]}</span>${t==='boss'?` <span class="small">☠ 처치 ${fmt(P.kills[ar.boss.name]||0)}회</span>`:''}</div>
      ${(t==='boss'||t==='mid')?`<div class="etitle" style="text-align:left">${(t==='boss'?ar.boss:ar.mid).title}</div>`:''}
      </div></div>
      <div class="desc">권장 Lv ${stageRec(a,s)} · 첫 클리어 보상: ${STAGE_REWARD[t]}${s<=prog?' <span class="gold">(클리어 완료 · 재도전 가능)</span>':''}${t==='boss'&&ar.boss.drop?(P.relics.includes(ar.boss.drop)?' · 🔒 인장 보유':' · 인장 미획득'):''}</div>
      ${sortieRule(a)?(()=>{const ok=P.active.filter(id=>sortieOk(a,id)).slice(0,sortieRule(a).max||9),no=P.active.filter(id=>!ok.includes(id));
        return `<div class="notice sortie">⚠ 출전 조건 — ${sortieRule(a).text}<br><span class="small">출전 가능: ${ok.length?ok.map(id=>ALLIES[id].name).join(', '):'없음'}${no.length?` · 출전 불가: ${no.map(id=>ALLIES[id].name).join(', ')}`:''}</span></div>`;})():''}
      <div class="grid">
        <button class="btn ${t==='boss'||t==='mid'?'danger':'primary'}" id="go" ${open?'':'disabled'}>${open?'⚔ 출전':'🔒 이전 스테이지를 먼저 클리어'}</button>
        <button class="btn" id="back">← 거점으로</button>
      </div>
    </div>${tabBar()}`;
  document.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{mapSel={a,s:+b.dataset.st};renderMap(a);});
  $('#go').onclick=()=>startBattle({area:a,stage:s});
  $('#back').onclick=()=>renderHub();
  const sel=document.querySelector('.node.sel');
  if(sel&&!msg)sel.scrollIntoView({block:'center'});
  else window.scrollTo(0,0);
  save();
}

document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&P){try{localStorage.setItem(SAVE_KEY,JSON.stringify(P))}catch(e){}
  if(FB&&cloudRef&&P.uid===fbPid){try{cloudRef.set({json:JSON.stringify(P),savedAt:P.savedAt||Date.now(),key:SAVE_KEY});}catch(e){}}}});
/* ===================== 새 버전 자동 새로고침 =====================
   옛날 탭을 계속 켜 두면 새 기능(코인 받기 등)이 안 돌아가서, 몇 분마다 index.html을 다시 받아
   지금 열린 게임 코드와 다르면 → 전투 중·창이 떠 있을 때·입력 중일 때는 기다렸다가 저장하고 새로고침한다.
   같은 새 버전으로는 한 번만 새로고침 (계속 반복되지 않게) */
const UPD_EVERY=5*60000,UPD_IDLE=60000,UPD_KEY='bp_upd_try';
let updMine=null,updNew=null,updBusy=false,updAct=Date.now(),updVisAt=0;
const updHash=s=>{let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return (h>>>0).toString(36)+':'+s.length;};
const updCode=d=>[...d.querySelectorAll('script:not([src]),style')].map(e=>e.textContent).join('\n');
const updOn=()=>/^https?:$/.test(location.protocol)&&hasFirebaseHost();
async function updCheck(){
  if(!updOn()||updBusy)return;
  if(updNew){updTry();return;}
  updBusy=true;
  try{
    if(!updMine)updMine=updHash(updCode(document));
    const r=await fetch(location.pathname,{cache:'no-cache'});   // 브라우저 캐시도 새것으로 → 새로고침하면 바로 새 버전
    if(r.ok){const h=updHash(updCode(new DOMParser().parseFromString(await r.text(),'text/html')));if(h!==updMine)updNew=h;}
  }catch(e){}
  updBusy=false;
  updTry();
}
function updTry(){
  if(!updNew||B)return;                                              // 전투 중이면 기다림
  if(!$('#modal').classList.contains('hidden')||document.querySelector('.pzfx'))return;   // 창·연출이 떠 있으면 기다림
  const a=document.activeElement;if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))return;   // 입력 중이면 기다림
  if(!document.hidden&&Date.now()-updAct<UPD_IDLE&&Date.now()-updVisAt>3000)return;   // 화면을 만지는 중이면 기다림 (돌아온 직후는 바로)
  let tried=null;try{tried=sessionStorage.getItem(UPD_KEY);}catch(e){}
  if(tried===updNew)return;
  try{sessionStorage.setItem(UPD_KEY,updNew);}catch(e){}
  if(P){try{localStorage.setItem(SAVE_KEY,JSON.stringify(P));}catch(e){}}   // 저장 시간은 그대로 (다른 기기의 더 최신 기록을 덮지 않게)
  location.reload();
}
['pointerdown','keydown','touchstart'].forEach(t=>document.addEventListener(t,()=>{updAct=Date.now();},{passive:true,capture:true}));
document.addEventListener('visibilitychange',()=>{if(document.hidden)updTry();else{updVisAt=Date.now();updCheck();}});
setInterval(updCheck,UPD_EVERY);
setTimeout(updCheck,30000);
renderTitle();
initCloud();



</script>
